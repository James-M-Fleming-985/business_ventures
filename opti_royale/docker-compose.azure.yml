version: '3.8'

# Azure Container Instances / AKS Production Configuration
services:
  # Azure Database for PostgreSQL Flexible Server
  # This would be replaced with Azure managed service in production
  postgres-azure:
    image: postgres:15
    environment:
      POSTGRES_DB: opti_royale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:volumes:
  postgres_primary_data:
  redis_master_data:
  model_cache:
  training_data:
  prometheus_data:
  grafana_data:
  influxdb_data:
  uploads:
  azure_storage:

networks:
  opti-royale-network:
    driver: overlay
    attachable: trueWORD}
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '8.0'
          memory: 32G
        reservations:
          cpus: '4.0'
          memory: 16G
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opti-royale-network

  # Azure Cache for Redis Premium
  redis-azure:
    image: redis:7-alpine
    command: |
      redis-server 
      --maxmemory 8gb 
      --maxmemory-policy allkeys-lru 
      --save 900 1 
      --save 300 10 
      --save 60 10000 
      --tcp-keepalive 300 
      --timeout 0
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    volumes:
      - redis_data:/data
    networks:
      - opti-royale-network

  # API Service Cluster (Azure Container Apps)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.azure
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${AZURE_POSTGRES_CONNECTION_STRING}
      - REDIS_URL=${AZURE_REDIS_CONNECTION_STRING}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_COMPUTER_VISION_ENDPOINT=${AZURE_COMPUTER_VISION_ENDPOINT}
      - AZURE_COMPUTER_VISION_KEY=${AZURE_COMPUTER_VISION_KEY}
      - PORT=80
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - opti-royale-network

  # Computer Vision Service Cluster (Enterprise Scale)
  cv-analyzer:
    build:
      context: ./services/cv-analyzer
      dockerfile: Dockerfile.azure-gpu
    environment:
      - AZURE_ML_WORKSPACE=${AZURE_ML_WORKSPACE}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - REDIS_URL=${AZURE_REDIS_CONNECTION_STRING}
      - ONNX_RUNTIME_PROVIDERS=CUDAExecutionProvider,CPUExecutionProvider
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - MAX_CONCURRENT_ANALYSES=200
      - BATCH_SIZE=64
      - MODEL_CACHE_SIZE=5000
    deploy:
      replicas: 10  # Start with 10 GPU instances
      resources:
        limits:
          cpus: '16.0'
          memory: 32G
        reservations:
          cpus: '8.0'
          memory: 16G
          devices:
            - driver: nvidia
              count: 4  # 4 GPUs per instance
              capabilities: [gpu]
    volumes:
      - model_cache:/app/models
      - azure_storage:/app/storage
    networks:
      - opti-royale-network

  # Additional CV Workers for CPU-only processing
  cv-cpu-workers:
    build:
      context: ./services/cv-analyzer
      dockerfile: Dockerfile.azure-cpu
    environment:
      - REDIS_URL=${AZURE_REDIS_CONNECTION_STRING}
      - WORKER_TYPE=cpu_fallback
      - MAX_CONCURRENT_ANALYSES=50
    deploy:
      replicas: 20  # 20 CPU-only instances for overflow
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
    networks:
      - opti-royale-network

  # Celery Workers (Enterprise Scale Background Processing)
  celery-worker:
    build:
      context: ./services/cv-analyzer
      dockerfile: Dockerfile.azure-gpu
    command: |
      celery -A app.celery worker 
      --loglevel=info 
      --concurrency=32 
      --prefetch-multiplier=1 
      --max-tasks-per-child=50
      --pool=prefork
      --optimization=fair
    environment:
      - REDIS_URL=${AZURE_REDIS_CONNECTION_STRING}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - WORKER_CLASS=gpu_worker
    deploy:
      replicas: 25  # 25 GPU worker instances
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    networks:
      - opti-royale-network

  # CPU-only Celery Workers for preprocessing
  celery-cpu-worker:
    build:
      context: ./services/cv-analyzer
      dockerfile: Dockerfile.azure-cpu
    command: |
      celery -A app.celery worker 
      --loglevel=info 
      --concurrency=16 
      --prefetch-multiplier=2
      --queues=preprocessing,postprocessing
    environment:
      - REDIS_URL=${AZURE_REDIS_CONNECTION_STRING}
      - WORKER_CLASS=cpu_worker
    deploy:
      replicas: 50  # 50 CPU worker instances
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    networks:
      - opti-royale-network

  # Azure Application Gateway / Front Door
  nginx-azure:
    image: nginx:alpine
    volumes:
      - ./nginx-azure.conf:/etc/nginx/nginx.conf
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - opti-royale-network

  # Machine Learning Pipeline Service
  ml-pipeline:
    build:
      context: ./services/ml-pipeline
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=${AZURE_REDIS_CONNECTION_STRING}
      - DATABASE_URL=${AZURE_POSTGRES_CONNECTION_STRING}
      - AZURE_ML_WORKSPACE=${AZURE_ML_WORKSPACE}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MODEL_RETRAIN_SCHEDULE=daily
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    volumes:
      - model_cache:/app/models
      - training_data:/app/data
    networks:
      - opti-royale-network

  # Model Training Service (Scheduled)
  model-trainer:
    build:
      context: ./services/ml-pipeline
      dockerfile: Dockerfile.training
    environment:
      - DATABASE_URL=${AZURE_POSTGRES_CONNECTION_STRING}
      - AZURE_ML_WORKSPACE=${AZURE_ML_WORKSPACE}
      - TRAINING_DATA_PATH=/app/data
      - MODEL_OUTPUT_PATH=/app/models
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '8.0'
          memory: 32G
        reservations:
          cpus: '4.0'
          memory: 16G
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    volumes:
      - model_cache:/app/models
      - training_data:/app/data
    networks:
      - opti-royale-network

  # Feature Store Service
  feature-store:
    image: feast-dev/feature-server:latest
    environment:
      - FEAST_REPO_PATH=/feature_repo
      - REDIS_URL=${AZURE_REDIS_CONNECTION_STRING}
    ports:
      - "6566:6566"
    volumes:
      - ./feature_store:/feature_repo
    networks:
      - opti-royale-network

  # Real-time Model Serving (Triton)
  triton-server:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    command: tritonserver --model-repository=/models --allow-http=true --allow-grpc=true
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - model_cache:/models
    networks:
      - opti-royale-network

  # Data Pipeline Service (Apache Airflow)
  airflow-webserver:
    image: apache/airflow:2.7.2
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://postgres:password@postgres-primary:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis-master:6379/1
      - AIRFLOW__CELERY__BROKER_URL=redis://redis-master:6379/1
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - opti-royale-network

  # Time Series Database for Analytics
  influxdb:
    image: influxdb:2.7
    environment:
      - INFLUXDB_DB=opti_royale_metrics
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=password
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - opti-royale-network
    image: prom/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus-azure.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus-azure.yml:/etc/prometheus/prometheus-azure.yml
      - prometheus_data:/prometheus
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - opti-royale-network

volumes:
  postgres_data:
    driver: azure-file
  redis_data:
    driver: azure-file
  model_cache:
    driver: azure-file
  prometheus_data:
    driver: azure-file
  azure_storage:
    driver: azure-file

networks:
  opti-royale-network:
    driver: overlay
    attachable: true
