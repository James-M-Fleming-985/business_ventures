name = "clash_royale_analyzer"
version = "0.1.0"
description = "Computer vision service for analyzing Clash Royale game recordings"

[tool.poetry]
name = "clash_royale_analyzer"
version = "0.1.0"
description = "Computer vision service for analyzing Clash Royale game recordings"
authors = ["OptiRoyale Team"]

[tool.poetry.dependencies]
python = "^3.9"
opencv-python = "^4.8.0"
tensorflow = "^2.13.0"
numpy = "^1.24.0"
pillow = "^10.0.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.5.0"
python-multipart = "^0.0.6"
aiofiles = "^23.2.0"
redis = "^5.0.0"
celery = "^5.3.0"
scikit-learn = "^1.3.0"
matplotlib = "^3.8.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
