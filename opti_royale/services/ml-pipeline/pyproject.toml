name = "ml_pipeline"
version = "0.1.0"
description = "Machine Learning pipeline for continuous model improvement"

[tool.poetry]
name = "ml_pipeline"
version = "0.1.0"
description = "ML pipeline for Clash Royale analysis optimization"
authors = ["OptiRoyale Team"]

[tool.poetry.dependencies]
python = "^3.9"
# Core ML libraries
torch = "^2.1.0"
tensorflow-gpu = "^2.13.0"
scikit-learn = "^1.3.0"
xgboost = "^2.0.0"
lightgbm = "^4.1.0"

# Computer Vision
opencv-python = "^4.8.0"
pillow = "^10.0.0"
albumentations = "^1.3.0"

# ML Ops and Experiment Tracking
mlflow = "^2.7.0"
wandb = "^0.15.0"
tensorboard = "^2.13.0"
dvc = "^3.0.0"

# Data Processing
pandas = "^2.1.0"
numpy = "^1.24.0"
polars = "^0.19.0"
pyarrow = "^13.0.0"

# Feature Engineering
feast = "^0.34.0"
feature-engine = "^1.6.0"

# Model Serving
triton-python-backend-stubs = "^1.0.0"
onnx = "^1.14.0"
onnxruntime-gpu = "^1.16.0"

# Data Pipeline
apache-airflow = "^2.7.0"
kafka-python = "^2.0.0"
pyspark = "^3.5.0"

# Database and Storage
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
redis = "^5.0.0"
azure-storage-blob = "^12.18.0"
azure-ml-core = "^1.52.0"

# API and Web
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
celery = "^5.3.0"

# Monitoring and Logging
prometheus-client = "^0.17.0"
structlog = "^23.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
jupyter = "^1.0.0"
notebook = "^7.0.0"
jupyterlab = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
