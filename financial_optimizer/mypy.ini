# mypy.ini
[mypy]
python_version = 3.12
exclude = (.*\/site-packages\/.*)
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False

# Ignore missing imports for specific packages
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-dash_bootstrap_components.*]
ignore_missing_imports = True

[mypy-dash_draggable.*]
ignore_missing_imports = True