# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Statistical Forecasting Engine"
  
  description: |
    Implements core statistical time-series forecasting models including ARIMA, SARIMA,
    and Prophet. Provides model training, validation, and prediction capabilities for
    correlation time-series data. Handles automatic parameter selection, seasonal
    decomposition, and forecast generation with confidence intervals. Supports both
    single-step and multi-step ahead forecasting for 30-day correlation drift predictions.
  
  rationale: |
    Statistical models like ARIMA and Prophet are proven methods for time-series forecasting
    that handle trends, seasonality, and cyclical patterns effectively. These models provide
    interpretable results with confidence intervals, making them essential components of a
    robust forecasting ensemble. They complement ML models by capturing linear patterns
    and known seasonal effects in correlation data.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/statistical_forecasting/forecasting_engine.py"
    modules:
      - "arima_model.py"        # ARIMA/SARIMA model implementation
      - "prophet_model.py"      # Prophet model wrapper and configuration
      - "model_selector.py"     # Automatic parameter selection and model comparison
      - "forecast_utils.py"     # Common utilities for data preprocessing and validation
  
  # Main classes/functions to implement
  classes:
    - name: "ARIMAForecaster"
      purpose: "ARIMA and SARIMA model implementation for correlation time-series"
      methods:
        - name: "fit"
          signature: "fit(time_series: pd.Series, seasonal_period: Optional[int] = None) -> None"
          purpose: "Train ARIMA model with automatic parameter selection"
          example: |
            # Example usage
            forecaster = ARIMAForecaster()
            forecaster.fit(correlation_series, seasonal_period=252)  # Annual seasonality
        
        - name: "predict"
          signature: "predict(steps: int = 30, confidence_level: float = 0.95) -> ForecastResult"
          purpose: "Generate forecast with confidence intervals"
          example: |
            # Generate 30-day forecast
            result = forecaster.predict(steps=30, confidence_level=0.95)
            print(f"Forecast: {result.predictions}")
            print(f"Lower CI: {result.lower_bound}")
            print(f"Upper CI: {result.upper_bound}")
    
    - name: "ProphetForecaster"
      purpose: "Facebook Prophet model wrapper for handling complex seasonality"
      methods:
        - name: "fit"
          signature: "fit(time_series: pd.DataFrame, changepoint_prior_scale: float = 0.05) -> None"
          purpose: "Train Prophet model with custom parameters"
          example: |
            # Example usage
            forecaster = ProphetForecaster()
            df = pd.DataFrame({'ds': dates, 'y': correlation_values})
            forecaster.fit(df, changepoint_prior_scale=0.1)
        
        - name: "predict"
          signature: "predict(future_dates: pd.DatetimeIndex) -> ForecastResult"
          purpose: "Generate forecast for specified future dates"
    
    - name: "ModelSelector"
      purpose: "Automatic model selection and parameter optimization"
      methods:
        - name: "select_best_model"
          signature: "select_best_model(time_series: pd.Series, models: List[str], validation_split: float = 0.2) -> Dict[str, Any]"
          purpose: "Compare models and select best performer"
          example: |
            # Select best model
            selector = ModelSelector()
            best = selector.select_best_model(
                correlation_series,
                models=['arima', 'sarima', 'prophet'],
                validation_split=0.2
            )
  
  # Key technical details
  implementation_details:
    libraries: ["statsmodels", "prophet", "pandas", "numpy", "scipy"]
    patterns: ["Strategy Pattern", "Factory Pattern", "Builder Pattern"]
    error_handling:
      - error_type: "InsufficientDataError"
        handling: "Raise when time series has fewer than 100 observations"
      - error_type: "ModelConvergenceError"
        handling: "Retry with different parameters or fallback to simpler model"
      - error_type: "InvalidParameterError"
        handling: "Validate all model parameters before training"
  
  # Input/output contract
  inputs:
    - name: "correlation_time_series"
      type: "pd.Series or pd.DataFrame"
      description: "Historical correlation values with datetime index"
      example: "pd.Series([0.65, 0.67, 0.63, ...], index=pd.date_range('2024-01-01', periods=365))"
    
    - name: "forecast_horizon"
      type: "int"
      description: "Number of periods to forecast (default: 30 days)"
      example: "30"
    
    - name: "model_config"
      type: "Dict[str, Any]"
      description: "Model-specific configuration parameters"
      example: "{'seasonal_period': 252, 'trend': 'multiplicative'}"
  
  outputs:
    - name: "forecast_result"
      type: "ForecastResult"
      description: "Container with predictions, confidence intervals, and metrics"
      example: |
        {
          'predictions': pd.Series([0.68, 0.69, 0.67, ...]),
          'lower_bound': pd.Series([0.65, 0.66, 0.64, ...]),
          'upper_bound': pd.Series([0.71, 0.72, 0.70, ...]),
          'model_type': 'SARIMA(2,1,2)(1,1,1)[252]',
          'metrics': {'rmse': 0.023, 'mape': 3.5}
        }

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "ARIMA model achieves RMSE < 0.05 on test data"
    test: "Validate on 20% holdout set from historical correlation data"
    example: |
      # Example test command
      pytest tests/unit/test_arima_model.py::test_forecast_accuracy -v
  
  - criterion: "Prophet model handles weekly and monthly seasonality"
    test: "Verify seasonal components are correctly identified and modeled"
    example: |
      # Test seasonal decomposition
      pytest tests/unit/test_prophet_model.py::test_seasonal_components -v
  
  - criterion: "Model selection completes within 5 minutes for 1 year of data"
    test: "Time model selection process with benchmark dataset"
    example: |
      # Performance test
      pytest tests/performance/test_model_selection_speed.py -v
  
  - criterion: "Confidence intervals contain actual values 95% of the time"
    test: "Backtest confidence interval calibration on historical data"
  
  - criterion: "Models handle missing data gracefully"
    test: "Test with datasets containing gaps and verify interpolation"

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build Statistical Forecasting Engine (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_arima_model.py"
      tests:
        - "test_arima_basic_forecast"
        - "test_arima_parameter_selection"
        - "test_sarima_seasonal_detection"
        - "test_confidence_interval_generation"
      duration: "2 hours"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_arima_model.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement ARIMAForecaster (GREEN phase)"
      file: "src/statistical_forecasting/arima_model.py"
      methods:
        - "fit(time_series: pd.Series, seasonal_period: Optional[int]) → None"
        - "predict(steps: int, confidence_level: float) → ForecastResult"
        - "_select_order(time_series: pd.Series) → Tuple[int, int, int]"
        - "_validate_data(time_series: pd.Series) → None"
      duration: "4 hours"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_arima_model.py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "Extract common forecasting logic to base class"
        - "Improve error messages and logging"
        - "Optimize parameter grid search"
      duration: "2 hours"
    
    - step: 6
      action: "Integration test with time-series data"
      file: "tests/integration/test_forecasting_pipeline.py"
      duration: "1 hour"
  
  total_time: "9 hours"
  
  deliverable: "Fully functional statistical forecasting engine with ARIMA/SARIMA and Prophet models"

