# ====================================================================================
# LAYER REQUIREMENTS: Statistical Forecasting Engine
# ====================================================================================
# LAYER ID: LAYER-CA-003-01-01
# FEATURE: FEATURE-CA-003-01 (Time-Series Forecasting Models)
# ====================================================================================

metadata:
  layer_id: "LAYER-CA-003-01-01"
  layer_name: "Statistical Forecasting Engine"
  feature_id: "FEATURE-CA-003-01"
  version: "1.0.0"
  created_date: "2025-11-01"
  owner: "Causal Affect Team"

# ====================================================================================
# LAYER OVERVIEW
# ====================================================================================

overview:
  description: |
    Statistical time-series forecasting engine implementing ARIMA, SARIMA, and Prophet 
    models for correlation drift prediction. Handles linear trends, seasonal patterns, 
    and provides interpretable statistical forecasts with confidence intervals.
  
  responsibility: |
    - ARIMA model selection and training with auto-tuning (AIC/BIC)
    - SARIMA for seasonal correlation patterns
    - Facebook Prophet for robust trend and seasonality decomposition
    - Statistical model validation and diagnostics
    - Confidence interval generation
    - Model persistence and versioning

  input: "Correlation time-series data from CA-002 (pandas DataFrame)"
  output: "Statistical forecasts with confidence intervals (ForecastResult)"
  technology: "statsmodels, fbprophet, pandas, numpy"

# ====================================================================================
# FUNCTIONAL REQUIREMENTS
# ====================================================================================

requirements:
  - id: "LAYER-CA-003-01-01-REQ-001"
    title: "ARIMA Model Implementation"
    description: "Auto-tuned ARIMA for linear drift forecasting"
    acceptance_criteria:
      - "Auto-ARIMA with AIC/BIC optimization for (p,d,q) selection"
      - "Support stationary and non-stationary time series"
      - "Residual diagnostics (ACF, PACF, Ljung-Box test)"
      - "Forecast horizons: 7, 30, 90 days"
      - "95% confidence intervals"

  - id: "LAYER-CA-003-01-01-REQ-002"
    title: "SARIMA Model Implementation"
    description: "Seasonal ARIMA for cyclical correlation patterns"
    acceptance_criteria:
      - "Seasonal decomposition with auto-detected periods"
      - "SARIMA (p,d,q)(P,D,Q)m parameter tuning"
      - "Handles weekly, monthly, quarterly seasonality"
      - "Seasonal strength assessment"
      - "Model diagnostics for seasonal components"

  - id: "LAYER-CA-003-01-01-REQ-003"
    title: "Prophet Model Integration"
    description: "Facebook Prophet for robust trend/seasonality"
    acceptance_criteria:
      - "Prophet with automatic changepoint detection"
      - "Multiple seasonality support (weekly, yearly)"
      - "Holiday effects handling"
      - "Uncertainty intervals via MCMC sampling"
      - "Trend flexibility with changepoint priors"

  - id: "LAYER-CA-003-01-01-REQ-004"
    title: "Model Selection Logic"
    description: "Choose best statistical model for each series"
    acceptance_criteria:
      - "Auto-select based on data characteristics"
      - "ARIMA for short-term linear trends"
      - "SARIMA when seasonality detected (p < 0.05)"
      - "Prophet for long-term complex patterns"
      - "Cross-validation for model comparison"

  - id: "LAYER-CA-003-01-01-REQ-005"
    title: "Forecast Generation"
    description: "Generate forecasts with metadata"
    acceptance_criteria:
      - "Multiple horizon forecasts (7, 30, 90 days)"
      - "Point forecasts with confidence intervals"
      - "Model diagnostics in metadata"
      - "Forecast quality metrics (MAPE, RMSE)"
      - "Serializable forecast objects"

# ====================================================================================
# TECHNICAL SPECIFICATIONS
# ====================================================================================

technical_specs:
  class_design:
    - "StatisticalForecaster: Main forecasting class"
    - "ARIMAModel: Auto-tuned ARIMA implementation"
    - "SARIMAModel: Seasonal ARIMA wrapper"
    - "ProphetModel: Facebook Prophet wrapper"
    - "ModelSelector: Model selection logic"
    - "ForecastResult: Output dataclass"

  data_structures:
    forecast_result:
      fields:
        - "model_type: str  # 'ARIMA', 'SARIMA', 'Prophet'"
        - "forecast_7day: float"
        - "forecast_30day: float"
        - "forecast_90day: float"
        - "confidence_lower_7day: float"
        - "confidence_upper_7day: float"
        - "confidence_lower_30day: float"
        - "confidence_upper_30day: float"
        - "confidence_lower_90day: float"
        - "confidence_upper_90day: float"
        - "model_params: Dict[str, Any]"
        - "diagnostics: Dict[str, float]  # AIC, BIC, RMSE, MAPE"
        - "fitted_values: List[float]"
        - "residuals: List[float]"

  algorithms:
    arima_selection: |
      1. Test stationarity (ADF, KPSS tests)
      2. Difference series if non-stationary
      3. ACF/PACF analysis for initial (p,q) range
      4. Grid search over parameter space
      5. Select model with lowest AIC/BIC
      6. Validate residuals are white noise
    
    sarima_seasonality_detection: |
      1. Decompose series (additive/multiplicative)
      2. ACF of seasonal lags (detect period m)
      3. Seasonal strength test
      4. If seasonal_strength > 0.6: use SARIMA
      5. Auto-tune seasonal parameters (P,D,Q)
    
    prophet_configuration: |
      1. Prepare data format (ds, y columns)
      2. Add known holidays/events
      3. Configure seasonality: yearly, weekly
      4. Set changepoint_prior_scale (0.05 default)
      5. Fit with MCMC for uncertainty
      6. Extract forecast with prediction intervals

# ====================================================================================
# TESTING REQUIREMENTS
# ====================================================================================

testing:
  unit_tests:
    - "test_arima_stationary_series"
    - "test_arima_nonstationary_series"
    - "test_sarima_seasonal_detection"
    - "test_sarima_weekly_pattern"
    - "test_prophet_trend_decomposition"
    - "test_prophet_seasonality_capture"
    - "test_model_selection_logic"
    - "test_forecast_confidence_intervals"
    - "test_multiple_horizon_forecasts"
  
  integration_tests:
    - "test_real_correlation_timeseries_arima"
    - "test_real_correlation_timeseries_sarima"
    - "test_real_correlation_timeseries_prophet"
    - "test_model_comparison_same_data"

# ====================================================================================
# DEPENDENCIES
# ====================================================================================

dependencies:
  external:
    - "statsmodels>=0.14.0"
    - "fbprophet>=0.7.1  # or prophet>=1.0"
    - "pandas>=2.0.0"
    - "numpy>=1.24.0"
    - "scipy>=1.10.0"

# ====================================================================================
# PERFORMANCE REQUIREMENTS
# ====================================================================================

performance:
  - "ARIMA training: <10 seconds for 365-day series"
  - "SARIMA training: <20 seconds for seasonal series"
  - "Prophet training: <15 seconds"
  - "Forecast generation: <1 second once trained"
  - "Model selection: <30 seconds total"
