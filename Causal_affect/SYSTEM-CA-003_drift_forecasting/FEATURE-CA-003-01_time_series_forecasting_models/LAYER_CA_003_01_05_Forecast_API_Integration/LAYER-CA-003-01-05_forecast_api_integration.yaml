# ====================================================================================
# LAYER REQUIREMENTS: Forecast API Integration
# ====================================================================================
# LAYER ID: LAYER-CA-003-01-05
# FEATURE: FEATURE-CA-003-01 (Time-Series Forecasting Models)
# ====================================================================================

metadata:
  layer_id: "LAYER-CA-003-01-05"
  layer_name: "Forecast API Integration"
  feature_id: "FEATURE-CA-003-01"
  version: "1.0.0"
  created_date: "2025-11-01"
  owner: "Causal Affect Team"

# ====================================================================================
# LAYER OVERVIEW
# ====================================================================================

overview:
  description: |
    FastAPI REST endpoints that orchestrate the complete drift forecasting pipeline. 
    Integrates with CA-002 correlation data, coordinates statistical and ML forecasting 
    engines, ensemble orchestration, and validation. Provides forecasts to CA-002-07 
    analysis explanation feature and external consumers.
  
  responsibility: |
    - Provide REST API endpoints for drift forecast requests
    - Fetch correlation time-series from CA-002 features
    - Orchestrate statistical and ML forecasting layers
    - Coordinate ensemble combination
    - Cache forecasts for performance
    - Provide health and status endpoints
    - Integrate with CA-002-07 for analysis explanations

  input: "HTTP requests with correlation pair and forecast parameters"
  output: "JSON responses with ensemble forecasts and metadata"
  technology: "FastAPI, pydantic, asyncio, aiohttp, redis"

# ====================================================================================
# FUNCTIONAL REQUIREMENTS
# ====================================================================================

requirements:
  - id: "LAYER-CA-003-01-05-REQ-001"
    title: "Forecast Request Endpoint"
    description: "POST endpoint for drift forecast generation"
    acceptance_criteria:
      - "POST /api/forecast accepts correlation pair and parameters"
      - "Request validation with pydantic models"
      - "Async processing for non-blocking operation"
      - "Response within 30 seconds for single correlation pair"
      - "Support multiple forecast horizons (7, 30, 90 days)"

  - id: "LAYER-CA-003-01-05-REQ-002"
    title: "Batch Forecast Endpoint"
    description: "POST endpoint for batch forecast generation"
    acceptance_criteria:
      - "POST /api/forecast/batch accepts list of correlation pairs"
      - "Maximum batch size: 10 pairs"
      - "Concurrent processing with asyncio.gather"
      - "Response within 5 minutes for 10 pairs"
      - "Partial success handling (return available forecasts)"

  - id: "LAYER-CA-003-01-05-REQ-003"
    title: "CA-002 Data Integration"
    description: "Fetch correlation time-series from CA-002 features"
    acceptance_criteria:
      - "Async call to CA-002-05 for correlation data"
      - "Retrieve sufficient history (365+ days for ML training)"
      - "Handle multiple correlation types (Pearson, Spearman)"
      - "Timeout: 10 seconds for data fetch"
      - "Return error if insufficient data available"

  - id: "LAYER-CA-003-01-05-REQ-004"
    title: "Forecast Pipeline Orchestration"
    description: "Coordinate all forecasting layers"
    acceptance_criteria:
      - "Invoke Layer 01 (Statistical models) in parallel"
      - "Invoke Layer 02 (ML models) in parallel"
      - "Collect individual forecasts"
      - "Pass to Layer 03 (Ensemble orchestrator)"
      - "Return ensemble forecast with metadata"

  - id: "LAYER-CA-003-01-05-REQ-005"
    title: "Forecast Caching"
    description: "Cache forecasts for performance"
    acceptance_criteria:
      - "Redis cache for forecast results"
      - "Cache key: symbol_pair + timeframe + forecast_date"
      - "TTL: 1 hour for real-time data, 24 hours for historical"
      - "Cache invalidation on model retraining"
      - "Cache hit rate > 60% in production"

  - id: "LAYER-CA-003-01-05-REQ-006"
    title: "Health and Status Endpoints"
    description: "Service health and model status"
    acceptance_criteria:
      - "GET /health returns service status"
      - "GET /api/forecast/status returns model readiness"
      - "Include CA-002 connectivity status"
      - "Model training status (last trained, accuracy)"
      - "Cache statistics"

  - id: "LAYER-CA-003-01-05-REQ-007"
    title: "CA-002-07 Integration"
    description: "Support integration with analysis explanation feature"
    acceptance_criteria:
      - "GET /api/forecast/{symbol_pair}/latest returns most recent forecast"
      - "Include all metadata needed for CA-002-07"
      - "Graceful handling when forecasts unavailable"
      - "Response format compatible with CA-002-07 expectations"
      - "CORS enabled for cross-feature access"

# ====================================================================================
# TECHNICAL SPECIFICATIONS
# ====================================================================================

technical_specs:
  api_endpoints:
    - endpoint: "POST /api/forecast"
      description: "Generate drift forecast for correlation pair"
      request_body:
        symbol_a: "str"
        symbol_b: "str"
        correlation_type: "str  # 'pearson', 'spearman', 'kendall'"
        forecast_horizons: "List[int]  # [7, 30, 90]"
        ensemble_strategy: "str  # default: 'WEIGHTED_AVERAGE'"
      response:
        forecast_id: "str"
        symbol_a: "str"
        symbol_b: "str"
        ensemble_forecast_7day: "float"
        ensemble_forecast_30day: "float"
        ensemble_forecast_90day: "float"
        confidence_intervals: "Dict[str, Tuple[float, float]]"
        model_weights: "Dict[str, float]"
        metadata: "ForecastMetadata"
    
    - endpoint: "POST /api/forecast/batch"
      description: "Generate forecasts for multiple correlation pairs"
      request_body:
        pairs: "List[CorrelationPair]"
        forecast_horizons: "List[int]"
      response:
        forecasts: "List[ForecastResponse]"
        failed: "List[str]"
        processing_time: "float"
    
    - endpoint: "GET /api/forecast/{symbol_pair}/latest"
      description: "Retrieve latest forecast for CA-002-07 integration"
      response:
        forecast: "EnsembleForecastResult"
        cached: "bool"
        generated_at: "datetime"
    
    - endpoint: "GET /health"
      response:
        status: "str  # 'healthy', 'degraded', 'unhealthy'"
        ca_002_connectivity: "bool"
        models_ready: "bool"
        cache_available: "bool"

  data_models:
    correlation_pair:
      fields:
        - "symbol_a: str"
        - "symbol_b: str"
        - "correlation_type: str = 'pearson'"
    
    forecast_request:
      fields:
        - "symbol_a: str"
        - "symbol_b: str"
        - "correlation_type: str = 'pearson'"
        - "forecast_horizons: List[int] = [7, 30, 90]"
        - "ensemble_strategy: str = 'WEIGHTED_AVERAGE'"
    
    forecast_response:
      fields:
        - "forecast_id: str"
        - "symbol_a: str"
        - "symbol_b: str"
        - "correlation_type: str"
        - "ensemble_forecast_7day: float"
        - "ensemble_forecast_30day: float"
        - "ensemble_forecast_90day: float"
        - "confidence_lower_7day: float"
        - "confidence_upper_7day: float"
        - "confidence_lower_30day: float"
        - "confidence_upper_30day: float"
        - "confidence_lower_90day: float"
        - "confidence_upper_90day: float"
        - "model_weights: Dict[str, float]"
        - "metadata: ForecastMetadata"
    
    forecast_metadata:
      fields:
        - "generated_at: datetime"
        - "processing_time_seconds: float"
        - "data_points_used: int"
        - "models_used: List[str]"
        - "ensemble_strategy: str"
        - "validation_accuracy: Optional[float]"
        - "cache_hit: bool"

  orchestration_flow:
    pipeline: |
      1. Receive API request → Validate with pydantic
      2. Check cache → Return if fresh and available
      3. Fetch correlation time-series from CA-002-05 (async)
      4. Validate data sufficiency (>= 180 days for training)
      5. Invoke Layer 01 statistical models (parallel):
         - ARIMA forecast
         - SARIMA forecast (if seasonal)
         - Prophet forecast
      6. Invoke Layer 02 ML models (parallel):
         - LSTM forecast
         - XGBoost forecast
      7. Collect all individual forecasts
      8. Pass to Layer 03 Ensemble Orchestrator
      9. Get ensemble forecast with confidence intervals
      10. Build response with metadata
      11. Cache result with TTL
      12. Return to client

# ====================================================================================
# TESTING REQUIREMENTS
# ====================================================================================

testing:
  unit_tests:
    - "test_request_validation_valid"
    - "test_request_validation_invalid"
    - "test_cache_key_generation"
    - "test_cache_hit_return"
    - "test_cache_miss_pipeline"
    - "test_ca002_data_fetch_success"
    - "test_ca002_data_fetch_failure"
    - "test_orchestration_pipeline"
    - "test_error_handling_insufficient_data"
  
  integration_tests:
    - "test_end_to_end_forecast_generation"
    - "test_batch_forecast_processing"
    - "test_real_ca002_data_integration"
    - "test_ca002_07_integration"
  
  performance_tests:
    - "test_single_forecast_under_30_seconds"
    - "test_batch_10_forecasts_under_5_minutes"
    - "test_cache_hit_under_500ms"
    - "test_concurrent_requests_scalability"

# ====================================================================================
# DEPENDENCIES
# ====================================================================================

dependencies:
  internal:
    - "LAYER-CA-003-01-01: Statistical forecasting"
    - "LAYER-CA-003-01-02: ML forecasting"
    - "LAYER-CA-003-01-03: Ensemble orchestrator"
    - "LAYER-CA-003-01-04: Validation (for accuracy reporting)"
    - "FEATURE-CA-002-05: Correlation data source"
  
  external:
    - "fastapi>=0.104.0"
    - "pydantic>=2.0.0"
    - "aiohttp>=3.8.0"
    - "redis>=4.5.0"
    - "python-dotenv>=1.0.0"

# ====================================================================================
# PERFORMANCE REQUIREMENTS
# ====================================================================================

performance:
  - "Single forecast (cache miss): <30 seconds"
  - "Single forecast (cache hit): <500ms"
  - "Batch 10 forecasts: <5 minutes"
  - "CA-002 data fetch: <10 seconds"
  - "Concurrent requests: 20 RPS"
  - "Cache hit rate: >60% in production"

# ====================================================================================
# CONFIGURATION
# ====================================================================================

configuration:
  environment_variables:
    - "CA_002_05_API_URL: URL for CA-002-05 integration endpoint"
    - "REDIS_URL: Redis connection for caching"
    - "CACHE_TTL_REALTIME: Cache TTL for real-time forecasts (seconds)"
    - "CACHE_TTL_HISTORICAL: Cache TTL for historical forecasts (seconds)"
    - "CA_002_TIMEOUT: Timeout for CA-002 requests (seconds)"
    - "MAX_BATCH_SIZE: Maximum batch forecast size"
    - "MIN_DATA_POINTS: Minimum data points required for forecasting"
  
  defaults:
    cache_ttl_realtime: 3600  # 1 hour
    cache_ttl_historical: 86400  # 24 hours
    ca_002_timeout: 10  # seconds
    max_batch_size: 10
    min_data_points: 180  # ~6 months
