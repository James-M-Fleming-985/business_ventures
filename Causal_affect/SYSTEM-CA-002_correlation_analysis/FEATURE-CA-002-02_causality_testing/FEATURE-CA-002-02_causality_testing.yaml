# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    Distinguishes correlation from causation using econometric and information-theoretic tests including Granger causality, VAR models, IRF, transfer entropy, and DAG inference.
  
  business_value:
    - "Identifies causal relationships vs spurious correlations"
    - "Quantifies direction and strength of causal effects"
    - "Provides foundation for predictive drift models"
    - "Reduces false positives in MVP recommendations"
  
  user_story: |
    As a data scientist, I want to test whether correlations are causal, so that I can focus on exploitable cause-effect relationships rather than spurious patterns.
  
  acceptance_criteria:
    - "All layer implementations complete and passing tests"
    - "API endpoints functional and returning correct data"
    - "Integration with CA-001 data source working"
    - "Performance meets system requirements"
    - "Documentation complete and accurate"

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  - layer_id: "LAYER-CA-002-02-01"
    name: "Granger Test"
    responsibility: "Implements Granger causality tests with multiple lags"
    technology: "Statsmodels"
    requirement_file: "LAYER-CA-002-02-01_granger_test.yaml"
    requirements:
      - "LAYER-CA-002-02-01"
  
  - layer_id: "LAYER-CA-002-02-02"
    name: "VAR Model"
    responsibility: "Builds Vector Autoregression models for multivariate analysis"
    technology: "Statsmodels"
    requirement_file: "LAYER-CA-002-02-02_var_model.yaml"
    requirements:
      - "LAYER-CA-002-02-02"
  
  - layer_id: "LAYER-CA-002-02-03"
    name: "IRF Calculator"
    responsibility: "Calculates Impulse Response Functions to quantify shock effects"
    technology: "Statsmodels"
    requirement_file: "LAYER-CA-002-02-03_irf_calculator.yaml"
    requirements:
      - "LAYER-CA-002-02-03"
  
  - layer_id: "LAYER-CA-002-02-04"
    name: "Transfer Entropy"
    responsibility: "Calculates transfer entropy for information flow quantification"
    technology: "NumPy, SciPy"
    requirement_file: "LAYER-CA-002-02-04_transfer_entropy.yaml"
    requirements:
      - "LAYER-CA-002-02-04"
  
  - layer_id: "LAYER-CA-002-02-05"
    name: "DAG Inference"
    responsibility: "Infers directed acyclic graphs of causal structure"
    technology: "CausalNex, NetworkX"
    requirement_file: "LAYER-CA-002-02-05_dag_inference.yaml"
    requirements:
      - "LAYER-CA-002-02-05"
  

