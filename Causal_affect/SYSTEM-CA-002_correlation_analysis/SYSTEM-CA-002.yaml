    source_backend:
      base_path: "SYSTEM-CA-002_correlation_analysis/src/backend"
      description: |
        FastAPI backend implementation with hybrid architecture.
        NOTE: All generated files will be saved INSIDE the SYSTEM folder at:
        /workspaces/business_ventures/Causal_affect/SYSTEM-CA-002_correlation_analysis/src/backend/app/
