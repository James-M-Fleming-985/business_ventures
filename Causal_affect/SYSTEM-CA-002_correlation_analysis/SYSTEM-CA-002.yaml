              - __init__.py
              - services/         # DashboardAggregator, ChartGenerator, NetworkGraphBuilder
              - models/           # Dashboard config, chart data models
              - db/               # Dashboard config schema
              - tests/            # Unit tests for dashboard services"
        root_files:
