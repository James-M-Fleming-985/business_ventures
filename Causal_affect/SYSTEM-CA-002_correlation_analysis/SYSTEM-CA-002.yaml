        - "deployment-guide.md       # Railway deployment instructions"

system_requirements:
  core_capabilities:
    - "Calculate Pearson, Spearman, Kendall correlations for all variable pairs"
    - "Perform time-lagged correlation analysis (0-30 day lags)"
    - "Execute Granger causality tests to identify causal relationships"
    - "Build directed acyclic graphs (DAG) of causal relationships"
    - "Score correlations by statistical significance, effect size, stability"
    - "Rank correlations by exploitability for MVP opportunities"
    - "Provide interactive correlation heatmap visualization"
    - "Display network graph of causal relationships"
    - "Export correlation reports in JSON/CSV formats"
    - "API endpoints for downstream systems (CA-003, CA-004)"
  
  performance_requirements:
    - "Calculate correlations for 1000+ variable pairs in <5 minutes"
    - "Granger causality tests complete in <10 minutes for 100 pairs"
    - "Dashboard loads in <2 seconds"
    - "Real-time filtering and search (<500ms response)"
    - "Support 100K+ data points per variable"
  
  data_requirements:
    - "Integrate with CA-001 TimescaleDB for time-series data"
    - "Handle missing data gracefully (interpolation/imputation)"
    - "Support multiple data frequencies (daily, weekly, monthly)"
    - "Cache correlation results for performance"
    - "Store causality test results for drift analysis"

features:
  - feature_id: FEATURE-CA-002-01
    name: Statistical Correlation Calculator
    description: |
      Calculates multiple correlation coefficients between time-series variable pairs.
      Supports Pearson (linear), Spearman (monotonic), Kendall Tau (rank), partial
      correlation (controlling confounders), and time-lagged correlation (delayed effects).
    layers:
      - LAYER-CA-002-01-01: Pearson Calculator
      - LAYER-CA-002-01-02: Spearman Calculator
      - LAYER-CA-002-01-03: Kendall Tau Calculator
      - LAYER-CA-002-01-04: Partial Correlation Calculator
      - LAYER-CA-002-01-05: Lagged Correlation Calculator
    
  - feature_id: FEATURE-CA-002-02
    name: Causality Testing Engine
    description: |
      Distinguishes correlation from causation using econometric tests. Implements
      Granger causality, Vector Autoregression (VAR), Impulse Response Functions (IRF),
      Transfer Entropy, and Directed Acyclic Graph (DAG) inference.
    layers:
      - LAYER-CA-002-02-01: Granger Causality Test
      - LAYER-CA-002-02-02: VAR Model Builder
      - LAYER-CA-002-02-03: IRF Calculator
      - LAYER-CA-002-02-04: Transfer Entropy Calculator
      - LAYER-CA-002-02-05: DAG Inference Engine
    
  - feature_id: FEATURE-CA-002-03
    name: Correlation Exploitation Scorer
    description: |
      Ranks correlations by their potential for MVP exploitation. Scores based on
      statistical significance, effect size, temporal stability, actionability, and
      market size. Outputs prioritized list of exploitable correlations.
    layers:
      - LAYER-CA-002-03-01: Statistical Significance Calculator
      - LAYER-CA-002-03-02: Effect Size Analyzer
      - LAYER-CA-002-03-03: Temporal Stability Tracker
      - LAYER-CA-002-03-04: Actionability Classifier
      - LAYER-CA-002-03-05: Market Opportunity Estimator
    
  - feature_id: FEATURE-CA-002-04
    name: Correlation Dashboard & Visualization
    description: |
      Interactive web dashboard for exploring correlations. Provides heatmap,
      time-series plots, network graphs, leaderboards, and drill-down views.
      Supports filtering, search, and export functionality.
    layers:
      - LAYER-CA-002-04-01: Heatmap Generator
      - LAYER-CA-002-04-02: Time Series Plotter
      - LAYER-CA-002-04-03: Network Graph Builder
      - LAYER-CA-002-04-04: Leaderboard Component

acceptance_criteria:
  statistical_accuracy:
    - "Pearson correlations match scipy.stats.pearsonr within 0.001"
    - "Granger p-values match statsmodels within 0.01"
    - "All significance tests use appropriate corrections (Bonferroni, FDR)"
  
  performance:
    - "1000 correlation pairs calculated in <5 minutes"
    - "Dashboard loads initial view in <2 seconds"
    - "Search/filter operations complete in <500ms"
  
  data_integration:
    - "Successfully queries CA-001 TimescaleDB"
    - "Handles missing data without errors"
    - "Caches results for repeated queries"
  
  visualization_quality:
    - "Heatmap renders for 100x100 correlation matrix"
    - "Network graph displays 500+ nodes without lag"
    - "Charts update smoothly (<100ms) on interaction"

technology_stack:
  backend:
    framework: "FastAPI 0.104+"
    statistical_libs: "NumPy, SciPy, Pandas, Statsmodels"
    causality_libs: "CausalNex, NetworkX, pyGranger"
    database: "PostgreSQL 15 (shared with CA-001)"
    cache: "Redis 7 for correlation results"
    async: "asyncio, asyncpg for async database access"
  
  frontend:
    framework: "React 18 + TypeScript"
    visualization: "D3.js, Recharts, Plotly.js"
    state_management: "Zustand"
    build: "Vite"
  
  deployment:
    platform: "Railway"
    containers: "Docker multi-stage builds"
    ci_cd: "GitHub Actions"

dependencies:
  internal:
    - "SYSTEM-CA-001: Data Ingestion (provides time-series data)"
  
  external:
    - "TimescaleDB (CA-001's time-series database)"
    - "PostgreSQL (shared operational database)"
    - "Redis (caching layer)"

testing_requirements:
  philosophy: |
    ALL TESTS MUST VERIFY ACTUAL STATISTICAL CALCULATIONS AND CAUSALITY TESTS.
    Use real data samples to validate correctness. Compare against known libraries.
    Test edge cases (missing data, constant series, perfect correlation).
  
  unit_tests:
    coverage_target: ">85%"
    focus_areas:
      - "Correlation calculation accuracy"
      - "Causality test implementation"
      - "Scoring algorithm correctness"
      - "Data handling edge cases"
  
  integration_tests:
    required_scenarios:
      - "CA-001 database integration"
      - "End-to-end correlation pipeline"
      - "Dashboard data aggregation"
  
  e2e_tests:
    required_scenarios:
      - "User calculates correlations via API"
      - "User views heatmap in dashboard"
      - "User explores causal network graph"
      - "User exports correlation report"

estimated_effort:
  development: "5-7 days"
  testing: "2-3 days"
  deployment: "1 day"
  total: "8-11 days"

