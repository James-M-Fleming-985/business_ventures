# SYSTEM-CA-002: Correlation Analysis Engine
# ==========================================

metadata:
  system_id: SYSTEM-CA-002
  system_name: Correlation Analysis Engine
  parent_project: PROJECT-CAUSAL_AFFECT
  created_date: 2025-01-19
  status: planned
  priority: critical
  
  purpose: |
    Analyzes time-series data from CA-001 to identify statistically significant
    correlations between variables. Performs causality testing to distinguish
    correlation from causation. Scores correlations by exploitability for MVP
    opportunities. Provides interactive dashboard for correlation exploration.
  
  business_value: |
    - Identifies market opportunities from data relationships
    - Distinguishes actionable correlations from noise
    - Provides foundation for drift forecasting (CA-003)
    - Enables data-driven MVP recommendations (CA-004)
    - Reduces false positives through rigorous statistical testing

deployment:
  platform: Railway
  service_type: Backend API + Frontend Dashboard
  scaling: 1 backend + 1 frontend (Phase 1) → 2-3 replicas (Phase 2)
  estimated_cost: "$25/month (Phase 1) → $70/month (Phase 2)"
  
  railway_config_backend:
    builder: NIXPACKS
    build_command: "pip install -r requirements.txt"
    start_command: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    health_check: "/health"
    restart_policy: ON_FAILURE
  
  railway_config_frontend:
    builder: NIXPACKS
    build_command: "npm install && npm run build"
    start_command: "npm run preview -- --host 0.0.0.0 --port $PORT"
    health_check: "/"
    restart_policy: ON_FAILURE

code_generation:
  repository_root: "/workspaces/business_ventures/Causal_affect"
  system_folder: "SYSTEM-CA-002_correlation_analysis"
  
  folder_structure:
    requirements:
      description: "Hierarchical folder structure with FEATURE and LAYER folders"
      structure: |
        SYSTEM-CA-002_correlation_analysis/
        ├── SYSTEM-CA-002.yaml (at root)
        ├── FEATURE-CA-002-01_statistical_correlation/
        │   ├── FEATURE-CA-002-01_statistical_correlation.yaml
        │   ├── LAYER-CA-002-01-01_pearson_calculator/
        │   │   └── LAYER-CA-002-01-01_pearson_calculator.yaml
        │   ├── LAYER-CA-002-01-02_spearman_calculator/
        │   │   └── LAYER-CA-002-01-02_spearman_calculator.yaml
        │   └── ... (additional layers)
        ├── FEATURE-CA-002-02_causality_testing/
        │   └── FEATURE-CA-002-02_causality_testing.yaml
        ├── FEATURE-CA-002-03_correlation_scorer/
