    - "AnalyticsService.get_accuracy_summary returns correct MAPE and direction %"
    - "AnalyticsService.get_timeseries returns matching predicted/actual pairs"
    - "AnalyticsService.compare_models groups by model_version correctly"
    - "ActualUpdater finds pending predictions and updates them"
    - "PredictionOverlayChart renders with valid data"
    - "ModelComparisonTable sorts by columns"
