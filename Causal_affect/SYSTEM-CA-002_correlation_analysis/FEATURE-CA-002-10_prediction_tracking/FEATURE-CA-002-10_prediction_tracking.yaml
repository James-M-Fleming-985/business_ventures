# ====================================================================================
# PRODUCTION INTEGRATION (auto-wiring into the live app)
# ====================================================================================
# This section tells the AI Feature Builder HOW to connect the built feature
# into the production application.  Without this, the feature code is generated
# but sits orphaned — never imported or served by the running app.
#
# The builder reads this section after generating feature_integration.py and
# automatically patches the target router file to import the orchestrator and
# register API endpoints.
# ====================================================================================

production_integration:
  # Path to the router/app file that should be patched (relative to repo root)
  target_router_file: "src/backend/app/causality_router.py"

  # Unique alias for the imported orchestrator (used in generated code)
  import_alias: "PredictionTrackingService"

  # Unique module name for importlib loading (avoids name collisions)
  module_name: "feature_integration_10"

  # URL prefix for all endpoints (appended to the router's existing prefix)
  endpoint_prefix: "/predictions"

  # Whether to auto-generate a GET <prefix>/health endpoint
  health_endpoint: true

  # Pydantic models for request validation
  pydantic_models:
    - name: "PredictionListRequest"
      fields:
        - name: "domain"
          type: "Optional[str]"
          default: "None"
          description: "Filter by variable domain"
        - name: "variable_pair"
          type: "Optional[str]"
          default: "None"
          description: "Filter by X→Y pair"
        - name: "model_version"
          type: "Optional[str]"
          default: "None"
          description: "Filter by model version"
        - name: "status"
          type: "Optional[str]"
          default: "None"
          description: "pending, validated, expired"
        - name: "confidence"
          type: "Optional[str]"
          default: "None"
          description: "High, Medium, Low"
        - name: "page"
          type: "int"
          default: "1"
          description: "Page number"
        - name: "page_size"
          type: "int"
          default: "50"
          description: "Results per page"

    - name: "AccuracyFilterRequest"
      fields:
        - name: "domain"
          type: "Optional[str]"
          default: "None"
          description: "Filter by domain"
        - name: "variable_pair"
          type: "Optional[str]"
          default: "None"
          description: "Filter by pair"
        - name: "model_version"
          type: "Optional[str]"
          default: "None"
          description: "Filter by model"
        - name: "date_from"
          type: "Optional[str]"
          default: "None"
          description: "Start date ISO"
        - name: "date_to"
          type: "Optional[str]"
          default: "None"
          description: "End date ISO"

  # Operations to expose as API endpoints
  operations:
    - name: "list_predictions"
      http_method: "get"
      path: "/"
      description: "List predictions with filters"
      request_model: "PredictionListRequest"
      orchestrator_method: "list_predictions"
      orchestrator_args: "request.domain, request.variable_pair, request.model_version, request.status, request.confidence, request.page, request.page_size"

    - name: "get_prediction"
      http_method: "get"
      path: "/{prediction_id}"
      description: "Get single prediction detail"
      orchestrator_method: "get_prediction"
      orchestrator_args: "prediction_id"

    - name: "accuracy_summary"
      http_method: "get"
      path: "/accuracy"
      description: "Get accuracy summary metrics"
      request_model: "AccuracyFilterRequest"
      orchestrator_method: "get_accuracy_summary"
      orchestrator_args: "request.domain, request.variable_pair, request.model_version, request.date_from, request.date_to"

    - name: "accuracy_timeseries"
      http_method: "get"
      path: "/accuracy/timeseries"
      description: "Get predicted-vs-actual time series for overlay chart"
      request_model: "AccuracyFilterRequest"
      orchestrator_method: "get_accuracy_timeseries"
      orchestrator_args: "request.variable_pair, request.model_version, request.date_from, request.date_to"

    - name: "compare_models"
      http_method: "get"
      path: "/models/compare"
      description: "Compare accuracy across model versions"
      request_model: "AccuracyFilterRequest"
      orchestrator_method: "compare_models"
      orchestrator_args: "request.domain, request.variable_pair, request.date_from, request.date_to"

    - name: "trigger_actual_update"
      http_method: "post"
      path: "/update-actuals"
      description: "Trigger background job to update actuals for pending predictions"
      orchestrator_method: "update_actuals"
      orchestrator_args: ""
