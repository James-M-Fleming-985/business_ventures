# ====================================================================================
# DATABASE SCHEMA
# ====================================================================================

database:
  table_name: "prediction_tracking"
  schema: |
    CREATE TABLE prediction_tracking (
      id SERIAL PRIMARY KEY,

      -- Identification
      prediction_id VARCHAR(50) UNIQUE NOT NULL,
      granger_result_id INT REFERENCES granger_results(id),

      -- Variables involved
      fast_variable_id INT REFERENCES variable_metadata(id),
      fast_variable_name VARCHAR(100) NOT NULL,
      medium_variable_id INT REFERENCES variable_metadata(id),
      medium_variable_name VARCHAR(100) NOT NULL,

      -- Timing
      predicted_at TIMESTAMP NOT NULL,
      target_date DATE NOT NULL,
      optimal_lag_days INT,

      -- The prediction
      predicted_direction VARCHAR(10),
      predicted_value FLOAT,
      predicted_change_pct FLOAT,
      baseline_value FLOAT,

      -- Regression coefficients
      beta_0 FLOAT,
      beta_1 FLOAT,
      r_squared FLOAT,
      fast_var_change FLOAT,

      -- Model metadata
      model_version VARCHAR(50) NOT NULL DEFAULT 'granger_v1',
      confidence_level VARCHAR(20) DEFAULT 'Medium',
      granger_p_value FLOAT,
      granger_f_statistic FLOAT,

      -- Actual outcome (NULL until data available)
      actual_value FLOAT,
      actual_direction VARCHAR(10),
      actual_change_pct FLOAT,
      actual_recorded_at TIMESTAMP,

      -- Accuracy metrics (calculated after actual known)
      direction_correct BOOLEAN,
      value_error FLOAT,
      value_error_pct FLOAT,
      timing_error_days INT,

      -- Status
      status VARCHAR(20) DEFAULT 'pending',

      created_at TIMESTAMP DEFAULT NOW(),
      updated_at TIMESTAMP DEFAULT NOW()
    );

    CREATE INDEX idx_prediction_target_date ON prediction_tracking(target_date);
    CREATE INDEX idx_prediction_status ON prediction_tracking(status);
    CREATE INDEX idx_prediction_model ON prediction_tracking(model_version);
    CREATE INDEX idx_prediction_variables ON prediction_tracking(fast_variable_id, medium_variable_id);

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  # Backend Layers
  - layer_id: "LAYER-CA-002-10-01"
    name: "Prediction Storage"
    folder: "LAYER_CA_002_10_01_Prediction_Storage"
    type: "backend"
    responsibility: |
      SQLAlchemy model for prediction_tracking table plus a repository class
      with CRUD operations: store_prediction(), record_actual(),
      list_predictions(), get_prediction().  Uses async SQLAlchemy with
      the Railway PostgreSQL database.
    technology: "Python, SQLAlchemy, asyncpg"
    requirement_file: "LAYER-CA-002-10-01_prediction_storage.yaml"

  - layer_id: "LAYER-CA-002-10-02"
    name: "Actual Updater"
    folder: "LAYER_CA_002_10_02_Actual_Updater"
    type: "backend"
    responsibility: |
      Background job that queries prediction_tracking where target_date <= today
      AND actual_value IS NULL, fetches actual values from time_series_data,
      and updates records with actual_value, direction_correct, value_error_pct.
      Can be triggered via API endpoint or scheduled.
    technology: "Python, SQLAlchemy, asyncio"
    requirement_file: "LAYER-CA-002-10-02_actual_updater.yaml"

  - layer_id: "LAYER-CA-002-10-03"
    name: "Analytics Service"
    folder: "LAYER_CA_002_10_03_Analytics_Service"
    type: "backend"
    responsibility: |
      Service class that calculates accuracy metrics:
      - Summary: direction accuracy, MAPE, timing accuracy, best/worst pairs
      - Timeseries: predicted-vs-actual data points for overlay chart
      - Model comparison: accuracy breakdown by model_version
      Supports filtering by domain, variable pair, date range, model, confidence.
      Operates on ALL 61+ variable pairs from CA-001 data sources.
    technology: "Python, NumPy, SQLAlchemy"
    requirement_file: "LAYER-CA-002-10-03_analytics_service.yaml"

  - layer_id: "LAYER-CA-002-10-04"
    name: "Prediction Router"
    folder: "LAYER_CA_002_10_04_Prediction_Router"
    type: "backend"
    responsibility: |
      FastAPI router exposing 5 endpoints under /api/causality/predictions/:
      1. GET / — paginated prediction list
      2. GET /{prediction_id} — single prediction detail
      3. GET /accuracy — summary accuracy metrics
      4. GET /accuracy/timeseries — chart data for overlay
      5. GET /models/compare — model comparison table data
      Plus POST /update-actuals to trigger the actual updater job.
    technology: "FastAPI, Pydantic"
    requirement_file: "LAYER-CA-002-10-04_prediction_router.yaml"

  # Frontend Layer
  - layer_id: "LAYER-CA-002-10-05"
    name: "Prediction Dashboard"
    folder: "LAYER_CA_002_10_05_Prediction_Dashboard"
    type: "frontend"
    responsibility: |
      Full-page React dashboard at /predictions with:
      1. PredictionOverlayChart — Recharts ComposedChart showing predicted
         (dashed line) vs actual (solid line) with divergence area shading
      2. ModelComparisonTable — sortable table of model versions with
         Direction %, MAPE, N Predictions, Period columns
      3. PredictionFilters — domain, variable pair, date range, model version,
         confidence level filter controls
      4. Summary cards — direction accuracy %, MAPE, timing accuracy
      New nav item "🎯 Predictions" in Layout.jsx, route in App.jsx.
    technology: "React, Recharts, TailwindCSS"
    requirement_file: "LAYER-CA-002-10-05_prediction_dashboard.yaml"

