# ====================================================================================
# UI INTEGRATION CONTEXT
# ====================================================================================

ui_integration:
  entry_point:
    page: "PredictionDashboard.jsx"
    location: "src/components/PredictionDashboard.jsx"
    trigger: "User clicks '🎯 Predictions' in the nav sidebar"

  navigation:
    type: "new_nav_item"
    nav_file: "src/components/Layout.jsx"
    label: "🎯 Predictions"
    route: "/predictions"
    position: "After Signal Radar"

  routing:
    router_file: "src/App.jsx"
    route_path: "/predictions"
    component: "PredictionDashboard"

  new_components:
    - name: "PredictionDashboard.jsx"
      type: "React page component"
      library: "Recharts, TailwindCSS"
      description: |
        Full-page Prediction Analytics dashboard.  Three main sections:
        1. Predicted-vs-Actual overlay chart (Recharts ComposedChart with
           dashed prediction line, solid actual line, divergence shading)
        2. Model Comparison table (sortable by Direction %, MAPE, N, Period)
        3. Filter panel (domain, variable pair, date range, model version,
           confidence level)

    - name: "PredictionOverlayChart.jsx"
      type: "React component"
      library: "Recharts"
      description: "Line chart overlay: predicted (dashed) vs actual (solid) with divergence area shading"

    - name: "ModelComparisonTable.jsx"
      type: "React component"
      library: "TailwindCSS"
      description: "Sortable table comparing Direction %, MAPE, N Predictions, Period across model versions"

    - name: "PredictionFilters.jsx"
      type: "React component"
      library: "TailwindCSS"
      description: "Filter controls: domain, variable pair, date range, model version, confidence level"

  user_flow: |
    User clicks "🎯 Predictions" in the nav sidebar
      → PredictionDashboard.jsx loads
        → Calls GET /api/causality/predictions/accuracy (summary metrics)
        → Calls GET /api/causality/predictions/accuracy/timeseries (chart data)
          → PredictionOverlayChart renders predicted vs actual lines
          → Summary cards show direction accuracy, MAPE, timing accuracy
        → Bottom section shows ModelComparisonTable
          → Calls GET /api/causality/predictions/models/compare
          → Rows: model version, direction %, MAPE, N predictions, period
        → User applies filters → API calls refresh with query params
          → by_domain, by_variable_pair, date_range, model_version, confidence

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    Prediction Accuracy Tracking is the Phase 5.5 MODEL MANAGEMENT TOOL for the
    Causal Affect project.  It stores every prediction the system makes (direction,
    magnitude, timing, β₁ values) for ALL 61+ variable pairs from CA-001 data
    sources, then updates with actual outcomes as data arrives.

    Core value: MODEL COMPARISON.  Users see which model variant (granger_v1,
    granger_v1+lag_opt, ensemble_v1, etc.) performs best for each domain and
    variable pair.  Lag optimization is INTEGRAL — not a separate approach but
    the default enhancement applied to all Granger predictions.

    North-star metric: CLOSING THE GAP between predicted and actual values,
    measured as decreasing MAPE and increasing direction accuracy across model
    iterations.

    The dashboard answers:
    - Where do our models excel vs struggle (per domain and variable pair)?
    - Which model version gives the best accuracy for which relationships?
    - Is accuracy improving over time as we add new models?
    - What is the gap between predicted and actual, and is it closing?

  business_value:
    - "Creates feedback loop for continuous model improvement"
    - "Tracks accuracy across ALL 61+ CA-001 variable pairs"
    - "Enables model comparison to identify best approach per relationship"
    - "Identifies where models excel vs struggle by domain"
    - "Measures gap between predicted and actual over time"
    - "Informs future model investments (ensemble, VAR, etc.)"

  user_story: |
    As a Causal Affect analyst, I want to see how accurate my predictions are
    for every variable pair across different model versions, so I can identify
    which models work best where and focus improvement efforts on closing the
    gap between predictions and reality.

  acceptance_criteria:
    - "Predictions stored automatically when Granger/regression analysis runs"
    - "Actual outcomes recorded by daily background updater job"
    - "GET /api/causality/predictions returns paginated list of all predictions"
    - "GET /api/causality/predictions/{id} returns single prediction detail"
    - "GET /api/causality/predictions/accuracy returns summary metrics"
    - "GET /api/causality/predictions/accuracy/timeseries returns chart data"
    - "GET /api/causality/predictions/models/compare returns model comparison"
    - "Dashboard shows predicted-vs-actual overlay chart with divergence shading"
    - "Dashboard shows model comparison table sortable by Direction %, MAPE"
    - "Dashboard has filter controls for domain, variable pair, date, model, confidence"
    - "Direction accuracy, MAPE, timing accuracy displayed as summary cards"
    - "New nav item '🎯 Predictions' visible in sidebar"
    - "Error handling: 404 for missing prediction, 400 for invalid input"

# ====================================================================================
# API SPECIFICATION
# ====================================================================================

api:
  base_prefix: "/api/causality/predictions"

  endpoints:
    - method: "GET"
      path: "/api/causality/predictions"
      description: "Paginated list of predictions with optional filters"
      query_params:
        - name: "domain"
          type: "string"
          description: "Filter by variable domain"
        - name: "variable_pair"
          type: "string"
          description: "Filter by specific X→Y pair (e.g., ai_papers__nvda_stock)"
        - name: "model_version"
          type: "string"
          description: "Filter by model version"
        - name: "status"
          type: "string"
          description: "'pending', 'validated', 'expired'"
        - name: "confidence"
          type: "string"
          description: "'High', 'Medium', 'Low'"
        - name: "page"
          type: "integer"
          default: 1
        - name: "page_size"
          type: "integer"
          default: 50
      response: |
        {
          "success": true,
          "data": {
            "predictions": [...],
            "total": 245,
            "page": 1,
            "page_size": 50
          }
        }

    - method: "GET"
      path: "/api/causality/predictions/{prediction_id}"
      description: "Single prediction with full detail"
      response: |
        {
          "success": true,
          "data": {
            "prediction_id": "pred-abc123",
            "fast_variable_name": "ai_papers",
            "medium_variable_name": "nvda_stock",
            "predicted_direction": "up",
            "predicted_value": 480.0,
            "actual_value": 465.0,
            "direction_correct": false,
            "value_error_pct": -3.1,
            "model_version": "granger_v1",
            "status": "validated",
            ...
          }
        }

    - method: "GET"
      path: "/api/causality/predictions/accuracy"
      description: "Summary accuracy metrics with optional filters"
      query_params:
        - name: "domain"
          type: "string"
        - name: "variable_pair"
          type: "string"
        - name: "model_version"
          type: "string"
        - name: "date_from"
          type: "string"
          description: "ISO date"
        - name: "date_to"
          type: "string"
          description: "ISO date"
      response: |
        {
          "success": true,
          "data": {
            "direction_accuracy": 0.785,
            "mean_absolute_error": 4.2,
            "mape": 3.8,
            "timing_accuracy": 0.85,
            "total_predictions": 245,
            "validated_predictions": 180,
            "best_performing_pair": {
              "pair": "layoff_searches → job_board_traffic",
              "direction_accuracy": 0.91
            },
            "worst_performing_pair": {
              "pair": "ai_papers → nvda_stock",
              "direction_accuracy": 0.62
            }
          }
        }

    - method: "GET"
      path: "/api/causality/predictions/accuracy/timeseries"
      description: "Time series of predicted vs actual for overlay chart"
      query_params:
        - name: "variable_pair"
          type: "string"
          required: true
        - name: "model_version"
          type: "string"
        - name: "date_from"
          type: "string"
        - name: "date_to"
          type: "string"
      response: |
        {
          "success": true,
          "data": {
            "variable_pair": "ai_papers → nvda_stock",
