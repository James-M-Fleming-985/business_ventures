  stat_cards: "bg-gray-800 rounded-lg p-4 shadow-md"
  chart_container: "bg-gray-800 rounded-lg p-6 mt-6"
  table: "bg-gray-800 rounded-lg overflow-hidden mt-6"
  table_header: "bg-gray-700 text-gray-300 uppercase text-xs"
  table_row: "border-b border-gray-700 hover:bg-gray-750"
  filter_panel: "bg-gray-800 rounded-lg p-4 space-y-3"
  accent_color: "text-emerald-400 for positive, text-red-400 for negative"
  best_model_highlight: "ring-2 ring-emerald-500"

# ====================================================================================
# ACCEPTANCE CRITERIA
# ====================================================================================

acceptance_criteria:
  - "Dashboard accessible at /predictions route"
  - "Nav sidebar shows '🎯 Predictions' link"
  - "Four summary stat cards load with data from /accuracy endpoint"
  - "Overlay chart renders predicted (dashed blue) and actual (solid green) lines"
  - "Divergence area shaded red for over-prediction, green for under-prediction"
  - "Model comparison table loads with sortable columns"
  - "Best model row highlighted with accent"
  - "Filter panel has domain, variable pair, date range, model, confidence controls"
  - "Applying filters refreshes all three data sections"
  - "Loading states shown while data fetches"
  - "Error states shown if API calls fail"
  - "Responsive layout works on standard desktop viewport"
  - "Dark theme matches existing app aesthetic"

