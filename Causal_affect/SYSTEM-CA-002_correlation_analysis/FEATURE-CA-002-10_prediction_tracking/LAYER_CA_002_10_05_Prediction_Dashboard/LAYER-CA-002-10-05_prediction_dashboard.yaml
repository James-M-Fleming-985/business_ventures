# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Prediction Analytics Dashboard"

  description: |
    Full-page React dashboard at route /predictions, accessible via new
    sidebar nav item "🎯 Predictions" in Layout.jsx.

    The dashboard has three main sections:

    1. SUMMARY CARDS (top row)
       Four stat cards showing:
       - Direction Accuracy (e.g., "78.5%")
       - MAPE (e.g., "4.2%")
       - Timing Accuracy (e.g., "85%")
       - Total Predictions (e.g., "245 tracked")
       Data from: GET /api/causality/predictions/accuracy

    2. PREDICTED VS ACTUAL OVERLAY CHART (main area)
       - Recharts ComposedChart with two Line series:
         - Predicted values: dashed line, blue
         - Actual values: solid line, green
       - Area between the lines shaded to show divergence:
         - Red shading where predicted > actual (over-prediction)
         - Green shading where actual > predicted (under-prediction)
       - X-axis: target dates
       - Y-axis: values
       - Tooltip shows date, predicted, actual, divergence %
       - Default view: most recent variable pair with data
       Data from: GET /api/causality/predictions/accuracy/timeseries

    3. MODEL COMPARISON TABLE (bottom section)
       - Sortable HTML table with columns:
         - Model Version (e.g., "granger_v1", "granger_v1+lag_opt")
         - Direction % (e.g., "72%", "76%")
         - MAPE (e.g., "5.1%", "4.5%")
         - N Predictions (e.g., "45", "38")
         - Period (e.g., "Jan-Jun 2026")
       - Click column header to sort
       - Best model highlighted with accent color
       Data from: GET /api/causality/predictions/models/compare

    4. FILTER PANEL (sidebar or top bar)
       - Domain dropdown (variable domain filter)
       - Variable Pair dropdown (specific X→Y relationship)
       - Date Range picker (from/to date inputs)
       - Model Version dropdown
       - Confidence Level dropdown (High/Medium/Low)
       - "Apply Filters" button refreshes all three sections
       - "Reset" button clears all filters

    Navigation Integration:
    - Add to Layout.jsx nav items: { label: "🎯 Predictions", to: "/predictions" }
    - Add to App.jsx routes: <Route path="/predictions" element={<PredictionDashboard />} />

  rationale: |
    The dashboard is the user-facing surface for model management.
    It answers "where are models good, where are they bad, and is accuracy
    improving?" — the north-star questions for the prediction tracking system.

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  technology_stack:
    programming_language: "JavaScript (JSX)"
    file_extensions: [".jsx"]
    runtime_environment: "Browser (React)"
    primary_framework: "React"
    additional_libraries:
      - "recharts (ComposedChart, Line, Area, XAxis, YAxis, Tooltip, Legend)"
      - "react-router-dom"
      - "TailwindCSS utility classes"

  api_calls:
    - endpoint: "GET /api/causality/predictions/accuracy"
      description: "Summary metrics for stat cards"
      trigger: "On mount and on filter change"
    - endpoint: "GET /api/causality/predictions/accuracy/timeseries"
      description: "Chart data for overlay"
      trigger: "On mount and on filter change"
      requires: "variable_pair query param"
    - endpoint: "GET /api/causality/predictions/models/compare"
      description: "Model comparison table data"
      trigger: "On mount and on filter change"

  components:
    - name: "PredictionDashboard"
      file: "PredictionDashboard.jsx"
      description: "Main page component, orchestrates data fetching and layout"

    - name: "PredictionOverlayChart"
      file: "PredictionOverlayChart.jsx"
      description: |
        Recharts ComposedChart with:
        - Line (dashed, blue): predicted values
        - Line (solid, green): actual values
        - Area: divergence shading between lines
        Props: { points: [{target_date, predicted_value, actual_value, divergence_pct}] }

    - name: "ModelComparisonTable"
      file: "ModelComparisonTable.jsx"
      description: |
        Sortable table showing model performance.
        Props: { models: [{model_version, direction_accuracy, mape, n_predictions, period}] }
        State: sortColumn, sortDirection

    - name: "PredictionFilters"
      file: "PredictionFilters.jsx"
      description: |
        Filter controls panel.
        Props: { onApply: (filters) => void, onReset: () => void }
        State: domain, variablePair, dateFrom, dateTo, modelVersion, confidence

