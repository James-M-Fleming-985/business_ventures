# ====================================================================================
# CODE GENERATION CONSTRAINTS
# ====================================================================================

code_generation_constraints:
  must_use:
    - "FastAPI APIRouter"
    - "Depends(get_db) for database session"
    - "HTTPException for error responses"
    - "statsmodels.api.OLS for regression"
  
  must_not_use:
    - "Global database connections"
    - "Blocking synchronous calls in async functions"
    - "Manual regression calculation (use statsmodels)"
  
  naming_conventions:
    functions: "snake_case"
    classes: "PascalCase"
    constants: "UPPER_SNAKE_CASE"
  
  file_structure:
    implementation: "src/backend/app/regression_calculator.py"
    tests: "tests/test_regression_calculator.py"
