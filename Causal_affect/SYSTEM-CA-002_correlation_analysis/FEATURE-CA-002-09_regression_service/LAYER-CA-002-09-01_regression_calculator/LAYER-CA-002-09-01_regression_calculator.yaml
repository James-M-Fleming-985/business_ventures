requirement:
  title: "Regression Calculator"
  description: |
    Implements OLS (Ordinary Least Squares) regression to calculate the
    β₁ coefficient that quantifies the relationship between X and Y.
    
    Model: Y = β₀ + β₁×X + ε
    
    Where:
    - β₀: Intercept (baseline Y when X=0)
    - β₁: Slope (change in Y per unit change in X) - THE KEY OUTPUT
    - ε: Error term
    
    Also calculates:
    - R² (coefficient of determination)
    - Standard error of β₁
    - 95% confidence interval for β₁
    - P-value for significance testing
  
  rationale: |
    Correlation tells us variables are related. Regression tells us BY HOW MUCH.
    The β₁ coefficient is the critical number for exploitation decisions.

specification:
  structure:
    entry_point: "src/backend/app/regression_service.py"
    modules:
      - "regression_service.py - OLS calculation"
  
  implementation_details:
    libraries:
      - "Statsmodels (OLS)"
      - "NumPy"
      - "SciPy"
    patterns:
      - "Service Pattern"
    
  inputs:
    - name: "x_series"
      type: "np.ndarray"
      description: "Predictor variable time series"
    - name: "y_series"
      type: "np.ndarray"
      description: "Outcome variable time series"
    - name: "lag"
      type: "int"
      description: "Lag offset to apply to X (from Phase 3)"
  
  outputs:
    - name: "regression_result"
      type: "dict"
      description: "Complete regression statistics"
      example: |
        {
          "beta_0": 50000.0,
          "beta_1": 3.2,
          "r_squared": 0.68,
          "p_value": 0.001,
          "std_error": 0.4,
          "confidence_interval_95": {"lower": 2.4, "upper": 4.0},
          "n_observations": 156,
          "interpretation": "For every +1 layoff search, job traffic increases by 3.2 visitors"
        }

acceptance_criteria:
  - criterion: "Calculates β₀ and β₁ using OLS"
    category: "functional"
  - criterion: "Returns R² coefficient of determination"
    category: "functional"
  - criterion: "Calculates 95% confidence interval for β₁"
    category: "functional"
  - criterion: "Applies lag offset to predictor variable"
    category: "functional"
  - criterion: "Handles edge cases (constant values, insufficient data)"
    category: "functional"
  - criterion: "Calculation time <5 seconds"
    category: "performance"
  - criterion: "Unit test coverage >90%"
    category: "quality"

code_generation_constraints:
  imports:
    required:
      - "import numpy as np"
      - "import statsmodels.api as sm"
      - "from typing import Dict, Any, Optional"
  
  naming_conventions:
    class_name: "RegressionService"
    main_function: "run_ols_regression"
  
  structure:
    must_include:
      - "run_ols_regression(x_series, y_series, lag=0) -> dict"
      - "calculate_predicted_impact(beta_1, x_change) -> float"
      - "_generate_interpretation(var1_name, var2_name, beta_1) -> str"
      - "validation of input data"

