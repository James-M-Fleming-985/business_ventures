# ====================================================================================
# UI INTEGRATION CONTEXT
# ====================================================================================

ui_integration:
  entry_point:
    page: "GrangerModal.jsx"
    location: "src/components/GrangerModal.jsx"
    trigger: "User clicks 'Regression' tab inside GrangerModal"
  
  component:
    name: "GrangerModal.jsx"
    location: "src/components/GrangerModal.jsx"
    status: "MODIFIED by CA-002-08 to have tabs"
    tab: "Regression (third tab)"
  
  new_components:
    - name: "RegressionResults.jsx"
      type: "React component"
      description: "Displays β₁, R², formula, interpretation"
  
  user_flow: |
    User is in GrangerModal (with tabs from CA-002-08)
      → User clicks "Regression" tab
        → RegressionResults component loads
          → Calls GET /api/signal-radar/signals/{keyword}/regression
            → Backend returns: beta_0, beta_1, r_squared, p_value, interpretation
              → Component displays:
                - Large β₁ = 2.45
                - Formula: Y = 150.23 + 2.45 × X
                - R² = 0.72 (72% variance explained)
                - "For every 1% increase in ai_papers, nvda_stock increases 2.45%"

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    Backend service that performs Ordinary Least Squares (OLS) regression
    between a signal and target at the optimal lag (from CA-002-08),
    returning the β₁ coefficient for quantified predictions.
    
    Regression answers: "How much does Y change for every 1-unit change in X?"
    The β₁ coefficient is the KEY to exploitation - it tells you the expected
    magnitude of price movement given a signal change.
  
  business_value:
    - "Provides quantified predictions: β₁ = 2.45 means +1 X → +2.45 Y"
    - "Enables formula-based trading: Y = β₀ + β₁ × X"
    - "R² indicates model quality (how much variance explained)"
    - "Confidence intervals quantify prediction uncertainty"
    - "Interpretation text makes results actionable"
  
  user_story: |
    As a user viewing Granger/Lag results,
    I want to see exactly how much change in the target I can expect
    for a given change in the signal,
    So that I can make quantified predictions and calculate expected returns.
  
  acceptance_criteria:
    - "GET /api/signal-radar/signals/{keyword}/regression endpoint functional"
    - "Uses statsmodels OLS regression"
    - "Applies optimal_lag from lag analysis"
    - "Returns beta_0 (intercept) and beta_1 (slope)"
    - "Returns r_squared (coefficient of determination)"
    - "Returns p_value for statistical significance"
    - "Returns confidence_intervals for beta_1"
    - "Returns interpretation text"
    - "Error handling for missing signals (404)"

# ====================================================================================
# API SPECIFICATION
# ====================================================================================

api:
  endpoint: "GET /api/signal-radar/signals/{keyword}/regression"
  status: "NEW"
  
  path_params:
    keyword:
      type: "string"
      description: "Signal keyword (e.g., 'ai_papers')"
  
  query_params:
    lag:
      type: "integer"
      default: null
      description: "Lag to use. If null, uses optimal_lag from lag analysis"
  
  response_format: |
    {
      "keyword": "ai_papers",
      "target": "nvda_stock",
      "lag_used": 30,
      "beta_0": 150.23,
      "beta_1": 2.45,
      "r_squared": 0.72,
      "p_value": 0.0001,
      "std_error": 0.34,
      "confidence_interval": {"lower": 1.78, "upper": 3.12},
      "n_observations": 365,
      "interpretation": "For every +1% increase in ai_papers, nvda_stock increases by 2.45% after 30 days"
    }

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  # Backend Layers
  - layer_id: "LAYER-CA-002-09-01"
    name: "Regression Service"
    folder: "LAYER_CA_002_09_01_Regression_Service"
    type: "backend"
    responsibility: |
      Service class that performs OLS regression using statsmodels.
      Retrieves data, applies lag shift, runs regression, formats results.
    technology: "Python, statsmodels"
    requirement_file: "LAYER-CA-002-09-01_regression_service.yaml"
  
  - layer_id: "LAYER-CA-002-09-02"
    name: "Regression Router"
    folder: "LAYER_CA_002_09_02_Regression_Router"
    type: "backend"
    responsibility: |
      FastAPI router with GET /api/signal-radar/signals/{keyword}/regression endpoint.
      Calls RegressionService and returns formatted results.
    technology: "FastAPI"
    requirement_file: "LAYER-CA-002-09-02_regression_router.yaml"
  
  # Frontend Layer
  - layer_id: "LAYER-CA-002-09-03"
    name: "Regression Results"
    folder: "LAYER_CA_002_09_03_Regression_Results"
    type: "frontend"
    responsibility: |
      React component displaying regression results with emphasis on β₁.
      Shows formula, R², interpretation, confidence intervals.
    technology: "React, TailwindCSS"
    requirement_file: "LAYER-CA-002-09-03_regression_results.yaml"

# ====================================================================================
# DEPENDENCIES
# ====================================================================================

dependencies:
  requires:
    - feature: "FEATURE-CA-002-08"
      reason: "Uses optimal_lag from lag analysis"
      data: "optimal_lag value"
  
  python_libraries:
    - "statsmodels>=0.14.0"
    - "numpy"
    - "pandas"
  
  existing_frontend:
    - path: "GrangerModal.jsx"
      status: "Already has tabs from CA-002-08"
      integration: "RegressionResults renders in 'Regression' tab"

# ====================================================================================
# TESTING STRATEGY
# ====================================================================================

testing:
  unit_tests:
    - "RegressionService correctly applies lag shift"
    - "RegressionService returns valid OLS results"
    - "RegressionResults renders β₁ prominently"
    - "Interpretation text is accurate"
  
  integration_tests:
    - "Full flow: API → RegressionService → statsmodels → response"
    - "RegressionResults fetches and displays data"
    - "Tab switching loads regression correctly"

# ====================================================================================
# PRODUCTION INTEGRATION (auto-wiring into the live app)
# ====================================================================================

production_integration:
  target_router_file: "src/backend/app/causality_router.py"
  app_entry_point: "src/backend/main.py"
  import_alias: "RegressionQuantificationService"
  module_name: "feature_integration_09"
  endpoint_prefix: "/regression"
  health_endpoint: true

  pydantic_models:
    - name: "RegressionRequest"
      fields:
        - name: "series_1"
          type: "List[float]"
          default: "..."
          description: "Independent variable time series (signal)"
        - name: "series_2"
          type: "List[float]"
          default: "..."
          description: "Dependent variable time series (target)"
        - name: "lag"
          type: "Optional[int]"
          default: "None"
          description: "Lag to apply. If null, uses optimal lag from lag analysis"

  operations:
    - name: "run_regression"
      http_method: "post"
      path: "/analyze"
      description: "Run OLS regression between signal and target at specified lag"
      request_model: "RegressionRequest"
      orchestrator_method: "run_regression"
      orchestrator_args: "request.series_1, request.series_2, request.lag"

    - name: "regression_service_status"
      http_method: "get"
      path: "/status"
      description: "Get regression service status"
      orchestrator_method: "get_service_status"
