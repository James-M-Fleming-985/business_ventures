metadata:
  requirement_id: "FEATURE-CA-002-09"
  requirement_name: "Regression Quantification Service"
  feature_id: "FEATURE-CA-002-09"
  feature_name: "Regression Quantification Service"
  feature_code: "CA-002-09"
  version: "1.0.0"
  status: "Active"
  created_date: "2026-02-10"
  last_modified: "2026-02-10"
  owner: "Causal Affect Team"
  priority: "MUST HAVE"
  target_date: "2026-02-25"
  
  traceability:
    parent_system: "SYSTEM-CA-002"
    parent_system_file: "../SYSTEM-CA-002.yaml"
    parent_system_requirements:
      - "SYS-REQ-004: OLS regression for coefficient calculation"
      - "SYS-REQ-006: REST API endpoint for regression access"
    
    derivation_rationale: |
      This feature implements OLS regression to calculate the β₁ coefficient,
      enabling quantified predictions: "For every 1-unit change in X, 
      Y changes by β₁ units."

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    REST API service that performs Ordinary Least Squares (OLS) regression
    between two variables at the optimal lag, returning the β₁ coefficient
    and associated statistics for making quantified predictions.
    
    This is Phase 4 implementation that answers: "How much does Y change
    for every 1-unit change in X?"
  
  business_value:
    - "Provides quantified predictions: β₁ coefficient"
    - "Enables 'For every X increase, Y increases by β₁' statements"
    - "Returns confidence intervals for prediction uncertainty"
    - "R² indicates prediction model quality"
    - "Generates current predictions based on latest X value"
  
  user_story: |
    As a user analyzing causal relationships, I want to know exactly how much
    change in Y I can expect for a given change in X, so I can make
    quantified predictions and decisions.
  
  acceptance_criteria:
    - "GET /api/causality/{var1}/{var2}/regression endpoint functional"
    - "Returns beta_0 (intercept) and beta_1 (slope) coefficients"
    - "Returns r_squared (coefficient of determination)"
    - "Returns p_value for statistical significance"
    - "Returns confidence_intervals for beta_1"
    - "Returns current_prediction based on latest X value"
    - "Applies optimal_lag from lag analysis"
    - "Error handling for missing variables (404)"
    - "Error handling for insufficient data (400)"

# ====================================================================================
# SHARED INTERFACES
# ====================================================================================

shared_interfaces:
  response_structure: "JSON API response with success, data, error fields"
  
  parent_system_reference:
    file: "../SYSTEM-CA-002.yaml"
    section: "shared_interfaces.api_response_structure"
  
  implementation_requirement: |
    Response format:
    {
      "success": true,
      "data": {
        "var1": "ai_papers",
        "var2": "nvda_stock",
        "beta_0": 150.23,
        "beta_1": 2.45,
        "r_squared": 0.72,
        "p_value": 0.0001,
        "confidence_intervals": {"lower": 1.89, "upper": 3.01},
        "optimal_lag_used": 14,
        "current_prediction": {"x_value": 125, "predicted_y": 456.48}
      },
      "error": null
    }

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  - layer_id: "LAYER-CA-002-09-01"
    name: "Regression Calculator"
    responsibility: "Perform OLS regression and calculate β₁ coefficient"
    technology: "Python, FastAPI, statsmodels"
    requirement_file: "LAYER-CA-002-09-01_regression_calculator.yaml"
    requirements:
      - "LAYER-CA-002-09-01"

# ====================================================================================
# FEATURE REQUIREMENTS
# ====================================================================================

requirements:
  - id: "FEAT-CA-002-09-REQ-001"
    title: "Regression API Endpoint"
    description: "GET /api/causality/{var1}/{var2}/regression returns OLS regression results"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      system_requirements: ["SYS-REQ-004", "SYS-REQ-006"]
      layer_requirements: ["LAYER-CA-002-09-01"]
  
  - id: "FEAT-CA-002-09-REQ-002"
    title: "Beta Coefficient Calculation"
    description: "Calculate β₀ (intercept) and β₁ (slope) using OLS"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      system_requirements: ["SYS-REQ-004"]
      layer_requirements: ["LAYER-CA-002-09-01"]
  
  - id: "FEAT-CA-002-09-REQ-003"
    title: "Statistical Metrics"
    description: "Return R², p-value, and confidence intervals"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      system_requirements: ["SYS-REQ-004"]
      layer_requirements: ["LAYER-CA-002-09-01"]
  
  - id: "FEAT-CA-002-09-REQ-004"
    title: "Optimal Lag Integration"
    description: "Apply optimal_lag from FEATURE-CA-002-08 for time alignment"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      layer_requirements: ["LAYER-CA-002-09-01"]
  
  - id: "FEAT-CA-002-09-REQ-005"
    title: "Current Prediction"
    description: "Generate prediction using latest X value"
    priority: "SHOULD HAVE"
    status: "Active"
    traces_to:
      layer_requirements: ["LAYER-CA-002-09-01"]
  
  - id: "FEAT-CA-002-09-REQ-006"
    title: "Error Handling"
    description: "Return appropriate HTTP status codes for missing variables and insufficient data"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      layer_requirements: ["LAYER-CA-002-09-01"]

