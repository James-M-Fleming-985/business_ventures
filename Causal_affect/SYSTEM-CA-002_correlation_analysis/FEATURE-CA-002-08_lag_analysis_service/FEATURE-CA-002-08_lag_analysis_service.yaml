# SYSTEM: CA-002 Correlation Analysis Engine
# PHASE: 3 - Lag Analysis
# ====================================================================================

metadata:
  requirement_id: "FEATURE-CA-002-08"
  requirement_name: "Lag Analysis Service"
  feature_id: "FEATURE-CA-002-08"
  feature_name: "Lag Analysis Service"
  feature_code: "CA-002-08"
  version: "1.0.0"
  status: "Active"
  created_date: "2026-02-10"
  last_modified: "2026-02-10"
  owner: "Causal Affect Team"
  priority: "MUST HAVE"
  target_date: "2026-02-20"
  
  traceability:
    parent_system: "SYSTEM-CA-002"
    parent_system_file: "../SYSTEM-CA-002.yaml"
    parent_system_requirements:
      - "SYS-REQ-003: Lag optimization for predictive correlation"
      - "SYS-REQ-006: REST API endpoint for lag analysis access"
    
    derivation_rationale: |
      This feature implements optimal lag window detection between variables.
      Users need to know not just IF two variables correlate, but WHEN - 
      specifically how many days of lead time exists for prediction.

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    REST API service that wraps the existing LaggedCorrelationAnalyzer 
    (LAYER-CA-002-01-05) to calculate correlation at multiple lag values (0-90 days)
    and identify the optimal predictive lag window between two variables.
    
    This is Phase 3 implementation that answers: "How far in advance can we
    predict variable Y using variable X?"
  
  business_value:
    - "Discovers optimal prediction lead time between variables"
    - "Generates lag curve data for visualization"
    - "Identifies peak correlation lag for forecasting"
    - "Enables time-shifted predictive analytics"
  
  user_story: |
    As a user analyzing causal relationships, I want to see how correlation
    changes across different time lags, so I can identify the optimal
    prediction window and make timely forecasts.
  
  acceptance_criteria:
    - "GET /api/causality/{var1}/{var2}/lag-curve endpoint functional"
    - "Returns lag_days array (0-90 days, configurable max_lag)"
    - "Returns correlations array for each lag value"
    - "Returns optimal_lag with highest absolute correlation"
    - "Returns peak_correlation value at optimal lag"
    - "Error handling for missing variables (404)"
    - "Error handling for insufficient data (400)"

# ====================================================================================
# SHARED INTERFACES
# ====================================================================================

shared_interfaces:
  response_structure: "JSON API response with success, data, error fields"
  
  parent_system_reference:
    file: "../SYSTEM-CA-002.yaml"
    section: "shared_interfaces.api_response_structure"
  
  implementation_requirement: |
    Response format:
    {
      "success": true,
      "data": {
        "var1": "ai_papers",
        "var2": "nvda_stock",
        "lag_days": [0, 1, 2, ..., 90],
        "correlations": [0.12, 0.35, 0.67, ...],
        "optimal_lag": 14,
        "peak_correlation": 0.78
      },
      "error": null
    }

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  - layer_id: "LAYER-CA-002-08-01"
