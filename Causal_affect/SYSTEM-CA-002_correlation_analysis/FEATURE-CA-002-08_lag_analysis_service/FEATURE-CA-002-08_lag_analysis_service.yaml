metadata:
  requirement_id: "FEATURE-CA-002-08"
  requirement_name: "Lag Analysis Service"
  feature_id: "FEATURE-CA-002-08"
  feature_name: "Lag Analysis Service"
  feature_code: "CA-002-08"
  version: "2.0.0"
  status: "Active"
  created_date: "2026-02-10"
  last_modified: "2026-02-10"
  owner: "Causal Affect Team"
  priority: "MUST HAVE"
  target_date: "2026-02-20"
  
  traceability:
    parent_system: "SYSTEM-CA-002"
    parent_system_file: "../SYSTEM-CA-002.yaml"
    parent_system_requirements:
      - "SYS-REQ-003: Lag optimization for predictive correlation"
      - "SYS-REQ-006: REST API endpoints for Signal Radar"
    
    derivation_rationale: |
      This feature wraps the existing LaggedCorrelationAnalyzer implementation
      (LAYER-CA-002-01-05) and adds a new "Lag Curve" tab to the GrangerModal
      showing correlation at each lag from 0-90 days.

# ====================================================================================
# UI INTEGRATION CONTEXT
# ====================================================================================

ui_integration:
  entry_point:
    page: "GrangerModal.jsx"
    location: "src/components/GrangerModal.jsx"
    trigger: "User clicks 'Lag Curve' tab inside GrangerModal"
  
  component:
    name: "GrangerModal.jsx"
    location: "src/components/GrangerModal.jsx"
    status: "EXISTS - needs tabs added"
    modifications_required: "Add tabbed interface with [Granger | Lag Curve | Regression]"
  
  new_components:
    - name: "LagCurveChart.jsx"
      type: "React component"
      library: "Recharts"
      description: "Line chart showing correlation at each lag value"
  
  user_flow: |
    User is in GrangerModal (opened from SignalRadar)
      → User sees new tab bar: [Granger] [Lag Curve] [Regression]
        → User clicks "Lag Curve" tab
          → LagCurveChart component loads
            → Calls GET /api/signal-radar/signals/{keyword}/lag-curve
              → Backend returns: lag_days[], correlations[], optimal_lag, peak_correlation
                → Chart displays line graph with optimal lag highlighted
                → Below chart: "Best prediction window: 30 days ahead (r=0.72)"

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    Backend service wrapping the existing LaggedCorrelationAnalyzer (LAYER-CA-002-01-05)
    plus frontend components to visualize lag curve data in the GrangerModal.
    
    Lag optimization answers: "How many days in advance can we predict Y from X?"
    The lag curve shows correlation strength at each lag value (0-90 days),
    helping users identify the optimal prediction window.
  
  business_value:
    - "Discovers optimal prediction lead time between FMV signals and MV targets"
    - "Visualizes how predictive power changes across time lags"
    - "Identifies whether signals are leading (early warning) or lagging indicators"
    - "Enables time-shifted predictive analytics for trading strategies"
  
  user_story: |
    As a user viewing Granger results,
    I want to see a chart of correlation at different lag values,
    So that I can identify the optimal prediction window and make timely forecasts.
  
  acceptance_criteria:
    - "GrangerModal has tabbed interface: [Granger | Lag Curve | Regression]"
    - "Lag Curve tab displays Recharts LineChart"
    - "GET /api/signal-radar/signals/{keyword}/lag-curve endpoint functional"
    - "Returns lag_days array (0-90 days)"
    - "Returns correlations array for each lag value"
    - "Returns optimal_lag with highest absolute correlation"
    - "Returns peak_correlation and p_value at optimal lag"
    - "Chart highlights optimal lag point with marker"
    - "Error handling for missing signals (404)"

# ====================================================================================
# API SPECIFICATION
# ====================================================================================

api:
  endpoint: "GET /api/signal-radar/signals/{keyword}/lag-curve"
  status: "NEW"
  
  path_params:
    keyword:
      type: "string"
      description: "Signal keyword (e.g., 'ai_papers')"
  
  query_params:
    max_lag:
      type: "integer"
      default: 90
      description: "Maximum lag days to calculate"
  
  response_format: |
    {
      "keyword": "ai_papers",
      "target": "nvda_stock",
      "lag_days": [0, 1, 2, 3, ..., 90],
      "correlations": [0.12, 0.15, 0.23, 0.31, ..., 0.45],
      "optimal_lag": 30,
      "peak_correlation": 0.72,
      "p_value_at_optimal": 0.001
    }

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  # Backend Layers
  - layer_id: "LAYER-CA-002-08-01"
    name: "Lag Service"
    folder: "LAYER_CA_002_08_01_Lag_Service"
    type: "backend"
    responsibility: |
      Service wrapper that imports LaggedCorrelationAnalyzer from LAYER-CA-002-01-05.
      Provides calculate_lag_curve() method returning correlation at each lag.
    technology: "Python, LaggedCorrelationAnalyzer"
    wraps: "LAYER-CA-002-01-05_lagged_correlation/src/implementation.py"
    requirement_file: "LAYER-CA-002-08-01_lag_service.yaml"
  
  - layer_id: "LAYER-CA-002-08-02"
    name: "Lag Router"
    folder: "LAYER_CA_002_08_02_Lag_Router"
    type: "backend"
    responsibility: |
      FastAPI router with GET /api/signal-radar/signals/{keyword}/lag-curve endpoint.
      Calls LagService and returns lag curve data for frontend visualization.
    technology: "FastAPI"
    requirement_file: "LAYER-CA-002-08-02_lag_router.yaml"
  
  # Frontend Layers
  - layer_id: "LAYER-CA-002-08-03"
    name: "Lag Curve Chart"
    folder: "LAYER_CA_002_08_03_Lag_Curve_Chart"
    type: "frontend"
    responsibility: |
      React component using Recharts LineChart to visualize lag curve data.
      X-axis: lag days (0-90), Y-axis: correlation (-1 to 1).
      Highlights optimal lag point with special marker.
    technology: "React, Recharts, TailwindCSS"
    requirement_file: "LAYER-CA-002-08-03_lag_curve_chart.yaml"
  
  - layer_id: "LAYER-CA-002-08-04"
    name: "Modal Tabs"
    folder: "LAYER_CA_002_08_04_Modal_Tabs"
    type: "frontend"
    responsibility: |
      Enhance GrangerModal.jsx with tabbed interface.
      Tabs: [Granger | Lag Curve | Regression]
      Lazy-load tab content on click.
    technology: "React, TailwindCSS"
    requirement_file: "LAYER-CA-002-08-04_modal_tabs.yaml"

# ====================================================================================
# EXISTING IMPLEMENTATIONS TO WRAP
# ====================================================================================

dependencies:
  existing_backend:
    - path: "FEATURE-CA-002-01_statistical_correlation/LAYER-CA-002-01-05_lagged_correlation/src/implementation.py"
      class: "LaggedCorrelationAnalyzer"
      methods:
        - "calculate_lagged_correlation(x, y, lags) -> dict[int, float]"
        - "find_optimal_lag(x, y, criterion) -> (int, LaggedCorrelationResult)"
      config: "max_lag=90, min_observations=10"
  
  existing_frontend:
    - path: "SYSTEM-CA-006_feedback_iteration/FEATURE-CA-006-06_dashboard_ui/dashboard-app-complete/src/components/GrangerModal.jsx"
      status: "MODIFY - add tabs"
      current_state: "Single panel showing Granger results"
      target_state: "Tabbed interface with [Granger | Lag Curve | Regression]"

# ====================================================================================
# TESTING STRATEGY
# ====================================================================================

testing:
  unit_tests:
    - "LagService.calculate_lag_curve returns correct array lengths"
    - "LagService.find_optimal_lag returns highest absolute correlation lag"
    - "LagCurveChart renders with valid data"
    - "Modal tabs switch content correctly"
  
  integration_tests:
    - "Full flow: API call → LagService → LaggedCorrelationAnalyzer → response"
    - "LagCurveChart fetches and displays data from API"
    - "Tab navigation works without full page reload"

# ====================================================================================
# PRODUCTION INTEGRATION (auto-wiring into the live app)
# ====================================================================================
# This section tells the AI Feature Builder HOW to connect the built feature
# into the production application. Without this, the feature code is generated
# but sits orphaned — never imported or served by the running app.
#
# The builder reads this section after generating feature_integration.py and
# automatically patches the target router file to import the orchestrator and
# register API endpoints.
# ====================================================================================

production_integration:
  # Path to the router/app file that should be patched (relative to repo root)
  target_router_file: "src/backend/app/causality_router.py"
  
  # Unique alias for the imported orchestrator (used in generated code)
  import_alias: "LagAnalysisService"
  
  # Unique module name for importlib loading (avoids name collisions)
  module_name: "feature_integration_08"
  
  # URL prefix for all endpoints (appended to the router's existing prefix)
  endpoint_prefix: "/lag"
  
  # Whether to auto-generate a GET <prefix>/health endpoint
  health_endpoint: true
  
  # Pydantic models for request validation
  pydantic_models:
    - name: "LagAnalysisRequest"
      fields:
        - name: "series_1"
          type: "List[float]"
          default: "..."
          description: "First time series"
        - name: "series_2"
          type: "List[float]"
          default: "..."
          description: "Second time series"
        - name: "max_lag"
          type: "Optional[int]"
          default: "None"
          description: "Override max lag"
    - name: "BatchLagRequest"
      fields:
        - name: "series_pairs"
          type: "List[Dict[str, Any]]"
          default: "..."
          description: "List of {id, series_1, series_2} dicts"
  
  # Operations to expose as API endpoints
  operations:
    - name: "analyze_lag"
      http_method: "post"
      path: "/analyze"
      description: "Perform lag analysis between two time series"
      request_model: "LagAnalysisRequest"
      orchestrator_method: "analyze_lag"
      orchestrator_args: "request.series_1, request.series_2"
    
    - name: "batch_lag_analysis"
      http_method: "post"
      path: "/batch"
      description: "Batch lag analysis on multiple series pairs"
      request_model: "BatchLagRequest"
      orchestrator_method: "batch_analyze"
      orchestrator_args: "request.series_pairs"
    
    - name: "lag_service_status"
      http_method: "get"
      path: "/status"
      description: "Get lag analysis service status"
      orchestrator_method: "get_analysis_status"
      orchestrator_args: "'default'"
