# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Lag Calculator"
  
  description: |
    Wraps the existing LaggedCorrelationAnalyzer (LAYER-CA-002-01-05) to calculate
    Pearson correlation at each lag value from 0 to 90 days (configurable max_lag).
    Returns array of correlations and identifies optimal lag (highest absolute correlation).
    
    Key responsibilities:
    - Define GET /api/causality/{var1_name}/{var2_name}/lag-curve endpoint
    - Import and use LaggedCorrelationAnalyzer from LAYER-CA-002-01-05
    - Configure with max_lag=90, min_observations=10
    - Return structured JSON with lag_days, correlations, optimal_lag, peak_correlation
    - Handle errors: 404 for missing variables, 400 for insufficient data
  
  rationale: |
    Users need to know the optimal prediction window between variables.
    A correlation at lag=0 may be weak, but at lag=14 could be very strong,
    indicating a 2-week lead time for predictions.

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  technology_stack:
    programming_language: "Python"
    file_extensions: [".py"]
    runtime_environment: "Python 3.10+"
    primary_framework: "FastAPI 0.104.0"
    additional_libraries:
      - "sqlalchemy"
      - "numpy"
      - "pandas"
  
  structure:
    entry_point: "src/backend/app/lag_calculator.py"
    modules:
      - "lag_calculator.py - Lag calculation with FastAPI endpoint"
  
  classes:
    - name: "lag_calculator"
      purpose: "Calculate correlations at each lag and find optimal"
      methods:
        - name: "get_lag_curve"
          signature: "async def get_lag_curve(var1_name: str, var2_name: str, max_lag: int = 30, db: Session = Depends(get_db)) -> dict"
          purpose: "Calculate correlation at each lag from 0 to max_lag"
          example: |
            # GET /api/causality/ai_papers/nvda_stock/lag-curve?max_lag=30
            # Returns:
            {
              "var1": "ai_papers",
              "var2": "nvda_stock",
              "lag_days": [0, 1, 2, ..., 30],
              "correlations": [0.12, 0.35, 0.67, ...],
              "optimal_lag": 14,
              "peak_correlation": 0.78
            }
        
        - name: "_calculate_lagged_correlation"
          signature: "def _calculate_lagged_correlation(series1: np.ndarray, series2: np.ndarray, lag: int) -> float"
          purpose: "Calculate Pearson correlation with series2 shifted by lag days"
        
        - name: "_find_optimal_lag"
          signature: "def _find_optimal_lag(correlations: List[float]) -> Tuple[int, float]"
          purpose: "Find lag index with highest absolute correlation"
  
  implementation_details:
    libraries:
      - "FastAPI"
      - "SQLAlchemy"
      - "NumPy"
      - "Pandas"
    patterns:
      - "Router Pattern"
      - "Dependency Injection"
      - "Service Layer Pattern"
    error_handling:
      - error_type: "VariableNotFound"
        handling: "Return HTTP 404 with descriptive message"
      - error_type: "InsufficientData"
        handling: "Return HTTP 400 with required data points info"
      - error_type: "CalculationError"
        handling: "Return HTTP 500 with error details"
  
  inputs:
    - name: "var1_name"
      type: "str"
      description: "Name of first variable (leading indicator)"
      example: "ai_papers"
    - name: "var2_name"
      type: "str"
      description: "Name of second variable (lagging indicator)"
      example: "nvda_stock"
    - name: "max_lag"
      type: "int"
      description: "Maximum lag days to test (default 30)"
      example: "30"
  
  outputs:
    - name: "lag_curve_result"
      type: "dict"
      description: "Complete lag analysis results"
      example: |
        {
          "var1": "ai_papers",
          "var2": "nvda_stock",
          "lag_days": [0, 1, 2, 3, ..., 30],
          "correlations": [0.12, 0.35, 0.56, 0.67, ...],
          "optimal_lag": 14,
          "peak_correlation": 0.78
        }

# ====================================================================================
# ACCEPTANCE CRITERIA
# ====================================================================================

acceptance_criteria:
