  - criterion: "Returns correlations array with max_lag+1 elements"
    test: "pytest test_lag_calculator.py::test_correlations_array_length"
    category: "functional"
  
  - criterion: "Optimal lag has highest absolute correlation"
    test: "pytest test_lag_calculator.py::test_optimal_lag_is_peak"
    category: "functional"
  
  - criterion: "Returns 404 when variable not found"
    test: "pytest test_lag_calculator.py::test_variable_not_found_returns_404"
    category: "functional"
  
  - criterion: "Returns 400 when insufficient data"
    test: "pytest test_lag_calculator.py::test_insufficient_data_returns_400"
    category: "functional"
  
  - criterion: "Correlations are valid (-1 to 1 range)"
    test: "pytest test_lag_calculator.py::test_correlations_in_valid_range"
    category: "functional"

# ====================================================================================
# TDD IMPLEMENTATION PLAN
# ====================================================================================

week_1_task:
  title: "Build Lag Calculator (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/test_lag_calculator.py"
      tests:
        - "test_get_lag_curve_returns_json"
        - "test_correlations_array_length"
        - "test_optimal_lag_is_peak"
        - "test_variable_not_found_returns_404"
        - "test_insufficient_data_returns_400"
        - "test_correlations_in_valid_range"
      duration: "30 min"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/test_lag_calculator.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement lag_calculator.py (GREEN phase)"
      file: "src/backend/app/lag_calculator.py"
      methods:
        - "get_lag_curve(var1_name, var2_name, max_lag) → dict"
        - "_calculate_lagged_correlation(series1, series2, lag) → float"
        - "_find_optimal_lag(correlations) → Tuple[int, float]"
      duration: "2 hours"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/test_lag_calculator.py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "Optimize correlation calculation"
        - "Add type hints"
        - "Cache results for repeated queries"
      duration: "30 min"
  
  total_time: "~3.5 hours"
  
  deliverable: "Fully tested /api/causality/{var1}/{var2}/lag-curve endpoint"

