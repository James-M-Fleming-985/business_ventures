# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Lag Router"
  
  description: |
    FastAPI router providing GET /api/signal-radar/signals/{keyword}/lag-curve endpoint.
    
    Key responsibilities:
    - Define GET endpoint matching Signal Radar API pattern
    - Accept optional max_lag query parameter (default 90)
    - Instantiate and call LagService.calculate_lag_curve()
    - Return JSON response for LagCurveChart frontend component
    - Handle 404 for missing signals
    - Handle 400 for insufficient data

# ====================================================================================
# API ENDPOINT DEFINITION
# ====================================================================================

api:
  endpoint:
    method: "GET"
    path: "/api/signal-radar/signals/{keyword}/lag-curve"
    path_params:
      - name: "keyword"
        type: "str"
        description: "Signal keyword (e.g., 'ai_papers')"
    
    query_params:
      - name: "max_lag"
        type: "int"
        default: 90
        min: 1
        max: 365
        description: "Maximum lag days to calculate"
    
    response:
      success_code: 200
      content_type: "application/json"
      schema: |
        {
          "keyword": "ai_papers",
          "target": "nvda_stock",
          "lag_days": [0, 1, 2, ..., 90],
          "correlations": [0.12, 0.15, 0.23, ..., 0.45],
          "optimal_lag": 30,
          "peak_correlation": 0.72,
          "p_value_at_optimal": 0.001
        }
    
    error_responses:
      - code: 404
        description: "Signal keyword not found"
        body: '{"detail": "Signal not found: {keyword}"}'
      - code: 400
        description: "Insufficient data for lag analysis"
        body: '{"detail": "Insufficient data. Need at least 10 observations."}'

# ====================================================================================
# FRONTEND COMPATIBILITY
# ====================================================================================

frontend_compatibility:
  component: "LagCurveChart.jsx"
  expected_fields:
    - "lag_days (array of integers)"
    - "correlations (array of floats)"
    - "optimal_lag (integer)"
    - "peak_correlation (float)"

