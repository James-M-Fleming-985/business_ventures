# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Lag Curve Chart Component"
  
  description: |
    React component that visualizes lag curve data using Recharts LineChart.
    Shows correlation strength at each lag value from 0-90 days.
    
    Key responsibilities:
    - Accept keyword prop and fetch data from /api/signal-radar/signals/{keyword}/lag-curve
    - Display loading spinner while fetching
    - Render Recharts LineChart with:
      - X-axis: lag days (0-90)
      - Y-axis: correlation (-1 to 1)
      - Line showing correlation at each lag
      - Special marker/dot at optimal_lag point
    - Display summary below chart: "Best prediction window: {optimal_lag} days (r={peak_correlation})"
    - Handle error states gracefully
  
  rationale: |
    Users need to visualize how predictive power changes across different lag values
    to identify the optimal prediction window for trading strategies.

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  technology_stack:
    programming_language: "JavaScript/JSX"
    file_extensions: [".jsx"]
    runtime_environment: "Browser"
    primary_framework: "React 18"
    additional_libraries:
      - "recharts"
      - "tailwindcss"

# ====================================================================================
# COMPONENT DEFINITION
# ====================================================================================

component:
  name: "LagCurveChart"
  file: "LagCurveChart.jsx"
  
  props:
    - name: "keyword"
      type: "string"
      required: true
      description: "Signal keyword to fetch lag curve for"
    - name: "onDataLoaded"
      type: "function"
      required: false
      description: "Callback when data is loaded, receives lag curve data"
  
  state:
    - name: "loading"
      type: "boolean"
      initial: true
    - name: "data"
      type: "object | null"
      initial: null
    - name: "error"
      type: "string | null"
      initial: null
  
  api_call:
    endpoint: "GET /api/signal-radar/signals/{keyword}/lag-curve"
    trigger: "useEffect on mount and keyword change"
  
  visual_layout: |
    ┌──────────────────────────────────────────────────────────┐
    │ Correlation                                              │
    │    1.0 ┤                                                 │
    │    0.8 ┤                    ●                            │
    │    0.6 ┤               ╱    │    ╲                       │
    │    0.4 ┤          ╱         │         ╲                  │
    │    0.2 ┤     ╱              │              ╲             │
    │    0.0 ┼────────────────────┼────────────────────        │
    │   -0.2 ┤                    │                            │
    │        0    15    30    45    60    75    90             │
    │                   Lag (days)                             │
    └──────────────────────────────────────────────────────────┘
    Best prediction window: 30 days ahead (r=0.72, p<0.001)

# ====================================================================================
# STYLING
# ====================================================================================

styling:
  container: "bg-white rounded-lg p-4"
  chart_height: 300
  optimal_marker:
    color: "#8b5cf6"  # purple-500
    size: 8
  line:
    color: "#3b82f6"  # blue-500
    stroke_width: 2
  reference_line:
    y_value: 0
    color: "#9ca3af"  # gray-400
    dash: "3 3"

