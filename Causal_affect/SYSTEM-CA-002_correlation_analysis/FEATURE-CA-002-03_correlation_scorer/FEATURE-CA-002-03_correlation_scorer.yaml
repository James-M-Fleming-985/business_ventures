# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    Ranks correlations by their potential for MVP exploitation based on statistical significance, effect size, temporal stability, actionability, and market size.
  
  business_value:
    - "Prioritizes correlations by MVP opportunity potential"
    - "Balances statistical rigor with business practicality"
    - "Identifies stable vs volatile correlations"
    - "Estimates market opportunity size for recommendations"
  
  user_story: |
    As a business strategist, I want correlations ranked by exploitability, so that I can focus resources on the highest-potential MVP opportunities.
  
  acceptance_criteria:
    - "All layer implementations complete and passing tests"
    - "API endpoints functional and returning correct data"
    - "Integration with CA-001 data source working"
    - "Performance meets system requirements"
    - "Documentation complete and accurate"

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  - layer_id: "LAYER-CA-002-03-01"
    name: "Significance Calculator"
    responsibility: "Calculates p-values, applies multiple testing corrections (Bonferroni, FDR)"
    technology: "SciPy, Statsmodels"
    requirement_file: "LAYER-CA-002-03-01_significance_calculator.yaml"
    requirements:
      - "LAYER-CA-002-03-01"
  
  - layer_id: "LAYER-CA-002-03-02"
    name: "Effect Size Analyzer"
    responsibility: "Calculates Cohen's d and other effect size metrics"
    technology: "NumPy, SciPy"
    requirement_file: "LAYER-CA-002-03-02_effect_size_analyzer.yaml"
    requirements:
      - "LAYER-CA-002-03-02"
  
  - layer_id: "LAYER-CA-002-03-03"
    name: "Stability Tracker"
    responsibility: "Tracks correlation stability over rolling windows"
    technology: "Pandas, NumPy"
    requirement_file: "LAYER-CA-002-03-03_stability_tracker.yaml"
    requirements:
      - "LAYER-CA-002-03-03"
  
  - layer_id: "LAYER-CA-002-03-04"
    name: "Actionability Classifier"
    responsibility: "Classifies correlations by MVP feasibility (high/medium/low)"
    technology: "Scikit-learn"
    requirement_file: "LAYER-CA-002-03-04_actionability_classifier.yaml"
    requirements:
      - "LAYER-CA-002-03-04"
  
  - layer_id: "LAYER-CA-002-03-05"
    name: "Market Estimator"
    responsibility: "Estimates market size from search volume and engagement data"
    technology: "Pandas, NumPy"
    requirement_file: "LAYER-CA-002-03-05_market_estimator.yaml"
    requirements:
      - "LAYER-CA-002-03-05"
  

