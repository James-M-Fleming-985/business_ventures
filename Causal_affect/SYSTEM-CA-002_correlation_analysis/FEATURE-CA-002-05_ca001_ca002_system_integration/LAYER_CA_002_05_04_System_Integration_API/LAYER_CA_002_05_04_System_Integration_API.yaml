# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "System Integration API"
  
  description: |
    Implements REST API endpoints for external system integration with the correlation
    analysis platform. Provides HTTP interfaces for requesting correlation matrices,
    retrieving available symbols from CA-001, and monitoring system health. Handles
    request validation, response formatting, error handling, and connection management
    to ensure reliable communication between CA-001 data sources and CA-002 analysis
    features.
  
  rationale: |
    A standardized REST API is essential for enabling external systems, including the
    CA-002-04 dashboard, to interact with the correlation analysis platform. This layer
    provides a clean, well-defined interface that abstracts the complexity of data
    retrieval and correlation calculations, making the system accessible to various
    clients while maintaining security, performance, and reliability standards.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/api/integration_api.py"
    modules:
      - "api_server.py"        # FastAPI application setup and configuration
      - "endpoints.py"         # REST endpoint definitions and handlers
      - "request_models.py"    # Pydantic models for request validation
      - "response_models.py"   # Pydantic models for response formatting
      - "ca001_client.py"     # HTTP client for CA-001 API integration
      - "connection_pool.py"   # Connection pooling for CA-001 requests
  
  # Main classes/functions to implement
  classes:
    - name: "IntegrationAPI"
      purpose: "Main API server class managing endpoints and middleware"
      methods:
        - name: "create_app"
          signature: "create_app() -> FastAPI"
          purpose: "Initialize FastAPI application with routes and middleware"
          example: |
            # Example usage
            app = IntegrationAPI().create_app()
            uvicorn.run(app, host="0.0.0.0", port=8000)
    
    - name: "CA001Client"
      purpose: "HTTP client for retrieving data from CA-001 system"
      methods:
        - name: "get_market_data"
          signature: "get_market_data(symbols: List[str], timeframe: str) -> Dict[str, pd.DataFrame]"
          purpose: "Fetch time-series data for specified symbols"
          example: |
            # Example usage
            client = CA001Client(base_url="http://ca001-api:8080")
            data = client.get_market_data(["BTC-USD", "ETH-USD"], "1h")
        
        - name: "get_available_symbols"
          signature: "get_available_symbols() -> List[str]"
          purpose: "Retrieve list of available trading symbols from CA-001"
          example: |
            # Example usage
            symbols = client.get_available_symbols()
    
    - name: "ConnectionPool"
      purpose: "Manage connection pooling for CA-001 API requests"
      methods:
        - name: "get_session"
          signature: "get_session() -> aiohttp.ClientSession"
          purpose: "Get an available session from the pool"
          example: |
            # Example usage
            async with pool.get_session() as session:
                response = await session.get(url)
  
  # Key technical details
  implementation_details:
    libraries: ["fastapi", "aiohttp", "pydantic", "pandas", "numpy", "asyncio"]
    patterns: ["Repository Pattern", "Connection Pooling", "Circuit Breaker"]
    error_handling:
      - error_type: "CA001ConnectionError"
        handling: "Retry with exponential backoff, fallback to mock data after 3 attempts"
      - error_type: "ValidationError"
        handling: "Return 400 Bad Request with detailed error message"
      - error_type: "TimeoutError"
        handling: "Return 504 Gateway Timeout, log for monitoring"
  
  # Input/output contract
  inputs:
    - name: "correlation_request"
      type: "CorrelationRequest"
      description: "POST request body containing symbol list and timeframe"
      example: '{"symbols": ["BTC-USD", "ETH-USD"], "timeframe": "1h", "window": 20}'
    
    - name: "symbol_filter"
      type: "Optional[str]"
      description: "Query parameter to filter available symbols"
      example: "?filter=USD"
  
  outputs:
    - name: "correlation_response"
      type: "CorrelationResponse"
      description: "JSON response containing correlation matrix and metadata"
      example: '{"matrix": [[1.0, 0.85], [0.85, 1.0]], "symbols": ["BTC-USD", "ETH-USD"], "timestamp": "2025-01-13T10:30:00Z"}'
    
    - name: "symbols_response"
      type: "SymbolsResponse"
      description: "JSON array of available trading symbols"
      example: '{"symbols": ["BTC-USD", "ETH-USD", "SOL-USD"], "count": 3}'

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "POST /api/correlations endpoint accepts valid requests and returns correlation matrix"
    test: "Send POST with symbol list and verify correlation matrix response"
    example: |
      # Example test command
      curl -X POST http://localhost:8000/api/correlations \
        -H "Content-Type: application/json" \
        -d '{"symbols": ["BTC-USD", "ETH-USD"], "timeframe": "1h"}'
  
  - criterion: "GET /api/symbols returns available symbols from CA-001"
    test: "Call endpoint and verify symbol list matches CA-001 data"
    example: |
      # Example test command
      pytest tests/integration/test_symbols_endpoint.py::test_get_available_symbols -v
  
  - criterion: "Connection pooling maintains 15-20 concurrent connections"
    test: "Load test with concurrent requests and monitor connection count"
    example: |
      # Example test command
      locust -f tests/load/test_connection_pool.py --users 20 --spawn-rate 5
  
  - criterion: "Response time under 2 seconds for 10-symbol correlation matrix"
    test: "Performance test with realistic data volume"
    example: |
      # Example test command
      pytest tests/performance/test_correlation_performance.py::test_response_time -v
  
  - criterion: "Fallback to mock data when CA-001 unavailable"
    test: "Disable CA-001 connection and verify mock data response"
    example: |
      # Example test command
      pytest tests/integration/test_fallback_behavior.py::test_ca001_unavailable -v

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build System Integration API (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_integration_api.py"
      tests:
        - "test_create_app_initializes_correctly"
        - "test_correlation_endpoint_validation"
        - "test_symbols_endpoint_returns_list"
        - "test_health_check_endpoint"
        - "test_connection_pool_lifecycle"
      duration: "2 hours"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_integration_api.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "5 min"
    
    - step: 3
      action: "Implement IntegrationAPI and endpoints (GREEN phase)"
      file: "src/api/integration_api.py"
      methods:
        - "create_app() → FastAPI"
        - "post_correlations(request: CorrelationRequest) → CorrelationResponse"
        - "get_symbols(filter: Optional[str]) → SymbolsResponse"
        - "get_health() → HealthResponse"
      duration: "3 hours"
    
    - step: 4
      action: "Implement CA001Client and ConnectionPool"
      file: "src/api/ca001_client.py"
      methods:
        - "get_market_data(symbols, timeframe) → Dict[str, DataFrame]"
        - "get_available_symbols() → List[str]"
        - "ConnectionPool.get_session() → ClientSession"
      duration: "2 hours"
    
    - step: 5
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_integration_api.py -v"
      expected: "All tests PASS"
      duration: "10 min"
    
    - step: 6
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "Add comprehensive error handling with custom exceptions"
        - "Implement circuit breaker pattern for CA-001 calls"
        - "Add request/response logging middleware"
        - "Optimize connection pool configuration"
      duration: "2 hours"
    
    - step: 7
      action: "Integration test with CA-001 system"
      file: "tests/integration/test_ca001_integration.py"
      duration: "1 hour"
    
    - step: 8
      action: "Load testing for performance requirements"
      file: "tests/load/test_api_performance.py"
      duration: "1 hour"
  
  total_time: "11 hours 20 minutes"
  
  deliverable: "Fully functional REST API with endpoints for correlation requests, symbol retrieval, and health monitoring, including connection pooling and error handling"

