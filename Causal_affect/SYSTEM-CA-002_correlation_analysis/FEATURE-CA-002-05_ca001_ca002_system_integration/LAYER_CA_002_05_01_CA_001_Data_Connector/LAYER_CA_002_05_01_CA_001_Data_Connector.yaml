# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "CA-001 Data Connector"
  
  description: |
    Establishes HTTP API connectivity to CA-001's TimescaleDB data source, retrieves
    time-series market data for multiple financial instruments, transforms the data
    into correlation-ready format, and provides it to CA-002 features. Implements
    connection pooling, retry logic, and fallback mechanisms to ensure reliable
    data flow even under adverse conditions. Supports concurrent requests for
    15-20 symbols with sub-2-second response times.
  
  rationale: |
    CA-002's correlation analysis features require real-time access to market data
    stored in CA-001's TimescaleDB. This layer provides a robust, performant bridge
    between the two systems, abstracting the complexities of HTTP communication,
    data transformation, and error handling. By centralizing this logic, other
    CA-002 layers can focus on analysis without worrying about data acquisition.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/ca_001_connector/connector.py"
    modules:
      - "connector.py"        # Main CA001DataConnector class with HTTP client
      - "data_transformer.py" # Transforms CA-001 data to CA-002 format
      - "connection_pool.py"  # HTTP connection pooling for performance
      - "retry_handler.py"    # Retry logic for transient failures
  
  # Main classes/functions to implement
  classes:
    - name: "CA001DataConnector"
      purpose: "Primary interface for retrieving data from CA-001 TimescaleDB API"
      methods:
        - name: "fetch_time_series"
          signature: "fetch_time_series(symbols: List[str], start_time: datetime, end_time: datetime) -> Dict[str, pd.DataFrame]"
          purpose: "Retrieves time-series data for multiple symbols within time range"
          example: |
            # Example usage
            connector = CA001DataConnector(base_url="http://ca-001-api:8080")
            data = connector.fetch_time_series(
                symbols=["AAPL", "GOOGL", "MSFT"],
                start_time=datetime(2025, 1, 1),
                end_time=datetime(2025, 1, 2)
            )
        
        - name: "get_available_symbols"
          signature: "get_available_symbols() -> List[str]"
          purpose: "Retrieves list of symbols available in CA-001 database"
          example: |
            symbols = connector.get_available_symbols()
            # Returns: ["AAPL", "GOOGL", "MSFT", "AMZN", ...]
        
        - name: "health_check"
          signature: "health_check() -> Dict[str, Any]"
          purpose: "Checks CA-001 API availability and connection status"
          example: |
            status = connector.health_check()
            # Returns: {"status": "healthy", "latency_ms": 45, "timestamp": "2025-01-02T10:00:00Z"}
    
    - name: "DataTransformer"
      purpose: "Converts CA-001 time-series format to CA-002 correlation format"
      methods:
        - name: "transform_to_correlation_format"
          signature: "transform_to_correlation_format(raw_data: Dict[str, List[Dict]]) -> pd.DataFrame"
          purpose: "Transforms raw API response into pandas DataFrame for correlation analysis"
  
  # Key technical details
  implementation_details:
    libraries: ["httpx", "pandas", "numpy", "tenacity", "asyncio"]
    patterns: ["Connection Pool Pattern", "Circuit Breaker Pattern", "Retry Pattern"]
    error_handling:
      - error_type: "ConnectionError"
        handling: "Retry with exponential backoff, fallback to mock data after 3 attempts"
      - error_type: "TimeoutError"
        handling: "Immediate retry with longer timeout, max 2 retries"
      - error_type: "HTTPStatusError"
        handling: "Log error, return partial data if available, notify monitoring"
  
  # Input/output contract
  inputs:
    - name: "symbols"
      type: "List[str]"
      description: "List of financial instrument symbols to fetch"
      example: '["AAPL", "GOOGL", "MSFT"]'
    
    - name: "time_range"
      type: "Tuple[datetime, datetime]"
      description: "Start and end datetime for data retrieval"
      example: "(datetime(2025, 1, 1), datetime(2025, 1, 2))"
  
  outputs:
    - name: "time_series_data"
      type: "Dict[str, pd.DataFrame]"
      description: "Dictionary mapping symbols to their time-series DataFrames"
      example: |
        {
          "AAPL": DataFrame with columns [timestamp, open, high, low, close, volume],
          "GOOGL": DataFrame with columns [timestamp, open, high, low, close, volume]
        }

