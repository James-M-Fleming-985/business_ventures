  - criterion: "Successfully connects to CA-001 API and retrieves data"
    test: "Integration test with mock CA-001 server"
    example: |
      # Example test command
      pytest tests/integration/test_ca001_connector.py::test_fetch_time_series_success -v
  
  - criterion: "Handles 15-20 concurrent symbol requests"
    test: "Load test with concurrent requests"
    example: |
      pytest tests/performance/test_concurrent_requests.py::test_concurrent_symbol_fetch -v
  
  - criterion: "Response time under 2 seconds for typical request"
    test: "Performance benchmark test"
    example: |
      pytest tests/performance/test_response_time.py::test_response_under_2_seconds -v
  
  - criterion: "Falls back to mock data when CA-001 unavailable"
