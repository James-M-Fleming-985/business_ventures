# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Feature Integration Controller"
  
  description: |
    The Feature Integration Controller serves as the central orchestrator for integrating
    CA-001 (Financial Data Management) with CA-002 (Correlation Analysis) features. It
    manages HTTP connections to CA-001's TimescaleDB API, retrieves time-series financial
    data, formats it for correlation analysis, and provides REST endpoints for external
    systems to request correlation computations. The controller handles concurrent requests,
    manages connection pooling, implements retry logic for transient failures, and provides
    fallback mechanisms when primary data sources are unavailable.
  
  rationale: |
    A dedicated integration controller is necessary to decouple the data source (CA-001)
    from the analysis features (CA-002). This separation of concerns allows:
    - Independent scaling of data retrieval and analysis components
    - Centralized error handling and retry logic
    - Consistent data formatting across different consumers
    - Performance optimization through connection pooling and caching
    - Simplified testing through mock data fallback capabilities

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/integration/controller.py"
    modules:
      - "controller.py"        # Main integration controller with orchestration logic
      - "ca001_client.py"      # HTTP client for CA-001 TimescaleDB API
      - "data_formatter.py"    # Data transformation and formatting utilities
      - "api_endpoints.py"     # REST API endpoint definitions
      - "connection_pool.py"   # Connection pooling management
      - "error_handler.py"     # Error handling and retry logic
  
  # Main classes/functions to implement
  classes:
    - name: "FeatureIntegrationController"
      purpose: "Central orchestrator for CA-001 to CA-002 data flow"
      methods:
        - name: "fetch_time_series_data"
          signature: "fetch_time_series_data(symbols: List[str], timeframe: str) -> Dict[str, pd.DataFrame]"
          purpose: "Retrieve time-series data from CA-001 for specified symbols"
          example: |
            # Example usage
            controller = FeatureIntegrationController()
            data = controller.fetch_time_series_data(['AAPL', 'GOOGL'], '1D')
        
        - name: "format_for_correlation"
          signature: "format_for_correlation(data: Dict[str, pd.DataFrame]) -> pd.DataFrame"
          purpose: "Transform CA-001 data into format expected by CA-002"
          example: |
            # Example usage
            formatted = controller.format_for_correlation(raw_data)
        
        - name: "process_correlation_request"
          signature: "process_correlation_request(request_data: dict) -> dict"
          purpose: "Handle end-to-end correlation request processing"
          example: |
            # Example usage
            result = controller.process_correlation_request({
                'symbols': ['AAPL', 'GOOGL', 'MSFT'],
                'timeframe': '1D',
                'correlation_type': 'pearson'
            })
    
    - name: "CA001APIClient"
      purpose: "HTTP client for communicating with CA-001 TimescaleDB API"
      methods:
        - name: "get_symbols"
          signature: "get_symbols() -> List[str]"
          purpose: "Retrieve available symbols from CA-001"
        
        - name: "get_time_series"
          signature: "get_time_series(symbol: str, start: datetime, end: datetime) -> pd.DataFrame"
          purpose: "Fetch time-series data for a single symbol"
    
    - name: "ConnectionPoolManager"
      purpose: "Manage HTTP connection pooling for performance"
      methods:
        - name: "get_connection"
          signature: "get_connection() -> httpx.AsyncClient"
          purpose: "Retrieve available connection from pool"
        
        - name: "release_connection"
          signature: "release_connection(client: httpx.AsyncClient) -> None"
          purpose: "Return connection to pool"
  
  # Key technical details
  implementation_details:
    libraries: ["fastapi", "httpx", "pandas", "asyncio", "pydantic", "tenacity"]
    patterns: ["Repository Pattern", "Connection Pool Pattern", "Circuit Breaker Pattern"]
    error_handling:
      - error_type: "CA001ConnectionError"
        handling: "Retry with exponential backoff, then fallback to mock data"
      - error_type: "DataFormatError"
        handling: "Log error, return partial results with missing data indicators"
      - error_type: "RateLimitError"
        handling: "Queue request for delayed processing"
  
  # Input/output contract
  inputs:
    - name: "symbol_list"
      type: "List[str]"
      description: "List of financial symbols to analyze"
      example: "['AAPL', 'GOOGL', 'MSFT', 'AMZN']"
    
    - name: "timeframe"
      type: "str"
      description: "Time period for correlation analysis"
      example: "1D, 1W, 1M, 3M, 1Y"
    
    - name: "correlation_type"
      type: "str"
      description: "Type of correlation calculation"
      example: "pearson, spearman, kendall"
  
  outputs:
    - name: "correlation_matrix"
      type: "pd.DataFrame"
      description: "Correlation matrix between symbols"
      example: "DataFrame with symbols as both index and columns"
    
    - name: "metadata"
      type: "dict"
      description: "Additional information about the calculation"
      example: "{'timestamp': '2024-01-15T10:30:00Z', 'data_quality': 0.98}"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "Successfully retrieves data from CA-001 HTTP API"
    test: "Integration test with mock CA-001 server"
    example: |
      # Example test command
      pytest tests/integration/test_ca001_client.py::test_retrieve_time_series -v
  
  - criterion: "Formats time-series data correctly for CA-002 consumption"
    test: "Unit test data transformation logic"
    example: |
      # Example test command
      pytest tests/unit/test_data_formatter.py::test_format_for_correlation -v
  
  - criterion: "Handles 15-20 concurrent requests without degradation"
    test: "Load test with concurrent API calls"
    example: |
      # Example test command
      locust -f tests/load/test_concurrent_requests.py --users 20 --spawn-rate 2
  
  - criterion: "Responds within 2 seconds for correlation matrix calculation"
    test: "Performance benchmark test"
    example: |
      # Example test command
      pytest tests/performance/test_response_time.py::test_correlation_under_2s -v
  
  - criterion: "Falls back to mock data when CA-001 is unavailable"
    test: "Failover test with CA-001 offline"
    example: |
      # Example test command
      pytest tests/integration/test_failover.py::test_mock_data_fallback -v

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build Feature Integration Controller (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_controller.py"
      tests:
        - "test_fetch_time_series_data_success"
        - "test_format_for_correlation_transforms_correctly"
        - "test_handle_ca001_connection_error"
        - "test_concurrent_request_handling"
      duration: "2 hours"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_controller.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement FeatureIntegrationController (GREEN phase)"
      file: "src/integration/controller.py"
      methods:
        - "fetch_time_series_data() → Dict[str, pd.DataFrame]"
        - "format_for_correlation(data: Dict) → pd.DataFrame"
        - "process_correlation_request(request: dict) → dict"
      duration: "4 hours"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_controller.py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "Extract connection pool logic to separate class"
        - "Implement async/await for concurrent requests"
        - "Add comprehensive logging and metrics"
      duration: "2 hours"
    
    - step: 6
      action: "Integration test with CA-001 and CA-002"
      file: "tests/integration/test_end_to_end_flow.py"
      duration: "2 hours"
  
  total_time: "10 hours 7 minutes"
  
  deliverable: "Fully functional integration controller with REST API, connection pooling, and error handling"

