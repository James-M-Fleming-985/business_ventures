# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    Calculates multiple correlation coefficients between time-series variable pairs including Pearson, Spearman, Kendall Tau, partial correlation, and time-lagged correlation.
  
  business_value:
    - "Identifies linear, monotonic, and rank-based relationships in data"
    - "Controls for confounding variables via partial correlation"
    - "Detects delayed effects through time-lagged analysis"
    - "Provides statistical foundation for causality testing"
  
  user_story: |
    As a data analyst, I want to calculate multiple types of correlations between market variables, so that I can identify potential exploitable relationships for MVP opportunities.
  
  acceptance_criteria:
    - "All layer implementations complete and passing tests"
    - "API endpoints functional and returning correct data"
    - "Integration with CA-001 data source working"
    - "Performance meets system requirements"
    - "Documentation complete and accurate"

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  - layer_id: "LAYER-CA-002-01-01"
    name: "Pearson Calculator"
    responsibility: "Calculates Pearson correlation coefficient (r) and p-values for linear relationships"
    technology: "NumPy, SciPy"
    requirement_file: "LAYER-CA-002-01-01_pearson_calculator.yaml"
    requirements:
      - "LAYER-CA-002-01-01"
  
  - layer_id: "LAYER-CA-002-01-02"
    name: "Spearman Calculator"
    responsibility: "Calculates Spearman rank correlation for monotonic relationships"
    technology: "SciPy"
    requirement_file: "LAYER-CA-002-01-02_spearman_calculator.yaml"
    requirements:
      - "LAYER-CA-002-01-02"
  
  - layer_id: "LAYER-CA-002-01-03"
    name: "Kendall Calculator"
    responsibility: "Calculates Kendall Tau correlation for ordinal data"
    technology: "SciPy"
    requirement_file: "LAYER-CA-002-01-03_kendall_calculator.yaml"
    requirements:
      - "LAYER-CA-002-01-03"
  
  - layer_id: "LAYER-CA-002-01-04"
    name: "Partial Correlation"
    responsibility: "Calculates partial correlation controlling for confounding variables"
    technology: "Statsmodels, Pandas"
    requirement_file: "LAYER-CA-002-01-04_partial_correlation.yaml"
    requirements:
      - "LAYER-CA-002-01-04"
  
  - layer_id: "LAYER-CA-002-01-05"
    name: "Lagged Correlation"
    responsibility: "Calculates time-lagged correlations to detect delayed effects"
    technology: "NumPy, Pandas"
    requirement_file: "LAYER-CA-002-01-05_lagged_correlation.yaml"
    requirements:
      - "LAYER-CA-002-01-05"
  

