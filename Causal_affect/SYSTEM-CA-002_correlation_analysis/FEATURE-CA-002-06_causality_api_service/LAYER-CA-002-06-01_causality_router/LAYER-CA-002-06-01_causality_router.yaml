requirement:
  title: "Causality Router"
  description: |
    FastAPI router implementing REST endpoints for Granger causality testing.
    Wraps the existing GrangerCausalityTest implementation (LAYER-CA-002-02-01)
    and exposes it via /api/causality endpoints.
    
    Key responsibilities:
    - Parse request parameters (var names, max_lag, significance)
    - Fetch time series data from database
    - Call GrangerCausalityTest for both directions
    - Format and return structured JSON response
    - Store results in database for caching
  
  rationale: |
    Users need a REST API to access causality testing functionality.
    The underlying Granger test implementation exists but is not exposed
    via HTTP endpoints. This router bridges that gap.

specification:
  structure:
    entry_point: "src/backend/app/causality_router.py"
    modules:
      - "causality_router.py - FastAPI router with endpoints"
  
  implementation_details:
    libraries:
      - "FastAPI"
      - "SQLAlchemy"
      - "NumPy"
    patterns:
      - "Router Pattern"
      - "Dependency Injection"
    error_handling:
      - error_type: "VariableNotFound"
        handling: "Return 404 with descriptive message"
      - error_type: "InsufficientData"
        handling: "Return 400 with required data points info"
      - error_type: "GrangerTestError"
        handling: "Return 500 with error details"
  
  inputs:
    - name: "var1_name"
      type: "str"
      description: "Name of first variable (potential cause)"
    - name: "var2_name"
      type: "str"
      description: "Name of second variable (potential effect)"
    - name: "max_lag"
      type: "int"
      description: "Maximum lag to test (default 10)"
    - name: "significance"
      type: "float"
      description: "P-value threshold (default 0.05)"
  
  outputs:
    - name: "causality_result"
      type: "dict"
      description: "Complete causality test results"
      example: |
        {
          "var1": "ai_papers",
          "var2": "nvda_stock",
          "test_x_causes_y": {"p_value": 0.001, "is_significant": true},
          "test_y_causes_x": {"p_value": 0.45, "is_significant": false},
          "causal_direction": "X->Y",
          "interpretation": "AI papers significantly Granger-causes NVDA stock"
        }

acceptance_criteria:
  - criterion: "GET /api/causality/{var1}/{var2} returns valid JSON"
    category: "functional"
  - criterion: "Returns 404 when variable not found in database"
    category: "functional"
  - criterion: "Returns 400 when insufficient data points"
    category: "functional"
  - criterion: "Tests both X→Y and Y→X directions"
    category: "functional"
  - criterion: "Includes human-readable interpretation in response"
    category: "functional"
  - criterion: "Response time <10 seconds for 365 days of data"
    category: "performance"
  - criterion: "Unit test coverage >90%"
    category: "quality"

code_generation_constraints:
  imports:
    required:
      - "from fastapi import APIRouter, HTTPException, Query, Depends"
      - "from sqlalchemy.ext.asyncio import AsyncSession"
      - "import numpy as np"
    forbidden: []
  
  naming_conventions:
    router_variable: "router"
    router_prefix: "/api/causality"
    endpoint_functions: "snake_case"
  
  structure:
    must_include:
      - "router = APIRouter(prefix='/api/causality', tags=['causality'])"
      - "async def test_causality(...) endpoint"
      - "async def causality_health() endpoint"
      - "determine_causal_direction() helper function"
      - "_generate_interpretation() helper function"
    
  dependencies:
    use_existing:
      - "GrangerCausalityTest from LAYER-CA-002-02-01"
      - "get_db from app.database"
      - "timeseries_data_table from features schema"

traceability:
  traces_from:
    feature: "FEATURE-CA-002-06"
    system: "SYSTEM-CA-002"
  traces_to:
    implementation: "src/backend/app/causality_router.py"
    tests: "src/backend/tests/test_causality_router.py"
