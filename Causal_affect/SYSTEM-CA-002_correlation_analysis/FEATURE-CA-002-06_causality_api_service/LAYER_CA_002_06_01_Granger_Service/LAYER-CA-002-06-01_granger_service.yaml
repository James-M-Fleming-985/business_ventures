# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Granger Service"
  
  description: |
    Service wrapper class that imports and uses the existing GrangerCausalityTest
    implementation from LAYER-CA-002-02-01 to provide Granger causality testing.
    
    Key responsibilities:
    - Import GrangerCausalityTest from existing implementation
    - Provide test_causality(keyword, target) method
    - Call test_bidirectional() to test both X→Y and Y→X directions
    - Determine causal_direction from results (X_to_Y, Y_to_X, bidirectional, none)
    - Return formatted dict matching GrangerModal.jsx expected response
  
  rationale: |
    The GrangerCausalityTest class already exists and is fully implemented.
    This layer wraps it for production use with the Signal Radar API without
    duplicating the statistical logic.

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  technology_stack:
    programming_language: "Python"
    file_extensions: [".py"]
    runtime_environment: "Python 3.10+"
    primary_framework: "None"
    additional_libraries:
      - "numpy"
      - "pandas"
  
  wraps:
    source_path: "../../FEATURE-CA-002-02_causality_testing/LAYER-CA-002-02-01_granger_test/src/implementation.py"
    class_name: "GrangerCausalityTest"
    methods_used:
      - "test_bidirectional(x, y) -> {'x_causes_y': result, 'y_causes_x': result}"
    initialization: "GrangerCausalityTest(max_lag=30, confidence_level=0.05)"

# ====================================================================================
# INTERFACE DEFINITION
# ====================================================================================

interface:
  class_name: "GrangerService"
  
  methods:
    - name: "test_causality"
      signature: "def test_causality(self, keyword: str, target: str = 'default_target') -> dict"
      description: "Tests Granger causality between signal keyword and target variable"
      parameters:
        - name: "keyword"
          type: "str"
          description: "Signal keyword (e.g., 'ai_papers', 'bitcoin')"
        - name: "target"
          type: "str"
          description: "Target variable to predict"
      returns:
        type: "dict"
        description: "Granger results matching GrangerModal expected format"
        format: |
          {
            "granger_results": {
              "f_statistic": float,
              "p_value": float,
              "optimal_lag": int,
              "r_value": float,
              "reject_null": bool
            },
            "direction": str  # X_to_Y, Y_to_X, bidirectional, none
          }

# ====================================================================================
# TESTING REQUIREMENTS
# ====================================================================================

# ====================================================================================
# TOP-LEVEL KEYS (required by AI Code Generator orchestrator)
# ====================================================================================

layer_id: "LAYER-CA-002-06-01"
feature_name: "Granger Causality API Service"

acceptance_criteria:
  - criterion: "test_causality returns correct structure with f_statistic, p_value, optimal_lag, r_value, reject_null"
    category: functional
  - criterion: "test_causality determines direction correctly for X causes Y case"
    category: functional
  - criterion: "test_causality determines direction correctly for Y causes X case"
    category: functional
  - criterion: "test_causality handles bidirectional causality case"
    category: functional
  - criterion: "test_causality handles no causality case (returns direction=none)"
    category: functional
  - criterion: "test_causality handles missing data gracefully with meaningful error"
    category: functional
  - criterion: "GrangerService imports and uses GrangerCausalityTest from LAYER-CA-002-02-01"
    category: functional
  - criterion: "Response format matches GrangerModal.jsx expected format"
    category: functional
