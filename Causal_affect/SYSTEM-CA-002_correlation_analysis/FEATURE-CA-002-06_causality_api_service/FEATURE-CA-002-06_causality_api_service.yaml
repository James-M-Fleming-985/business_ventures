# ====================================================================================
# UI INTEGRATION CONTEXT
# ====================================================================================

ui_integration:
  entry_point:
    page: "SignalRadar.jsx"
    location: "src/pages/SignalRadar.jsx"
    trigger: "User clicks 'Run Granger' button on signal card"
  
  component:
    name: "GrangerModal.jsx"
    location: "src/components/GrangerModal.jsx"
    status: "EXISTS - displays Granger results"
    modifications_required: "None - enhance backend only"
  
  user_flow: |
    SignalRadar page
      → User sees list of FMV signals (ai_papers, bitcoin, etc.)
        → User clicks signal card "Run Granger" button
          → GrangerModal opens
            → Modal calls POST /api/signal-radar/signals/{keyword}/granger
              → Backend returns: f_statistic, p_value, optimal_lag, direction
                → Modal displays results with star ratings and interpretation

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    Backend service that wraps the existing GrangerCausalityTest class
    (from LAYER-CA-002-02-01) to provide Granger causality testing via
    the Signal Radar API. The frontend GrangerModal.jsx already exists
    and displays results - this feature only enhances the backend.
    
    Granger causality tests whether X(t-lag) helps predict Y(t) beyond
    Y's own history, determining if FMV signals have predictive power
    over MV targets.
  
  business_value:
    - "Determines causal direction: does X→Y or Y→X?"
    - "Filters out spurious correlations that aren't predictive"
    - "Provides F-statistic strength rating for signal quality"
    - "Enables confident exploitation of only predictive relationships"
  
  user_story: |
    As a user viewing Signal Radar,
    I want to click "Run Granger" on a signal and see if it truly predicts
    the target variable with a clear direction indicator,
    So that I can focus on relationships with genuine predictive power.
  
  acceptance_criteria:
    - "POST /api/signal-radar/signals/{keyword}/granger endpoint functional"
    - "Uses existing GrangerCausalityTest from LAYER-CA-002-02-01"
    - "Returns f_statistic, p_value, optimal_lag, r_value"
    - "Returns causal_direction: X_to_Y, Y_to_X, bidirectional, or none"
    - "Response format matches existing GrangerModal.jsx expectations"
    - "Error handling for missing signals (404)"
    - "Error handling for insufficient data (400)"

# ====================================================================================
# API SPECIFICATION
# ====================================================================================

api:
  endpoint: "POST /api/signal-radar/signals/{keyword}/granger"
  status: "EXISTS - enhance backend implementation"
  
  request_body:
    max_lag:
      type: "integer"
      default: 12
      description: "Maximum lag periods to test"
  
  response_format: |
    {
      "granger_results": {
        "f_statistic": 8.234,
        "p_value": 0.0001,
        "optimal_lag": 30,
        "r_value": 0.72,
        "reject_null": true
      },
      "interpretation": "Strong evidence that signal Granger-causes target"
    }

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  - layer_id: "LAYER-CA-002-06-01"
    name: "Granger Service"
    folder: "LAYER_CA_002_06_01_Granger_Service"
    type: "backend"
    responsibility: |
      Service wrapper class that imports and uses GrangerCausalityTest
      from LAYER-CA-002-02-01. Provides test_causality() method that:
      - Retrieves signal and target time series data
      - Calls GrangerCausalityTest.test_bidirectional()
      - Determines causal direction from results
      - Returns formatted response for GrangerModal
    technology: "Python, GrangerCausalityTest"
    wraps: "LAYER-CA-002-02-01_granger_test/src/implementation.py"
    requirement_file: "LAYER-CA-002-06-01_granger_service.yaml"
  
  - layer_id: "LAYER-CA-002-06-02"
    name: "Granger Router"
    folder: "LAYER_CA_002_06_02_Granger_Router"
    type: "backend"
    responsibility: |
      FastAPI router enhancement for /api/signal-radar/signals/{keyword}/granger
      endpoint. Calls GrangerService and returns response matching
      GrangerModal.jsx expected format.
    technology: "FastAPI"
    requirement_file: "LAYER-CA-002-06-02_granger_router.yaml"

# ====================================================================================
# EXISTING IMPLEMENTATIONS TO WRAP
# ====================================================================================

dependencies:
  existing_backend:
    - path: "LAYER-CA-002-02-01_granger_test/src/implementation.py"
      class: "GrangerCausalityTest"
      methods:
        - "test(x, y, lag) -> GrangerTestResult"
        - "test_bidirectional(x, y) -> dict with x_causes_y, y_causes_x"
      config: "max_lag=30, confidence_level=0.05"
  
  existing_frontend:
    - path: "SYSTEM-CA-006_feedback_iteration/FEATURE-CA-006-06_dashboard_ui/dashboard-app-complete/src/components/GrangerModal.jsx"
      status: "No changes needed"
      expects: "granger_results.f_statistic, granger_results.p_value, granger_results.optimal_lag, granger_results.r_value"

# ====================================================================================
# TESTING STRATEGY
# ====================================================================================

testing:
  unit_tests:
    - "GrangerService.test_causality returns correct direction"
    - "GrangerService handles missing signal gracefully"
    - "Response format matches GrangerModal expectations"
  
  integration_tests:
    - "Full flow: API call → GrangerService → GrangerCausalityTest → response"
    - "GrangerModal displays results correctly"
