      This feature implements REST API exposure of the existing Granger causality 
      test (LAYER-CA-002-02-01) for frontend consumption. It bridges Phase 1 
      statistical implementation with user-facing functionality.

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    REST API service that wraps the existing Granger causality test implementation
    (LAYER-CA-002-02-01) into production endpoints. Enables frontend to test
    causal relationships between any two variables and receive structured results.
    
    This is the Phase 2 implementation that bridges the statistical calculations
    to the user interface.
  
  business_value:
    - "Exposes causality testing to end users via REST API"
    - "Caches results to avoid redundant expensive calculations"
    - "Provides clear directional indicators (X→Y vs Y→X)"
    - "Enables UI to show causal relationships in correlation explorer"
  
  user_story: |
    As a user viewing correlations, I want to click "Test Causality" and see
    which variable causes which, so I can focus on predictive relationships
    rather than spurious correlations.
  
  acceptance_criteria:
    - "GET /api/causality/{var1}/{var2} endpoint functional"
    - "Returns both X→Y and Y→X Granger test p-values"
    - "Includes causal_direction field (X->Y, Y->X, bidirectional, none)"
    - "Human-readable interpretation included in response"
    - "Error handling for missing variables (404)"
    - "Error handling for insufficient data (400)"

# ====================================================================================
# SHARED INTERFACES
# ====================================================================================

shared_interfaces:
  response_structure: "JSON API response with success, data, error fields"
  
  parent_system_reference:
    file: "../SYSTEM-CA-002.yaml"
    section: "shared_interfaces.api_response_structure"
  
  implementation_requirement: |
    Response format:
    {
      "success": true,
      "data": {...},
      "error": null
    }

# ====================================================================================
