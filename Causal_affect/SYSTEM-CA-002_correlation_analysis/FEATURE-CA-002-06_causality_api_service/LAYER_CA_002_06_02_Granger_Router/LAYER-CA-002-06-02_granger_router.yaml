# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Granger Router"
  
  description: |
    FastAPI router that enhances the existing /api/signal-radar/signals/{keyword}/granger
    endpoint to use the new GrangerService wrapper.
    
    Key responsibilities:
    - Define POST /api/signal-radar/signals/{keyword}/granger endpoint
    - Accept max_lag parameter in request body (default 12)
    - Instantiate and call GrangerService.test_causality()
    - Return response matching GrangerModal.jsx expected format
    - Handle 404 for missing signals
    - Handle 400 for insufficient data
  
  rationale: |
    The GrangerModal.jsx frontend already expects a specific response format.
    This router must return data in that exact format to maintain compatibility.

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  technology_stack:
    programming_language: "Python"
    file_extensions: [".py"]
    runtime_environment: "Python 3.10+"
    primary_framework: "FastAPI 0.104.0"
    additional_libraries:
      - "pydantic"

# ====================================================================================
# API ENDPOINT DEFINITION
# ====================================================================================

api:
  endpoint:
    method: "POST"
    path: "/api/signal-radar/signals/{keyword}/granger"
    path_params:
      - name: "keyword"
        type: "str"
        description: "Signal keyword (e.g., 'ai_papers')"
    
    request_body:
      content_type: "application/json"
      schema:
        max_lag:
          type: "integer"
          default: 12
          min: 1
          max: 90
          description: "Maximum lag periods to test"
    
    response:
      success_code: 200
      content_type: "application/json"
      schema: |
        {
          "granger_results": {
            "f_statistic": 8.234,
            "p_value": 0.0001,
            "optimal_lag": 30,
            "r_value": 0.72,
            "reject_null": true
          },
          "interpretation": "Strong evidence that ai_papers Granger-causes target with 30 period lag."
        }
      
    error_responses:
      - code: 404
        description: "Signal keyword not found"
        body: '{"detail": "Signal not found: {keyword}"}'
      - code: 400
        description: "Insufficient data for Granger test"
        body: '{"detail": "Insufficient data for Granger test. Need at least 30 observations."}'

# ====================================================================================
# FRONTEND COMPATIBILITY
# ====================================================================================

frontend_compatibility:
  component: "GrangerModal.jsx"
  expected_fields:
    - "granger_results.f_statistic"
    - "granger_results.p_value"
    - "granger_results.optimal_lag"
    - "granger_results.r_value"
    - "granger_results.reject_null"
  notes: |
    GrangerModal.jsx references these fields directly.
    Any change to response structure will break the modal.

