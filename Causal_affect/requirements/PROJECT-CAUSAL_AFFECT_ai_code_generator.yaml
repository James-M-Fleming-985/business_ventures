technology_stack:
  deployment_platform:
    primary: Railway (Pro account)
    philosophy: Solo founder optimized, automation-first, lean + scalable
    deployment_target: 10-15 minute MVP deployments
    configuration: railway.json per service
    
  frontend:
    framework: React 18+
    language: TypeScript 5+
    styling: TailwindCSS
    state_management: Zustand (simpler than Redux for solo dev)
    build_tool: Vite (Railway-native fast builds)
    charts: Recharts (simpler than D3.js for MVP)
    testing: Vitest + React Testing Library
    deployment: Railway (automatic Git deploys)
  
  backend:
    framework: FastAPI
    language: Python 3.11+
    async_runtime: asyncio + uvicorn
    task_queue: Celery (Railway-hosted workers)
    cache: Redis (Railway add-on)
    message_broker: Upstash Kafka (managed) or Railway Redis
    testing: pytest + pytest-asyncio
    deployment: Railway (automatic Git deploys)
  
  data_layer:
    primary_db: PostgreSQL (Railway add-on, phase 1)
    time_series_optimization: TimescaleDB Cloud (phase 2, if needed)
    cache: Redis (Railway add-on)
    object_storage: Cloudflare R2 (S3-compatible, $0.015/GB)
    backup_db: Supabase or Neon (serverless PostgreSQL)
    orm: SQLAlchemy 2.0 (portable across providers)
  
  analytics_processing:
    data_processing: Pandas + NumPy (phase 1, sufficient for 50-100 GB)
    statistical_analysis: SciPy + statsmodels
    forecasting: Prophet (Facebook, easy to use) + statsmodels ARIMA
    parallel_processing: Dask (phase 2, when scaling to 500 GB+)
    
  infrastructure:
    containerization: Docker (Railway-native)
    orchestration: Railway (built-in, not Kubernetes initially)
    reverse_proxy: Railway (built-in)
    load_balancer: Railway (built-in)
    monitoring: Railway metrics + Uptime Robot (free tier)
    logging: Railway logs + Papertrail (optional)
    error_tracking: Sentry (free tier, 5k errors/month)
    
  deployment:
    ci_cd: Railway (automatic Git deploys) + GitHub Actions (testing only)
    infrastructure_as_code: railway.json + railway.toml
    secrets_management: Railway environment variables
    hosting: Railway US/EU regions
    
  external_managed_services:
