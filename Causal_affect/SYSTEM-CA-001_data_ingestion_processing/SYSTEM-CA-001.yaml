technology_stack:
  ingestion_framework: "Celery distributed task queue"
  message_broker: "Redis (Railway managed)"
  api_client: "aiohttp for async HTTP requests"
  data_validation: "Pydantic for schema validation"
  storage: "PostgreSQL + TimescaleDB extension (Railway)"
  caching: "Redis for rate limiting and hot data"
  monitoring: "Prometheus metrics + Railway built-in monitoring"
  orchestration: "Celery Beat for scheduled tasks"
  deployment: "Railway (auto-deploy from Git)"

dependencies:
  internal:
    - system_id: SYSTEM-CA-002
      dependency_type: "Data consumer"
      description: "CA-002 reads ingested data from TimescaleDB for correlation analysis"
  
  external:
    - "15-20 external data source APIs"
    - "PostgreSQL database (Railway managed)"
    - "Redis message broker (Railway managed)"
    - "Internet connectivity for API access"

testing_requirements:
  unit_tests:
    framework: "pytest"
    coverage_target: "85%"
    scope: "Individual functions and classes"
    test_types:
      - "Pure function testing (validators, transformers)"
      - "Class method testing (API clients, database models)"
      - "Mock-based testing for external dependencies"
      - "Edge case and error condition testing"
    
    test_locations:
      - "features/FEATURE-CA-001-01_api_connector/tests/test_http_client.py"
      - "features/FEATURE-CA-001-01_api_connector/tests/test_auth_manager.py"
      - "features/FEATURE-CA-001-01_api_connector/tests/test_rate_limiter.py"
      - "features/FEATURE-CA-001-02_data_validation/tests/test_schema_validator.py"
      - "features/FEATURE-CA-001-02_data_validation/tests/test_data_cleaner.py"
      - "features/FEATURE-CA-001-03_timeseries_storage/tests/test_db_writer.py"
      - "features/FEATURE-CA-001-04_monitoring/tests/test_metrics_collector.py"
    
    example_tests:
      - name: "test_rate_limiter_enforces_limits"
        description: "Verify rate limiter blocks requests exceeding API limits"
        assertion: "Rate limiter sleeps when limit reached, allows after cooldown"
        
      - name: "test_schema_validator_rejects_invalid_data"
        description: "Validate that invalid JSON is rejected with proper error messages"
        assertion: "ValidationError raised with field-specific errors"
        
      - name: "test_circuit_breaker_trips_after_failures"
        description: "Circuit breaker opens after 3 consecutive failures"
        assertion: "CircuitBreakerOpen exception raised on 4th attempt"
  
  integration_tests:
    framework: "pytest with testcontainers"
    scope: "Multi-component interactions"
    test_types:
      - "API to database integration"
      - "Celery task execution with Redis"
      - "Data flow through pipeline stages"
      - "Authentication flow with mocked OAuth providers"
      - "Multi-source concurrent ingestion"
    
    test_locations:
      - "tests/integration/test_api_to_storage_flow.py"
      - "tests/integration/test_celery_task_execution.py"
      - "tests/integration/test_concurrent_ingestion.py"
      - "tests/integration/test_monitoring_integration.py"
    
    example_tests:
      - name: "test_full_ingestion_pipeline"
        description: "Mock API → Validation → Storage → CA-002 availability"
        setup: "TestContainers PostgreSQL + Redis"
        assertion: "Data retrieved from API is validated and stored in TimescaleDB"
        
      - name: "test_concurrent_multi_source_ingestion"
        description: "15 API sources ingesting simultaneously without conflicts"
        setup: "15 mocked API endpoints"
        assertion: "All 15 sources complete without deadlocks, data correctly partitioned"
        
      - name: "test_celery_task_retry_logic"
        description: "Task retries on transient failures, fails permanently after 5 attempts"
        setup: "Mock API that fails 3 times then succeeds"
        assertion: "Task succeeds on 4th attempt with exponential backoff"
  
  e2e_tests:
    framework: "pytest with real Railway services (staging)"
    scope: "Complete user journeys in production-like environment"
    description: |
      End-to-end tests validate full user workflows from start to finish in a staging
      environment that mirrors production. Unlike integration tests which test
      component-to-component interactions, E2E tests verify real-world scenarios
      including deployment configuration, network latency, and operational workflows.
    
    environment:
      deployment_target: "Railway staging environment"
      database: "Dedicated Railway PostgreSQL instance (staging)"
      message_broker: "Railway Redis instance (staging)"
      api_sources: "Live external APIs (with test API keys)"
      monitoring: "Railway metrics + logs"
    
    test_scenarios:
      - scenario_id: E2E-CA-001-01
        name: "New API Source Onboarding"
        description: |
          Admin adds a new external API source (e.g., "CoinGecko crypto prices")
          through configuration, system auto-configures and begins ingestion.
        user_journey:
          - "Admin updates API configuration file with new source"
          - "Redeploy CA-001 on Railway (git push triggers deploy)"
          - "System auto-detects new source and initializes connection"
          - "Data begins flowing from new source within 5 minutes"
          - "CA-002 can query the new data source"
        acceptance_criteria:
          - "New source appears in monitoring dashboard"
          - "Data successfully ingested and stored in TimescaleDB"
          - "CA-002 correlation analysis includes new source"
          - "No errors in Railway logs"
        test_file: "tests/e2e/test_new_source_onboarding.py"
      
      - scenario_id: E2E-CA-001-02
        name: "API Failure Recovery Without Data Loss"
        description: |
          External API goes down mid-ingestion, system handles gracefully
          and recovers when API comes back online.
        user_journey:
          - "Ingestion running normally from 15 APIs"
          - "1 API source fails (simulated by revoking API key)"
          - "Circuit breaker trips, other 14 sources continue normally"
          - "Failed API retries with exponential backoff"
          - "API restored (re-enable API key)"
          - "System auto-recovers and backfills missing data"
        acceptance_criteria:
          - "Zero data loss during failure"
          - "Other sources unaffected by failure"
          - "Alert triggered (Slack/email notification)"
          - "Automatic backfill completes within 30 minutes"
          - "Monitoring dashboard shows recovery"
        test_file: "tests/e2e/test_failure_recovery.py"
      
      - scenario_id: E2E-CA-001-03
        name: "Multi-Source Concurrent Ingestion at Scale"
        description: |
          Stress test with 15-20 APIs running concurrently for 50-100 GB ingestion
          to verify performance, scalability, and resource management.
        user_journey:
          - "Configure 20 diverse API sources"
          - "Trigger full ingestion cycle"
          - "Monitor Railway metrics (CPU, memory, DB connections)"
          - "Verify data quality and completeness"
          - "Confirm CA-002 can query data efficiently"
        acceptance_criteria:
          - "Ingestion completes in 30-60 minutes"
          - "Railway workers scale to 4 instances"
          - "Database connections < 50 (no connection leaks)"
          - "Memory usage < 2 GB per worker"
          - "100% data validation success rate"
          - "TimescaleDB query latency < 200ms for CA-002"
        test_file: "tests/e2e/test_concurrent_scale.py"
      
      - scenario_id: E2E-CA-001-04
        name: "Data Quality Validation End-to-End"
        description: |
          Inject known bad data to verify validation pipeline catches errors
          and prevents corrupt data from reaching downstream systems.
        user_journey:
          - "Configure mock API with intentionally corrupt data (missing fields, wrong types)"
          - "Trigger ingestion"
          - "Verify validation errors logged"
          - "Confirm corrupt data NOT stored in TimescaleDB"
          - "CA-002 queries return only valid data"
        acceptance_criteria:
          - "100% of corrupt data rejected"
          - "Validation errors logged with details"
          - "Alert triggered for high error rate (>10%)"
          - "Valid data from same source still ingested"
          - "Database integrity maintained"
        test_file: "tests/e2e/test_data_quality.py"
      
      - scenario_id: E2E-CA-001-05
        name: "Monitoring and Alerting System Verification"
        description: |
          Verify monitoring dashboard, metrics export, and alerting work correctly
          for various operational scenarios (success, partial failure, complete failure).
        user_journey:
          - "Access monitoring dashboard (FastAPI /status endpoint)"
          - "Verify all 15-20 sources show current status"
          - "Simulate API failure to trigger alert"
          - "Confirm Slack/email alert received"
          - "Check Prometheus metrics exported correctly"
        acceptance_criteria:
          - "Dashboard loads in < 2 seconds"
          - "Real-time status accurate for all sources"
          - "Alerts delivered within 1 minute of failure"
          - "Metrics include: throughput, latency, error rate, queue depth"
          - "Railway logs show detailed error traces"
        test_file: "tests/e2e/test_monitoring.py"
    
    execution_strategy:
      frequency: "Before each production deployment"
      automation: "GitHub Actions CI/CD pipeline"
      duration: "45-60 minutes for full E2E suite"
      rollback_criteria: "Any E2E test failure blocks deployment"

estimated_effort:
  development_time: "120 hours (3 weeks at 40 hours/week)"
  testing_time: "40 hours (1 week)"
  deployment_time: "8 hours"
  total_time: "168 hours (~4 weeks)"

implementation_phases:
  phase_1_core_ingestion:
    duration: "2 weeks"
    deliverables:
      - "FEATURE-01: API Connector (working with 5 APIs)"
      - "FEATURE-02: Data Validation pipeline"
      - "FEATURE-03: TimescaleDB storage"
      - "Unit + integration tests"
    success_metric: "5 APIs → TimescaleDB → CA-002 can query"
  
  phase_2_scale_and_monitor:
    duration: "1 week"
    deliverables:
      - "Scale to 15-20 APIs"
      - "FEATURE-04: Monitoring dashboard"
      - "E2E tests + CI/CD pipeline"
    success_metric: "50-100 GB ingested in 30-60 min with monitoring"
  
  phase_3_production:
    duration: "1 week"
    deliverables:
      - "Railway production deployment"
      - "Documentation and runbooks"
      - "Performance tuning"
    success_metric: "Production-ready with 99% uptime"

risks:
  - risk_id: RISK-CA-001-01
    description: "API rate limits more restrictive than expected"
    probability: "Medium"
    impact: "High - could slow ingestion significantly"
    mitigation: "Implement adaptive rate limiting, fallback to paid API tiers"
    
  - risk_id: RISK-CA-001-02
    description: "TimescaleDB performance degrades with large data volumes"
    probability: "Low"
    impact: "High - affects CA-002 query performance"
    mitigation: "Optimize partitioning strategy, add indexes, consider compression"
    
  - risk_id: RISK-CA-001-03
    description: "Railway cost exceeds budget as data volume grows"
    probability: "Medium"
    impact: "Medium - may need infrastructure changes"
    mitigation: "Monitor costs closely, optimize worker count, consider AWS migration"
