# SYSTEM-CA-001: Data Ingestion & Processing Engine
# ===================================================

metadata:
  system_id: SYSTEM-CA-001
  system_name: Data Ingestion & Processing Engine
  parent_project: PROJECT-CAUSAL_AFFECT
  created_date: 2025-10-13
  updated_date: 2025-10-17
  status: planned
  priority: critical
  
  purpose: |
    High-performance data ingestion pipeline that pulls data from 15-20 concurrent
    external APIs, validates, transforms, and stores time-series data for downstream
    correlation analysis. Designed to handle 50-100 GB in Phase 1, scaling to 10+ TB
    as business grows.
  
  business_value: |
    - Enables access to diverse data sources (financial, weather, social, economic)
    - Handles API failures gracefully without data loss
    - Provides clean, normalized data for CA-002 correlation analysis
    - Scales easily as more data sources and volume are added
    - Reduces manual data collection effort by 95%

deployment:
  platform: Railway
  service_type: Backend worker service (Celery workers + monitoring API)
  scaling: 2-4 workers (Phase 1) → 8-16 workers (Phase 2)
  estimated_cost: "$40/month (Phase 1) → $150/month (Phase 2)"
  
  railway_config_workers:
    builder: NIXPACKS
    build_command: "pip install -r requirements.txt"
    start_command: "celery -A app.tasks worker --loglevel=info --concurrency=4"
    health_check: "/health"
    restart_policy: ON_FAILURE
  
  railway_config_api:
    builder: NIXPACKS
    build_command: "pip install -r requirements.txt"
    start_command: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    health_check: "/health"
    restart_policy: ON_FAILURE

code_generation:
  repository_root: "/workspaces/business_ventures/Causal_affect"
  system_folder: "SYSTEM-CA-001_data_ingestion_processing"
  
  folder_structure:
    requirements:
      description: "Hierarchical folder structure with FEATURE and LAYER folders"
      structure: |
        SYSTEM-CA-001_data_ingestion_processing/
        ├── SYSTEM-CA-001.yaml (at root)
        ├── FEATURE-CA-001-01_api_connector/
        │   ├── FEATURE-CA-001-01_api_connector.yaml
        │   ├── LAYER-CA-001-01-01_http_client/
        │   │   └── LAYER-CA-001-01-01_http_client.yaml
        │   ├── LAYER-CA-001-01-02_auth_manager/
        │   │   └── LAYER-CA-001-01-02_auth_manager.yaml
        │   ├── LAYER-CA-001-01-03_rate_limiter/
        │   │   └── LAYER-CA-001-01-03_rate_limiter.yaml
        │   └── LAYER-CA-001-01-04_circuit_breaker/
        │       └── LAYER-CA-001-01-04_circuit_breaker.yaml
        ├── FEATURE-CA-001-02_data_validation/
        │   ├── FEATURE-CA-001-02_data_validation.yaml
        │   ├── LAYER-CA-001-02-01_schema_validator/
        │   ├── LAYER-CA-001-02-02_data_cleaner/
        │   ├── LAYER-CA-001-02-03_transformer/
        │   └── LAYER-CA-001-02-04_quality_checker/
        ├── FEATURE-CA-001-03_timeseries_storage/
        │   ├── FEATURE-CA-001-03_timeseries_storage.yaml
        │   ├── LAYER-CA-001-03-01_db_connection/
        │   ├── LAYER-CA-001-03-02_partitioner/
        │   ├── LAYER-CA-001-03-03_indexer/
        │   └── LAYER-CA-001-03-04_compressor/
        └── FEATURE-CA-001-04_monitoring/
            ├── FEATURE-CA-001-04_monitoring.yaml
            ├── LAYER-CA-001-04-01_metrics_collector/
            ├── LAYER-CA-001-04-02_health_checker/
            └── LAYER-CA-001-04-03_alerter/
      
      naming_convention:
        feature_folder: "FEATURE-{SYSTEM_ID}-{NUMBER}_{feature_name}"
        feature_file: "FEATURE-{SYSTEM_ID}-{NUMBER}_{feature_name}.yaml"
        layer_folder: "LAYER-{SYSTEM_ID}-{FEATURE_NUM}-{LAYER_NUM}_{layer_name}"
        layer_file: "LAYER-{SYSTEM_ID}-{FEATURE_NUM}-{LAYER_NUM}_{layer_name}.yaml"
      
      example_paths:
        - "SYSTEM-CA-001_data_ingestion_processing/FEATURE-CA-001-01_api_connector/FEATURE-CA-001-01_api_connector.yaml"
        - "SYSTEM-CA-001_data_ingestion_processing/FEATURE-CA-001-01_api_connector/LAYER-CA-001-01-01_http_client/LAYER-CA-001-01-01_http_client.yaml"
    
    source_backend:
      base_path: "src/data_ingestion/backend"
      description: "Celery-based worker service with hybrid architecture"
      entry_point: "app/main.py"
      structure:
        app:
          - "__init__.py"
          - "main.py          # FastAPI app for monitoring API"
          - "tasks.py         # Celery task definitions"
          - "config.py        # System-wide configuration"
          - "celery_app.py    # Celery app instance"
          - "api/             # Monitoring and control API endpoints
              - __init__.py
              - health.py          # Health check endpoints
              - status.py          # Ingestion status endpoints
              - control.py         # Start/stop/configure endpoints"
          - "db/              # System-level database infrastructure
              - __init__.py
              - connection.py      # SQLAlchemy engine for TimescaleDB
              - base.py            # Declarative base"
          - "middleware/      # Cross-cutting concerns
              - __init__.py
              - error_handler.py   # Global exception handling
              - logging.py         # Request/response logging"
          - "schemas/         # Shared DTOs
              - __init__.py
              - health.py          # HealthResponse
              - error.py           # ErrorResponse"
        features:
          - "FEATURE-CA-001-01_api_connector/
              - __init__.py
              - services/         # HTTP clients, auth, rate limiting
              - models/           # API configs, request/response models
              - db/               # API metadata schema
              - tests/            # Unit tests"
          - "FEATURE-CA-001-02_data_validation/
              - __init__.py
              - services/         # Validators, cleaners, transformers
              - models/           # Validation rules, schemas
              - db/               # Validation error logs
              - tests/            # Unit tests"
          - "FEATURE-CA-001-03_timeseries_storage/
              - __init__.py
              - services/         # TimescaleDB operations
              - models/           # Time-series data models
              - db/               # Table schemas, partitions
              - tests/            # Unit tests"
          - "FEATURE-CA-001-04_monitoring/
              - __init__.py
              - services/         # Metrics collectors, health checks
              - models/           # Monitoring data models
              - db/               # Metrics storage
              - tests/            # Unit tests"
        root_files:
          - "requirements.txt # Python dependencies"
          - "Dockerfile.dev   # Development container"
          - ".env.example     # Environment variable template"
    
    configuration:
      base_path: "src/data_ingestion"
      description: "Deployment and development configuration"
      files:
        - "railway.json           # Railway deployment configuration"
        - "docker-compose.dev.yml # Local development with PostgreSQL + Redis"
        - "README.md              # How to run CA-001 locally"
        - ".gitignore             # Git ignore patterns"
    
    tests:
      base_path: "tests/data_ingestion"
      description: "Test files mirroring source structure"
      structure:
