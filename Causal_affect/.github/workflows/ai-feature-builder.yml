# ================================================
# AI FEATURE BUILDER - GitHub Actions Workflow
# ================================================
# Triggers AI Code Generator to build Causal Affect features
#
# USAGE:
#   - Go to Actions tab in GitHub (or GitHub mobile)
#   - Click "AI Feature Builder"
#   - Click "Run workflow"
#   - Select feature to build
#
# REQUIRES:
#   Repository secret: ANTHROPIC_API_KEY

name: AI Feature Builder

on:
  workflow_dispatch:
    inputs:
      feature:
        description: 'Feature to build'
        required: true
        type: choice
        options:
          - 'FEATURE-CA-002-06'  # Causality API Service
          - 'FEATURE-CA-002-08'  # Lag Analysis Service
          - 'FEATURE-CA-002-09'  # Regression Service
          - 'FEATURE-CA-002-10'  # Prediction Tracking
          - 'ALL_SEQUENTIAL'     # Build all features in order
      dry_run:
        description: 'Dry run (verify YAML without AI generation)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  build-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Checkout control_tower (AI Code Generator)
        uses: actions/checkout@v4
        with:
          repository: James-M-Fleming-985/control_tower
          path: control_tower
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml requests pytest
          
          # Install Causal Affect backend dependencies
          if [ -f src/backend/requirements.txt ]; then
            pip install -r src/backend/requirements.txt
          fi

      - name: Verify feature YAML exists
        id: verify
        run: |
          FEATURE="${{ github.event.inputs.feature }}"
          
          if [ "$FEATURE" = "ALL_SEQUENTIAL" ]; then
            FEATURES=("FEATURE-CA-002-06" "FEATURE-CA-002-08" "FEATURE-CA-002-09" "FEATURE-CA-002-10")
          else
            FEATURES=("$FEATURE")
          fi
          
          for F in "${FEATURES[@]}"; do
            YAML_PATH="SYSTEM-CA-002_correlation_analysis/${F}_*/FEATURE*.yaml"
            FOUND=$(find . -path "./$YAML_PATH" -type f 2>/dev/null | head -1)
            
            if [ -z "$FOUND" ]; then
              echo "::error::Feature YAML not found for $F"
              exit 1
            fi
            
            echo "✓ Found: $FOUND"
          done
          
          echo "features_verified=true" >> $GITHUB_OUTPUT

      - name: Build single feature
        if: github.event.inputs.feature != 'ALL_SEQUENTIAL'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FEATURE="${{ github.event.inputs.feature }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          echo "================================================"
          echo "Building feature: $FEATURE"
          echo "Dry run: $DRY_RUN"
          echo "================================================"
          
          # Find the feature YAML path
          YAML_PATTERN="SYSTEM-CA-002_correlation_analysis/${FEATURE}_*/${FEATURE}*.yaml"
          YAML_PATH=$(find . -path "./$YAML_PATTERN" -type f 2>/dev/null | head -1)
          
          if [ -z "$YAML_PATH" ]; then
            echo "::error::Could not find YAML for $FEATURE"
            exit 1
          fi
          
          echo "Found YAML: $YAML_PATH"
          
          # Build using absolute path
          FULL_PATH="$(pwd)/${YAML_PATH#./}"
          
          if [ "$DRY_RUN" = "true" ]; then
            # Dry run - just validate the YAML
            python -c "import yaml; yaml.safe_load(open('$FULL_PATH'))" && echo "✓ YAML valid"
          else
            python control_tower/build_feature.py "$FULL_PATH"
          fi

      - name: Build all features sequentially
        if: github.event.inputs.feature == 'ALL_SEQUENTIAL'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          FEATURES=("FEATURE-CA-002-06" "FEATURE-CA-002-08" "FEATURE-CA-002-09" "FEATURE-CA-002-10")
          
          for F in "${FEATURES[@]}"; do
            echo ""
            echo "================================================"
            echo "Building feature: $F"
            echo "================================================"
            
            # Find the feature YAML path
            YAML_PATTERN="SYSTEM-CA-002_correlation_analysis/${F}_*/${F}*.yaml"
            YAML_PATH=$(find . -path "./$YAML_PATTERN" -type f 2>/dev/null | head -1)
            
            if [ -z "$YAML_PATH" ]; then
              echo "::warning::Could not find YAML for $F, skipping"
              continue
            fi
            
            FULL_PATH="$(pwd)/${YAML_PATH#./}"
            
            if [ "$DRY_RUN" = "true" ]; then
              python -c "import yaml; yaml.safe_load(open('$FULL_PATH'))" && echo "✓ YAML valid"
            else
              python control_tower/build_feature.py "$FULL_PATH"
            fi
            
            # Commit after each feature
            if [ "$DRY_RUN" != "true" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "AI-generated: $F implementation" || echo "No changes to commit"
              git push || echo "Push failed, continuing..."
            fi
          done

      - name: Commit changes
        if: github.event.inputs.feature != 'ALL_SEQUENTIAL' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "AI-generated: ${{ github.event.inputs.feature }} implementation"
          git push || echo "Push failed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results-${{ github.event.inputs.feature }}
          path: |
            **/verification_*.md
            **/build_*.log
            **/test_results_*.xml
          retention-days: 30

      - name: Summary
        run: |
          echo "## Feature Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Feature:** ${{ github.event.inputs.feature }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Complete" >> $GITHUB_STEP_SUMMARY
