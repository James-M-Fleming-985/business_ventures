  acceptance_criteria:
    - "Pop-out loads in < 1 second when correlation cell clicked"
    - "Causality tests execute and display results clearly"
    - "Drift timeline shows relationship evolution graphically"
    - "Recommendations are actionable and business-focused"
    - "Export functionality for analysis reports"
  
  dependencies:
