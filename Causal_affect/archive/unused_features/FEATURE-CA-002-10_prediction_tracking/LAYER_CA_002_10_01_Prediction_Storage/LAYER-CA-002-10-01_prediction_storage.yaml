# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Prediction Storage"
  
  description: |
    Database layer for storing and managing predictions with accuracy tracking.
    
    Key responsibilities:
    - Define prediction_tracking database table (SQLAlchemy model)
    - Implement POST /api/predictions to store new predictions
    - Implement PUT /api/predictions/{id}/actual to record actual outcomes
    - Implement GET /api/predictions to list predictions with pagination
    - Implement GET /api/predictions/analytics for accuracy metrics
    - Calculate MAE, MAPE, R², hit rate from stored predictions
    - Handle errors: 400 for invalid data, 404 for not found
  
  rationale: |
    Users need to track prediction accuracy over time to validate
    their causal models and improve forecasting. Without tracking,
    there's no way to know if predictions are actually correct.

# ====================================================================================
# DATABASE SCHEMA
# ====================================================================================

database_schema:
  table_name: "prediction_tracking"
  columns:
    - name: "id"
      type: "Integer"
      constraints: "PRIMARY KEY, AUTOINCREMENT"
    - name: "var1_name"
      type: "String(100)"
      constraints: "NOT NULL"
    - name: "var2_name"
      type: "String(100)"
      constraints: "NOT NULL"
    - name: "predicted_value"
      type: "Float"
      constraints: "NOT NULL"
    - name: "actual_value"
      type: "Float"
      constraints: "NULLABLE"
    - name: "x_value_used"
      type: "Float"
      constraints: "NOT NULL"
    - name: "beta_1_used"
      type: "Float"
      constraints: "NOT NULL"
    - name: "lag_used"
      type: "Integer"
      constraints: "NOT NULL"
    - name: "prediction_date"
      type: "DateTime"
      constraints: "NOT NULL, DEFAULT=now()"
    - name: "target_date"
      type: "Date"
      constraints: "NOT NULL"
    - name: "actual_recorded_date"
      type: "DateTime"
      constraints: "NULLABLE"
    - name: "created_at"
      type: "DateTime"
      constraints: "NOT NULL, DEFAULT=now()"
    - name: "updated_at"
      type: "DateTime"
      constraints: "NOT NULL, DEFAULT=now(), ON UPDATE=now()"

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  technology_stack:
    programming_language: "Python"
    file_extensions: [".py"]
    runtime_environment: "Python 3.10+"
    primary_framework: "FastAPI 0.104.0"
    additional_libraries:
      - "sqlalchemy"
      - "numpy"
      - "pydantic"
  
  structure:
    entry_point: "src/backend/app/prediction_storage.py"
    modules:
      - "prediction_storage.py - CRUD operations and accuracy calculations"
      - "models/prediction_tracking.py - SQLAlchemy model"
  
  classes:
    - name: "PredictionTracking"
      purpose: "SQLAlchemy model for prediction_tracking table"
      methods: []
    
    - name: "prediction_router"
      purpose: "FastAPI router for prediction endpoints"
      methods:
        - name: "create_prediction"
          signature: "async def create_prediction(prediction: PredictionCreate, db: Session = Depends(get_db)) -> dict"
          purpose: "Store new prediction record"
          example: |
            # POST /api/predictions
            # Body: {"var1": "ai_papers", "var2": "nvda_stock", "predicted_value": 456.48, ...}
            # Returns: {"id": 1, "var1": "ai_papers", ...}
        
        - name: "record_actual"
          signature: "async def record_actual(prediction_id: int, actual: ActualValue, db: Session = Depends(get_db)) -> dict"
          purpose: "Record actual outcome for a prediction"
          example: |
            # PUT /api/predictions/1/actual
            # Body: {"actual_value": 462.10}
            # Returns: {"id": 1, "actual_value": 462.10, "error": 5.62, ...}
        
        - name: "list_predictions"
          signature: "async def list_predictions(skip: int = 0, limit: int = 50, var1: str = None, var2: str = None, db: Session = Depends(get_db)) -> dict"
          purpose: "List predictions with optional filtering"
        
        - name: "get_analytics"
          signature: "async def get_analytics(var1: str = None, var2: str = None, db: Session = Depends(get_db)) -> dict"
          purpose: "Calculate and return accuracy metrics"
          example: |
            # GET /api/predictions/analytics
            # Returns:
            {
              "total_predictions": 50,
              "predictions_with_actuals": 35,
              "accuracy_metrics": {
                "mae": 12.5,
                "mape": 3.2,
                "r_squared": 0.78,
                "hit_rate_5pct": 0.82
              }
            }
        
        - name: "_calculate_mae"
          signature: "def _calculate_mae(predictions: List[float], actuals: List[float]) -> float"
          purpose: "Calculate Mean Absolute Error"
        
        - name: "_calculate_mape"
          signature: "def _calculate_mape(predictions: List[float], actuals: List[float]) -> float"
          purpose: "Calculate Mean Absolute Percentage Error"
        
        - name: "_calculate_hit_rate"
          signature: "def _calculate_hit_rate(predictions: List[float], actuals: List[float], threshold: float = 0.05) -> float"
          purpose: "Calculate percentage of predictions within threshold"
  
  implementation_details:
    libraries:
      - "FastAPI"
      - "SQLAlchemy"
      - "Pydantic"
      - "NumPy"
    patterns:
      - "Repository Pattern"
      - "Router Pattern"
      - "Dependency Injection"
    error_handling:
      - error_type: "InvalidData"
        handling: "Return HTTP 400 with validation errors"
      - error_type: "PredictionNotFound"
        handling: "Return HTTP 404 with descriptive message"
      - error_type: "DatabaseError"
        handling: "Return HTTP 500 with error details"
  
  inputs:
    - name: "prediction_create"
      type: "PredictionCreate (Pydantic model)"
      description: "New prediction data"
      example: |
        {
          "var1": "ai_papers",
          "var2": "nvda_stock",
          "predicted_value": 456.48,
          "x_value_used": 125,
          "beta_1_used": 2.45,
          "lag_used": 14,
          "target_date": "2026-02-24"
        }
    - name: "actual_value"
      type: "ActualValue (Pydantic model)"
      description: "Actual outcome to record"
      example: '{"actual_value": 462.10}'
  
  outputs:
    - name: "prediction_response"
      type: "dict"
      description: "Stored prediction with ID"
    - name: "analytics_response"
      type: "dict"
      description: "Accuracy metrics"
      example: |
        {
          "total_predictions": 50,
          "predictions_with_actuals": 35,
          "accuracy_metrics": {
            "mae": 12.5,
            "mape": 3.2,
            "r_squared": 0.78,
            "hit_rate_5pct": 0.82
          }
        }

