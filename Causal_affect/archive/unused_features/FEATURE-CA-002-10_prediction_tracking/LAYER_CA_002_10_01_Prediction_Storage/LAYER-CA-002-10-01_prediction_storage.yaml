# ====================================================================================
# CODE GENERATION CONSTRAINTS
# ====================================================================================

code_generation_constraints:
  must_use:
    - "FastAPI APIRouter"
    - "SQLAlchemy ORM"
    - "Pydantic for request/response validation"
    - "Depends(get_db) for database session"
    - "HTTPException for error responses"
  
  must_not_use:
    - "Raw SQL queries (use SQLAlchemy ORM)"
    - "Global database connections"
    - "Blocking synchronous calls in async functions"
  
  naming_conventions:
    functions: "snake_case"
    classes: "PascalCase"
    constants: "UPPER_SNAKE_CASE"
    tables: "snake_case"
  
  file_structure:
    model: "src/backend/app/models/prediction_tracking.py"
