        - "test_mape_calculation"
        - "test_hit_rate_calculation"
        - "test_prediction_not_found_returns_404"
        - "test_invalid_data_returns_400"
      duration: "45 min"
    
    - step: 3
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/test_prediction_storage.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 4
      action: "Implement prediction_storage.py (GREEN phase)"
