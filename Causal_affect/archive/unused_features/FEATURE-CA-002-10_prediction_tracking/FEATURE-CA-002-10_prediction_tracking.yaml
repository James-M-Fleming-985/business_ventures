# VERSION: 1.0.0
# LAST UPDATED: 2026-02-10
# SYSTEM: CA-002 Correlation Analysis Engine
# PHASE: 5.5 - Prediction Tracking
# ====================================================================================

metadata:
  requirement_id: "FEATURE-CA-002-10"
  requirement_name: "Prediction Tracking Service"
  feature_id: "FEATURE-CA-002-10"
  feature_name: "Prediction Tracking Service"
  feature_code: "CA-002-10"
  version: "1.0.0"
  status: "Active"
  created_date: "2026-02-10"
  last_modified: "2026-02-10"
  owner: "Causal Affect Team"
  priority: "MUST HAVE"
  target_date: "2026-03-01"
  
  traceability:
    parent_system: "SYSTEM-CA-002"
    parent_system_file: "../SYSTEM-CA-002.yaml"
    parent_system_requirements:
      - "SYS-REQ-005: Prediction storage and accuracy tracking"
      - "SYS-REQ-006: REST API endpoints for prediction management"
    
    derivation_rationale: |
      This feature implements prediction storage and accuracy tracking.
      Users need to record predictions, compare with actual outcomes,
      and measure prediction accuracy over time.

# ====================================================================================
# FEATURE OVERVIEW
# ====================================================================================

overview:
  description: |
    REST API service that stores predictions, records actual outcomes,
    and calculates prediction accuracy metrics over time.
    
    This is Phase 5.5 implementation that answers: "How accurate are
    our causal predictions?"
  
  business_value:
    - "Stores predictions for future validation"
    - "Tracks actual outcomes vs predictions"
    - "Calculates accuracy metrics (MAE, MAPE, R²)"
    - "Provides analytics on prediction performance"
    - "Enables model improvement based on accuracy data"
  
  user_story: |
    As a user making predictions, I want to track my predictions and
    compare them with actual outcomes, so I can measure accuracy and
    improve my forecasting over time.
  
  acceptance_criteria:
    - "POST /api/predictions endpoint stores new predictions"
    - "GET /api/predictions/analytics returns accuracy metrics"
    - "Predictions include: var1, var2, predicted_value, prediction_date, target_date"
    - "Actuals can be recorded when available"
    - "Accuracy calculated: MAE, MAPE, R², hit rate"
    - "Error handling for invalid data (400)"
    - "Error handling for prediction not found (404)"

# ====================================================================================
# SHARED INTERFACES
# ====================================================================================

shared_interfaces:
  response_structure: "JSON API response with success, data, error fields"
  
  parent_system_reference:
    file: "../SYSTEM-CA-002.yaml"
    section: "shared_interfaces.api_response_structure"
  
  implementation_requirement: |
    POST /api/predictions Request:
    {
      "var1": "ai_papers",
      "var2": "nvda_stock",
      "predicted_value": 456.48,
      "x_value_used": 125,
      "beta_1_used": 2.45,
      "lag_used": 14,
      "target_date": "2026-02-24"
    }
    
    GET /api/predictions/analytics Response:
    {
      "success": true,
      "data": {
        "total_predictions": 50,
        "predictions_with_actuals": 35,
        "accuracy_metrics": {
          "mae": 12.5,
          "mape": 3.2,
          "r_squared": 0.78,
          "hit_rate_5pct": 0.82
        },
        "by_variable_pair": [...]
      },
      "error": null
    }

# ====================================================================================
# LAYER ARCHITECTURE
# ====================================================================================

layers:
  - layer_id: "LAYER-CA-002-10-01"
    name: "Prediction Storage"
    responsibility: "Store predictions, record actuals, calculate accuracy"
    technology: "Python, FastAPI, SQLAlchemy"
    requirement_file: "LAYER-CA-002-10-01_prediction_storage.yaml"
    requirements:
      - "LAYER-CA-002-10-01"

# ====================================================================================
# FEATURE REQUIREMENTS
# ====================================================================================

requirements:
  - id: "FEAT-CA-002-10-REQ-001"
    title: "Store Prediction"
    description: "POST /api/predictions stores new prediction record"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      system_requirements: ["SYS-REQ-005", "SYS-REQ-006"]
      layer_requirements: ["LAYER-CA-002-10-01"]
  
  - id: "FEAT-CA-002-10-REQ-002"
    title: "Record Actual Outcome"
    description: "PUT /api/predictions/{id}/actual records actual value"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      system_requirements: ["SYS-REQ-005"]
      layer_requirements: ["LAYER-CA-002-10-01"]
  
  - id: "FEAT-CA-002-10-REQ-003"
    title: "Prediction Analytics"
    description: "GET /api/predictions/analytics returns accuracy metrics"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      system_requirements: ["SYS-REQ-005", "SYS-REQ-006"]
      layer_requirements: ["LAYER-CA-002-10-01"]
  
  - id: "FEAT-CA-002-10-REQ-004"
    title: "List Predictions"
    description: "GET /api/predictions returns paginated prediction list"
    priority: "SHOULD HAVE"
    status: "Active"
    traces_to:
      layer_requirements: ["LAYER-CA-002-10-01"]
  
  - id: "FEAT-CA-002-10-REQ-005"
    title: "Accuracy Metrics"
    description: "Calculate MAE, MAPE, R², and hit rate"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      system_requirements: ["SYS-REQ-005"]
      layer_requirements: ["LAYER-CA-002-10-01"]
  
  - id: "FEAT-CA-002-10-REQ-006"
    title: "Error Handling"
    description: "Return appropriate HTTP status codes for errors"
    priority: "MUST HAVE"
    status: "Active"
    traces_to:
      layer_requirements: ["LAYER-CA-002-10-01"]

# ====================================================================================
# INTEGRATION POINTS
# ====================================================================================

integration:
