# LAYER-CA-006-02-05: Engagement Storage Layer
# =============================================

metadata:
  layer_id: LAYER-CA-006-02-05
  layer_name: Engagement Storage Layer
  parent_feature: FEATURE-CA-006-02
  parent_feature_name: Real-Time Engagement Tracking
  parent_system: SYSTEM-CA-006
  created_date: 2025-10-14
  status: planned
  priority: high
  complexity: medium

traceability:
  parent_feature_id: FEATURE-CA-006-02
  parent_system_id: SYSTEM-CA-006
  implements_acceptance_criteria:
    - AC-FEAT-006-02-09  # Store events and sessions persistently
    - AC-FEAT-006-02-10  # Support historical query and analysis
  contributes_to_system_criteria:
    - AC-SYS-006-01  # Metrics collected from all MVPs

description: |
  PostgreSQL-based persistent storage for events, sessions, and calculated
  metrics. Optimized for time-series queries and historical analysis.

responsibilities:
  - "Store all events persistently in PostgreSQL"
  - "Store session data with complete history"
  - "Store calculated metrics for trending"
  - "Provide efficient queries for time-range analysis"
  - "Support data retention policies (90-day default)"
  - "Handle high write throughput (10K events/min)"

interfaces:
  inputs:
    - "Events from Real-Time Processor"
    - "Sessions from Session Tracker"
    - "Calculated metrics from Metrics Calculator"
  
  outputs:
    - "Persisted events, sessions, and metrics"
    - "Historical data for queries and reporting"
    - "Data for cohort and retention analysis"

acceptance_criteria:
  - criterion_id: AC-LAY-006-02-05-01
    criterion: "Store events with <1 second write latency"
    verification: "Database write performance test"
    test_type: "performance"
    
  - criterion_id: AC-LAY-006-02-05-02
    criterion: "Support time-range queries with <2 second response"
    verification: "Query performance test (30-day range)"
    test_type: "performance"
    
  - criterion_id: AC-LAY-006-02-05-03
    criterion: "Maintain data integrity across high write volume"
    verification: "Concurrent write test with validation"
    test_type: "integration"
    
  - criterion_id: AC-LAY-006-02-05-04
    criterion: "Implement data retention policy (90-day default)"
    verification: "Data cleanup job test"
    test_type: "unit"

technical_specification:
  language: "Python 3.11+"
  dependencies:
    - "sqlalchemy >= 2.0"
    - "psycopg2-binary >= 2.9"
    - "alembic >= 1.12 (migrations)"
  
  class_structure:
    EngagementStorage:
      methods:
        - "__init__(db_url: str)"
        - "store_event(event: Event) -> None"
        - "store_session(session: Session) -> None"
        - "store_metrics(mvp_id: str, metrics: dict) -> None"
        - "query_events(mvp_id: str, start_date: datetime, end_date: datetime) -> List[Event]"
        - "query_sessions(mvp_id: str, start_date: datetime, end_date: datetime) -> List[Session]"
        - "cleanup_old_data(retention_days: int) -> int"

  database_schema:
    events_table:
      columns:
        - "event_id: UUID PRIMARY KEY"
        - "mvp_id: VARCHAR(100) NOT NULL"
        - "user_id: VARCHAR(100) NOT NULL"
        - "session_id: VARCHAR(100)"
        - "event_type: VARCHAR(50) NOT NULL"
        - "timestamp: TIMESTAMP NOT NULL"
        - "properties: JSONB"
        - "created_at: TIMESTAMP DEFAULT NOW()"
      indexes:
        - "idx_events_mvp_timestamp ON (mvp_id, timestamp DESC)"
        - "idx_events_user_timestamp ON (user_id, timestamp DESC)"
        - "idx_events_session ON (session_id)"
    
    sessions_table:
      columns:
        - "session_id: VARCHAR(100) PRIMARY KEY"
        - "mvp_id: VARCHAR(100) NOT NULL"
        - "user_id: VARCHAR(100) NOT NULL"
        - "start_time: TIMESTAMP NOT NULL"
        - "end_time: TIMESTAMP"
        - "duration_seconds: INTEGER"
        - "event_count: INTEGER"
        - "engagement_score: FLOAT"
        - "is_bounce: BOOLEAN"
      indexes:
        - "idx_sessions_mvp_start ON (mvp_id, start_time DESC)"
        - "idx_sessions_user ON (user_id, start_time DESC)"
    
    metrics_table:
      columns:
        - "metric_id: SERIAL PRIMARY KEY"
        - "mvp_id: VARCHAR(100) NOT NULL"
        - "metric_date: DATE NOT NULL"
        - "dau: INTEGER"
        - "mau: INTEGER"
        - "avg_session_duration: FLOAT"
        - "bounce_rate: FLOAT"
        - "retention_day_1: FLOAT"
        - "retention_day_7: FLOAT"
        - "retention_day_30: FLOAT"
        - "calculated_at: TIMESTAMP DEFAULT NOW()"
      indexes:
        - "idx_metrics_mvp_date ON (mvp_id, metric_date DESC)"
        - "UNIQUE idx_metrics_unique ON (mvp_id, metric_date)"

testing_requirements:
  unit_tests:
    - "Test event insertion with valid data"
    - "Test session storage and retrieval"
    - "Test metrics storage and updates"
    - "Test data cleanup job logic"
  
  integration_tests:
    - "Test concurrent event writes (10K/min)"
    - "Test time-range query performance"
    - "Test database migrations with Alembic"
  
  performance_tests:
    - "Measure write throughput (target: 10K events/min)"
    - "Measure query latency (target: <2 seconds for 30-day range)"

implementation_notes: |
  - Use SQLAlchemy ORM for database operations
  - Implement connection pooling (pool size: 20)
  - Use batch inserts for events (batch size: 100)
  - Partition events table by month for performance
  - Use TimescaleDB extension for time-series optimization (optional)
  - Implement daily cleanup job for retention policy
  - Create database indexes optimized for time-range queries
  - Use JSONB for flexible event properties storage
