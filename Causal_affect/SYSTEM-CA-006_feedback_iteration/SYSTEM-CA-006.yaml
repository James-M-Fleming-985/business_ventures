# SYSTEM-CA-006: Feedback Collection & Iteration Orchestrator
# ============================================================

metadata:
  system_id: SYSTEM-CA-006
  system_name: Feedback Collection & Iteration Orchestrator
  parent_project: PROJECT-CAUSAL_AFFECT
  created_date: 2025-10-13
  status: planned
  priority: critical
  
  purpose: |
    Automated feedback collection using analytics providers (Google Analytics,
    Mixpanel, Amplitude). Tracks engagement across MVPs, prioritizes high-performers,
    archives non-performers. Operates with <5 minute latency.
  
  business_value: |
    - Identifies successful MVPs for further investment
    - Eliminates wasted resources on non-performers
    - Provides data-driven iteration priorities
    - Enables portfolio-level optimization

deployment:
  platform: Railway
  service_type: Backend API + Frontend Dashboard
  scaling: 1 backend + 1 frontend (Phase 1) → 2-3 replicas (Phase 2)
  estimated_cost: "$20/month (Phase 1) → $60/month (Phase 2)"
  
  railway_config_backend:
    builder: NIXPACKS
    build_command: "pip install -r requirements.txt"
    start_command: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    health_check: "/health"
    restart_policy: ON_FAILURE
  
  railway_config_frontend:
    builder: NIXPACKS
    build_command: "npm install && npm run build"
    start_command: "npm run preview -- --host 0.0.0.0 --port $PORT"
    health_check: "/"
    restart_policy: ON_FAILURE

code_generation:
  repository_root: "/workspaces/business_ventures/Causal_affect"
  system_folder: "SYSTEM-CA-006_feedback_iteration"
  
  folder_structure:
    requirements:
      description: "Hierarchical folder structure with FEATURE and LAYER folders"
      structure: |
        SYSTEM-CA-006_feedback_iteration/
        ├── SYSTEM-CA-006.yaml (at root)
        ├── FEATURE-CA-006-01_analytics_integration/
        │   ├── FEATURE-CA-006-01_analytics_integration.yaml (FEATURE requirements at folder root)
        │   ├── LAYER-CA-006-01-01_google_analytics_client/
        │   │   └── LAYER-CA-006-01-01_google_analytics_client.yaml (LAYER requirements at folder root)
        │   ├── LAYER-CA-006-01-02_mixpanel_client/
        │   │   └── LAYER-CA-006-01-02_mixpanel_client.yaml
        │   └── ... (additional layers)
        ├── FEATURE-CA-006-02_engagement_tracking/
        │   └── FEATURE-CA-006-02_engagement_tracking.yaml
        └── ... (additional features)
      
      naming_convention:
        feature_folder: "FEATURE-{SYSTEM_ID}-{NUMBER}_{feature_name}"
        feature_file: "FEATURE-{SYSTEM_ID}-{NUMBER}_{feature_name}.yaml"
        layer_folder: "LAYER-{SYSTEM_ID}-{FEATURE_NUM}-{LAYER_NUM}_{layer_name}"
        layer_file: "LAYER-{SYSTEM_ID}-{FEATURE_NUM}-{LAYER_NUM}_{layer_name}.yaml"
      
      example_paths:
        - "SYSTEM-CA-006_feedback_iteration/FEATURE-CA-006-01_analytics_integration/FEATURE-CA-006-01_analytics_integration.yaml"
        - "SYSTEM-CA-006_feedback_iteration/FEATURE-CA-006-01_analytics_integration/LAYER-CA-006-01-01_google_analytics_client/LAYER-CA-006-01-01_google_analytics_client.yaml"
    
    source_backend:
      base_path: "src/feedback_iteration/backend"
      description: "FastAPI backend implementation"
      entry_point: "app/main.py"
      structure:
        app:
          - "__init__.py"
          - "main.py          # FastAPI app instance, lifespan, routers"
          - "config.py        # Pydantic Settings for environment configuration"
          - "api/             # API route handlers"
          - "services/        # Business logic (analytics clients, prioritization)"
          - "models/          # Pydantic models for request/response/database"
          - "db/              # Database connections, migrations, repositories"
        root_files:
          - "requirements.txt # Python dependencies"
          - "Dockerfile.dev   # Development container"
          - ".env.example     # Environment variable template"
      
    source_frontend:
      base_path: "src/feedback_iteration/frontend"
      description: "React + Vite + TypeScript frontend"
      entry_point: "src/main.tsx"
      structure:
        src:
          - "main.tsx         # React entry point"
          - "App.tsx          # Root component with routing"
          - "config.ts        # Frontend configuration"
          - "components/      # React components (Dashboard, Metrics, Charts)"
          - "services/        # API client, WebSocket for real-time updates"
          - "stores/          # Zustand state management"
          - "types/           # TypeScript type definitions"
        root_files:
          - "package.json     # NPM dependencies"
          - "vite.config.ts   # Vite build configuration"
          - "tsconfig.json    # TypeScript configuration"
          - "Dockerfile.dev   # Development container"
          - ".env.example     # Environment variable template"
    
    configuration:
      base_path: "src/feedback_iteration"
      description: "Deployment and development configuration"
      files:
        - "railway.json           # Railway deployment configuration"
        - "docker-compose.dev.yml # Local development environment"
        - "README.md              # How to run CA-006 locally and deploy"
        - ".gitignore             # Git ignore patterns"
    
    tests:
      base_path: "tests/feedback_iteration"
      description: "Test files mirroring source structure"
      structure:
        backend:
          - "test_analytics.py        # Analytics integration tests"
          - "test_metrics.py          # Metrics collection tests"
          - "test_prioritization.py   # Prioritization engine tests"
          - "test_integration.py      # End-to-end integration tests"
        frontend:
          - "Dashboard.test.tsx       # Dashboard component tests"
          - "MetricsCard.test.tsx     # Metrics card tests"
          - "api.test.ts              # API client tests"
    
    documentation:
      base_path: "SYSTEM-CA-006_feedback_iteration/docs"
      description: "System-specific documentation"
      files:
        - "architecture.md     # System architecture and design decisions"
        - "api-design.md       # API endpoint specifications"
        - "deployment-guide.md # Railway deployment instructions"
        - "analytics-setup.md  # Analytics provider configuration"
  
  file_naming_conventions:
    python_modules: "lowercase_with_underscores.py"
    python_classes: "PascalCase"
    python_functions: "snake_case"
    typescript_files: "PascalCase.tsx or camelCase.ts"
    react_components: "PascalCase.tsx"
    test_files: "test_*.py or *.test.tsx"
    yaml_files: "FEATURE-CA-006-XX.yaml or LAYER-CA-006-XX-YY.yaml"
  
  technology_stack:
    backend:
      language: "Python 3.11+"
      framework: "FastAPI 0.104+"
      validation: "Pydantic 2.0+"
      database_orm: "SQLAlchemy 2.0+"
      migrations: "Alembic"
      testing: "pytest, pytest-asyncio"
      linting: "ruff, black, mypy"
    
    frontend:
      language: "TypeScript 5.0+"
      framework: "React 18+"
      build_tool: "Vite 5+"
      styling: "TailwindCSS 3+"
      state_management: "Zustand"
      charts: "Recharts"
      testing: "Vitest, React Testing Library"
      linting: "ESLint, Prettier"
    
    infrastructure:
      deployment: "Railway"
      database: "PostgreSQL 15+ (Railway)"
      cache: "Redis (Railway)"
      analytics: "Google Analytics, Mixpanel, Amplitude"
  
  configuration_management:
    approach: "Environment-based configuration via Pydantic Settings"
    no_main_py: true
    explanation: |
      DO NOT create a main.py at repository root. Each service has its own entry point:
      - Backend: uvicorn app.main:app (defined in railway.json)
      - Frontend: npm run dev or npm run preview (defined in package.json)
      
      Configuration is loaded from environment variables using Pydantic Settings:
      - Development: .env files with docker-compose.dev.yml
      - Production: Railway environment variables
      
      This prevents version confusion and ensures dev/prod parity.
    
    environment_files:
      backend_env_example: |
        # Backend .env.example
        ENVIRONMENT=development
        LOG_LEVEL=debug
        DATABASE_URL=postgresql://user:pass@postgres:5432/ca006
        REDIS_URL=redis://redis:6379
        GOOGLE_ANALYTICS_ID=UA-XXXXXXXXX-X
        MIXPANEL_TOKEN=your_mixpanel_token
        AMPLITUDE_API_KEY=your_amplitude_key
        CORS_ORIGINS=["http://localhost:5173"]
      
      frontend_env_example: |
        # Frontend .env.example
        VITE_API_URL=http://localhost:8000
        VITE_WS_URL=ws://localhost:8000/ws
        VITE_ENVIRONMENT=development

system_requirements:
  performance_phase_1:
    metric_collection_latency: "<5 minutes"
    dashboard_refresh_rate: "Real-time (<1 minute)"
    prioritization_calculation: "<2 minutes per cycle"
    archive_processing_time: "<10 minutes"
  
  data_collection:
    metrics_per_mvp: "10+ key metrics (DAU, conversions, revenue, retention)"
    data_retention: "Indefinite for active MVPs, 90 days for archived"
    analytics_providers: "Google Analytics (free) + Mixpanel/Amplitude (free tier)"
  
  decision_accuracy:
    iteration_priority_precision: ">85%"
    false_archive_rate: "<5% (archiving a potential winner)"
    false_iteration_rate: "<10% (iterating on a loser)"

features:
  - feature_id: FEATURE-CA-006-01
    feature_name: Multi-Source Analytics Integration
    description: |
      Integrates with analytics providers (Google Analytics, Mixpanel, etc.)
      to collect engagement, traffic, and conversion metrics
    estimated_layers: 4-5
    priority: critical
    
  - feature_id: FEATURE-CA-006-02
    feature_name: Real-Time Engagement Tracking
    description: |
      Real-time tracking of user engagement, session duration, page views,
      bounce rates, and custom events across all MVPs
    estimated_layers: 5-6
    priority: critical
    
  - feature_id: FEATURE-CA-006-03
    feature_name: Revenue & Conversion Tracking
    description: |
      Tracks financial metrics including revenue, conversions, average order
      value, customer acquisition cost, and lifetime value
    estimated_layers: 4-5
    priority: critical
    
  - feature_id: FEATURE-CA-006-04
    feature_name: Automated Prioritization Engine
    description: |
      Scores MVPs based on engagement, revenue, growth rate, and potential,
      automatically moving high-performers to iteration pipeline
    estimated_layers: 4-5
    priority: critical
    
  - feature_id: FEATURE-CA-006-05
    feature_name: Archive & Cleanup Automation
    description: |
      Automatically archives non-performing MVPs after evaluation period,
      preserving data and shutting down infrastructure
    estimated_layers: 3-4
    priority: high
    
  - feature_id: FEATURE-CA-006-06
    feature_name: Dashboard User Interface
    description: |
      Modern React-based dashboard interface providing real-time visibility into all deployed MVPs.
      Displays portfolio-level metrics, individual MVP analytics, prioritization scores, and
      archive candidates with interactive charts and tables. Built with React 18, TypeScript,
      TailwindCSS, and Recharts for production-grade user experience with <30 second data refresh.
    estimated_layers: 5
    priority: critical
    technologies:
      - "React 18 + TypeScript 5"
      - "Vite 5 (build tool)"
      - "TailwindCSS 3 (styling)"
      - "Zustand (state management)"
      - "Recharts (charts)"
      - "TanStack Table (data tables)"
      - "WebSocket API (real-time updates)"
    
  - feature_id: FEATURE-CA-006-07
    feature_name: Admin Configuration UI
    status: placeholder
    description: |
      PLACEHOLDER: Administrative interface for configuring system settings including analytics
      providers (Google Analytics, Mixpanel), prioritization rules (scoring weights, thresholds),
      and archive policies (retention, approval workflows). This is a FUTURE ENHANCEMENT to be
      implemented after FEATURE-06 (Dashboard UI) is deployed and validated with users.
    estimated_layers: 4
    priority: low
    implementation_priority: "After FEATURE-06 deployment"
    technologies:
      - "React 18 + TypeScript 5 (same as FEATURE-06)"
      - "React Hook Form + Zod (form handling)"
      - "TanStack Table (config lists)"
    notes:
      - "Requires backend configuration management API (CRUD operations)"
      - "Requires role-based access control (admin role)"
      - "Requires audit logging for configuration changes"
      - "Admin routes already defined in FEATURE-06 LAYER-01 (/settings, /settings/analytics, etc.)"

