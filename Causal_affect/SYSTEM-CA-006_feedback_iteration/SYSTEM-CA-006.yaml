    - "Total users across all MVPs"
  
  performance_grid:
    - "All MVPs in grid layout"
    - "Key metrics per MVP (DAU, revenue, growth)"
    - "Color-coded status (green/yellow/red)"
    - "Click through to detailed view"
  
  top_performers:
    - "Top 10 MVPs by engagement"
    - "Top 10 MVPs by revenue"
    - "Top 10 MVPs by growth rate"
    - "Recent winners (entered iteration pipeline)"
  
  at_risk:
    - "MVPs approaching archive threshold"
    - "MVPs with declining metrics"
    - "MVPs with high costs, low revenue"
  
  trends:
    - "Portfolio growth over time"
    - "Success rate (% MVPs in iteration pipeline)"
    - "Average time to iteration decision"
    - "Archive rate and reasons"

technology_stack:
  data_collection: "Segment for unified analytics pipeline"
  storage: "ClickHouse for analytics data, PostgreSQL for operational"
  processing: "Apache Kafka for real-time streaming"
  calculations: "Python with Pandas for metric calculations"
  dashboard: "React + Recharts + D3.js for visualization"
  api: "FastAPI for backend API"
  caching: "Redis for dashboard performance"

dependencies:
  internal:
    - "SYSTEM-CA-005: MVP Deployment (provides deployed MVPs to track)"
  
  external:
    - "Analytics platforms (GA4, Mixpanel, etc.)"
    - "Payment processors (Stripe)"
    - "ClickHouse or similar analytics database"
    - "Kafka for event streaming"

testing_requirements:
  philosophy: |
    ALL TESTS MUST VERIFY ACTUAL FEEDBACK COLLECTION AND ITERATION LOGIC.
    No fake metrics or stubbed analytics. Use real data pipelines. Verify decisions are data-driven.
    
    1. Tests verify actual behavior, not just interfaces
    2. Tests check side effects (metrics collected, decisions made correctly)
    3. Tests use mocks to VERIFY calls, not just STUB returns
    4. Integration tests run with REAL analytics data and REAL decision logic
    5. Manual verification confirms feedback loop drives meaningful improvements
  
  unit_tests:
    minimum_count: 40
    coverage_threshold: 0.85
    
    required_verifications:
      analytics_integration_tests:
        - "VERIFY: Analytics provider SDK initialized correctly"
        - "VERIFY: Google Analytics integration works (tracking ID configured)"
        - "VERIFY: Mixpanel integration works (project token configured)"
        - "VERIFY: Amplitude integration works (API key configured)"
        - "VERIFY: Custom events tracked correctly"
        - "VERIFY: User properties set correctly"
        - "VERIFY: Event data includes required fields (timestamp, user_id, properties)"
        - "VERIFY: Multiple providers supported simultaneously"
        - "NO MOCKING: Use real analytics SDK, verify events sent"
        - "SIDE EFFECT: Check analytics dashboard for test events"
        - "EDGE CASE: Network failure, invalid credentials, rate limits"
        
      metric_collection_tests:
        - "VERIFY: User engagement metrics calculated correctly (DAU, WAU, MAU)"
        - "VERIFY: Conversion metrics calculated correctly (signups, purchases, activations)"
        - "VERIFY: Revenue metrics calculated correctly (MRR, ARR, LTV)"
        - "VERIFY: Retention metrics calculated correctly (D1, D7, D30 retention)"
        - "VERIFY: Churn metrics calculated correctly (user churn, revenue churn)"
        - "VERIFY: Metrics aggregated correctly (per MVP, per opportunity, system-wide)"
        - "VERIFY: Metrics stored in TimescaleDB with timestamps"
        - "VERIFY: Metric queries performant (< 1 second for dashboard)"
        - "REAL DATA: Use actual event data from analytics providers"
        - "MATH CHECK: Manual metric calculation vs system calculation"
        - "EDGE CASE: Zero users, negative values, missing data"
        
      prioritization_algorithm_tests:
        - "VERIFY: Prioritization formula mathematically correct"
        - "VERIFY: Factors weighted correctly (traction, growth rate, ROI, risk)"
        - "VERIFY: High-traction MVPs prioritized over low-traction"
        - "VERIFY: Fast-growing MVPs prioritized over stagnant"
        - "VERIFY: High-ROI MVPs prioritized over low-ROI"
        - "VERIFY: Priority score range 0-100 enforced"
        - "VERIFY: Priorities recalculated regularly (every 5 minutes)"
        - "VERIFY: Priority changes trigger notifications"
        - "VERIFY: Priorities persisted in database"
        - "SIDE EFFECT: Check database for priority records"
        - "MATH CHECK: Manual priority calculation vs algorithm"
        
      archive_automation_tests:
        - "VERIFY: Archive criteria evaluated correctly"
        - "VERIFY: Low-performing MVPs identified (< threshold for 60 days)"
        - "VERIFY: Archive recommendation generated"
        - "VERIFY: Manual approval required before archiving"
        - "VERIFY: Archived MVPs shut down gracefully (drain connections)"
        - "VERIFY: Infrastructure destroyed (Terraform destroy)"
        - "VERIFY: Data backed up before archiving"
        - "VERIFY: Archive status recorded in database"
        - "VERIFY: Archive notifications sent"
        - "NO AUTO-ARCHIVE: Require explicit human approval"
        - "SIDE EFFECT: Check archived MVPs inaccessible"
        - "EDGE CASE: Prevent accidental archive of successful MVPs"
        
      dashboard_rendering_tests:
        - "VERIFY: Dashboard data API returns correct metrics"
        - "VERIFY: Portfolio view shows all active MVPs"
        - "VERIFY: Individual MVP view shows detailed metrics"
        - "VERIFY: Opportunity pipeline view shows assessment status"
        - "VERIFY: Charts render correctly (time-series, bar, pie)"
        - "VERIFY: Filters work (by status, by priority, by date range)"
        - "VERIFY: Search works (by name, by opportunity type)"
        - "VERIFY: Real-time updates work (WebSocket or polling)"
        - "VERIFY: Dashboard loads within 2 seconds"
        - "NO FAKE DATA: Use actual metrics from database"
        - "VISUAL CHECK: Screenshot, verify layout correct"
  
  integration_tests:
    minimum_count: 25
    coverage_threshold: 0.80
    
    required_scenarios:
      end_to_end_feedback_loop:
        description: "Complete feedback cycle from MVP to iteration decision"
        requirements:
          - "SETUP: Deploy MVP with analytics integration"
          - "INJECT: Simulate user activity (page views, events, conversions)"
          - "VERIFY: Analytics events sent to providers"
          - "VERIFY: Events ingested into TimescaleDB (query to confirm)"
          - "VERIFY: Metrics calculated correctly (DAU, conversions, revenue)"
          - "VERIFY: Priority score updated based on metrics"
          - "VERIFY: Dashboard shows updated metrics"
          - "VERIFY: Iteration recommendations generated"
          - "VERIFY: Complete cycle within 5-minute latency"
          - "NO MOCKING: Real analytics providers, real data pipeline"
          - "MANUAL: Check analytics dashboard, verify events present"
        
      real_time_metric_collection:
        description: "Metrics collected and displayed with < 5-minute latency"
        requirements:
          - "DEPLOY: MVP with analytics integration"
          - "GENERATE: User events (clicks, conversions, etc.)"
          - "MEASURE: Time from event to dashboard display"
          - "VERIFY: Latency < 5 minutes (measured)"
          - "VERIFY: No events dropped or lost"
          - "VERIFY: Event ordering preserved"
          - "VERIFY: Metrics accurate (match analytics provider)"
          - "REAL-TIME: Use actual event streaming, not batch"
          - "LOAD TEST: Generate high event volume, verify no degradation"
        
      prioritization_calculation:
        description: "MVP priorities calculated correctly based on real metrics"
        requirements:
          - "SETUP: 5+ MVPs with different performance profiles"
          - "MVP-1: High traction, fast growth (should be #1 priority)"
          - "MVP-2: Medium traction, slow growth (should be medium priority)"
          - "MVP-3: Low traction, declining (should be low priority, archive candidate)"
          - "MVP-4: New MVP, no data yet (should be medium priority, give time)"
          - "MVP-5: High traction, negative ROI (should be deprioritized, investigate)"
          - "VERIFY: Priorities calculated correctly for each"
          - "VERIFY: Priority ranking matches expected order"
          - "VERIFY: Priorities update as metrics change"
          - "REAL DATA: Use actual metrics, not hardcoded values"
          - "MANUAL: Review priorities, verify they make business sense"
        
      archive_automation_workflow:
        description: "Low-performing MVPs identified and archived correctly"
        requirements:
          - "SETUP: MVP with consistently low metrics (< threshold for 60 days)"
          - "VERIFY: Archive recommendation generated"
          - "VERIFY: Notification sent to operator"
          - "VERIFY: Manual approval recorded"
          - "TRIGGER: Archive workflow"
          - "VERIFY: MVP shut down gracefully (no dropped requests)"
          - "VERIFY: Infrastructure destroyed (Terraform destroy)"
          - "VERIFY: Data backed up to S3"
          - "VERIFY: Archive status recorded in database"
          - "VERIFY: MVP no longer accessible"
          - "REAL ARCHIVE: Actual shutdown and cleanup, verify resources gone"
          - "MANUAL: Attempt to access archived MVP, verify 404 or offline"
        
      dashboard_real_time_updates:
        description: "Dashboard shows real-time metrics and updates"
        requirements:
          - "OPEN: Dashboard in browser"
          - "GENERATE: New events for one MVP"
          - "VERIFY: Dashboard metrics update within 5 minutes"
          - "VERIFY: Charts reflect new data"
          - "VERIFY: Priority changes reflected"
          - "VERIFY: Notifications appear for significant changes"
          - "VERIFY: No page refresh required (WebSocket or auto-refresh)"
          - "REAL DASHBOARD: Actual frontend, verify in browser"
          - "MANUAL: Watch dashboard update in real-time"
  
  real_time_tests:
    required: true
    
    scenarios:
      latency_verification:
        target: "5-minute latency from event to dashboard"
        verification:
          - "GENERATE: Test event in MVP"
          - "RECORD: Event timestamp"
          - "WAIT: Monitor dashboard for update"
          - "RECORD: Dashboard update timestamp"
          - "CALCULATE: Latency = update time - event time"
          - "VERIFY: Latency < 5 minutes"
          - "PROFILE: Identify bottlenecks (analytics API, ingestion, aggregation, query)"
        
      dashboard_update_speed:
        target: "Real-time dashboard updates"
        verification:
          - "OPEN: Dashboard in browser"
          - "INJECT: High-frequency events"
          - "VERIFY: Dashboard updates continuously"
          - "VERIFY: No UI freezing or lag"
          - "VERIFY: Update frequency reasonable (not too fast to read)"
          - "MEASURE: Update latency, target < 5 seconds"
        
      prioritization_calculation_speed:
        target: "Priority recalculation every 5 minutes"
        verification:
          - "SCHEDULE: Priority calculation task"
          - "VERIFY: Task runs every 5 minutes (measured)"
          - "VERIFY: Calculation completes before next run"
          - "VERIFY: No backlog or queue buildup"
          - "MEASURE: Calculation time, target < 1 minute"
  
  performance_tests:
    required: true
    
    scenarios:
      high_volume_event_ingestion:
        description: "Handle high event volume from multiple MVPs"
        verification:
          - "GENERATE: 10000+ events/minute across 10 MVPs"
          - "VERIFY: All events ingested successfully"
          - "VERIFY: No events dropped or lost"
          - "VERIFY: Ingestion latency remains < 5 minutes"
          - "VERIFY: Database performance acceptable (no slowdown)"
          - "MEASURE: Throughput, latency, resource usage"
        
      dashboard_load_time:
        description: "Dashboard loads quickly with many MVPs"
        verification:
          - "SETUP: 50+ MVPs with metrics"
          - "LOAD: Dashboard portfolio view"
          - "MEASURE: Time to interactive"
          - "VERIFY: Load time < 2 seconds"
          - "VERIFY: UI responsive (no lag)"
          - "OPTIMIZE: Query optimization, caching, pagination"
        
      concurrent_dashboard_users:
        description: "Multiple users access dashboard simultaneously"
        verification:
          - "SPAWN: 20 concurrent dashboard sessions"
          - "VERIFY: All sessions load successfully"
          - "VERIFY: No significant slowdown vs single user"
          - "VERIFY: Real-time updates work for all users"
          - "MEASURE: Per-user latency, server resource usage"
  
  manual_verification:
    required: true
    description: "Human verification that feedback loop drives meaningful improvements"
    
    checklist:
      - "START: Deploy MVP with real analytics integration"
      - "GENERATE: Actual user activity (or simulate realistically)"
      - "CHECK: Analytics provider dashboard shows events"
      - "WAIT: 5 minutes for metrics to propagate"
      - "VERIFY: Causal Affect dashboard shows updated metrics"
      - "CHECK: Metrics match analytics provider (spot-check)"
      - "VERIFY: Priority score makes business sense"
      - "TEST: Low-performing MVP shows archive recommendation"
      - "VERIFY: Dashboard charts render correctly"
      - "TEST: Filter and search work"
      - "VERIFY: Real-time updates work (generate event, watch dashboard)"
      - "MEASURE: Event-to-dashboard latency with stopwatch"
      - "TEST: Archive workflow (simulate approval, verify shutdown)"
      - "VERIFY: Archived MVP inaccessible"
      - "DOCUMENT: Screenshot evidence of working feedback loop"

estimated_effort:
  total_days: 7
  team_size: 2 developers

implementation_phases:
  phase_1:
    duration: 2 days
    deliverable: "Analytics integration with major providers"
  
  phase_2:
    duration: 2 days
    deliverable: "Real-time metric collection pipeline"
  
  phase_3:
    duration: 2 days
    deliverable: "Prioritization engine and archive automation"
  
  phase_4:
    duration: 1 day
    deliverable: "Portfolio dashboard with key views"

risks:
  - risk: "Analytics provider API limits may constrain data collection"
    mitigation: "Use Segment as intermediary, batch API calls"
    severity: medium
  
  - risk: "False archives may eliminate potential winners"
    mitigation: "Conservative thresholds, manual override, long evaluation"
    severity: medium
  
  - risk: "Dashboard may become overwhelming with many MVPs"
    mitigation: "Filtering, search, grouping, summary views"
    severity: low
