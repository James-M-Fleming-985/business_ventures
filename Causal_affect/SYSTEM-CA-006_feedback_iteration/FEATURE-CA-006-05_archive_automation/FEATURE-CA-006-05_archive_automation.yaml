# FEATURE-CA-006-05: Archive & Cleanup Automation
# ================================================

metadata:
  requirement_id: FEATURE-CA-006-05
  requirement_name: Archive & Cleanup Automation
  requirement_type: Feature
  parent_system: SYSTEM-CA-006
  parent_project: business_ventures

  team_size: small
  risk_level: high

  estimated_effort_hours: 60
  actual_effort_hours: 0
  progress_percentage: 0
  status: planned

traceability:
  parent_system_id: SYSTEM-CA-006
  parent_requirement: "Automatically archives non-performing MVPs, preserving data and shutting down infrastructure"
  contributes_to_acceptance_criteria:
    - AC-SYS-006-04 # Automated archiving triggers after evaluation period
    - AC-SYS-006-05 # False archive rate below 5%
  contributes_to_business_value:
    - "Eliminates wasted resources on non-performers"
    - "Enables portfolio-level optimization"

description: |
  Automated workflow system for archiving and cleaning up non-performing MVPs.
  Safely shuts down infrastructure, preserves historical data for analysis,
  and manages the complete lifecycle of MVP retirement.

  Implements multi-stage archive workflow with safety checks, manual approval
  gates, and rollback capabilities. Ensures complete data preservation while
  minimizing ongoing costs for non-viable MVPs.

  Provides archive analytics to prevent false positives and continuously
  improve archive decision criteria based on historical outcomes.

business_value: |
  - Cost reduction through infrastructure cleanup
  - Resource reallocation to high-performers
  - Portfolio health through elimination of dead weight
  - Learning from failures through preserved data
  - Reduced operational overhead

acceptance_criteria:
  - criterion_id: AC-FEAT-006-05-01
    criterion: "Trigger archive workflow for MVPs meeting archive criteria"
    verification: "Archive trigger logic test"
    priority: critical
    test_type: "integration"
    traces_to: AC-SYS-006-04

  - criterion_id: AC-FEAT-006-05-02
    criterion: "Preserve all historical data before infrastructure shutdown"
    verification: "Data preservation verification test"
    priority: critical
    test_type: "integration"
    traces_to: AC-SYS-006-04

  - criterion_id: AC-FEAT-006-05-03
    criterion: "Shut down Railway services cleanly without data loss"
    verification: "Infrastructure shutdown test"
    priority: critical
    test_type: "integration"
    traces_to: AC-SYS-006-04

  - criterion_id: AC-FEAT-006-05-04
    criterion: "Support manual approval before final archive"
    verification: "Approval workflow test"
    priority: high
    test_type: "integration"
    traces_to: AC-SYS-006-05

  - criterion_id: AC-FEAT-006-05-05
    criterion: "Provide rollback capability within 7 days of archive"
    verification: "Archive rollback test"
    priority: high
    test_type: "integration"
    traces_to: AC-SYS-006-05

  - criterion_id: AC-FEAT-006-05-06
    criterion: "Send notification to system operator before archiving"
    verification: "Notification delivery test"
    priority: medium
    test_type: "integration"
    traces_to: AC-SYS-006-04

  - criterion_id: AC-FEAT-006-05-07
    criterion: "Complete archive workflow in <10 minutes"
    verification: "Archive workflow timing test"
    priority: medium
    test_type: "performance"
    traces_to: AC-SYS-006-04

technical_requirements:
  workflow_stages:
    stage_1_identification:
      - "Receive archive trigger from prioritization engine"
      - "Validate MVP meets all archive criteria"
      - "Check for recent positive signals (safety check)"
      - "Log archive nomination with reasoning"

    stage_2_notification:
      - "Send notification to system operator"
      - "Generate archive recommendation report"
      - "Include 30-day performance summary"
      - "Provide option for manual review/override"

    stage_3_approval:
      - "Wait for approval (auto-approve after 7 days if configured)"
      - "Support manual approval/rejection"
      - "Log approval decision and approver"
      - "Cancel workflow if rejected"

    stage_4_data_preservation:
      - "Export all MVP data to long-term storage"
      - "Create archive snapshot with metadata"
      - "Verify data integrity of export"
      - "Generate data inventory manifest"

    stage_5_infrastructure_cleanup:
      - "Gracefully shutdown Railway services"
      - "Delete Railway deployments"
      - "Remove domain routing"
      - "Clean up database connections"
      - "Cancel scheduled jobs"

    stage_6_finalization:
      - "Mark MVP as archived in system"
      - "Update portfolio metrics"
      - "Send completion notification"
      - "Create restoration checklist for rollback"

  data_preservation:
    storage_location: "AWS S3 or Railway Volume"
    retention_period: "indefinite (cold storage)"
    data_included:
      - "Complete analytics history"
      - "Revenue and conversion data"
      - "User feedback and comments"
      - "Source code snapshot"
      - "Configuration and secrets (encrypted)"
      - "Infrastructure as code"

    manifest_contents:
      - "MVP metadata (ID, name, created date)"
      - "Archive date and reason"
      - "Final performance metrics"
      - "Data file inventory"
      - "Restoration instructions"

  rollback_capability:
    rollback_window: "7 days from archive completion"
    rollback_process:
      - "Restore data from archive storage"
      - "Redeploy infrastructure on Railway"
      - "Restore domain routing"
      - "Restart analytics collection"
      - "Mark MVP as active"
    rollback_sla: "<30 minutes to full restoration"

testing_requirements:
  unit_tests:
    required: true
    minimum_count: 30
    coverage_threshold: 90
    focus_areas:
      - "Workflow stage transitions"
      - "Approval logic (manual and auto-approve)"
      - "Data export completeness validation"
      - "Infrastructure cleanup logic"
      - "Rollback restoration logic"
      - "Notification generation"

  integration_tests:
    required: true
    minimum_count: 15
    coverage_threshold: 85
    focus_areas:
      - "End-to-end archive workflow (6 stages)"
      - "Data preservation and integrity verification"
      - "Railway service shutdown and cleanup"
      - "Rollback from archive (7-day window)"
      - "Notification delivery (email, Slack)"
      - "Concurrent archive operations (safety)"

  e2e_tests:
    required: true
    minimum_count: 5
    focus_areas:
      - "Complete archive workflow with manual approval"
      - "Auto-approve workflow for low-risk archives"
      - "False positive prevention test (recent growth ignored)"
      - "Data loss prevention (verify before delete)"
      - "Rollback workflow from archive to active (<30 min SLA)"

quality_gates:
  no_mocks_unless_specified: false
  mock_policy: "Railway API, AWS S3, email/Slack can be mocked. Workflow orchestration, data integrity checks, and rollback logic must use real implementations. CRITICAL: Dry-run mode required for testing to prevent accidental deletion."
  real_failing_tests_required: true
  tdd_cycle_enforcement: true
  safety_critical: true

layers:
  - layer_id: LAYER-CA-006-05-01
    name: Archive Workflow Orchestrator
    description: "Multi-stage workflow management (6 stages: review, approval, notification, export, cleanup, finalization) with approval gates (manual or auto-approve). Supports rollback within 7-day window."
    priority: critical
    estimated_hours: 20
    requirement_file: "LAYER-CA-006-05-01_archive_workflow_orchestrator.yaml"

  - layer_id: LAYER-CA-006-05-02
    name: Infrastructure Cleanup Service
    description: "Railway service shutdown and resource cleanup. Gracefully stops services, deletes deployments, removes domain routing, cleans database connections, cancels scheduled jobs."
    priority: high
    estimated_hours: 16
    requirement_file: "LAYER-CA-006-05-02_infrastructure_cleanup_service.yaml"

  - layer_id: LAYER-CA-006-05-03
    name: Data Preservation Service
    description: "Data export to AWS S3, archival with encryption, integrity verification. Preserves analytics, revenue data, user feedback, source code, configs (encrypted). Generates manifest with restoration instructions."
    priority: critical
    estimated_hours: 18
    requirement_file: "LAYER-CA-006-05-03_data_preservation_service.yaml"

  - layer_id: LAYER-CA-006-05-04
    name: Notification Service
    description: "Multi-channel notifications for archive events (email, Slack). Sends archive review, approval request, completion confirmation. Includes rollback instructions in notifications."
    priority: medium
    estimated_hours: 6
    requirement_file: "LAYER-CA-006-05-04_notification_service.yaml"

implementation_notes:
  directory_structure: |
    features/FEATURE-CA-006-05_archive_automation/
    ├── __init__.py
    ├── services/
    │   ├── __init__.py
    │   ├── workflow_orchestrator.py
    │   ├── infrastructure_cleanup.py
    │   ├── data_preservation.py
    │   └── notification_service.py
    ├── models/
    │   ├── __init__.py
    │   ├── archive_workflow.py
    │   ├── archive_decision.py
    │   └── archive_metadata.py
    ├── db/
    │   ├── __init__.py
    │   ├── schema.py
    │   └── repositories.py
    └── tests/
        ├── __init__.py
        ├── test_workflow_orchestrator.py
        ├── test_infrastructure_cleanup.py
        ├── test_data_preservation.py
        └── test_notification_service.py
  
  design_decisions:
    - "Implement idempotent workflow steps (safe to retry, no side effects)"
    - "Use database transactions for state changes (atomic operations)"
    - "Comprehensive logging at each workflow stage for audit trail"
    - "Exponential backoff for retries (1s, 2s, 4s, 8s, 16s)"
    - "Support dry-run mode for testing (simulates without deletion)"
    - "Create detailed restoration documentation in manifest"
    - "Implement archive analytics for false positive tracking (monitor <5% false rate)"
    - "Add safety checks before irreversible operations (require confirmation)"
    - "Support bulk archive operations for efficiency (batch low-performers)"
    - "Implement archive cost tracking and reporting (AWS S3 storage costs)"

  code_structure:
    # Services Layer
    - "services/workflow_orchestrator.py:
        - ArchiveWorkflowOrchestrator: Multi-stage workflow state machine
        - Methods: start_workflow(), advance_stage(), approve_archive(), rollback_archive()
        - Stages: review → approval → notification → export → cleanup → finalization"
    
    - "services/infrastructure_cleanup.py:
        - InfrastructureCleanup: Railway service shutdown and resource cleanup
        - Methods: shutdown_service(), remove_domain(), cleanup_database(), cancel_jobs()
        - Safety: dry_run_mode(), verify_before_delete(), create_restore_snapshot()"
    
    - "services/data_preservation.py:
        - DataPreservationService: S3 export with encryption and integrity checks
        - Methods: export_to_s3(), encrypt_data(), verify_integrity(), generate_manifest()
        - Exports: analytics_data, revenue_data, source_code, configs, user_feedback"
    
    - "services/notification_service.py:
        - NotificationService: Multi-channel notifications (email, Slack)
        - Methods: send_archive_review(), send_approval_request(), send_completion_notice()
        - Templates: archive_review_email, approval_request_slack, rollback_instructions"
    
    # Models Layer
    - "models/archive_workflow.py:
        - ArchiveWorkflow (Pydantic): workflow_id, mvp_id, current_stage, status, timestamps
        - WorkflowStage (Enum): REVIEW, APPROVAL, NOTIFICATION, EXPORT, CLEANUP, FINALIZED
        - WorkflowStatus (Enum): PENDING, IN_PROGRESS, APPROVED, REJECTED, COMPLETED, ROLLED_BACK"
    
    - "models/archive_decision.py:
        - ArchiveDecision (Pydantic): decision_id, mvp_id, reason, approval_type, approver
        - ApprovalType (Enum): AUTO_APPROVED, MANUAL_APPROVED, REJECTED
        - ArchiveReason (Pydantic): score_threshold, consecutive_days, manual_override"
    
    - "models/archive_metadata.py:
        - ArchiveMetadata (Pydantic): archive_id, mvp_id, archive_date, s3_location, manifest
        - ArchiveManifest (Pydantic): data_files, checksums, restoration_instructions
        - RollbackData (Pydantic): original_state, rollback_deadline, restore_procedure"
    
    # Database Layer
    - "db/schema.py:
        - ArchiveWorkflowORM (SQLAlchemy): Workflow state and history
        - ArchiveMetadataORM (SQLAlchemy): Archive storage and rollback data
        - ArchiveAuditLogORM (SQLAlchemy): Complete audit trail
        - Indexes: mvp_id, workflow_status, archive_date for query optimization"
    
    - "db/repositories.py:
        - ArchiveRepository: Async CRUD for archive workflows
        - Methods: create_workflow(), update_stage(), get_rollback_candidates()
        - AuditRepository: Archive decision tracking
        - Methods: log_decision(), get_archive_history(), track_false_positives()"
    
    # Tests Layer
    - "tests/test_workflow_orchestrator.py:
        - test_workflow_stages(): Verify 6-stage progression
        - test_approval_gates(): Verify manual and auto-approve logic
        - test_rollback_workflow(): Verify 7-day rollback window
        - test_idempotency(): Verify safe retry behavior
        - test_dry_run_mode(): Verify simulation without deletion"
    
    - "tests/test_infrastructure_cleanup.py:
        - test_railway_shutdown(): Verify service shutdown
        - test_resource_cleanup(): Verify complete deallocation
        - test_safety_checks(): Verify confirmation requirements
        - test_restore_snapshot(): Verify backup before delete"
    
    - "tests/test_data_preservation.py:
        - test_s3_export(): Verify data export to S3
        - test_encryption(): Verify data encryption
        - test_integrity_verification(): Verify checksum validation
        - test_manifest_generation(): Verify restoration docs
        - test_data_completeness(): Verify 100% data capture"
    
    - "tests/test_notification_service.py:
        - test_email_notifications(): Verify SendGrid delivery
        - test_slack_notifications(): Verify Slack webhook
        - test_notification_timing(): Verify <2 min delivery
        - test_rollback_instructions(): Verify clear guidance"

dependencies:
  external_libraries:
    - "celery: Workflow orchestration and async task execution"
    - "railway-python: Railway API for service management"
    - "boto3: AWS S3 for archive storage"
    - "sendgrid: Email notifications"
    - "slack-sdk: Slack notifications"
    - "sqlalchemy: Archive metadata persistence"
    - "pydantic: Workflow validation and state management"

  configuration:
    - "Railway API key for infrastructure cleanup"
    - "AWS S3 bucket for archive storage (with encryption)"
    - "SendGrid API key for email notifications"
    - "Slack webhook URL for team notifications"
    - "PostgreSQL connection for archive metadata"
    - "Approval settings: auto-approve threshold (score <5), manual threshold (score 5-15)"
    - "Rollback window: 7 days"

success_criteria:
  - "Archive workflow completes in <10 minutes (6 stages)"
  - "Data preservation: 100% completeness, verified integrity checks"
  - "Rollback capability: <30 minutes from archive to active (7-day window)"
  - "False archive rate: <5% (no healthy MVPs archived)"
  - "Infrastructure cleanup: 100% resource deallocation (no orphaned services)"
  - "Notifications: delivered within 2 minutes of stage transitions"
  - "Dry-run mode: simulates archive without deletion (safety testing)"
  - "Archive analytics: tracks false positive rate, avg workflow time, rollback frequency"
