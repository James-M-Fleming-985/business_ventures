technical_requirements:
  performance:
    calculation_frequency: "every 5 minutes"
    calculation_time: "<2 minutes for 100 MVPs"
    score_staleness: "<10 minutes maximum"
    
  scoring_algorithm:
    dimensions:
      engagement_score:
        weight: 0.30
        components:
          - "DAU growth rate (30d)"
          - "Session duration trend"
          - "Bounce rate (inverse)"
          - "Retention rate (7d, 30d)"
        
      revenue_score:
        weight: 0.35
        components:
          - "Revenue growth rate (30d)"
          - "LTV:CAC ratio"
          - "Conversion rate"
          - "Revenue per user"
        
      growth_score:
        weight: 0.25
        components:
          - "User growth rate (7d, 30d)"
          - "Revenue growth acceleration"
          - "Viral coefficient"
          - "Market expansion signals"
        
      potential_score:
        weight: 0.10
        components:
          - "Market size estimate"
          - "Competitive position"
          - "Technical scalability"
          - "Resource requirements"
    
    normalization:
      method: "z-score normalization per dimension"
      outlier_handling: "winsorization at 95th percentile"
    
    thresholds:
      high_priority: ">75th percentile (top 25%)"
      medium_priority: "25th-75th percentile"
      low_priority: "<25th percentile (bottom 25%)"
      archive_candidate: "<10th percentile + no growth for 30d"
  
  decision_rules:
    iteration_priority:
      - "Score >80 → immediate iteration candidate"
      - "Score 60-80 + positive trend → watch list"
      - "Score 40-60 + stable → maintenance mode"
      - "Score 20-40 + negative trend → archive candidate"
      - "Score <20 → archive recommendation"
    
    archive_triggers:
      - "Score <10 for 14+ consecutive days"
      - "Zero revenue for 30+ days AND low engagement"
      - "Negative growth for 60+ days"
      - "Manual override from system operator"

layer_breakdown:
  estimated_layers: 5
  
  layers:
    - layer_id: LAYER-CA-006-04-01
      layer_name: Scoring Algorithm Engine
      description: "Multi-dimensional score calculation with configurable weights"
      estimated_complexity: high
      
    - layer_id: LAYER-CA-006-04-02
      layer_name: Ranking System
      description: "MVP ranking with percentile calculations and trending"
      estimated_complexity: medium
      
    - layer_id: LAYER-CA-006-04-03
      layer_name: Threshold Manager
      description: "Configurable threshold management and rule evaluation"
      estimated_complexity: medium
      
    - layer_id: LAYER-CA-006-04-04
      layer_name: Decision Engine
      description: "Priority assignment and workflow trigger logic"
      estimated_complexity: high
      
    - layer_id: LAYER-CA-006-04-05
      layer_name: Explainability Module
      description: "Score breakdown generation and explanation interface"
      estimated_complexity: medium

dependencies:
