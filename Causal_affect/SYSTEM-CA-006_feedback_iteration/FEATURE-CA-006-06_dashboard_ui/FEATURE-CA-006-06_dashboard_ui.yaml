    status: planned
    priority: critical
    verification_method: ui_tests
    layers: [LAYER-CA-006-06-02]
    
  - criterion_id: AC-FEAT-006-06-02
    criterion: "Top performers table shows top 25 MVPs sorted by priority score"
    status: planned
    priority: critical
    verification_method: ui_tests
    layers: [LAYER-CA-006-06-02]
    
  - criterion_id: AC-FEAT-006-06-03
    criterion: "Archive candidates table lists MVPs with score <10 and zero growth"
    status: planned
    priority: critical
    verification_method: ui_tests
    layers: [LAYER-CA-006-06-02]
    
  - criterion_id: AC-FEAT-006-06-04
    criterion: "MVP detail view displays engagement, revenue, and priority metrics"
    status: planned
