code_structure:
  api_client_ts: |
    import axios, { AxiosInstance } from 'axios'
    import { PortfolioStats, MVPSummary, MVPDetail } from '../types/api.types'
    
    class ApiClient {
      private client: AxiosInstance
      
      constructor(baseURL: string) {
        this.client = axios.create({
          baseURL,
          timeout: 30000,
        })
        
        this.client.interceptors.response.use(
          response => response,
          error => this.handleError(error)
        )
      }
      
      async getPortfolioOverview(): Promise<PortfolioStats> {
        const { data } = await this.client.get('/api/v1/portfolio/overview')
        return data
      }
      
      async getMVPDetail(id: string): Promise<MVPDetail> {
        const { data } = await this.client.get(`/api/v1/mvps/${id}`)
        return data
      }
      
      private async handleError(error: any) {
        // Retry logic and error handling
        throw error
      }
    }
    
    export default new ApiClient(import.meta.env.VITE_API_URL)
  
  use_portfolio_data_ts: |
    import { useEffect, useState } from 'react'
    import { useDataStore } from '../stores/dataStore'
    import apiClient from '../services/apiClient'
    
    export function usePortfolioData() {
      const [loading, setLoading] = useState(true)
      const [error, setError] = useState<Error | null>(null)
      const { portfolioStats, setPortfolioStats } = useDataStore()
      
      useEffect(() => {
        async function fetchData() {
          try {
            setLoading(true)
            const stats = await apiClient.getPortfolioOverview()
            setPortfolioStats(stats)
          } catch (err) {
            setError(err as Error)
          } finally {
            setLoading(false)
          }
        }
        
        fetchData()
        const interval = setInterval(fetchData, 30000) // Refresh every 30s
        return () => clearInterval(interval)
      }, [])
      
      return { stats: portfolioStats, loading, error }
    }

