# LAYER-CA-006-06-05: API Integration & Real-time Updates
# =========================================================

metadata:
  layer_id: LAYER-CA-006-06-05
  layer_name: API Integration & Real-time Updates
  parent_feature: FEATURE-CA-006-06
  parent_feature_name: Dashboard User Interface
  parent_system: SYSTEM-CA-006
  created_date: 2025-10-15
  status: planned
  priority: critical
  complexity: high

traceability:
  parent_feature_id: FEATURE-CA-006-06
  parent_system_id: SYSTEM-CA-006
  implements_acceptance_criteria:
    - AC-FEAT-006-06-08  # Real-time updates refresh dashboard data every <30 seconds
    - AC-FEAT-006-06-09  # WebSocket connection maintains live event feed with <5 second latency
    - AC-FEAT-006-06-10  # API integration handles errors gracefully with user notifications
  contributes_to_system_criteria:
    - AC-SYS-006-02  # Dashboard displays real-time data with <30 second refresh

description: |
  API client and WebSocket connection manager for frontend-backend communication.
  Provides type-safe API calls, real-time updates via WebSocket, automatic retry logic,
  error handling, and state synchronization using Zustand stores.
  
  Acts as the data layer for all dashboard components, abstracting network complexity
  and providing clean hooks for data fetching.

responsibilities:
  - "Provide API client for all backend endpoints"
  - "Manage WebSocket connections for real-time updates"
  - "Implement automatic reconnection with exponential backoff"
  - "Handle API errors and display user-friendly notifications"
  - "Provide React hooks for data fetching: usePortfolioData, useMVPDetail"
  - "Implement request caching and deduplication"
  - "Synchronize API data with Zustand stores"

components:
  ApiClient:
    type: "Service class"
    file: "src/services/apiClient.ts"
    responsibilities:
      - "Initialize Axios instance with base URL and auth headers"
      - "Implement all API methods: getPortfolioOverview(), getTopPerformers(), etc."
      - "Handle request/response interceptors for auth and error logging"
      - "Retry failed requests with exponential backoff"
      - "Type-safe responses using TypeScript generics"
    methods:
      - "getPortfolioOverview(): Promise<PortfolioStats>"
      - "getTopPerformers(limit: number): Promise<Array<MVPSummary>>"
      - "getArchiveCandidates(): Promise<Array<ArchiveCandidate>>"
      - "getPortfolioTrends(days: number): Promise<PortfolioTrends>"
      - "getMVPDetail(id: string): Promise<MVPDetail>"
      - "getMVPScoreBreakdown(id: string): Promise<ScoreBreakdown>"
      - "getMVPMetrics(id: string): Promise<{engagement, revenue}>"
      - "getMVPConversionFunnel(id: string): Promise<ConversionFunnel>"
      - "approveArchive(id: string): Promise<void>"
      - "rejectArchive(id: string): Promise<void>"
    
  WebSocketManager:
    type: "Service class"
    file: "src/services/websocketManager.ts"
    responsibilities:
      - "Establish WebSocket connection to backend"
      - "Subscribe to portfolio-level updates"
      - "Subscribe to MVP-specific event streams"
      - "Handle connection errors and automatic reconnection"
      - "Emit events to React components via custom hooks"
    methods:
      - "connect(url: string): void"
      - "disconnect(): void"
      - "subscribe(channel: string, callback: Function): void"
      - "unsubscribe(channel: string): void"
      - "reconnect(): void (with exponential backoff)"
    
  usePortfolioData:
    type: "React hook"
    file: "src/hooks/usePortfolioData.ts"
    responsibilities:
      - "Fetch portfolio stats, top performers, archive candidates, trends on mount"
      - "Subscribe to real-time updates via WebSocket"
      - "Return loading, error, and data states"
      - "Refresh data every 30 seconds"
    returns:
      - "stats: PortfolioStats | null"
      - "topPerformers: Array<MVPSummary>"
      - "archiveCandidates: Array<ArchiveCandidate>"
      - "trends: PortfolioTrends | null"
      - "loading: boolean"
      - "error: Error | null"
      - "refresh: () => void"
    
  useMVPDetail:
    type: "React hook"
    file: "src/hooks/useMVPDetail.ts"
    responsibilities:
      - "Fetch MVP detail data using mvpId parameter"
      - "Subscribe to real-time event stream for this MVP"
      - "Return loading, error, and data states"
      - "Auto-refresh metrics every 30 seconds"
    parameters:
      - "mvpId: string"
    returns:
      - "detail: MVPDetail | null"
      - "scoreBreakdown: ScoreBreakdown | null"
      - "metrics: {engagement, revenue} | null"
      - "funnel: ConversionFunnel | null"
      - "events: Array<Event>"
      - "loading: boolean"
      - "error: Error | null"
      - "refresh: () => void"
    
  useWebSocket:
    type: "React hook"
    file: "src/hooks/useWebSocket.ts"
    responsibilities:
      - "Manage WebSocket connection lifecycle"
      - "Subscribe to specific channels"
      - "Handle reconnection on connection loss"
      - "Return connection status and message handler"
    parameters:
      - "channel: string"
      - "onMessage: (data: any) => void"
    returns:
      - "connected: boolean"
      - "error: Error | null"
      - "send: (message: any) => void"

stores:
  dataStore:
    file: "src/stores/dataStore.ts"
    state:
      - "portfolioStats: PortfolioStats | null"
      - "topPerformers: Array<MVPSummary>"
      - "archiveCandidates: Array<ArchiveCandidate>"
      - "portfolioTrends: PortfolioTrends | null"
      - "mvpDetails: Map<string, MVPDetail>"
      - "lastUpdate: string (ISO timestamp)"
    actions:
      - "setPortfolioStats(stats: PortfolioStats)"
      - "setTopPerformers(mvps: Array<MVPSummary>)"
      - "setArchiveCandidates(candidates: Array<ArchiveCandidate>)"
      - "setPortfolioTrends(trends: PortfolioTrends)"
      - "setMVPDetail(id: string, detail: MVPDetail)"
