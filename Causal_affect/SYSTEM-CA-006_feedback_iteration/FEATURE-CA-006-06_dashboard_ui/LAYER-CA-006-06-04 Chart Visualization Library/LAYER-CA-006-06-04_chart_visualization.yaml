    - AC-FEAT-006-06-07  # Time-series charts display 30-day trends for DAU and revenue
    - AC-FEAT-006-06-06  # Conversion funnel visualizes 7-stage funnel with drop-off rates
  contributes_to_system_criteria:
    - AC-SYS-006-02  # Dashboard displays real-time data with <30 second refresh

description: |
  Reusable chart component library built on top of Recharts.
  Provides consistent, performant, and accessible chart components for time-series data,
  metric cards, progress bars, trend indicators, and funnel visualizations.
  
  Abstracts Recharts complexity and enforces design system consistency across all charts.

responsibilities:
  - "Provide TimeSeriesChart component for line/area charts"
  - "Provide BarChart component for comparison charts"
  - "Provide FunnelChart component for conversion funnels"
  - "Provide ProgressBar component for score visualizations"
  - "Provide TrendIndicator component for metric changes"
  - "Ensure all charts responsive and accessible"
  - "Apply consistent color scheme from design system"

components:
  TimeSeriesChart:
    type: "Chart component"
    file: "src/components/charts/TimeSeriesChart.tsx"
    responsibilities:
      - "Render line or area chart for time-series data"
      - "Support multiple data series with legend"
      - "Display tooltip on hover with formatted values"
      - "Auto-scale Y-axis based on data range"
      - "Responsive: adapt to container width"
    props:
      - "data: Array<{date: string, [key: string]: number}>"
      - "series: Array<{key: string, name: string, color: string}>"
      - "height: number (default: 300)"
      - "type: 'line' | 'area'"
      - "loading: boolean"
    
  BarChart:
    type: "Chart component"
    file: "src/components/charts/BarChart.tsx"
    responsibilities:
      - "Render vertical or horizontal bar chart"
      - "Support grouped or stacked bars"
      - "Display data labels on bars"
      - "Responsive width"
    props:
      - "data: Array<{category: string, value: number}>"
      - "orientation: 'vertical' | 'horizontal'"
      - "color: string"
      - "height: number"
      - "loading: boolean"
    
  FunnelChart:
    type: "Chart component"
    file: "src/components/charts/FunnelChart.tsx"
    responsibilities:
      - "Render horizontal funnel with stage widths proportional to values"
      - "Display conversion rates between stages"
      - "Highlight high drop-off stages with warning color"
      - "Show absolute numbers and percentages"
    props:
      - "stages: Array<{name: string, count: number, rate: number, dropOff: number}>"
      - "loading: boolean"
    
  ProgressBar:
    type: "Display component"
    file: "src/components/charts/ProgressBar.tsx"
    responsibilities:
      - "Render horizontal progress bar"
      - "Support color coding: green (>75), blue (50-75), yellow (25-50), red (<25)"
      - "Display percentage label"
      - "Animate fill on mount"
    props:
      - "value: number (0-100)"
      - "label: string"
      - "colorScheme: 'auto' | 'primary' | 'success' | 'warning' | 'danger'"
      - "height: number (default: 20)"
    
  TrendIndicator:
    type: "Display component"
    file: "src/components/charts/TrendIndicator.tsx"
    responsibilities:
      - "Display up/down arrow based on change value"
      - "Color code: green for positive, red for negative"
      - "Show percentage with + or - prefix"
      - "Support size variants: sm, md, lg"
    props:
      - "change: number (percentage)"
      - "size: 'sm' | 'md' | 'lg'"
      - "showZero: boolean (default: true)"
    
  MetricCard:
    type: "Display component"
    file: "src/components/charts/MetricCard.tsx"
    responsibilities:
      - "Display single metric with value, label, and trend"
      - "Support icon display"
      - "Show loading skeleton"
      - "Click handler for drill-down"
    props:
      - "label: string"
      - "value: string | number"
      - "change: number"
      - "changeLabel: string"
      - "icon: ReactNode"
      - "onClick: () => void"
      - "loading: boolean"

