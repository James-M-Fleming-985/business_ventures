      - "formatPercentage(value: number): string - Format as percentage (12.3%)"
      - "formatDuration(seconds: number): string - Format as duration (12m 34s)"
      - "formatDate(date: string): string - Format ISO date (Oct 15, 2025)"
      - "formatShortDate(date: string): string - Format short (10/15)"
  
