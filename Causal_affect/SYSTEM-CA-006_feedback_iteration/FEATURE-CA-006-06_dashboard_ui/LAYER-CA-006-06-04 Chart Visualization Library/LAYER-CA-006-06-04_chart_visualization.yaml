code_structure:
  time_series_chart_tsx: |
    import { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } from 'recharts'
    
    interface TimeSeriesChartProps {
      data: Array<{date: string, [key: string]: any}>
      series: Array<{key: string, name: string, color: string}>
      height?: number
      type?: 'line' | 'area'
      loading?: boolean
    }
    
    export default function TimeSeriesChart({ data, series, height = 300, type = 'line', loading }: TimeSeriesChartProps) {
      if (loading) return <div className="animate-pulse bg-gray-200 h-[${height}px] rounded" />
      
      return (
        <ResponsiveContainer width="100%" height={height}>
          <LineChart data={data}>
            <CartesianGrid strokeDasharray="3 3" />
            <XAxis dataKey="date" />
            <YAxis />
            <Tooltip />
            <Legend />
            {series.map(s => (
              <Line key={s.key} type="monotone" dataKey={s.key} name={s.name} stroke={s.color} strokeWidth={2} />
            ))}
          </LineChart>
        </ResponsiveContainer>
      )
    }
  
  trend_indicator_tsx: |
    import { ArrowUp, ArrowDown, Minus } from 'lucide-react'
    import clsx from 'clsx'
    
    interface TrendIndicatorProps {
      change: number
      size?: 'sm' | 'md' | 'lg'
      showZero?: boolean
    }
    
    export default function TrendIndicator({ change, size = 'md', showZero = true }: TrendIndicatorProps) {
      const Icon = change > 0 ? ArrowUp : change < 0 ? ArrowDown : Minus
      const color = change > 0 ? 'text-success' : change < 0 ? 'text-danger' : 'text-neutral'
      const sizeClass = size === 'sm' ? 'w-3 h-3' : size === 'lg' ? 'w-6 h-6' : 'w-4 h-4'
      
      if (change === 0 && !showZero) return null
      
      return (
        <div className={clsx('flex items-center', color)}>
          <Icon className={sizeClass} />
          <span className="ml-1 font-medium">{Math.abs(change).toFixed(1)}%</span>
        </div>
      )
    }

