version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ca006-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ca006_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ca006-network

  redis:
    image: redis:7-alpine
    container_name: ca006-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ca006-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ca006-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ca006_dev}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ca006-network
    command: >
      sh -c "
        echo 'Waiting for database...'
        sleep 5
        echo 'Running migrations...'
        alembic upgrade head
        echo 'Starting application...'
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ca006-celery-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ca006_dev}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    networks:
      - ca006-network
    command: celery -A celery_app worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ca006-celery-beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ca006_dev}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    networks:
      - ca006-network
    command: celery -A celery_app beat --loglevel=info

networks:
  ca006-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: