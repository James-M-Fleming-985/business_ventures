    - httpx>=0.25.0
    - tenacity>=8.2.0
    - pydantic>=2.0.0
    - python-dotenv>=1.0.0
  
  configuration:
    - API credentials via environment variables
    - Provider settings in config/analytics_config.yaml

success_criteria:
  - "Can authenticate with all 3 analytics providers using real credentials"
  - "Can collect metrics from all providers within 5 minutes"
  - "Normalizes data to common schema correctly"
  - "Handles provider failures gracefully with fallback"
  - "Retry logic works for transient failures"
  - "Circuit breaker prevents cascading failures"


estimated_effort:
  development_days: 2
  testing_days: 1
  total_days: 3
