metadata:
  system_id: SYSTEM-CA-006
  system_name: Feedback Collection & Iteration Orchestrator
  parent_project: PROJECT-CAUSAL_AFFECT
  created_date: 2025-10-13
  status: planned
  priority: critical
  purpose: 'Automated feedback collection using analytics providers (Google Analytics,

    Mixpanel, Amplitude). Tracks engagement across MVPs, prioritizes high-performers,

    archives non-performers. Operates with <5 minute latency.

    '
  business_value: '- Identifies successful MVPs for further investment

    - Eliminates wasted resources on non-performers

    - Provides data-driven iteration priorities

    - Enables portfolio-level optimization

    '
deployment:
  platform: Railway
  service_type: Backend API + Frontend Dashboard
  scaling: 1 backend + 1 frontend (Phase 1) → 2-3 replicas (Phase 2)
  estimated_cost: $20/month (Phase 1) → $60/month (Phase 2)
  railway_config_backend:
    builder: NIXPACKS
    build_command: pip install -r requirements.txt
    start_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    health_check: /health
    restart_policy: ON_FAILURE
  railway_config_frontend:
    builder: NIXPACKS
    build_command: npm install && npm run build
    start_command: npm run preview -- --host 0.0.0.0 --port $PORT
    health_check: /
    restart_policy: ON_FAILURE
code_generation:
  repository_root: /workspaces/business_ventures/Causal_affect
  system_folder: SYSTEM-CA-006_feedback_iteration
  folder_structure:
    requirements:
      description: Hierarchical folder structure with FEATURE and LAYER folders
      structure: 'SYSTEM-CA-006_feedback_iteration/

        ├── SYSTEM-CA-006.yaml (at root)

        ├── FEATURE-CA-006-01_analytics_integration/

        │   ├── FEATURE-CA-006-01_analytics_integration.yaml (FEATURE requirements at folder root)

        │   ├── LAYER-CA-006-01-01_google_analytics_client/

        │   │   └── LAYER-CA-006-01-01_google_analytics_client.yaml (LAYER requirements at folder root)

        │   ├── LAYER-CA-006-01-02_mixpanel_client/

        │   │   └── LAYER-CA-006-01-02_mixpanel_client.yaml

        │   └── ... (additional layers)

        ├── FEATURE-CA-006-02_engagement_tracking/

        │   └── FEATURE-CA-006-02_engagement_tracking.yaml

        └── ... (additional features)

        '
      naming_convention:
        feature_folder: FEATURE-{SYSTEM_ID}-{NUMBER}_{feature_name}
        feature_file: FEATURE-{SYSTEM_ID}-{NUMBER}_{feature_name}.yaml
        layer_folder: LAYER-{SYSTEM_ID}-{FEATURE_NUM}-{LAYER_NUM}_{layer_name}
        layer_file: LAYER-{SYSTEM_ID}-{FEATURE_NUM}-{LAYER_NUM}_{layer_name}.yaml
      example_paths:
      - SYSTEM-CA-006_feedback_iteration/FEATURE-CA-006-01_analytics_integration/FEATURE-CA-006-01_analytics_integration.yaml
      - SYSTEM-CA-006_feedback_iteration/FEATURE-CA-006-01_analytics_integration/LAYER-CA-006-01-01_google_analytics_client/LAYER-CA-006-01-01_google_analytics_client.yaml
    source_backend:
      base_path: src/feedback_iteration/backend
      description: FastAPI backend implementation with hybrid architecture
      entry_point: app/main.py
      structure:
        app:
        - __init__.py
        - 'main.py          # FastAPI app instance, lifespan, routers'
        - 'config.py        # System-wide Pydantic Settings'
        - 'api/             # Thin router wrappers calling feature services - __init__.py - engagement.py      # Routes to
          features/FEATURE-02/services/ - revenue.py         # Routes to features/FEATURE-03/services/ - prioritization.py  #
          Routes to features/FEATURE-04/services/ - iteration.py       # Routes to features/FEATURE-05/services/ - dashboard.py       #
          Routes to features/FEATURE-06/services/'
        - 'db/              # System-level database infrastructure ONLY - __init__.py - connection.py      # SQLAlchemy engine,
          async session factory - base.py            # Declarative base for features to inherit'
        - 'middleware/      # Cross-cutting concerns - __init__.py - error_handler.py   # Global exception handling - logging.py         #
          Request/response logging - cors.py            # CORS configuration'
        - 'schemas/         # Shared DTOs only (no domain models) - __init__.py - health.py          # HealthResponse - error.py           #
          ErrorResponse, ValidationError'
        features:
        - 'FEATURE-CA-006-01_analytics_integration/ - __init__.py - services/         # Google Analytics, Mixpanel, Amplitude
          clients - models/           # Analytics event models, client configs - db/               # Analytics event schema,
          repositories - tests/            # Unit tests for analytics clients'
        - 'FEATURE-CA-006-02_engagement_tracking/ - __init__.py - services/         # EventCollector, SessionTracker, MetricsCalculator
          - models/           # EngagementEvent, SessionData, Metrics - db/               # Engagement schema, repositories
          - tests/            # Unit tests for engagement services'
        - 'FEATURE-CA-006-03_revenue_tracking/ - __init__.py - services/         # ConversionTracker, RevenueCalculator -
          models/           # ConversionEvent, RevenueMetrics - db/               # Revenue schema, repositories - tests/            #
          Unit tests for revenue tracking'
        - 'FEATURE-CA-006-04_prioritization_engine/ - __init__.py - services/         # ScoreCalculator, PriorityRanker -
          models/           # FeatureScore, PriorityData - db/               # Priority schema, repositories - tests/            #
          Unit tests for prioritization'
        - 'FEATURE-CA-006-05_automated_iteration/ - __init__.py - services/         # IterationOrchestrator, ArchiveManager
          - models/           # IterationPlan, ArchiveDecision - db/               # Iteration history schema - tests/            #
          Unit tests for iteration logic'
        - 'FEATURE-CA-006-06_dashboard_visualization/ - __init__.py - services/         # DashboardDataAggregator, ChartGenerator
          - models/           # DashboardConfig, ChartData - db/               # Dashboard config schema - tests/            #
          Unit tests for dashboard services'
        root_files:
        - 'requirements.txt # Python dependencies'
        - 'Dockerfile.dev   # Development container'
        - '.env.example     # Environment variable template'
    source_frontend:
      base_path: src/feedback_iteration/frontend
      description: React + Vite + TypeScript frontend
      entry_point: src/main.tsx
      structure:
        src:
        - 'main.tsx         # React entry point'
        - 'App.tsx          # Root component with routing'
        - 'config.ts        # Frontend configuration'
        - 'components/      # React components (Dashboard, Metrics, Charts)'
        - 'services/        # API client, WebSocket for real-time updates'
        - 'stores/          # Zustand state management'
        - 'types/           # TypeScript type definitions'
        root_files:
        - 'package.json     # NPM dependencies'
        - 'vite.config.ts   # Vite build configuration'
        - 'tsconfig.json    # TypeScript configuration'
        - 'Dockerfile.dev   # Development container'
        - '.env.example     # Environment variable template'
    configuration:
      base_path: src/feedback_iteration
      description: Deployment and development configuration
      files:
      - 'railway.json           # Railway deployment configuration'
      - 'docker-compose.dev.yml # Local development environment'
      - 'README.md              # How to run CA-006 locally and deploy'
      - '.gitignore             # Git ignore patterns'
    tests:
      base_path: tests/feedback_iteration
      description: Test files mirroring source structure
      structure:
        backend:
        - 'test_analytics.py        # Analytics integration tests'
        - 'test_metrics.py          # Metrics collection tests'
        - 'test_prioritization.py   # Prioritization engine tests'
        - 'test_integration.py      # End-to-end integration tests'
        frontend:
        - 'Dashboard.test.tsx       # Dashboard component tests'
        - 'MetricsCard.test.tsx     # Metrics card tests'
        - 'api.test.ts              # API client tests'
    documentation:
      base_path: SYSTEM-CA-006_feedback_iteration/docs
      description: System-specific documentation
      files:
      - 'architecture.md     # System architecture and design decisions'
      - 'api-design.md       # API endpoint specifications'
      - 'deployment-guide.md # Railway deployment instructions'
      - 'analytics-setup.md  # Analytics provider configuration'
  phases:
    description: Multi-phase generation strategy to comply with Claude API 8K token output limit
    total_phases: 21
    estimated_total_time: 60-75 minutes
    phase_01_system_infrastructure:
      name: System Infrastructure
      max_tokens: 8192
      estimated_time: 5 minutes
      dependencies: []
      files:
      - app/__init__.py
      - app/main.py - FastAPI app initialization, lifespan, router includes
      - app/config.py - Pydantic Settings with feature flags, DB URL, Redis URL
      - app/db/__init__.py
      - app/db/connection.py - Async SQLAlchemy engine, session factory
      - app/db/base.py - Declarative base for ORM models
      - app/middleware/__init__.py
      - app/middleware/error_handler.py - Global exception handling
      - app/middleware/logging.py - Request/response logging
      - app/middleware/cors.py - CORS configuration
      - app/schemas/__init__.py
      - app/schemas/health.py - HealthResponse model
      - app/schemas/error.py - ErrorResponse, ValidationError models
      acceptance_criteria:
      - FastAPI app starts without errors
      - Database connection pool initializes
      - Health endpoint returns 200 OK
    phase_02_system_api_routers:
      name: System API Routers (Thin Wrappers)
      max_tokens: 8192
      estimated_time: 6 minutes
      dependencies:
      - phase_01_system_infrastructure
      files:
      - app/api/__init__.py
      - app/api/engagement.py - Router for engagement endpoints, calls feature services
      - app/api/revenue.py - Router for revenue endpoints
      - app/api/prioritization.py - Router for prioritization endpoints
      - app/api/iteration.py - Router for iteration endpoints
      - app/api/dashboard.py - Router for dashboard endpoints
      acceptance_criteria:
      - All routers registered in main.py
      - Each router has placeholder endpoints returning 501 Not Implemented
      - OpenAPI docs generated successfully
    phase_06_feature_04_prioritization:
      name: 'FEATURE-04: Prioritization Engine'
