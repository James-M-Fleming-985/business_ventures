engagement_metrics:
  traffic_metrics:
  - metric: Unique visitors
    importance: high
    threshold: '>100 per day'
  - metric: Page views
    importance: medium
    threshold: '>500 per day'
  - metric: Bounce rate
    importance: high
    threshold: <60%
  - metric: Average session duration
    importance: high
    threshold: '>2 minutes'
  - metric: Pages per session
    importance: medium
    threshold: '>3 pages'
  engagement_metrics:
  - metric: Daily active users (DAU)
    importance: critical
    threshold: '>50'
  - metric: Weekly active users (WAU)
    importance: critical
    threshold: '>200'
  - metric: Monthly active users (MAU)
    importance: critical
    threshold: '>500'
  - metric: DAU/MAU ratio (stickiness)
    importance: high
    threshold: '>20%'
  - metric: User retention (Day 7)
    importance: critical
    threshold: '>30%'
  - metric: User retention (Day 30)
    importance: critical
    threshold: '>15%'
  conversion_metrics:
  - metric: Conversion rate
    importance: critical
    threshold: '>2%'
  - metric: Sign-up rate
    importance: high
    threshold: '>10%'
  - metric: Trial-to-paid conversion
    importance: critical
    threshold: '>5%'
  - metric: Checkout abandonment
    importance: high
    threshold: <70%
  financial_metrics:
  - metric: Revenue (daily)
    importance: critical
    threshold: '>$10'
  - metric: Revenue (monthly)
    importance: critical
    threshold: '>$500'
  - metric: Average revenue per user (ARPU)
    importance: high
    threshold: '>$5'
  - metric: Customer acquisition cost (CAC)
    importance: critical
    threshold: <$50
  - metric: Customer lifetime value (LTV)
    importance: critical
    threshold: '>$100'
  - metric: LTV:CAC ratio
    importance: critical
    threshold: '>3:1'
  growth_metrics:
  - metric: Week-over-week growth
    importance: high
    threshold: '>10%'
  - metric: Month-over-month growth
    importance: high
    threshold: '>20%'
  - metric: Viral coefficient
    importance: medium
    threshold: '>0.5'
prioritization_algorithm:
  factors:
    engagement_score:
      weight: 0.3
      calculation: Weighted average of DAU, WAU, MAU, retention
    revenue_score:
      weight: 0.25
      calculation: Actual revenue vs projected, growth rate
    growth_trajectory:
      weight: 0.2
      calculation: Week-over-week and month-over-month trends
    product_market_fit_indicators:
      weight: 0.15
      calculation: Retention, NPS, organic growth signals
    resource_efficiency:
      weight: 0.1
      calculation: LTV:CAC ratio, infrastructure cost efficiency
  thresholds:
    iteration_priority:
      high: '>80th percentile across all MVPs'
      medium: 60-80th percentile
      low: 40-60th percentile
      archive: <40th percentile after evaluation period
  evaluation_periods:
    initial_assessment: 7 days post-deployment
    iteration_decision: 30 days post-deployment
    final_assessment: 90 days post-deployment
archive_criteria:
  automatic_archive_triggers:
  - condition: <10 DAU after 30 days
    reason: No user traction
  - condition: $0 revenue after 60 days
    reason: No monetization potential
  - condition: <5% week-over-week growth for 8 consecutive weeks
    reason: No growth trajectory
  - condition: '>90% bounce rate after 30 days'
    reason: Poor product-market fit
  - condition: Infrastructure cost > 5x revenue for 60 days
    reason: Unsustainable economics
  manual_override:
    allow: true
    reason: Operator can prevent archive if strategic value exists
analytics_integrations:
  web_analytics:
  - Google Analytics 4
  - Mixpanel
  - Amplitude
  - Plausible (privacy-focused)
  product_analytics:
  - Segment (data pipeline)
  - Heap (auto-tracking)
  - PostHog (open-source)
  revenue_tracking:
  - Stripe (payments)
  - ChartMogul (SaaS metrics)
  - Baremetrics (revenue analytics)
  monitoring:
  - Sentry (error tracking)
  - LogRocket (session replay)
  - Hotjar (heatmaps)
portfolio_dashboard_views:
  overview:
  - Total active MVPs
  - MVPs in iteration pipeline
  - MVPs pending archive
  - Portfolio-level revenue
  - Total users across all MVPs
  performance_grid:
  - All MVPs in grid layout
