# ====================================================================================
# TECHNOLOGY STACK
# ====================================================================================

technology_stack:
  backend:
    framework: FastAPI 0.104.0
    orm: SQLAlchemy 2.0
    computation:
      - numpy >= 1.24.0
      - scipy >= 1.11.0
      - pandas >= 2.0.0
    optimization:
      - pygmo >= 2.19.0  # Multi-objective optimization
  
  frontend:
    framework: React 18.2.0
    language: TypeScript 5.0
    bundler: Vite 5.0
    3d_visualization:
      - "@react-three/fiber": "^8.15.0"
      - "@react-three/drei": "^9.88.0"
      - "three": "^0.158.0"
    ui_components:
      - "@mui/material": "^5.14.0"
      - "recharts": "^2.10.0"
    state_management:
      - "@tanstack/react-query": "^5.0.0"
      - "zustand": "^4.4.0"
  
  database:
    type: PostgreSQL 15
    purpose: "Store engine configurations, calculation history, user preferences"
    
  deployment:
    platform: Railway
    services:
      - backend_api
      - frontend_dashboard
      - postgresql_database

