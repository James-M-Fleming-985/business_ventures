# ====================================================================================
# SYSTEM REQUIREMENTS: Feasibility Platform
# ====================================================================================
# SYSTEM-001: Generic Feasibility Analysis Platform
# ====================================================================================
# This system provides a pluggable engine framework for evaluating energy efficiency
# opportunities across multiple domains. Engines implement a standard interface and
# provide transparent calculations with formula tracking.
# ====================================================================================

metadata:
  system_id: SYSTEM-001
  system_name: "Feasibility Platform"
  parent_project: PROJECT-001
  created_date: 2025-12-29
  status: "planned"
  priority: "critical"
  
  purpose: |
    Provide a generic platform for feasibility analysis that supports multiple
    mathematical engines. Each engine implements calculations for a specific domain
    (hose optimization, solar panels, HVAC, etc.) while the platform handles:
    - Dynamic UI generation from engine schemas
    - 3D visualization of response surfaces
    - Comprehensive calculation transparency
    - Multi-objective optimization scoring
    - Target profile comparison
    
    The pluggable architecture enables rapid deployment of new feasibility tools
    without modifying core platform code.
  
  business_value:
    - "Single platform serves multiple engineering domains"
    - "New domains added in days, not months"
    - "Calculation transparency builds stakeholder trust"
    - "3D visualization reveals non-obvious optimization opportunities"
    - "Reduces custom tool development costs by 80%+"
  
  traceability:
    parent_project_requirements:
      - "PROJECT-AC-001: Users can select from multiple feasibility engines via dropdown"
      - "PROJECT-AC-002: Control panel dynamically generated from engine's input schema"
      - "PROJECT-AC-003: 3D visualization displays normalized composite scores"
      - "PROJECT-AC-004: Every data point has comprehensive tooltip"
      - "PROJECT-AC-007: New engines can be added without modifying frontend or API code"
    
    project_requirements_file: "../PROJECT-001_energy_efficiency.yaml"
    
    derivation_rationale: |
      PROJECT-001 requires a platform that can evaluate multiple types of energy
      efficiency opportunities. This system provides the generic framework that
      makes this possible through:
      
      1. Abstract engine interface defining common contract
      2. Engine registry for dynamic discovery and loading
      3. Schema-driven UI generation for engine-agnostic controls
      4. Response surface visualization for any 3D output space
      5. Normalization framework for combining different units/scales

deployment:
  platform: Railway
  service_type: Backend API + Frontend Dashboard
  scaling: 1 backend + 1 frontend (Phase 1) → 2-3 replicas (Phase 2)
  estimated_cost: "$20/month (Phase 1) → $60/month (Phase 2)"
  
  railway_config_backend:
    builder: NIXPACKS
    build_command: "pip install -r requirements.txt"
    start_command: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    health_check: "/health"
    restart_policy: ON_FAILURE
  
  railway_config_frontend:
    builder: NIXPACKS
    build_command: "npm install && npm run build"
    start_command: "npm run preview -- --host 0.0.0.0 --port $PORT"
    health_check: "/"
    restart_policy: ON_FAILURE

# ====================================================================================
# SHARED INTERFACES - CRITICAL FOR FEATURE CONSISTENCY
# ====================================================================================
# All features in this system use API response structure (FastAPI backend)
# ====================================================================================

shared_interfaces:
  response_structure: "api_response_structure"
  deployment_model: "FastAPI Backend"
  
  # ---------------------------------------------------------------------------------
  # API RESPONSE STRUCTURE - Used by all features
  # ---------------------------------------------------------------------------------
  api_response_structure:
    standard: "Pydantic BaseModel with HTTP semantics"
    
    required_fields:
      - name: "success"
        type: "bool"
        description: "Whether operation succeeded (true/false)"
        required: true
      
      - name: "data"
        type: "Optional[Any]"
        description: "Successful result payload (None if error)"
        required: true
      
      - name: "error"
        type: "Optional[str]"
        description: "Error message if failed (None if success)"
        required: true
      
      - name: "metadata"
        type: "Optional[Dict[str, Any]]"
        description: "Additional context (timestamps, calculation_time_ms)"
        required: true
    
    http_status_mapping:
      - "200 OK: Success with data (success=true)"
      - "400 Bad Request: Validation error (success=false, error=message)"
      - "404 Not Found: Engine not found (success=false, error=message)"
      - "500 Internal Server Error: Calculation error (success=false, error=message)"
    
    implementation_example: |
      ```python
      from pydantic import BaseModel, Field
      from typing import Optional, Any, Dict
      from datetime import datetime
      
      class FeatureResponse(BaseModel):
          success: bool
          data: Optional[Any] = None
          error: Optional[str] = None
          metadata: Optional[Dict[str, Any]] = Field(default_factory=dict)
          
          class Config:
              json_encoders = {
                  datetime: lambda v: v.isoformat()
              }
      ```
  
  # ---------------------------------------------------------------------------------
  # ENGINE INTERFACE - Contract all engines must implement
  # ---------------------------------------------------------------------------------
  engine_interface:
    description: |
      All feasibility engines must implement this abstract interface.
      This ensures consistent behavior and enables generic frontend/API code.
    
    required_methods:
      - name: "get_metadata"
        signature: "() -> EngineMetadata"
        description: "Return engine ID, name, description, version"
        
      - name: "get_input_schema"
        signature: "() -> Dict[str, ParameterSchema]"
        description: "Return schema defining all input parameters (name, type, range, unit, default)"
        
      - name: "get_output_schema"
        signature: "() -> Dict[str, OutputSchema]"
        description: "Return schema defining all output metrics (name, type, unit, normalization)"
        
      - name: "calculate"
        signature: "(inputs: Dict[str, Any]) -> CalculationResult"
        description: |
          Perform calculations and return results with formula tracking.
          Result must include:
          - components: dict of individual calculated values with formula + steps
          - composites: dict of derived/normalized scores
          - visualization_point: (x, y, z) for 3D plotting
        
      - name: "get_target_profile"
        signature: "(profile_name: str) -> Dict[str, Any]"
        description: "Return predefined optimal configuration for comparison"
    
    calculation_result_structure: |
      ```python
      {
        "components": {
          "deltaP": {
            "value": 0.7,
            "unit": "bar",
            "formula": "ΔP = f × (L/Di) × (ρv²/2)",
            "calculation_steps": [
              "f = 0.024 (from Colebrook-White)",
              "ρv²/2 = 998 × 1.7² / 2 = 1442 Pa",
              "ΔP = 0.024 × (25/0.015) × 1442 = 57,680 Pa"
            ],
            "normalized": 70
          },
          # ... more component outputs
        },
        "composites": {
          "performance_score": {"value": 75, "formula": "weighted avg of ΔP, η_P, velocity"},
          "economic_score": {"value": 82, "formula": "weighted avg of cost, ROI, payback"},
          "durability_score": {"value": 68, "formula": "weighted avg of lifespan, wear_rate"}
        },
        "visualization_point": {"x": 75, "y": 82, "z": 68},
        "overall_score": 75.5,
        "metadata": {
          "calculation_time_ms": 45,
          "warnings": [],
          "notes": []
        }
      }
      ```
  
  # ---------------------------------------------------------------------------------
  # NORMALIZATION STRATEGY
  # ---------------------------------------------------------------------------------
  normalization:
    description: |
      Different engines produce outputs with different units (bar, $, years, m/s).
      To visualize on common 3D axes, we normalize all metrics to 0-100 scale.
    
    methods:
      min_max_scaling:
        formula: "normalized = 100 × (value - min) / (max - min)"
        use_case: "Metrics with known bounds (e.g., efficiency 0-100%)"
        
      target_based_scoring:
        formula: "normalized = 100 × (1 - |value - target| / target)"
        use_case: "Metrics with optimal target (e.g., velocity near 2 m/s)"
        
      logarithmic_scaling:
        formula: "normalized = 100 × log(value) / log(max)"
        use_case: "Metrics spanning orders of magnitude (e.g., cost $10-$10000)"
    
    composite_scores:
      description: |
        Group related outputs and compute weighted average for each 3D axis:
        - Performance Score (X): ΔP + pump_efficiency + velocity + Re (weighted)
        - Economic Score (Y): ROI + payback_period + total_cost (weighted)
        - Durability Score (Z): lifespan + wear_rate + maintenance_cost (weighted)

