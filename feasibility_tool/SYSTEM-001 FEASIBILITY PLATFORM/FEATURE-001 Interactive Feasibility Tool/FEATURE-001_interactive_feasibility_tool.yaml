# ====================================================================================
# DEPLOYMENT
# ====================================================================================

deployment:
  dependencies:
    - package: "fastapi"
      version: ">=0.104.0"
      purpose: "API framework"
    
    - package: "sqlalchemy"
      version: ">=2.0.0"
      purpose: "ORM for database operations"
    
    - package: "numpy"
      version: ">=1.24.0"
      purpose: "Numerical computations"
    
    - package: "scipy"
      version: ">=1.11.0"
      purpose: "Scientific computing and optimization"
    
    - package: "pygmo"
      version: ">=2.19.0"
      purpose: "Multi-objective optimization algorithms"
    
    - package: "react"
      version: "^18.2.0"
      purpose: "Frontend UI framework"
    
    - package: "@react-three/fiber"
      version: "^8.15.0"
      purpose: "React renderer for Three.js"
    
    - package: "three"
      version: "^0.158.0"
      purpose: "WebGL 3D library"
  
  configuration_required:
    - setting: "DATABASE_URL"
      value: "postgresql://user:pass@localhost/feasibility_db"
      location: ".env"
    
    - setting: "API_BASE_URL"
      value: "http://localhost:8000"
      location: "frontend/.env"
  
  deployment_steps:
    - "Install backend dependencies: pip install -r requirements.txt"
    - "Run database migrations: alembic upgrade head"
    - "Seed material database: python scripts/seed_materials.py"
    - "Start backend: uvicorn app.main:app --reload"
    - "Install frontend dependencies: cd frontend && npm install"
    - "Start frontend: npm run dev"
    - "Verify E2E tests: pytest tests/e2e/"

