  api_usage:
    - "Use FastAPI dependency injection for engine registry"
    - "Use Pydantic BaseModel for request/response validation"
  
  quality_requirements:
    - "ALL endpoints must return FeatureResponse"
    - "HTTP status codes must match system specification"
    - "Include calculation_time_ms in metadata"

