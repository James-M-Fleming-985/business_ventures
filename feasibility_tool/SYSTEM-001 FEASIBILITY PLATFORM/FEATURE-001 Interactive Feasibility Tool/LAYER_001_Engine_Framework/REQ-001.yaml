# ====================================================================================

integration:
  input_from:
    - layer: "LAYER-002 Material Database"
      data_type: "Material properties (density, viscosity, roughness)"
      interface: "MaterialDatabase.get_material_properties(material_name)"
  
  output_to:
    - layer: "LAYER-004 API Backend"
      data_type: "CalculationResult with formulas and normalized scores"
      interface: "Engine.calculate(inputs) -> CalculationResult"
    
    - layer: "LAYER-003 Optimization Engine"
      data_type: "Raw calculation outputs for multi-objective optimization"
      interface: "Engine.calculate(inputs).components"
  
  shared_dependencies:
    - "app/schemas/response.py (FeatureResponse)"

