# ====================================================================================
# DEPLOYMENT
# ====================================================================================

deployment:
  dependencies:
    - package: "numpy"
      version: ">=1.24.0"
      purpose: "Numerical computations"
    
    - package: "scipy"
      version: ">=1.11.0"
      purpose: "Colebrook-White equation solver"
    
    - package: "pydantic"
      version: ">=2.0.0"
      purpose: "Data validation and schemas"
  
  configuration:
    - setting: "DEFAULT_MATERIAL"
      value: "EPDM"
      location: "config/engines.yaml"
    
    - setting: "NORMALIZATION_BOUNDS"
      value: "{'deltaP': (0, 2), 'ROI': (0, 50), ...}"
      location: "config/engines.yaml"
  
  usage_example: |
    from src.engines.hose_optimization import HoseOptimizationEngine
    from src.engines.registry import EngineRegistry
    
    # Register engine
    engine = HoseOptimizationEngine()
    EngineRegistry().register(engine)
    
    # Use engine
    inputs = {'Di': 0.015, 'Do': 0.021, 'L': 25, 'flow_rate': 2.0, ...}
    result = engine.calculate(inputs)
    print(result.components['deltaP'].formula)

# ====================================================================================
# CODE GENERATION CONSTRAINTS
# ====================================================================================

code_generation_constraints:
  output_format:
    - "Return ONLY raw Python code - NO markdown fences"
    - "First line MUST be valid Python import or class definition"
  
  api_usage:
    - "ONLY implement methods defined in specification.classes"
    - "Use EXACT method signatures"
    - "DO NOT add helper methods not listed in spec"
  
  import_completeness:
    - "Import ABC, abstractmethod from abc"
    - "Import Dict, List, Optional, Any from typing"
    - "Import BaseModel from pydantic"
    - "Import numpy as np"
  
  naming_conventions:
    - "Class names: FeasibilityEngine, EngineRegistry, HoseOptimizationEngine"
    - "Method names: get_metadata, get_input_schema, calculate, etc."
  
  quality_requirements:
    - "NO stub implementations - all methods fully functional"
    - "Formula tracking MUST be present in all ComponentResult objects"
    - "Calculation accuracy within 1% of manual verification"

# ====================================================================================
# NOTES
# ====================================================================================

notes: |
  IMPORTANT CONSIDERATIONS:
  - Formula tracking is CRITICAL - every calculated value must include formula + steps
  - Colebrook-White equation requires iterative solver (use scipy.optimize.fsolve)
  - Normalization bounds should be configurable, not hardcoded
  - Material properties come from LAYER-002, don't hardcode density/viscosity
  
  DESIGN DECISIONS:
  - Abstract base class chosen over Protocol to enforce interface at registration time
  - Singleton pattern for registry ensures single source of truth
  - ComponentResult dataclass includes both value AND formula to keep them together
  
  FUTURE ENHANCEMENTS:
  - Add caching for expensive calculations (memoization)
  - Support unit conversion (user inputs meters, but engine works in mm)
  - Add calculation explanation feature (natural language description of steps)
  - Support multi-threading for batch calculations

