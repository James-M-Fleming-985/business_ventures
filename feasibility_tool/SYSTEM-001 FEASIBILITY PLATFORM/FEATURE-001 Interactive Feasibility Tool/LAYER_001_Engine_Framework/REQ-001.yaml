# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "Engine Framework"
  
  description: |
    Provides abstract engine interface and registry system for pluggable feasibility
    engines. Includes complete HoseOptimizationEngine implementation demonstrating:
    
    - Hydraulic calculations (pressure drop, Reynolds number, velocity)
    - Material property lookups
    - Economic metrics (ROI, payback period, total cost)
    - Formula tracking for every calculated value
    - Composite score normalization (Performance, Economics, Durability)
    
    The framework ensures all engines follow standard contract, enabling
    generic API and frontend code.
  
  rationale: |
    Feasibility analysis spans multiple engineering domains with different
    calculations, but share common workflow:
    
    1. User provides input parameters
    2. Engine performs domain-specific calculations
    3. Results normalized to common scales
    4. Visualization shows multi-dimensional trade-offs
    
    This layer abstracts the common pattern, making the platform extensible.

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  structure:
    entry_point: "src/engines/base.py"
    modules:
      - "base.py - Abstract FeasibilityEngine class"
      - "registry.py - EngineRegistry singleton"
      - "hose_optimization.py - HoseOptimizationEngine implementation"
      - "schemas.py - Pydantic models for metadata, schemas, results"
  
  classes:
    - name: "FeasibilityEngine"
      purpose: "Abstract base class defining engine interface"
      methods:
        - name: "get_metadata"
          signature: "get_metadata() -> EngineMetadata"
          purpose: "Return engine ID, name, description, version, domain"
          example: |
            engine = HoseOptimizationEngine()
            metadata = engine.get_metadata()
            print(metadata.name)  # "Hose/Pipe Optimization"
        
        - name: "get_input_schema"
          signature: "get_input_schema() -> Dict[str, ParameterSchema]"
          purpose: "Return schema defining all input parameters with types, ranges, units"
          example: |
            schema = engine.get_input_schema()
            print(schema['Di'].min_value)  # 0.01 (meters)
        
        - name: "get_output_schema"
          signature: "get_output_schema() -> Dict[str, OutputSchema]"
          purpose: "Return schema defining all output metrics"
          example: |
            schema = engine.get_output_schema()
            print(schema['deltaP'].unit)  # "bar"
        
        - name: "calculate"
          signature: "calculate(inputs: Dict[str, Any]) -> CalculationResult"
          purpose: "Perform calculations and return results with formulas"
          example: |
            result = engine.calculate({'Di': 0.015, 'Do': 0.021, 'L': 25, ...})
            print(result.components['deltaP'].formula)  # "ΔP = f × (L/Di) × (ρv²/2)"
        
        - name: "get_target_profile"
          signature: "get_target_profile(profile_name: str) -> Dict[str, Any]"
          purpose: "Return predefined optimal configuration"
          example: |
            profile = engine.get_target_profile("Maximum Performance")
            print(profile['Di'])  # 0.020
    
    - name: "EngineRegistry"
      purpose: "Singleton registry for managing available engines"
      methods:
        - name: "register"
          signature: "register(engine: FeasibilityEngine) -> None"
          purpose: "Add engine to registry"
        
        - name: "list_engines"
          signature: "list_engines() -> List[EngineMetadata]"
          purpose: "Get metadata for all registered engines"
        
        - name: "get_engine"
          signature: "get_engine(engine_id: str) -> FeasibilityEngine"
          purpose: "Retrieve specific engine by ID"
    
    - name: "HoseOptimizationEngine"
      purpose: "Reference implementation for hose/pipe feasibility analysis"
      methods:
        - name: "_calculate_pressure_drop"
          signature: "_calculate_pressure_drop(...) -> ComponentResult"
          purpose: "Calculate ΔP with Darcy-Weisbach equation, return with formula + steps"
        
        - name: "_calculate_reynolds"
          signature: "_calculate_reynolds(...) -> ComponentResult"
          purpose: "Calculate Reynolds number, return with formula + steps"
        
        - name: "_calculate_roi"
          signature: "_calculate_roi(...) -> ComponentResult"
          purpose: "Calculate ROI percentage, return with formula + steps"
  
  implementation_details:
    libraries:
      - "abc (abstract base classes)"
      - "pydantic (data validation)"
      - "numpy (numerical computations)"
      - "scipy (Colebrook-White equation solver)"
    
    patterns:
      - "Abstract Base Class pattern for engine interface"
      - "Singleton pattern for EngineRegistry"
      - "Strategy pattern for different engines"
      - "Factory pattern for creating calculation results"
    
    error_handling:
      - error_type: "InvalidInputError"
        handling: "Validate inputs against schema, raise with specific field"
      - error_type: "CalculationError"
        handling: "Wrap math errors, include context about which calculation failed"
  
  inputs:
    - name: "inputs"
      type: "Dict[str, Any]"
      description: "Dictionary of parameter values keyed by parameter name"
      example: "{'Di': 0.015, 'Do': 0.021, 'L': 25, 'flow_rate': 2.0, ...}"
  
  outputs:
    - name: "CalculationResult"
      type: "CalculationResult (Pydantic model)"
      description: "Contains components (with formulas), composites, visualization_point, overall_score"
      example: |
        {
          "components": {
            "deltaP": {
              "value": 0.7,
              "unit": "bar",
              "formula": "ΔP = f × (L/Di) × (ρv²/2)",
              "calculation_steps": ["f = 0.024", "ρv²/2 = 1442 Pa", "..."],
              "normalized": 70
            }
          },
          "composites": {
            "performance_score": 75,
            "economic_score": 82,
            "durability_score": 68
          },
          "visualization_point": {"x": 75, "y": 82, "z": 68},
          "overall_score": 75.5
        }

