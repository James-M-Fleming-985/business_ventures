# ====================================================================================
# DEPLOYMENT
# ====================================================================================

deployment:
  dependencies:
    - package: "numpy"
      version: ">=1.24.0"
      purpose: "Numerical operations"
    
    - package: "pygmo"
      version: ">=2.19.0"
      purpose: "Multi-objective optimization (future)"
  
  usage_example: |
    from src.optimization.normalizer import Normalizer
    from src.optimization.composite_scorer import CompositeScorer
    
    norm = Normalizer()
    scorer = CompositeScorer()
    
    # Normalize individual components
    deltaP_norm = norm.min_max_normalize(0.7, 0.0, 2.0)  # 35
    ROI_norm = norm.min_max_normalize(25.3, 0, 50)  # 50.6
    
    # Calculate composite
    performance = scorer.calculate_composite(
        {'deltaP': 35, 'efficiency': 85},
        {'deltaP': 0.5, 'efficiency': 0.5}
    )  # 60

