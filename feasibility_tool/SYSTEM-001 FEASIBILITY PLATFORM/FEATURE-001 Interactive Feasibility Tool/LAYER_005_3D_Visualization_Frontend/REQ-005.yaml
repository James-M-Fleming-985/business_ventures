# ====================================================================================
# REQUIREMENT DEFINITION
# ====================================================================================

requirement:
  title: "3D Visualization Frontend"
  
  description: |
    React 18 + TypeScript web application with:
    
    Components:
    - EngineSelector: Dropdown for choosing engine, displays metadata
    - DynamicControlPanel: Renders sliders/inputs from engine input schema
    - ResponseSurface3D: Three.js 3D scatter plot (Performance X, Economics Y, Durability Z)
    - TooltipPanel: Expandable panel showing value, unit, formula (LaTeX), calculation steps
    - ScoreDisplay: Overall optimization score with breakdown
    - TargetProfileSelector: Dropdown for predefined configurations
    
    State Management:
    - React Query for API calls and caching
    - Zustand for local UI state (selected engine, input values, calculation results)
    
    Performance:
    - 60 FPS rendering with 1000+ data points
    - Debounced input for <100ms calculation trigger
    - Progressive loading for large datasets
  
  rationale: |
    3D visualization reveals non-obvious trade-offs that tables or 2D charts miss.
    Formula tooltips build trust through calculation transparency.
    Dynamic UI generation from schemas enables pluggable engines without code changes.

# ====================================================================================
# SPECIFICATION
# ====================================================================================

specification:
  structure:
    entry_point: "src/App.tsx"
    modules:
      - "src/App.tsx - Main application component"
      - "src/components/EngineSelector.tsx"
      - "src/components/DynamicControlPanel.tsx"
      - "src/components/ResponseSurface3D.tsx"
      - "src/components/TooltipPanel.tsx"
      - "src/components/ScoreDisplay.tsx"
      - "src/hooks/useEngines.ts - React Query hook for engines API"
      - "src/hooks/useCalculate.ts - React Query hook for calculate API"
      - "src/store/appStore.ts - Zustand state management"
      - "src/utils/formulaRenderer.ts - LaTeX to HTML using KaTeX"
  
  classes:
    - name: "EngineSelector"
      purpose: "Dropdown to select engine, shows metadata"
      props:
        - "engines: EngineMetadata[]"
        - "selectedEngineId: string"
        - "onEngineChange: (engineId: string) => void"
      state:
        - "None (controlled component)"
      example: |
        <EngineSelector
          engines={engines}
          selectedEngineId="hose_optimization"
          onEngineChange={setSelectedEngine}
        />
    
    - name: "DynamicControlPanel"
      purpose: "Renders sliders/inputs from engine input schema"
      props:
        - "schema: Dict[str, ParameterSchema]"
        - "values: Dict[str, any]"
        - "onChange: (name: string, value: any) => void"
      state:
        - "None (controlled component)"
      example: |
        <DynamicControlPanel
          schema={inputSchema}
          values={inputValues}
          onChange={handleInputChange}
        />
    
    - name: "ResponseSurface3D"
      purpose: "Three.js 3D scatter plot with axes: Performance/Economics/Durability"
      props:
        - "dataPoints: Array<{x: number, y: number, z: number, metadata: any}>"
        - "currentPoint: {x: number, y: number, z: number}"
        - "onPointClick: (point: any) => void"
      state:
        - "camera: THREE.Camera"
        - "controls: OrbitControls"
      rendering:
        - "Use React-Three-Fiber for declarative Three.js"
        - "Instanced rendering for 1000+ points"
        - "LOD (Level of Detail) for performance"
      example: |
        <Canvas camera={{position: [5, 5, 5]}}>
          <ResponseSurface3D
            dataPoints={calculationHistory}
            currentPoint={currentResult.visualization_point}
            onPointClick={handlePointClick}
          />
        </Canvas>
    
    - name: "TooltipPanel"
      purpose: "Shows detailed calculation breakdown"
      props:
        - "component: ComponentResult"
        - "isOpen: boolean"
        - "onClose: () => void"
      rendering:
        - "Value and unit in large font"
        - "Formula rendered with KaTeX"
        - "Calculation steps as expandable list"
        - "Normalized score progress bar"
      example: |
        <TooltipPanel
          component={{
            value: 0.7,
            unit: "bar",
            formula: "ΔP = f × (L/Di) × (ρv²/2)",
            calculation_steps: ["f = 0.024", "..."],
            normalized: 70
          }}
          isOpen={true}
          onClose={() => setTooltipOpen(false)}
        />
  
  implementation_details:
    libraries:
      - "react@^18.2.0"
      - "typescript@^5.0.0"
      - "@react-three/fiber@^8.15.0 (React renderer for Three.js)"
      - "@react-three/drei@^9.88.0 (Three.js helpers)"
      - "three@^0.158.0 (3D library)"
      - "@mui/material@^5.14.0 (UI components)"
      - "@tanstack/react-query@^5.0.0 (API caching)"
      - "zustand@^4.4.0 (state management)"
      - "katex@^0.16.0 (LaTeX formula rendering)"
      - "axios@^1.6.0 (HTTP client)"
    
    patterns:
      - "Controlled components for all inputs"
      - "Custom hooks for API calls"
      - "Compound component pattern for complex UI"
    
    error_handling:
      - error_type: "API error"
        handling: "Show error toast, fallback to last valid state"
      - error_type: "Render error"
        handling: "Error boundary with fallback UI"
  
  inputs:
    - name: "User interactions"
      type: "Mouse clicks, slider changes"
      description: "User adjusts parameters or selects engine"
      example: "User drags diameter slider to 15mm"
  
  outputs:
    - name: "3D visualization"
      type: "WebGL canvas"
      description: "Interactive 3D scatter plot showing configuration space"
      example: "Current configuration highlighted in red, history in blue"

