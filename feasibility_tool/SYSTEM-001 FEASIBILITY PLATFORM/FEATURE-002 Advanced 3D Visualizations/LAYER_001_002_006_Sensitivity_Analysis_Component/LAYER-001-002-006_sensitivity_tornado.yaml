# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Sensitivity Analysis Visualization"
  
  description: |
    Provides an interactive tornado chart visualization that displays sensitivity 
    analysis results for all 13 input parameters. The chart ranks parameters by 
    their impact magnitude on the selected output variable, using finite difference 
    calculations. Each bar shows both magnitude and direction (positive/negative) 
    of impact. The visualization updates in real-time as users adjust parameters, 
    maintaining 60 FPS performance. Clicking a bar highlights the corresponding 
    parameter in other UI components for cross-referencing.
  
  rationale: |
    Understanding parameter sensitivity is crucial for optimization workflows. 
    Users need to quickly identify which inputs have the greatest influence on 
    outputs to focus their tuning efforts. The tornado chart provides an intuitive 
    visual ranking that reveals both high-impact parameters (long bars) and impact 
    direction (color coding). This enables efficient parameter space exploration 
    by prioritizing adjustments to the most influential variables.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/components/sensitivity_analysis/SensitivityAnalysis.tsx"
    modules:
      - "SensitivityAnalysis.tsx"        # Main React component
      - "useSensitivityCalculation.ts"   # Hook for sensitivity calculations
      - "TornadoChart.tsx"              # Three.js tornado chart component
      - "SensitivityTypes.ts"           # TypeScript interfaces
      - "sensitivityUtils.ts"           # Calculation utilities
  
  # Main classes/functions to implement
  classes:
    - name: "SensitivityAnalysis"
      purpose: "Main React component that orchestrates sensitivity visualization"
      methods:
        - name: "render"
          signature: "render(): JSX.Element"
          purpose: "Renders the sensitivity analysis visualization"
          example: |
            // Component usage
            <SensitivityAnalysis
              inputs={currentInputs}
              calculationResult={result}
              onParameterHighlight={handleHighlight}
              colorScale="viridis"
            />
    
    - name: "TornadoChart"
      purpose: "Three.js component that renders the tornado chart"
      methods:
        - name: "updateBars"
          signature: "updateBars(sensitivities: SensitivityData[]): void"
          purpose: "Updates bar positions and colors based on sensitivity data"
          example: |
            // Update chart with new sensitivity values
            chartRef.current.updateBars(newSensitivities);
    
    - name: "useSensitivityCalculation"
      purpose: "Custom hook for computing parameter sensitivities"
      methods:
        - name: "calculateSensitivities"
          signature: "calculateSensitivities(inputs: InputParameters, delta: number): SensitivityData[]"
          purpose: "Computes finite difference sensitivities for all parameters"
          example: |
            // Hook usage
            const sensitivities = useSensitivityCalculation(inputs, 0.01);
  
  # Key technical details
  implementation_details:
    libraries: ["react", "three", "@react-three/fiber", "@react-three/drei", "d3-scale", "d3-color"]
    patterns: ["React Hooks", "Memoization Pattern", "Observer Pattern"]
    error_handling:
      - error_type: "InvalidInputError"
        handling: "Display warning message, use default values"
      - error_type: "CalculationError"
        handling: "Log error, show fallback visualization"
  
  # Input/output contract
  inputs:
    - name: "inputs"
      type: "InputParameters"
      description: "Current values of all 13 input parameters"
      example: "{ param1: 0.5, param2: 0.7, ... }"
    
    - name: "calculationResult"
      type: "CalculationResult"
      description: "Current output values from calculation engine"
      example: "{ output1: 100, output2: 200, output3: 300 }"
    
    - name: "selectedOutput"
      type: "string"
      description: "Which output variable to analyze sensitivity for"
      example: "output1"
    
    - name: "colorScale"
      type: "'viridis' | 'plasma' | 'cividis'"
      description: "Colorblind-friendly color scheme selection"
      example: "viridis"
  
  outputs:
    - name: "sensitivities"
      type: "SensitivityData[]"
      description: "Array of sensitivity values sorted by magnitude"
      example: "[{parameter: 'param1', sensitivity: 0.85, direction: 'positive'}, ...]"
    
    - name: "onParameterClick"
      type: "(parameter: string) => void"
      description: "Callback fired when user clicks a sensitivity bar"
      example: "onParameterClick('param1')"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "13 bars are rendered, one for each input parameter"
    test: "Count rendered bar elements in DOM"
    example: |
      # Test verification
      const bars = container.querySelectorAll('.sensitivity-bar');
      expect(bars.length).toBe(13);
  
  - criterion: "Bars are sorted in descending order by sensitivity magnitude"
    test: "Verify bar heights decrease monotonically"
    example: |
      # Verify sorting
      const heights = Array.from(bars).map(b => b.getBoundingClientRect().width);
      expect(heights).toEqual([...heights].sort((a, b) => b - a));
  
  - criterion: "Sensitivity values computed via finite difference with delta=0.01"
    test: "Mock calculation engine and verify finite difference formula"
    example: |
      # Verify calculation
      const delta = 0.01;
      const sensitivity = (outputPlus - outputMinus) / (2 * delta * baseOutput);
  
  - criterion: "Positive impact bars are green, negative impact bars are red"
    test: "Check bar fill colors match expected values"
    example: |
      # Color verification
      const positiveBar = getByTestId('bar-positive');
      expect(positiveBar.style.fill).toBe('rgb(0, 128, 0)');
  
  - criterion: "Clicking a bar triggers onParameterHighlight callback"
    test: "Simulate click and verify callback invocation"
    example: |
      # Click test
      fireEvent.click(bars[0]);
      expect(mockOnHighlight).toHaveBeenCalledWith('param1');
  
  - criterion: "Chart updates within 5ms of input change"
    test: "Measure time between prop update and render completion"
    example: |
      # Performance test
      const start = performance.now();
      rerender(<SensitivityAnalysis inputs={newInputs} />);
      const duration = performance.now() - start;
      expect(duration).toBeLessThan(5);

