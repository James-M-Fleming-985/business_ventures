  - Green/red color coding may need adjustment based on user feedback
  - Consider caching sensitivity calculations when inputs haven't changed significantly
  
  DESIGN DECISIONS:
  - Using Three.js for bars instead of SVG for consistency with other 3D visualizations
  - Sorting by magnitude (not signed value) to show most impactful parameters first
  - Click-to-highlight enables cross-visualization parameter tracking
  
  FUTURE ENHANCEMENTS:
