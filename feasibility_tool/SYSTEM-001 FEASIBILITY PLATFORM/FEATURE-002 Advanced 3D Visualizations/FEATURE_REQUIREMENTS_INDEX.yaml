# ====================================================================================
# INTEGRATION SCENARIOS
# ====================================================================================

integration_scenarios:
  - "User drags material_type dropdown → all visualizations update instantly showing new material properties"
  - "User adjusts Di slider continuously → triangle, feasibility volume, parallel coords all morph in real-time at 60 FPS"
  - "User switches from Ternary to Response Surface mode → mode selector updates, previous mode disposed, new mode renders < 200ms"
  - "User accumulates 100+ configurations → history queue maintains only last 100, trails show recent exploration path"
  - "User clicks sensitivity bar → corresponding parameter highlighted in main input panel"
  - "User hovers correlation matrix cube → tooltip shows exact Pearson coefficient value"
  - "User enables reference planes in feasibility volume → transparent grids appear at specified score thresholds"

# ====================================================================================
# CONSTRAINTS
# ====================================================================================

constraints:
  technical:
    - "Must use onChange event for sliders, NOT onChangeCommitted"
    - "Must dispose Three.js geometries/materials when switching modes"
    - "Must use React.memo/useMemo/useCallback for performance"
    - "Must cap WebGL scene at 100k vertices maximum"
    - "Must use instancing for repeated geometries (trail spheres, grid points)"
    - "Must normalize color scales to [0,1] range"
    - "Must use right-handed coordinates (X=right, Y=up, Z=forward)"
  
  architectural:
    - "All visualization components must accept identical VisualizationProps interface"
    - "Shared utilities (ColorScales, MathUtils) must be stateless pure functions"
    - "History tracker must use FIFO queue, not unbounded array"
    - "Mode selector must lazy-load inactive modes to reduce bundle size"
  
  dependencies:
    - "Requires React 18.2.0 or higher"
    - "Requires TypeScript 5.0 or higher with strict mode"
    - "Requires Three.js latest version"
    - "Requires @react-three/fiber and @react-three/drei latest"
    - "Requires Material-UI 5.x for consistency with App.tsx"

