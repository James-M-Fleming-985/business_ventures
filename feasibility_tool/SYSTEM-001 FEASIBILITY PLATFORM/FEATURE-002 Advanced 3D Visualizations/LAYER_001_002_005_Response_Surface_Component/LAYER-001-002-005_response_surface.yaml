# DEPLOYMENT NOTES - How to deploy/use this layer
# ================================================================================
deployment:
  dependencies:
    - package: "@react-three/fiber"
      version: "^8.0.0"
      purpose: "React renderer for Three.js"
    
    - package: "d3-scale-chromatic"
      version: "^3.0.0"
      purpose: "Colorblind-friendly color scales"
    
    - package: "three"
      version: "^0.150.0"
      purpose: "3D graphics library"
  
  configuration:
    - setting: "gridResolution"
      value: "30"
      location: "config/visualization.yaml"
    
    - setting: "colorScale"
      value: "viridis"
      location: "config/visualization.yaml"
  
  usage_example: |
    # Example of how to use this layer
    import { ResponseSurfaceVisualization } from '@/response_surface/ResponseSurfaceVisualization';
    
    function App() {
      return (
        <ResponseSurfaceVisualization
          inputs={currentInputs}
          calculationResult={calculationResult}
          selectedVariables={{ var1: 'param1', var2: 'param7' }}
          onVariableChange={handleVariableChange}
        />
      );
    }

