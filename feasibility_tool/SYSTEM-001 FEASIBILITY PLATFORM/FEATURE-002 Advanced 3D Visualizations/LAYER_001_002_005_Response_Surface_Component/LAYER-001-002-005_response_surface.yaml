# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Response Surface 3D Visualization"
  
  description: |
    Renders an interactive 3D response surface plot showing how two selected input
    variables affect the output response. Provides dropdown selectors for choosing
    which two of the 13 input parameters to visualize, computes a 30x30 grid of
    output values, and displays the surface with heat map coloring. Marks the current
    parameter configuration with a vertical line indicator on the surface.
  
  rationale: |
    Scientists need to understand how pairs of input parameters interact to affect
    outputs. The response surface visualization provides intuitive 3D representation
    of these 2-variable relationships, enabling quick identification of optimal
    regions, interaction effects, and sensitivity patterns. This is essential for
    parameter optimization and understanding system behavior.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/response_surface/ResponseSurfaceVisualization.tsx"
    modules:
      - "ResponseSurfaceVisualization.tsx"    # Main React component
      - "SurfaceMesh.tsx"                     # Three.js mesh component
      - "VariableSelectors.tsx"               # Dropdown UI components
      - "surfaceCalculations.ts"              # Grid computation logic
      - "colorMapping.ts"                     # Heat map color utilities
  
  # Main classes/functions to implement
  classes:
    - name: "ResponseSurfaceVisualization"
      purpose: "Main React component managing the response surface visualization"
      methods:
        - name: "render"
          signature: "render(): JSX.Element"
          purpose: "Renders the complete visualization with controls"
          example: |
            # Example usage
            <ResponseSurfaceVisualization 
              inputs={currentInputs}
              calculationResult={result}
              onVariableChange={handleChange}
            />
        
        - name: "updateSurface"
          signature: "updateSurface(var1: string, var2: string): void"
          purpose: "Recomputes surface grid when variables change"
    
    - name: "SurfaceMesh"
      purpose: "Three.js mesh component rendering the 3D surface"
      methods:
        - name: "updateGeometry"
          signature: "updateGeometry(gridData: Float32Array): void"
          purpose: "Updates vertex positions for smooth morphing"
        
        - name: "updateColors"
          signature: "updateColors(values: Float32Array): void"
          purpose: "Updates vertex colors based on output values"
    
    - name: "computeSurfaceGrid"
      purpose: "Computes 30x30 grid of output values"
      methods:
        - name: "compute"
          signature: "compute(var1: string, var2: string, baseInputs: InputData): GridData"
          purpose: "Generates grid by varying two parameters"
  
  # Key technical details
  implementation_details:
    libraries: ["@react-three/fiber", "@react-three/drei", "three", "d3-scale", "d3-scale-chromatic"]
    patterns: ["Component Composition", "Memoization Pattern", "Vertex Morphing"]
    error_handling:
      - error_type: "InvalidVariableSelection"
        handling: "Default to first two variables, show warning toast"
      - error_type: "CalculationFailure"
        handling: "Display flat surface at z=0, show error indicator"
  
  # Input/output contract
  inputs:
    - name: "inputs"
      type: "InputData"
      description: "Current 13-parameter configuration"
      example: "{param1: 0.5, param2: 0.7, ..., param13: 0.3}"
    
    - name: "calculationResult"
      type: "CalculationResult"
      description: "Current output values from calculation engine"
      example: "{output1: 0.85, output2: 0.92, output3: 0.78}"
    
    - name: "selectedVariables"
      type: "{var1: string, var2: string}"
      description: "Names of two variables to plot"
      example: "{var1: 'param1', var2: 'param7'}"
  
  outputs:
    - name: "surfaceData"
      type: "SurfaceGridData"
      description: "30x30 grid of computed output values"
      example: "{ vertices: Float32Array(2700), colors: Float32Array(2700) }"
    
    - name: "currentPointMarker"
      type: "Vector3"
      description: "3D position of current configuration on surface"
      example: "{ x: 0.5, y: 0.7, z: 0.85 }"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "Two dropdown selectors render with all 13 input variables"
    test: "Verify dropdowns populate from input parameter list"
    example: |
      # Example test command
      pytest tests/unit/test_variable_selectors.py::test_dropdown_population -v
  
  - criterion: "30x30 grid computes in under 1 second"
    test: "Performance test grid computation with timer"
    example: |
      # Performance benchmark
      pytest tests/performance/test_surface_performance.py::test_grid_computation_speed -v
  
  - criterion: "Surface renders with smooth heat map coloring"
    test: "Visual regression test comparing rendered output"
    example: |
      # Visual test
      npm run test:visual -- ResponseSurfaceVisualization
  
  - criterion: "Current point marked with vertical line indicator"
    test: "Verify line mesh renders at correct position"
    example: |
      # Integration test
      pytest tests/integration/test_current_point_marker.py -v
  
  - criterion: "Surface morphs smoothly during variable changes"
    test: "Verify vertex position interpolation"
    example: |
      # Animation test
      npm run test:animation -- SurfaceMorphing

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build Response Surface Component (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_surface_calculations.py"
      tests:
        - "test_grid_generation_30x30"
        - "test_variable_range_mapping"
        - "test_invalid_variable_handling"
        - "test_calculation_error_recovery"
      duration: "2 hours"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_surface_calculations.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement computeSurfaceGrid (GREEN phase)"
      file: "src/response_surface/surfaceCalculations.ts"
      methods:
        - "compute(var1: string, var2: string, baseInputs: InputData) → GridData"
        - "mapVariableRange(varName: string, steps: number) → number[]"
        - "calculateGridPoint(inputs: InputData) → number"
      duration: "3 hours"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_surface_calculations.py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "Extract color mapping to separate module"
        - "Optimize grid computation with memoization"
        - "Add TypeScript strict null checks"
      duration: "1 hour"
    
    - step: 6
      action: "Integration test with Three.js rendering"
      file: "tests/integration/test_surface_rendering.tsx"
      duration: "2 hours"
  
  total_time: "8 hours 7 minutes"
  
  deliverable: "Fully functional ResponseSurfaceVisualization component with 2-variable selection, 30x30 grid computation, heat map coloring, and current point indicator"

