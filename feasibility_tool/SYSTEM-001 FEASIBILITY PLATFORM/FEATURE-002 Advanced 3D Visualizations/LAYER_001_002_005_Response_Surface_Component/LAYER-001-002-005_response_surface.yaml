notes: |
  IMPORTANT CONSIDERATIONS:
  - Surface grid is 30x30 (900 points) - balance between quality and performance
  - Use BufferGeometry for efficient vertex updates during morphing
  - Color scale must be perceptually uniform (viridis recommended)
  - Current point marker uses LineSegments for visibility from all angles
  
  DESIGN DECISIONS:
  - Vertex morphing chosen over geometry recreation for smooth transitions
  - Dropdown selectors use Material-UI for consistent styling
  - Grid computed on-demand, not precomputed, to handle dynamic ranges
  - Heat map colors computed in vertex shader for GPU efficiency
  
  FUTURE ENHANCEMENTS:
  - Add contour lines at user-defined intervals
  - Support logarithmic scaling for parameters with large ranges
  - Add export to STL for 3D printing of interesting surfaces
  - Implement adaptive grid resolution based on surface complexity

