# ================================================================================
deployment:
  dependencies:
    - package: "@react-three/fiber"
      version: "^8.15.0"
      purpose: "React renderer for Three.js"
    
    - package: "@react-three/drei"
      version: "^9.88.0"
      purpose: "Helper components and utilities"
    
    - package: "three"
      version: "^0.158.0"
      purpose: "3D graphics library"
    
    - package: "d3-scale-chromatic"
      version: "^3.0.0"
      purpose: "Colorblind-friendly color scales"
  
  configuration:
    - setting: "maxHistorySize"
      value: "100"
      location: "config/visualization.json"
    
    - setting: "targetFPS"
      value: "60"
      location: "config/visualization.json"
    
    - setting: "updateLatencyThreshold"
      value: "5"
      location: "config/visualization.json"
  
  usage_example: |
    # Example of how to use this layer
    import { VisualizationManager } from 'src/visualization/VisualizationManager';
    import { useVisualizationState } from 'src/hooks/useVisualizationState';
    
    function App() {
      const { mode, inputs, outputs, history } = useVisualizationState();
      
      return (
        <VisualizationManager
          mode={mode}
          inputs={inputs}
          outputs={outputs}
          history={history}
          onModeChange={(newMode) => console.log('Mode changed:', newMode)}
        />
      );
    }

# ================================================================================
# CODE GENERATION CONSTRAINTS - CRITICAL for AI Code Generation Quality
# ================================================================================
code_generation_constraints:  
  # Language Specification - CRITICAL: Prevents wrong language generation
  programming_language: "TypeScript"
  file_extensions: [".tsx", ".ts"]
  runtime_environment: "React Browser Environment (Node.js 18+)"
  primary_framework: "React 18.2.0 (functional components with hooks)"
  rendering_library: "@react-three/fiber (latest)"
  graphics_library: "Three.js (latest)"
  ui_framework: "Material-UI 5.x"
  type_checking: "TypeScript 5.0+ strict mode"
  
  # Output Format Rules - Prevents markdown wrapping
  output_format:
    - "Return ONLY raw TypeScript/TSX code - NO explanations or commentary"
    - "NO markdown code fences (```typescript or ```)"
    - "First line MUST be valid TypeScript (import statement or interface)"
    - "Last line MUST be valid TypeScript code (NOT a closing markdown fence)"
    - "File must be directly executable without any preprocessing"
  
  
  # API Usage Rules - Prevents method invention
  api_usage:
    - "ONLY use React-Three-Fiber hooks and components documented in v8.15"
    - "DO NOT invent Three.js methods - verify against Three.js r158 docs"
    - "Use EXACT React hook names (useFrame, useThree, useLoader)"
    - "Canvas props must match @react-three/fiber API exactly"
    - "DO NOT create custom WebGL shaders unless specified"
  
  # Import Completeness Rules - Prevents missing imports
  import_completeness:
    - "Import React and { useRef, useMemo, useCallback, useEffect } as needed"
    - "Import { Canvas, useFrame, useThree } from '@react-three/fiber'"
    - "Import specific Three.js classes: THREE.Vector3, THREE.Color, etc."
    - "Import TypeScript types for all props and return values"
    - "Import performance from 'web-vitals' for metrics"
  
  # Naming Convention Rules - Ensures consistency
  naming_conventions:
    - "Component names use PascalCase: VisualizationManager, SceneController"
    - "Hook names start with 'use': useVisualizationMode, usePerformance"
    - "Event handlers start with 'handle': handleModeChange, handleSliderUpdate"
    - "Three.js objects use camelCase: perspectiveCamera, ambientLight"
  
  # Code Quality Rules - Prevents stub/placeholder code
  quality_requirements:
    - "NO console.log() unless for performance monitoring"
    - "NO hardcoded magic numbers - use named constants"
    - "ALL Three.js objects must be properly disposed in cleanup"
    - "Use React.memo() and useMemo() for performance optimization"
    - "Include proper TypeScript types for all parameters and returns"
  
  # Validation Requirements - Ensures code correctness
  validation_requirements:
    - "Code MUST compile with TypeScript strict mode"
    - "All React components must handle mounting/unmounting properly"
    - "Three.js scenes must dispose geometries and materials"
    - "Performance measurements must use performance.now()"
    - "Color values must be valid hex strings or THREE.Color instances"

# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - WebGL context loss can occur on mobile devices or during GPU switching
  - Three.js geometries must be explicitly disposed to prevent memory leaks
  - React-Three-Fiber's useFrame hook runs at 60Hz - avoid heavy computations
  - Color interpolation should happen in perceptually uniform color spaces
  
  DESIGN DECISIONS:
  - Using React-Three-Fiber over raw Three.js for better React integration
  - Vertex morphing preferred over geometry recreation for smooth transitions
  - Object pooling for frequently created/destroyed geometries
  - Web Workers considered for heavy calculations but not required initially
  
  FUTURE ENHANCEMENTS:
  - GPU-based particle systems for larger datasets
  - WebXR support for VR/AR visualization
  - Progressive rendering for complex scenes
  - Adaptive quality based on device capabilities

