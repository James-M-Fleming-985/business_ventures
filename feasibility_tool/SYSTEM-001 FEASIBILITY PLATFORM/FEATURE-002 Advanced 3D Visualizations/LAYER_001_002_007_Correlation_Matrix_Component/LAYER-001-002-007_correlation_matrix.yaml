# DEPLOYMENT NOTES - How to deploy/use this layer
# ================================================================================
deployment:
  dependencies:
    - package: "@react-three/fiber"
      version: "^8.0.0"
      purpose: "React renderer for Three.js"
    
    - package: "@react-three/drei"
      version: "^9.0.0"
      purpose: "Helper components for 3D scenes"
    
    - package: "simple-statistics"
      version: "^7.8.0"
      purpose: "Statistical calculations including correlation"
  
  configuration:
    - setting: "minDataPoints"
      value: "30"
      location: "config/visualization.yaml"
    
    - setting: "correlationColorScale"
      value: "diverging-red-blue"
      location: "config/visualization.yaml"
  
  usage_example: |
    # Example of how to use this layer
    import { CorrelationMatrix } from './components/visualizations/CorrelationMatrix';
    import { useExplorationHistory } from './hooks/useExplorationHistory';
    
    function VisualizationContainer() {
      const history = useExplorationHistory();
      
      return (
        <CorrelationMatrix
          historicalData={history}
          inputNames={parameterConfig.inputs.map(i => i.name)}
          outputNames={parameterConfig.outputs.map(o => o.name)}
          onHover={(correlation) => console.log('Hovered:', correlation)}
        />
      );
    }

