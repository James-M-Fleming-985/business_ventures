# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - Pearson correlation assumes linear relationships - consider Spearman for non-linear
  - Correlation matrix updates can be expensive - use memoization and throttling
  - Three.js instanced mesh recommended for rendering 39 cubes efficiently
  - Color scale should be diverging (red-white-blue) to show positive/negative clearly
  
  DESIGN DECISIONS:
  - Using cubes instead of heatmap squares for better 3D depth perception
  - Size AND color encode correlation strength for redundant visual encoding
  - Minimum 30 data points based on statistical significance requirements
  - Grid layout (13x3) chosen over square matrix for better aspect ratio
  
  FUTURE ENHANCEMENTS:
  - Add correlation significance testing (p-values)
  - Support for Spearman rank correlation option
  - Animated transitions when correlations update
  - Click cube to scatter plot the two variables

