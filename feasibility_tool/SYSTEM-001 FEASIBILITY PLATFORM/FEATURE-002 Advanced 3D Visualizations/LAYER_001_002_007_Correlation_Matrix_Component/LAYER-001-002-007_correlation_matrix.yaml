# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Correlation Matrix Visualization Component"
  
  description: |
    Renders an interactive 3D correlation matrix visualization showing the relationship
    between 13 input parameters and 3 output metrics. Displays correlations as a 13×3
    grid of colored cubes where size and color indicate correlation strength. Computes
    Pearson correlation coefficients from historical exploration data (minimum 30 points)
    and provides hover tooltips showing exact correlation values. Updates in real-time
    as new data points are added to history while maintaining smooth 60 FPS performance.
  
  rationale: |
    Understanding the relationship between input parameters and output metrics is crucial
    for parameter optimization. The correlation matrix provides an at-a-glance view of
    which inputs most strongly influence each output, helping users identify key parameters
    to adjust. The 3D visualization with size/color encoding makes patterns immediately
    visible, while hover details provide precise values for detailed analysis.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/components/visualizations/CorrelationMatrix.tsx"
    modules:
      - "CorrelationMatrix.tsx"           # Main React component
      - "CorrelationCube.tsx"            # Individual cube component
      - "correlationCalculator.ts"        # Pearson correlation computation
      - "correlationTypes.ts"            # TypeScript type definitions
      - "correlationShaders.ts"          # Custom shaders for cube rendering
  
  # Main classes/functions to implement
  classes:
    - name: "CorrelationMatrix"
      purpose: "Main React component that renders the 3D correlation matrix visualization"
      methods:
        - name: "render"
          signature: "render(): JSX.Element"
          purpose: "Renders the Three.js scene with correlation cubes"
          example: |
            # Example usage
            <CorrelationMatrix
              inputData={historicalData}
              inputNames={parameterNames}
              outputNames={metricNames}
              onHover={handleHover}
            />
        
        - name: "updateCorrelations"
          signature: "updateCorrelations(history: DataPoint[]): void"
          purpose: "Recalculates correlation matrix from historical data"
          
        - name: "handleCubeHover"
          signature: "handleCubeHover(inputIndex: number, outputIndex: number): void"
          purpose: "Shows tooltip with correlation value on cube hover"
    
    - name: "CorrelationCalculator"
      purpose: "Computes Pearson correlation coefficients from data history"
      methods:
        - name: "calculatePearsonCorrelation"
          signature: "calculatePearsonCorrelation(x: number[], y: number[]): number"
          purpose: "Computes Pearson correlation between two data series"
          
        - name: "computeCorrelationMatrix"
          signature: "computeCorrelationMatrix(history: DataPoint[], inputIndices: number[], outputIndices: number[]): number[][]"
          purpose: "Builds complete correlation matrix from historical data"
  
  # Key technical details
  implementation_details:
    libraries: ["react", "three", "@react-three/fiber", "@react-three/drei", "simple-statistics"]
    patterns: ["Component Pattern", "Memoization Pattern", "Observer Pattern"]
    error_handling:
      - error_type: "InsufficientDataError"
        handling: "Display message when < 30 data points available"
      - error_type: "CalculationError"
        handling: "Return 0 correlation and log error for invalid data"
  
  # Input/output contract
  inputs:
    - name: "historicalData"
      type: "DataPoint[]"
      description: "Array of historical parameter configurations and results"
      example: "[{inputs: [0.5, 0.3, ...], outputs: [1.2, 0.8, 0.9]}, ...]"
    
    - name: "inputNames"
      type: "string[]"
      description: "Names of the 13 input parameters"
      example: "['Temperature', 'Pressure', 'Flow Rate', ...]"
    
    - name: "outputNames"
      type: "string[]"
      description: "Names of the 3 output metrics"
      example: "['Efficiency', 'Cost', 'Quality']"
  
  outputs:
    - name: "correlationMatrix"
      type: "number[][]"
      description: "13x3 matrix of correlation coefficients (-1 to 1)"
      example: "[[0.85, -0.42, 0.15], [0.23, 0.91, -0.67], ...]"
    
    - name: "hoveredCorrelation"
      type: "{inputIndex: number, outputIndex: number, value: number} | null"
      description: "Currently hovered cube information"
      example: "{inputIndex: 2, outputIndex: 1, value: 0.73}"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "13×3 grid of cubes renders correctly"
    test: "Visual inspection confirms 39 cubes arranged in proper grid"
    example: |
      # Example test command
      npm test -- CorrelationMatrix.test.tsx --testNamePattern="renders correct cube count"
  
  - criterion: "Pearson correlation computed accurately from history"
    test: "Unit tests verify correlation calculation against known values"
    example: |
      # Test with known correlation data
      const testData = generateCorrelatedData(0.85);
      expect(calculatePearsonCorrelation(testData.x, testData.y)).toBeCloseTo(0.85, 2);
  
  - criterion: "Requires minimum 30 data points"
    test: "Component shows warning message when insufficient data"
    example: |
      # Test insufficient data handling
      render(<CorrelationMatrix historicalData={twentyPoints} />);
      expect(screen.getByText(/Requires at least 30 data points/)).toBeInTheDocument();
  
  - criterion: "Hover displays exact correlation value"
    test: "Mouse hover on cube shows tooltip with correlation"
    example: |
      # Test hover interaction
      const cube = screen.getByTestId('correlation-cube-2-1');
      fireEvent.mouseEnter(cube);
      expect(screen.getByText('r = 0.73')).toBeVisible();
  
  - criterion: "Performance maintains 60 FPS"
    test: "Performance monitoring during matrix updates"
    example: |
      # Performance test
      const fps = measureFPS(() => {
        updateCorrelationMatrix(newData);
      });
      expect(fps).toBeGreaterThanOrEqual(60);

