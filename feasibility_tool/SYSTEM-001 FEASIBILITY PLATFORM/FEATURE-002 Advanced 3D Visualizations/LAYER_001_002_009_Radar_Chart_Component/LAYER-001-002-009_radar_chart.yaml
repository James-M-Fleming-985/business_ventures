      location: "config/visualization.yaml"
    
    - setting: "radarChart.animationDuration"
      value: "200"
      location: "config/visualization.yaml"
  
  usage_example: |
    // Example of how to use the radar chart component
    import { RadarChart } from 'src/components/visualizations/RadarChart';
    
    function VisualizationContainer() {
      const [inputs, setInputs] = useState(defaultInputs);
      const referenceConfig = loadReferenceConfig();
      
      return (
        <RadarChart
          inputs={inputs}
          reference={referenceConfig}
          colorScale="viridis"
          showLabels={true}
          showGrid={true}
          onHover={(param, value) => showTooltip(param, value)}
        />
      );
    }

