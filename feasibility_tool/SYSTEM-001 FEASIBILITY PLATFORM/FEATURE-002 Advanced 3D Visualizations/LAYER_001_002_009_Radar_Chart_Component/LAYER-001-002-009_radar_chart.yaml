# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Radar Chart Visualization Component"
  
  description: |
    Implements an interactive radar (spider) chart visualization that displays all 13
    input parameters on radial axes arranged at equal angles. The chart shows the current
    configuration as a filled polygon connecting normalized parameter values, with optional
    overlay of reference configurations for comparison. The visualization updates in
    real-time as parameters change and maintains 60 FPS performance during interaction.
  
  rationale: |
    Engineers need to visualize all input parameters simultaneously to understand the
    overall "shape" of a configuration. The radar chart provides this holistic view,
    making it easy to spot which parameters are at extremes, identify patterns, and
    compare configurations visually. This is particularly useful for quickly assessing
    whether a configuration is balanced or has outliers in specific dimensions.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/components/visualizations/RadarChart.tsx"
    modules:
      - "RadarChart.tsx"                    # Main React component with Three.js scene
      - "RadarChartGeometry.ts"            # Geometry generation for axes and polygons
      - "RadarChartScales.ts"              # Scale calculations and normalization
      - "RadarChartInteraction.ts"         # Mouse hover and tooltip handling
      - "RadarChartTypes.ts"               # TypeScript type definitions
  
  # Main classes/functions to implement
  classes:
    - name: "RadarChart"
      purpose: "React component that renders the interactive radar chart visualization"
      methods:
        - name: "constructor"
          signature: "constructor(props: RadarChartProps)"
          purpose: "Initialize component with input parameters and options"
          example: |
            const chart = <RadarChart 
              inputs={currentInputs}
              reference={referenceConfig}
              colorScale="viridis"
              showGrid={true}
            />
        
        - name: "updateGeometry"
          signature: "updateGeometry(inputs: InputParameters): void"
          purpose: "Update polygon vertices based on new input values"
          example: |
            // Called automatically when inputs change
            chart.updateGeometry(newInputs);
        
        - name: "renderAxes"
          signature: "renderAxes(): THREE.Group"
          purpose: "Create radial axes with labels and tick marks"
          example: |
            const axesGroup = this.renderAxes();
            scene.add(axesGroup);
    
    - name: "RadarChartGeometry"
      purpose: "Utility class for generating chart geometries"
      methods:
        - name: "createPolygon"
          signature: "createPolygon(values: number[], numAxes: number): THREE.BufferGeometry"
          purpose: "Generate filled polygon geometry from normalized values"
          example: |
            const geometry = RadarChartGeometry.createPolygon(
              normalizedValues,
              13
            );
        
        - name: "createAxesLines"
          signature: "createAxesLines(numAxes: number, radius: number): THREE.LineSegments"
          purpose: "Create radial axis lines from center to perimeter"
          example: |
            const axes = RadarChartGeometry.createAxesLines(13, 1.0);
        
        - name: "createConcentricRings"
          signature: "createConcentricRings(numRings: number, radius: number): THREE.LineSegments"
          purpose: "Create concentric reference rings for scale visualization"
          example: |
            const rings = RadarChartGeometry.createConcentricRings(5, 1.0);
  
  # Key technical details
  implementation_details:
    libraries: ["react", "three", "@react-three/fiber", "@react-three/drei", "d3-scale", "d3-color"]
    patterns: ["Component Pattern", "Reactive State Management", "Geometry Caching"]
    error_handling:
      - error_type: "InvalidInputCount"
        handling: "Log warning and use default zero values for missing inputs"
      - error_type: "NormalizationError"
        handling: "Clamp values to [0,1] range and log out-of-bounds warning"
  
  # Input/output contract
  inputs:
    - name: "inputs"
      type: "InputParameters"
      description: "Current values for all 13 input parameters"
      example: "{param1: 0.5, param2: 0.7, ..., param13: 0.3}"
    
    - name: "reference"
      type: "InputParameters | undefined"
      description: "Optional reference configuration to overlay"
      example: "{param1: 0.6, param2: 0.6, ..., param13: 0.6}"
    
    - name: "colorScale"
      type: "'viridis' | 'plasma' | 'cividis'"
      description: "Colorblind-friendly color scale to use"
      example: "viridis"
    
    - name: "showLabels"
      type: "boolean"
      description: "Whether to show parameter labels on axes"
      example: "true"
  
  outputs:
    - name: "radarChartElement"
      type: "JSX.Element"
      description: "React Three Fiber canvas with radar chart visualization"
      example: "<Canvas>...</Canvas>"
    
    - name: "hoveredParameter"
      type: "string | null"
      description: "Currently hovered parameter name for tooltip display"
      example: "param5"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "13 radial axes render at equal angles (360°/13 ≈ 27.7° spacing)"
    test: "Visual inspection and geometric validation of axis angles"
    example: |
      // Test that axes are evenly spaced
      const angleStep = (2 * Math.PI) / 13;
      axes.forEach((axis, i) => {
        expect(axis.angle).toBeCloseTo(i * angleStep, 3);
      });
  
  - criterion: "Filled polygon correctly connects all 13 input values"
    test: "Verify polygon vertices match normalized input positions"
    example: |
      // Test polygon generation
      const polygon = createPolygon(inputs);
      expect(polygon.vertices.length).toBe(13);
      expect(polygon.isClosed).toBe(true);
  
  - criterion: "Reference configuration displays as dotted overlay when provided"
    test: "Check reference polygon renders with correct styling"
    example: |
      // Test reference overlay
      const chart = render(<RadarChart inputs={inputs} reference={reference} />);
      const referencePolygon = chart.getByTestId('reference-polygon');
      expect(referencePolygon.style.strokeDasharray).toBeDefined();
  
  - criterion: "Concentric circles show scale at 20%, 40%, 60%, 80%, 100%"
    test: "Verify 5 concentric rings render at correct radii"
    example: |
      // Test scale rings
      const rings = chart.getScaleRings();
      expect(rings.length).toBe(5);
      expect(rings[0].radius).toBeCloseTo(0.2, 2);
  
  - criterion: "Chart updates within 5ms of input parameter change"
    test: "Performance test measuring update latency"
    example: |
      // Test update performance
      const start = performance.now();
      chart.updateInputs(newInputs);
      const updateTime = performance.now() - start;
      expect(updateTime).toBeLessThan(5);
  
  - criterion: "Maintains 60 FPS during continuous parameter updates"
    test: "Frame rate monitoring during rapid updates"
    example: |
      // Test frame rate
      const frameRates = monitorFrameRate(() => {
        for (let i = 0; i < 100; i++) {
          chart.updateInputs(generateRandomInputs());
        }
      });
      expect(Math.min(...frameRates)).toBeGreaterThan(59);

