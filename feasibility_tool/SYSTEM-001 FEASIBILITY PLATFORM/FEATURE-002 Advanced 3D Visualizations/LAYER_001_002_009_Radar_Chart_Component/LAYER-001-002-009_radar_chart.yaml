notes: |
  IMPORTANT CONSIDERATIONS:
  - The radar chart must handle exactly 13 input parameters (non-negotiable)
  - Angles between axes: 360° / 13 ≈ 27.69° (use precise calculation)
  - All values must be normalized to [0,1] range for consistent visualization
  - Reference overlay uses dashed lines to distinguish from current config
  - Performance is critical - use geometry instancing where possible
  
  DESIGN DECISIONS:
  - Using Three.js for rendering instead of SVG for better performance with animations
  - Polygon fill uses semi-transparent material to allow overlay visibility
  - Axes extend slightly beyond unit circle for label placement
  - Tooltip shows both normalized and actual values on hover
  
  FUTURE ENHANCEMENTS:
