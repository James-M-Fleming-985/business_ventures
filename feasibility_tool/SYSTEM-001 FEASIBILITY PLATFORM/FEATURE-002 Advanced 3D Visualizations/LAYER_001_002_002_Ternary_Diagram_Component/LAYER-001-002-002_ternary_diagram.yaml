# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Ternary Diagram Visualization Component"
  
  description: |
    A React Three.js component that renders an interactive ternary diagram for
    visualizing three-component polymer formulations. The diagram displays the
    current formulation composition as a point within an equilateral triangle,
    with vertices representing 100% of each component. The component tracks and
    displays a trail of the last 20 formulation configurations with progressive
    opacity fade, and includes iso-composition gridlines at 10% intervals for
    reference. All rendering uses colorblind-friendly palettes and maintains
    60 FPS performance during real-time updates.
  
  rationale: |
    Polymer formulations often involve balancing three key components (e.g.,
    polymer, solvent, additive). A ternary diagram provides an intuitive way
    to visualize how these three components relate to each other and how
    changes in composition affect the formulation space. The trail feature
    allows formulators to see their exploration path and identify regions
    of interest, while iso-composition lines help quantify exact ratios.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/components/visualizations/TernaryDiagram.tsx"
    modules:
      - "TernaryDiagram.tsx"          # Main React component with Three.js scene
      - "barycentric.ts"              # Barycentric coordinate calculations
      - "ternaryGeometry.ts"          # Triangle mesh and gridline generation
      - "trailRenderer.ts"            # History trail rendering logic
      - "types.ts"                    # TypeScript interfaces and types
  
  # Main classes/functions to implement
  classes:
    - name: "TernaryDiagram"
      purpose: "React component that renders the ternary diagram visualization"
      methods:
        - name: "render"
          signature: "render(): JSX.Element"
          purpose: "Renders the Three.js canvas with ternary diagram"
          example: |
            # Example usage
            <TernaryDiagram
              components={['Polymer', 'Solvent', 'Additive']}
              values={[0.5, 0.3, 0.2]}
              history={historyArray}
              colorScale="viridis"
            />
        
        - name: "updatePosition"
          signature: "updatePosition(values: [number, number, number]): void"
          purpose: "Updates the current point position based on component values"
          example: |
            # Internal method called when props change
            updatePosition([0.6, 0.25, 0.15])
    
    - name: "BarycentricCalculator"
      purpose: "Utility class for converting between Cartesian and barycentric coordinates"
      methods:
        - name: "toBarycentric"
          signature: "toBarycentric(a: number, b: number, c: number): [number, number]"
          purpose: "Converts 3-component values to 2D triangle coordinates"
          example: |
            # Convert composition to triangle position
            const [x, y] = BarycentricCalculator.toBarycentric(0.5, 0.3, 0.2)
        
        - name: "fromBarycentric"
          signature: "fromBarycentric(x: number, y: number): [number, number, number]"
          purpose: "Converts triangle coordinates back to component values"
          example: |
            # Get composition from triangle position
            const [a, b, c] = BarycentricCalculator.fromBarycentric(0.4, 0.3)
  
  # Key technical details
  implementation_details:
    libraries: ["react", "@react-three/fiber", "@react-three/drei", "three", "d3-scale-chromatic"]
    patterns: ["Component Pattern", "Observer Pattern", "Memoization Pattern"]
    error_handling:
      - error_type: "InvalidCompositionError"
        handling: "Validate that component values sum to 1.0 (±0.001 tolerance)"
      - error_type: "HistoryOverflowError"
        handling: "Automatically trim history to last 100 entries"
  
  # Input/output contract
  inputs:
    - name: "components"
      type: "[string, string, string]"
      description: "Names of the three components"
      example: "['Polymer', 'Solvent', 'Additive']"
    
    - name: "values"
      type: "[number, number, number]"
      description: "Current composition values (must sum to 1.0)"
      example: "[0.5, 0.3, 0.2]"
    
    - name: "history"
      type: "Array<{values: [number, number, number], timestamp: number}>"
      description: "Historical composition data for trail rendering"
      example: "[{values: [0.4, 0.4, 0.2], timestamp: 1234567890}]"
    
    - name: "colorScale"
      type: "'viridis' | 'plasma' | 'cividis'"
      description: "Colorblind-friendly color scale selection"
      example: "'viridis'"
  
  outputs:
    - name: "JSX.Element"
      type: "React.ReactElement"
      description: "Rendered Three.js canvas containing the ternary diagram"
      example: "<Canvas>...</Canvas>"
    
    - name: "onHover"
      type: "(composition: [number, number, number]) => void"
      description: "Callback fired when hovering over diagram points"
      example: "onHover([0.5, 0.3, 0.2])"

