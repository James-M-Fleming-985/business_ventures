notes: |
  IMPORTANT CONSIDERATIONS:
  - Barycentric coordinates require values that sum to exactly 1.0
  - Triangle vertices must be positioned for equilateral shape (120° angles)
  - Trail rendering can impact performance if not properly optimized
  - Color interpolation should be perceptually uniform
  
  DESIGN DECISIONS:
  - Using instanced mesh for trail points to improve performance
  - Gridlines rendered as single line geometry for efficiency
  - Memoization of barycentric calculations to reduce redundant math
  - Canvas size fixed to maintain consistent triangle proportions
  
  FUTURE ENHANCEMENTS:
