# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "3D Visualization Integration Layer"
  
  description: |
    Provides a unified interface between React UI components and Three.js visualization
    renderers. Manages visualization mode switching, state updates from UI controls,
    history tracking, and performance optimization. Ensures smooth real-time updates
    during user interactions while maintaining 60 FPS performance target.
  
  rationale: |
    Complex 3D visualizations require careful coordination between UI state and
    rendering logic. This layer centralizes state management, event handling, and
    performance optimization to prevent tight coupling between UI and rendering
    layers while ensuring responsive, high-performance visualizations.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/visualization_integration/integration_manager.py"
    modules:
      - "integration_manager.py"     # Main orchestrator class
      - "state_manager.py"          # Centralized state handling
      - "event_dispatcher.py"       # Event routing and optimization
      - "history_tracker.py"        # Configuration history management
      - "performance_monitor.py"    # FPS and latency tracking
  
  # Main classes/functions to implement
  classes:
    - name: "VisualizationIntegrationManager"
      purpose: "Orchestrates all visualization components and state updates"
      methods:
        - name: "__init__"
          signature: "__init__(initial_state: Dict[str, Any]) -> None"
          purpose: "Initialize integration manager with default state"
          example: |
            # Example usage
            manager = VisualizationIntegrationManager({
                'mode': 'ternary',
                'inputs': {'param1': 0.5, 'param2': 0.3}
            })
        
        - name: "switch_visualization_mode"
          signature: "switch_visualization_mode(mode: str) -> None"
          purpose: "Switch between visualization modes with < 200ms latency"
          example: |
            manager.switch_visualization_mode('response_surface')
        
        - name: "update_from_slider"
          signature: "update_from_slider(param: str, value: float) -> None"
          purpose: "Handle real-time slider updates with < 5ms latency"
          example: |
            manager.update_from_slider('temperature', 0.75)
    
    - name: "StateManager"
      purpose: "Manages centralized state with efficient updates"
      methods:
        - name: "update_state"
          signature: "update_state(updates: Dict[str, Any]) -> None"
          purpose: "Batch state updates for efficiency"
        
        - name: "get_state_snapshot"
          signature: "get_state_snapshot() -> Dict[str, Any]"
          purpose: "Return current state snapshot for rendering"
    
    - name: "HistoryTracker"
      purpose: "Manages FIFO queue of last 100 configurations"
      methods:
        - name: "add_configuration"
          signature: "add_configuration(config: Dict[str, Any]) -> None"
          purpose: "Add new configuration to history with automatic pruning"
        
        - name: "get_history_trail"
          signature: "get_history_trail(count: int = 20) -> List[Dict[str, Any]]"
          purpose: "Get recent history for trail visualization"
    
    - name: "PerformanceMonitor"
      purpose: "Track FPS and update latency"
      methods:
        - name: "measure_update_latency"
          signature: "measure_update_latency(start_time: float, end_time: float) -> None"
          purpose: "Record update latency for performance monitoring"
        
        - name: "get_fps"
          signature: "get_fps() -> float"
          purpose: "Calculate current FPS from frame timestamps"
  
  # Key technical details
  implementation_details:
    libraries: ["react", "@react-three/fiber", "zustand", "immer"]
    patterns: ["Observer Pattern", "Command Pattern", "State Management Pattern"]
    error_handling:
      - error_type: "InvalidModeError"
        handling: "Fall back to default 'ternary' mode and log warning"
      - error_type: "PerformanceThresholdError"
        handling: "Reduce quality settings and notify user"
      - error_type: "HistoryOverflowError"
        handling: "Prune oldest entries automatically"
  
  # Input/output contract
  inputs:
    - name: "ui_events"
      type: "Dict[str, Any]"
      description: "Events from UI components (dropdowns, sliders)"
      example: "{'type': 'slider_change', 'param': 'temperature', 'value': 0.75}"
    
    - name: "calculation_results"
      type: "Dict[str, float]"
      description: "Results from calculation engine"
      example: "{'output1': 0.85, 'output2': 0.62, 'output3': 0.94}"
  
  outputs:
    - name: "visualization_state"
      type: "Dict[str, Any]"
      description: "Complete state for visualization renderers"
      example: "{'mode': 'ternary', 'data': {...}, 'history': [...], 'performance': {...}}"
    
    - name: "performance_metrics"
      type: "Dict[str, float]"
      description: "Real-time performance data"
      example: "{'fps': 59.8, 'latency_ms': 3.2, 'frame_drops': 0}"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "Mode switching completes in < 200ms"
    test: "Time mode switch operation with performance.now()"
    example: |
      # Example test command
      pytest tests/unit/test_integration_manager.py::test_mode_switch_performance -v
  
  - criterion: "Slider updates propagate in < 5ms"
    test: "Measure latency from onChange to state update"
    example: |
      pytest tests/unit/test_state_manager.py::test_slider_update_latency -v
  
  - criterion: "History queue maintains exactly 100 entries max"
    test: "Add 150 entries and verify only last 100 remain"
    example: |
      pytest tests/unit/test_history_tracker.py::test_history_queue_limit -v
  
  - criterion: "FPS stays at 60 during continuous updates"
    test: "Run 10-second slider drag test with FPS monitoring"
    example: |
      pytest tests/integration/test_performance_monitor.py::test_sustained_fps -v

# ================================================================================
# TDD IMPLEMENTATION PLAN - Step-by-step guide for implementation
# ================================================================================
week_1_task:
  title: "Build Integration Layer (TDD Approach)"
  
  steps:
    - step: 1
      action: "Write failing unit tests (RED phase)"
      file: "tests/unit/test_integration_manager.py"
      tests:
        - "test_initialization_with_default_state"
        - "test_mode_switching_updates_state"
        - "test_slider_update_triggers_recalculation"
        - "test_invalid_mode_falls_back_gracefully"
      duration: "2 hours"
    
    - step: 2
      action: "Run pytest to confirm RED phase"
      command: "pytest tests/unit/test_integration_manager.py -v"
      expected: "All tests FAIL (as expected)"
      duration: "2 min"
    
    - step: 3
      action: "Implement VisualizationIntegrationManager (GREEN phase)"
      file: "src/visualization_integration/integration_manager.py"
      methods:
        - "__init__(initial_state: Dict[str, Any]) → None"
        - "switch_visualization_mode(mode: str) → None"
        - "update_from_slider(param: str, value: float) → None"
      duration: "3 hours"
    
    - step: 4
      action: "Run pytest to confirm GREEN phase"
      command: "pytest tests/unit/test_integration_manager.py -v"
      expected: "All tests PASS"
      duration: "5 min"
    
    - step: 5
      action: "Refactor for code quality (REFACTOR phase)"
      improvements:
        - "Extract state update logic to StateManager class"
        - "Implement event debouncing for performance"
        - "Add comprehensive type hints"
      duration: "1 hour"
    
    - step: 6
      action: "Integration test with visualization components"
      file: "tests/integration/test_visualization_integration.py"
      duration: "2 hours"
  
  total_time: "8 hours 7 minutes"
  
  deliverable: "Fully functional integration layer connecting UI to 3D visualizations with < 5ms latency and 60 FPS performance"

# ====================================================================================
# INTEGRATION POINTS - How this layer connects to others
# ====================================================================================
integration:
  input_from:
    - layer: "LAYER-001-002-001"
      data_type: "UI events (dropdown selections, slider changes)"
      interface: "Event handlers passed as props to React components"
    
    - layer: "LAYER-001-002-009"
      data_type: "Calculation results and model outputs"
      interface: "calculateOutputs() returns Dict[str, float]"
  
  output_to:
    - layer: "LAYER-001-002-002"
      data_type: "Ternary visualization state"
      interface: "updateTernaryDiagram(state: TernaryState)"
    
    - layer: "LAYER-001-002-003"
      data_type: "Feasibility volume state"
      interface: "updateFeasibilityVolume(state: VolumeState)"
    
    - layer: "LAYER-001-002-004"
      data_type: "Parallel coordinates state"
      interface: "updateParallelCoordinates(state: ParallelState)"
  
  shared_dependencies:
    - "Zustand store for centralized state management"
    - "Performance utilities for FPS and latency tracking"

# ================================================================================
# TESTING STRATEGY - Different test levels for this layer
# ================================================================================
testing_strategy:
  unit_tests:
    location: "tests/unit/test_integration_manager.py"
    coverage_target: "90%"
    key_scenarios:
      - "State initialization and validation"
      - "Mode switching with persistence"
      - "Real-time slider update handling"
      - "History queue management"
      - "Performance threshold monitoring"
  
  integration_tests:
    location: "tests/integration/test_visualization_integration.py"
    scenarios:
      - "Full UI to visualization update flow"
      - "Multi-component state synchronization"
      - "Performance under sustained load"
  
  fixtures:
    location: "tests/fixtures/integration/"
    files:
      - "sample_ui_events.json"
      - "sample_calculation_results.json"
      - "expected_visualization_states.json"

# ================================================================================
# DEPLOYMENT NOTES - How to deploy/use this layer
# ================================================================================
deployment:
  dependencies:
    - package: "zustand"
      version: "^4.4.0"
      purpose: "State management for React"
    - package: "immer"
      version: "^10.0.0"
      purpose: "Immutable state updates"
    - package: "@react-three/fiber"
      version: "^8.15.0"
      purpose: "React Three.js integration"
  
  configuration:
    - setting: "performance.targetFPS"
      value: "60"
      location: "config/visualization.yaml"
    - setting: "history.maxEntries"
      value: "100"
      location: "config/visualization.yaml"
  
  usage_example: |
    # Example of how to use this layer
    from src.visualization_integration import VisualizationIntegrationManager
    
    # Initialize with default state
    manager = VisualizationIntegrationManager({
        'mode': 'ternary',
        'inputs': {'param1': 0.5, 'param2': 0.3},
        'outputs': {'output1': 0.0, 'output2': 0.0}
    })
    
    # Handle UI events
    manager.switch_visualization_mode('response_surface')
    manager.update_from_slider('temperature', 0.75)
    
    # Get current state for rendering
    state = manager.get_visualization_state()

