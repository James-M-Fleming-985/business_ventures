# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - Performance is critical - must maintain 60 FPS during all operations
  - State updates must be batched to prevent excessive re-renders
  - History tracking should use efficient data structures (deque)
  - Mode switching should preload assets to meet < 200ms requirement
  
  DESIGN DECISIONS:
  - Zustand chosen over Redux for simpler state management
  - Event debouncing applied to slider changes for performance
  - Immutable updates via Immer to prevent React render issues
  
  FUTURE ENHANCEMENTS:
  - Add WebGL context loss recovery
  - Implement progressive quality reduction under load
  - Add state persistence to IndexedDB for session recovery
  - Support for custom visualization modes via plugin system

