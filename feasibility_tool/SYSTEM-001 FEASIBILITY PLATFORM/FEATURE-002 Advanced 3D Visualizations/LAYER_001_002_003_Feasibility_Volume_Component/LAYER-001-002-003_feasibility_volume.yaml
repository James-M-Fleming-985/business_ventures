    - setting: "morphSpeed"
      value: "0.1"
      location: "config/visualization.yaml"
  
  usage_example: |
    # Example of how to use this layer
    import { FeasibilityVolumeComponent } from './feasibility_volume/FeasibilityVolumeComponent'
    
    function VisualizationContainer() {
      return (
        <Canvas>
          <FeasibilityVolumeComponent
            constraints={activeConstraints}
            currentPoint={currentConfig}
            showReferencePlanes={showPlanes}
            colorScale="viridis"
          />
        </Canvas>
      )
    }

# ================================================================================
# CODE GENERATION CONSTRAINTS - CRITICAL for AI Code Generation Quality
# ================================================================================
# These constraints MUST be followed when AI generates implementation code
# Violations will cause runtime errors and integration failures
# ================================================================================
code_generation_constraints:  
  # Language Specification - CRITICAL: Prevents wrong language generation
  programming_language: "TypeScript"
  file_extensions: [".tsx", ".ts"]
  runtime_environment: "React Browser Environment (Node.js 18+)"
  primary_framework: "React 18.2.0 (functional components with hooks)"
  rendering_library: "@react-three/fiber (latest)"
  graphics_library: "Three.js (latest)"
  ui_framework: "Material-UI 5.x"
  type_checking: "TypeScript 5.0+ strict mode"
  
  # Output Format Rules - Prevents markdown wrapping
  output_format:
    - "Return ONLY raw TypeScript/TSX code - NO explanations or commentary"
    - "NO markdown code fences (```typescript or ```)"
    - "First line MUST be valid TypeScript (import statement or interface)"
    - "Last line MUST be valid TypeScript code (NOT a closing markdown fence)"
    - "File must be directly executable without any preprocessing"
  
  
  # API Usage Rules - Prevents method invention
  api_usage:
    - "ONLY use Three.js APIs that exist in version 0.150.0"
    - "DO NOT invent Three.js methods or properties"
    - "Use EXACT method names from @react-three/fiber and @react-three/drei"
    - "BufferGeometry vertex updates must use setAttribute, not direct array access"
    - "Use proper TypeScript types from @types/three"
  
  # Import Completeness Rules - Prevents missing imports
  import_completeness:
    - "Import ALL Three.js classes used (BufferGeometry, Float32BufferAttribute, etc.)"
    - "Import React hooks (useEffect, useMemo, useRef) before use"
    - "Import type definitions from './types' for custom interfaces"
    - "Import color scale functions from d3-scale-chromatic"
    - "Remove unused imports to maintain clean code"
  
  # Performance Rules - Ensures 60 FPS requirement
  performance_requirements:
    - "Use useMemo for expensive mesh generation"
    - "Update vertices in-place, never recreate geometry"
    - "Use morphVertices with lerp, not direct assignment"
    - "Batch vertex updates in single setAttribute call"
    - "Avoid creating new objects in render loop"
  
  # React Three Fiber Rules - Ensures proper integration
  r3f_requirements:
    - "Components must return JSX with Three.js elements"
    - "Use useFrame for animation updates, not setInterval"
    - "Props must follow R3F conventions (position as array, not object)"
    - "Event handlers use R3F events (onClick, onPointerMove)"
    - "Refs use useRef<THREE.Mesh>() with proper typing"

# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - Mesh resolution of 50x50 is optimal balance between visual quality and performance
  - Vertex morphing must use lerp to avoid jarring transitions
  - Gradient calculation requires boundary handling for edge vertices
  - Reference planes should be semi-transparent to avoid occluding volume
  
  DESIGN DECISIONS:
  - BufferGeometry chosen over Geometry for better performance
  - Finite differences preferred over analytical gradients for flexibility
  - Viridis color scale as default for best colorblind accessibility
  
  FUTURE ENHANCEMENTS:
  - Adaptive mesh resolution based on complexity
  - GPU-based gradient computation using compute shaders
  - Volumetric ray marching for better interior visualization

