# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Feasibility Volume 3D Visualization Component"
  
  description: |
    Renders an interactive 3D volume that represents the feasible solution space
    based on active constraints. The volume morphs smoothly as constraint parameters
    change, providing visual feedback about the size and shape of valid solutions.
    Uses a 50x50 mesh with vertex position morphing for smooth transitions, gradient
    vectors for surface normals, and toggleable reference planes for context.
  
  rationale: |
    Engineers need to understand how constraints affect the available solution space.
    A morphing 3D volume provides intuitive visual feedback about feasibility boundaries,
    helping users identify when they're approaching constraint limits and how different
    parameters interact to define the feasible region.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/feasibility_volume/FeasibilityVolumeComponent.tsx"
    modules:
      - "FeasibilityVolumeComponent.tsx"     # Main React component with Three.js scene
      - "VolumeGeometry.ts"                  # Mesh generation and morphing logic
      - "GradientCalculator.ts"              # Finite difference gradient computation
      - "ReferencePlanes.tsx"                # Toggleable reference plane components
      - "types.ts"                           # TypeScript interfaces for volume data
  
  # Main classes/functions to implement
  classes:
    - name: "FeasibilityVolumeComponent"
      purpose: "React component that renders the 3D feasibility volume visualization"
      methods:
        - name: "render"
          signature: "render(): JSX.Element"
          purpose: "Renders Three.js Canvas with volume mesh and controls"
          example: |
            # Example usage
            <FeasibilityVolumeComponent
              constraints={activeConstraints}
              currentPoint={currentConfiguration}
              showReferencePlanes={true}
              colorScale="viridis"
            />
        
        - name: "updateVolume"
          signature: "updateVolume(constraints: Constraint[]): void"
          purpose: "Updates mesh vertices based on constraint changes"
          example: |
            # Called when constraints change
            componentRef.current.updateVolume(newConstraints)
    
    - name: "VolumeGeometry"
      purpose: "Manages the 50x50 mesh geometry and vertex morphing"
      methods:
        - name: "generateMesh"
          signature: "generateMesh(resolution: number): BufferGeometry"
          purpose: "Creates initial mesh with specified resolution"
          example: |
            const geometry = VolumeGeometry.generateMesh(50)
        
        - name: "morphVertices"
          signature: "morphVertices(geometry: BufferGeometry, targetPositions: Float32Array, t: number): void"
          purpose: "Smoothly interpolates vertex positions using lerp"
          example: |
            VolumeGeometry.morphVertices(mesh.geometry, newPositions, 0.1)
    
    - name: "GradientCalculator"
      purpose: "Computes surface gradients using finite differences"
      methods:
        - name: "computeGradients"
          signature: "computeGradients(vertices: Float32Array, gridSize: number): Float32Array"
          purpose: "Calculates gradient vectors for surface normals"
          example: |
            const gradients = GradientCalculator.computeGradients(vertices, 50)
  
  # Key technical details
  implementation_details:
    libraries: ["@react-three/fiber", "@react-three/drei", "three", "d3-scale-chromatic"]
    patterns: ["Component Pattern", "Vertex Morphing", "Finite Differences"]
    error_handling:
      - error_type: "InvalidConstraintError"
        handling: "Fall back to default volume bounds with console warning"
      - error_type: "MeshUpdateError"
        handling: "Skip frame update and log error, maintain previous state"
  
  # Input/output contract
  inputs:
    - name: "constraints"
      type: "Constraint[]"
      description: "Array of active constraint definitions"
      example: "[{name: 'pressure', min: 0, max: 100, current: 50}]"
    
    - name: "currentPoint"
      type: "Point3D"
      description: "Current configuration position in 3D space"
      example: "{x: 0.5, y: 0.3, z: 0.7}"
    
    - name: "showReferencePlanes"
      type: "boolean"
      description: "Toggle reference plane visibility"
      example: "true"
    
    - name: "colorScale"
      type: "ColorScale"
      description: "Colorblind-friendly color scale selection"
      example: "'viridis' | 'plasma' | 'cividis'"
  
  outputs:
    - name: "volumeMesh"
      type: "THREE.Mesh"
      description: "Rendered 3D mesh representing feasible volume"
      example: "THREE.Mesh with BufferGeometry and MeshStandardMaterial"
    
    - name: "verticalMarker"
      type: "THREE.Line"
      description: "Vertical line marking current point position"
      example: "THREE.Line at currentPoint coordinates"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "50x50 mesh (2500 vertices) renders smoothly at 60 FPS"
    test: "Use Chrome DevTools Performance tab to verify frame rate during interaction"
    example: |
      # Performance test
      1. Open DevTools Performance tab
      2. Start recording
      3. Drag constraint sliders for 10 seconds
      4. Stop recording and verify average FPS >= 60
  
  - criterion: "Vertex positions update via lerp for smooth transitions"
    test: "Verify morphVertices uses linear interpolation between positions"
    example: |
      # Unit test
      test('morphVertices uses lerp interpolation', () => {
        const start = new Float32Array([0, 0, 0])
        const target = new Float32Array([1, 1, 1])
        morphVertices(geometry, target, 0.5)
        expect(geometry.attributes.position.array).toEqual([0.5, 0.5, 0.5])
      })
  
  - criterion: "Gradient vectors computed from finite differences"
    test: "Verify gradient calculation uses neighboring vertex differences"
    example: |
      # Integration test
      test('gradient vectors point outward from surface', () => {
        const gradients = computeGradients(sphereVertices, 50)
        // Verify gradients point away from center
        expect(dot(gradient, normal)).toBeGreaterThan(0)
      })
  
  - criterion: "Reference planes toggleable by user"
    test: "Verify planes appear/disappear based on showReferencePlanes prop"
    example: |
      # Component test
      test('reference planes toggle visibility', () => {
        const { rerender } = render(<FeasibilityVolumeComponent showReferencePlanes={false} />)
        expect(screen.queryByTestId('reference-planes')).not.toBeInTheDocument()
        rerender(<FeasibilityVolumeComponent showReferencePlanes={true} />)
        expect(screen.getByTestId('reference-planes')).toBeInTheDocument()
      })

