# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - WebGL has a limit on the number of vertices per draw call - batch polylines if needed
  - Text rendering in Three.js is expensive - use sprite-based labels for axes
  - Geometry pooling is critical for maintaining 60 FPS with history trails
  - Consider using InstancedBufferGeometry for multiple polylines with same structure
  
  DESIGN DECISIONS:
  - Using BufferGeometry over Geometry for better performance
  - Implementing custom shader material for efficient opacity fading
  - Normalizing all values to [0,1] simplifies axis scaling logic
  
  FUTURE ENHANCEMENTS:
  - Add axis brushing for filtering configurations
  - Implement axis reordering via drag-and-drop
  - Add configuration clustering visualization
  - Support categorical axes in addition to continuous

