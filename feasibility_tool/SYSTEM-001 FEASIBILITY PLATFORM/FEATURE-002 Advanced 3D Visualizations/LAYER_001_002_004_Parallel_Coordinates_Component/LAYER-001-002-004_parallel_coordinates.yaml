# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Parallel Coordinates Component"
  
  description: |
    Implements an interactive parallel coordinates visualization component using React
    and Three.js that displays all 16 dimensions (13 inputs + 3 outputs) of the
    optimization space. The component renders vertical axes for each parameter,
    connects parameter values with polylines, and maintains a visual history of the
    last 10 configurations with fading opacity. It supports real-time updates during
    slider manipulation while maintaining 60 FPS performance.
  
  rationale: |
    Parallel coordinates are essential for visualizing high-dimensional data where
    traditional 2D/3D plots fail. With 16 total dimensions in our optimization space,
    users need a way to see patterns, correlations, and trade-offs across all parameters
    simultaneously. This visualization reveals parameter relationships and helps identify
    optimal configuration regions that would be hidden in lower-dimensional projections.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/components/visualizations/ParallelCoordinatesComponent.tsx"
    modules:
      - "ParallelCoordinatesComponent.tsx"     # Main React component with Three.js scene
      - "ParallelCoordinatesGeometry.ts"       # Geometry generation for axes and polylines
      - "ParallelCoordinatesInteraction.ts"    # Mouse/touch interaction handlers
      - "ParallelCoordinatesUtils.ts"          # Scaling, normalization, color utilities
  
  # Main classes/functions to implement
  classes:
    - name: "ParallelCoordinatesComponent"
      purpose: "React component that renders the parallel coordinates visualization"
      methods:
        - name: "render"
          signature: "render(): JSX.Element"
          purpose: "Renders the Three.js canvas and axis labels"
          example: |
            # Example usage
            <ParallelCoordinatesComponent
              currentConfig={currentConfig}
              history={configHistory}
              onAxisClick={handleAxisClick}
            />
        
        - name: "updatePolylines"
          signature: "updatePolylines(configs: Configuration[]): void"
          purpose: "Updates polyline geometries for current and historical configurations"
          
        - name: "handleResize"
          signature: "handleResize(): void"
          purpose: "Adjusts axis spacing and scene dimensions on window resize"
    
    - name: "ParallelCoordinatesGeometry"
      purpose: "Generates Three.js geometries for axes and polylines"
      methods:
        - name: "createAxes"
          signature: "createAxes(parameters: Parameter[]): THREE.Group"
          purpose: "Creates vertical line geometries for each parameter axis"
          
        - name: "createPolyline"
          signature: "createPolyline(config: Configuration, axisPositions: number[]): THREE.BufferGeometry"
          purpose: "Creates connected line geometry through all axis points"
          
        - name: "createAxisLabels"
          signature: "createAxisLabels(parameters: Parameter[]): THREE.Group"
          purpose: "Creates text sprites for axis labels and tick marks"
  
  # Key technical details
  implementation_details:
    libraries: ["react", "three", "@react-three/fiber", "@react-three/drei", "d3-scale", "d3-color"]
    patterns: ["Component Pattern", "Observer Pattern", "Geometry Pooling"]
    error_handling:
      - error_type: "InvalidConfigurationError"
        handling: "Log error and render empty polyline"
      - error_type: "WebGLContextLostError"
        handling: "Attempt context restoration with exponential backoff"
  
  # Input/output contract
  inputs:
    - name: "currentConfig"
      type: "Configuration"
      description: "Current parameter configuration to highlight"
      example: "{inputs: [0.5, 0.3, ...], outputs: [0.8, 0.7, 0.9]}"
    
    - name: "history"
      type: "Configuration[]"
      description: "Array of last 10 historical configurations"
      example: "[{inputs: [...], outputs: [...]}, ...]"
    
    - name: "colorScale"
      type: "ColorScale"
      description: "Colorblind-friendly color scale (viridis, plasma, cividis)"
      example: "viridis"
  
  outputs:
    - name: "onAxisClick"
      type: "(axisIndex: number) => void"
      description: "Callback when user clicks on an axis"
      example: "handleAxisClick(5) // User clicked 6th axis"
    
    - name: "onBrushSelection"
      type: "(axisIndex: number, range: [number, number]) => void"
      description: "Callback when user brushes a range on an axis"
      example: "handleBrush(3, [0.2, 0.7])"

# ================================================================================
# ACCEPTANCE CRITERIA - How to verify this layer works correctly
# ================================================================================
acceptance_criteria:
  - criterion: "Renders all 16 axes (13 inputs + 3 outputs) with correct labels"
    test: "Visual inspection confirms 16 vertical axes with parameter names and units"
    example: |
      # Example test command
      pytest tests/unit/test_parallel_coordinates.py::test_axis_rendering -v
  
  - criterion: "Current configuration displayed as bright polyline connecting all axes"
    test: "Verify polyline passes through normalized parameter values on each axis"
    
  - criterion: "Last 10 configurations shown with decreasing opacity (1.0 to 0.1)"
    test: "Check polyline materials have correct opacity values in reverse chronological order"
    
  - criterion: "Updates within 5ms when currentConfig prop changes"
    test: "Measure time between prop update and geometry update completion"
    
  - criterion: "Maintains 60 FPS during continuous updates"
    test: "Run performance profiler during 10-second continuous update test"
    
  - criterion: "Uses colorblind-friendly palette for polyline coloring"
    test: "Verify colors match viridis/plasma/cividis color scale values"
    
  - criterion: "Axis values normalized to [0, 1] range for consistent display"
    test: "Check all polyline vertices have y-coordinates between 0 and 1"
    
  - criterion: "Responsive to container size changes"
    test: "Resize container and verify axes redistribute evenly"

