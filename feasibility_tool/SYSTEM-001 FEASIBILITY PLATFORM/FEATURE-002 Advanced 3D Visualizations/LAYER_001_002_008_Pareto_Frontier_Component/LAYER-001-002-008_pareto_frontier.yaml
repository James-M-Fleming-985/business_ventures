deployment:
  dependencies:
    - package: "@react-three/fiber"
      version: "^8.0.0"
      purpose: "React renderer for Three.js"
    
    - package: "@react-three/drei"
      version: "^9.0.0"
      purpose: "Helper components for React Three Fiber"
    
    - package: "quickhull3d"
      version: "^2.0.0"
      purpose: "Efficient 3D convex hull computation"
    
    - package: "d3-scale-chromatic"
      version: "^3.0.0"
      purpose: "Colorblind-friendly color scales"
  
  configuration:
    - setting: "pareto.minPoints"
      value: "30"
      location: "config/visualization.yaml"
    
    - setting: "pareto.zoneCount"
      value: "5"
      location: "config/visualization.yaml"
    
    - setting: "pareto.updateThreshold"
      value: "0.1"
      location: "config/visualization.yaml"
  
  usage_example: |
    # Example of how to use this layer
    import { ParetoFrontier } from './components/visualizations/ParetoFrontier';
    
    function App() {
      const history = useExplorationHistory();
      const current = useCurrentConfiguration();
      
      return (
        <ParetoFrontier
          explorationHistory={history}
          currentConfiguration={current}
          selectedObjectives={['yield', 'purity', 'cost']}
          colorScheme="viridis"
        />
      );
    }

