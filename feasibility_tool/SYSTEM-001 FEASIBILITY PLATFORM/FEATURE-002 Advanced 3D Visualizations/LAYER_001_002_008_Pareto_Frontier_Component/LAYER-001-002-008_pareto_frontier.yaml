# ================================================================================
# NOTES - Additional context, gotchas, or important information
# ================================================================================
notes: |
  IMPORTANT CONSIDERATIONS:
  - Convex hull computation is O(n log n) - cache results when possible
  - Three.js objects must be explicitly disposed to prevent memory leaks
  - Use instancedMesh for rendering multiple zone layers efficiently
  - QuickHull algorithm may fail with coplanar points - add small random perturbation
  
  DESIGN DECISIONS:
  - Using QuickHull3D over Gift Wrapping for better average-case performance
  - Limiting to 3 objectives for visualization (higher dimensions projected)
  - Zone colors use perceptually uniform gradients for better interpretation
  
  FUTURE ENHANCEMENTS:
  - Support for 4D visualization using time animation
  - Interactive frontier point selection to show trade-offs
  - Export frontier data as CSV for external analysis
  - Support for non-convex Pareto frontiers using alpha shapes

