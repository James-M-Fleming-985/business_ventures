# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "Pareto Frontier 3D Visualization Component"
  
  description: |
    Implements a Three.js-based 3D visualization component that computes and renders
    the Pareto-optimal frontier from exploration history data. The component displays
    a convex hull representing the boundary of optimal solutions, shows the current
    configuration's distance to the frontier, and uses color zones to indicate levels
    of optimality. The visualization updates in real-time as new data points are
    added and provides interactive rotation, zoom, and pan controls.
  
  rationale: |
    In multi-objective optimization problems, understanding the trade-off boundary
    between competing objectives is crucial for decision-making. The Pareto frontier
    visualization helps users identify optimal configurations where improving one
    objective necessarily degrades another. This visual representation enables users
    to make informed decisions about which trade-offs are acceptable for their
    specific use case.

# ====================================================================================
# SPECIFICATION - Technical details of what to build
# ====================================================================================
specification:
  # File/module structure
  structure:
    entry_point: "src/components/visualizations/ParetoFrontier.tsx"
    modules:
      - "ParetoFrontier.tsx"          # Main React component with Three.js integration
      - "paretoComputation.ts"        # Convex hull and distance calculation algorithms
      - "paretoGeometry.ts"          # 3D geometry generation for frontier surface
      - "paretoColors.ts"            # Color mapping and optimality zone definitions
      - "types/paretoTypes.ts"       # TypeScript type definitions
  
  # Main classes/functions to implement
  classes:
    - name: "ParetoFrontier"
      purpose: "React component that renders 3D Pareto frontier visualization"
      methods:
        - name: "computeConvexHull"
          signature: "computeConvexHull(points: DataPoint[]) -> ConvexHull"
          purpose: "Computes 3D convex hull from sample points using QuickHull algorithm"
          example: |
            # Example usage
            const hull = computeConvexHull(historyPoints);
            // Returns mesh geometry representing Pareto frontier
        
        - name: "calculateDistanceToFrontier"
          signature: "calculateDistanceToFrontier(point: DataPoint, hull: ConvexHull) -> number"
          purpose: "Calculates minimum distance from current point to frontier surface"
          example: |
            # Example usage
            const distance = calculateDistanceToFrontier(currentPoint, hull);
            // Returns normalized distance value 0-1
        
        - name: "generateOptimalityZones"
          signature: "generateOptimalityZones(hull: ConvexHull) -> ZoneMesh[]"
          purpose: "Creates color-coded zones around frontier indicating optimality levels"
          example: |
            # Example usage
            const zones = generateOptimalityZones(hull);
            // Returns array of mesh geometries with color gradients
        
        - name: "updateVisualization"
          signature: "updateVisualization(data: CalculationResult[]) -> void"
          purpose: "Updates frontier visualization when new data arrives"
          example: |
            # Example usage
            updateVisualization(explorationHistory);
            // Recomputes hull and updates Three.js scene
  
  # Key technical details
  implementation_details:
    libraries: ["@react-three/fiber", "@react-three/drei", "three", "quickhull3d", "d3-scale-chromatic"]
    patterns: ["React Hooks Pattern", "Memoization Pattern", "Observer Pattern"]
    error_handling:
      - error_type: "InsufficientDataError"
        handling: "Display message when < 30 points available for hull computation"
      - error_type: "ConvexHullError"
        handling: "Fallback to bounding box visualization if hull computation fails"
      - error_type: "RenderingError"
        handling: "Gracefully degrade to 2D projection if WebGL unavailable"
  
  # Input/output contract
  inputs:
    - name: "explorationHistory"
      type: "CalculationResult[]"
      description: "Array of historical calculation results with input/output values"
      example: "[{inputs: {...}, outputs: {yield: 0.8, purity: 0.9, cost: 1000}}, ...]"
    
    - name: "currentConfiguration"
      type: "CalculationResult"
      description: "Current parameter configuration and its outputs"
      example: "{inputs: {...}, outputs: {yield: 0.85, purity: 0.88, cost: 950}}"
    
    - name: "selectedObjectives"
      type: "string[]"
      description: "Which output objectives to use for Pareto frontier (max 3)"
      example: "['yield', 'purity', 'cost']"
    
    - name: "colorScheme"
      type: "ColorSchemeType"
      description: "Colorblind-friendly color scheme selection"
      example: "'viridis' | 'plasma' | 'cividis'"
  
  outputs:
    - name: "paretoVisualization"
      type: "JSX.Element"
      description: "React Three Fiber canvas with interactive 3D Pareto frontier"
      example: "<Canvas><ParetoFrontierMesh /></Canvas>"
    
    - name: "frontierMetrics"
      type: "FrontierMetrics"
      description: "Computed metrics about current point's optimality"
      example: "{distanceToFrontier: 0.15, nearestFrontierPoint: {...}, optimalityScore: 0.85}"

