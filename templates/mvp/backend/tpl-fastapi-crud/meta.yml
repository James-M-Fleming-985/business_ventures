# Template Metadata: FastAPI CRUD Backend
id: "tpl-backend-fastapi-crud"
name: "FastAPI CRUD Backend"
version: "1.0.0"
layer_type: "api"
status: "approved"

description: |
  Complete CRUD backend with repository pattern, FastAPI router, and SQLAlchemy model.
  Includes:
  - SQLAlchemy model with configurable fields
  - Repository with get, list, create, update, delete operations
  - FastAPI router with REST endpoints
  - Pydantic schemas for request/response validation

frameworks:
  - fastapi
  - sqlalchemy
  - pydantic

tags:
  - crud
  - rest-api
  - database
  - repository-pattern

# Variable schema reference
variables_schema: "variables.schema.json"

# Output files generated by this template
outputs:
  - path: "{{output_dir}}/models/{{model_name_snake}}.py"
    template: "model.py.jinja"
    description: "SQLAlchemy model definition"
  
  - path: "{{output_dir}}/repositories/{{model_name_snake}}_repository.py"
    template: "repository.py.jinja"
    description: "Repository with CRUD operations"
  
  - path: "{{output_dir}}/routers/{{model_name_snake}}_router.py"
    template: "router.py.jinja"
    description: "FastAPI router with REST endpoints"
  
  - path: "{{output_dir}}/schemas/{{model_name_snake}}_schemas.py"
    template: "schemas.py.jinja"
    description: "Pydantic request/response schemas"

# Cost estimation for CA-005
cost_estimate_tokens: 800
generation_time_seconds: 5

# Template is cacheable for reuse
cacheable: true

# Usage examples
example_params: "example_params.yaml"

# Maintainer
owner: "control_tower"
created: "2025-01-18"
last_updated: "2025-01-18"
