# Template Metadata: FastAPI JWT Authentication
id: "tpl-backend-fastapi-auth"
name: "FastAPI JWT Authentication"
version: "1.0.0"
layer_type: "api"
status: "approved"

description: |
  Complete JWT authentication system for FastAPI.
  Includes:
  - User registration with password hashing (bcrypt)
  - Login endpoint with JWT token generation
  - Token refresh endpoint
  - Password reset flow
  - Protected route dependencies
  - Role-based access control (optional)

frameworks:
  - fastapi
  - sqlalchemy
  - pydantic
  - python-jose
  - passlib

tags:
  - authentication
  - jwt
  - security
  - user-management
  - auth

# Variable schema reference
variables_schema: "variables.schema.json"

# Output files generated by this template
outputs:
  - path: "{{output_dir}}/auth/router.py"
    template: "auth_router.py.jinja"
    description: "Authentication router with login/register/refresh endpoints"
  
  - path: "{{output_dir}}/auth/dependencies.py"
    template: "auth_dependencies.py.jinja"
    description: "Auth dependencies for protected routes"
  
  - path: "{{output_dir}}/auth/utils.py"
    template: "auth_utils.py.jinja"
    description: "Password hashing and JWT token utilities"
  
  - path: "{{output_dir}}/auth/schemas.py"
    template: "auth_schemas.py.jinja"
    description: "Pydantic schemas for auth requests/responses"
  
  - path: "{{output_dir}}/models/user.py"
    template: "user_model.py.jinja"
    description: "User model with password field"
    condition: "include_user_model"

# Cost estimation for CA-005
cost_estimate_tokens: 1200
generation_time_seconds: 8

# Template is cacheable for reuse
cacheable: true

# Usage examples
example_params: "example_params.yaml"

# Maintainer
owner: "control_tower"
created: "2025-10-22"
last_updated: "2025-10-22"
