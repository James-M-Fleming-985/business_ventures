# Template Metadata: Statistical Correlation Analysis Engine
id: "tpl-correlation-analysis"
name: "Statistical Correlation Analysis Engine"
version: "2.0.0"
layer_type: "api"
status: "approved"

description: |
  Complete correlation analysis engine with Pearson, Spearman, Kendall, partial and lagged correlations.
  Based on real AI Code Generator output patterns.
  Includes:
  - @dataclass configuration patterns
  - Concurrent processing with ThreadPoolExecutor
  - Missing data handling strategies
  - Feature orchestrator integration
  - Statistical calculation engine with multiple correlation methods
  - Comprehensive error handling and logging

frameworks:
  - numpy
  - scipy
  - pandas
  - concurrent.futures

tags:
  - correlation
  - statistics
  - data-analysis
  - timeseries
  - scientific-computing
  - concurrent-processing
  - feature-orchestrator

# Variable schema reference
variables_schema: "variables.schema.json"

# Output files generated by this template
outputs:
  - path: "correlation_engine.py"
    description: "Main correlation calculation engine with config dataclass"
    source: "correlation_engine.py.jinja"
  - path: "tests/test_correlation_engine.py"
    description: "Comprehensive unit tests with integration testing"
    source: "tests/test_correlation_engine.py.jinja"
  - path: "README.md"
    description: "Usage documentation and examples"
    source: "README.md.jinja"

# Cost estimation (tokens)
cost_estimate_tokens: 1200

# Dependencies for this template
dependencies:
  python_packages:
    - "numpy>=1.21.0"
    - "scipy>=1.7.0"
    - "pandas>=1.3.0"
    - "pytest>=6.0.0"
    
# Integration notes
integration:
  feature_orchestrator: true
  concurrent_processing: true
  missing_data_handling: ["interpolate", "drop", "fill"]