id: tpl-analytics-mixpanel
name: Mixpanel Analytics Integration
version: 1.0.0
status: approved
layer_type: analytics
cacheable: true

description: |
  Mixpanel product analytics integration for user behavior tracking.
  Includes event tracking, user profiles, funnels, and cohort analysis.
  Supports both React and vanilla JavaScript implementations.

frameworks:
  - mixpanel
  - mixpanel-browser

tags:
  - analytics
  - tracking
  - mixpanel
  - product-analytics
  - user-behavior

variables:
  - name: project_token
    type: string
    required: true
    description: "Mixpanel Project Token"
    example: "abc123def456ghi789"
  
  - name: app_name
    type: string
    required: true
    description: "Application name for tracking"
    example: "My SaaS App"
  
  - name: environment
    type: string
    required: false
    default: "production"
    description: "Environment (production/staging/development)"
  
  - name: enable_debug
    type: boolean
    required: false
    default: false
    description: "Enable Mixpanel debug mode"
  
  - name: track_pageviews
    type: boolean
    required: false
    default: true
    description: "Automatically track pageviews"
  
  - name: persistence_type
    type: string
    required: false
    default: "localStorage"
    description: "Storage type (localStorage/cookie)"

outputs:
  - path: "analytics/mixpanel-config.js"
    description: "Mixpanel configuration and initialization"
  
  - path: "analytics/mixpanel-events.js"
    description: "Event tracking helpers and pre-defined events"
  
  - path: "analytics/mixpanel-react.tsx"
    description: "React component wrapper for Mixpanel"

cost_estimate_tokens: 450
estimated_generation_time: "~2 seconds"

dependencies:
  npm:
    - "mixpanel-browser: ^2.47.0"

environment_variables:
  - name: VITE_MIXPANEL_TOKEN
    description: "Mixpanel Project Token"
    required: true
    example: "abc123def456ghi789"
  
  - name: VITE_MIXPANEL_DEBUG
    description: "Enable debug mode"
    required: false
    example: "false"

usage_example: |
  # Generate Mixpanel tracking setup
  python mvp_generator.py --template tpl-analytics-mixpanel \
    --var project_token=abc123def456 \
    --var app_name="My App"
  
  # Track custom event
  trackEvent('Button Clicked', { button_name: 'signup' });
  
  # Identify user
  identifyUser('user123', { email: 'user@example.com', plan: 'pro' });

integration_notes: |
  - Add VITE_MIXPANEL_TOKEN to .env
  - Import and initialize in main app entry point
  - Use React component wrapper for SPA tracking
  - Events and user properties are automatically sent
  - Supports funnel analysis and cohort tracking
