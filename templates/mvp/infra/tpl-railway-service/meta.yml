# Template Metadata: Railway Service Deployment
id: "tpl-infra-railway-service"
name: "Railway Service Deployment"
version: "1.0.0"
layer_type: "infra"
status: "approved"

description: |
  Railway deployment configuration for web services.
  Includes:
  - railway.json with build and start commands
  - Health check configuration
  - Environment variable setup
  - PostgreSQL database provisioning (optional)

frameworks:
  - railway
  - docker

tags:
  - deployment
  - hosting
  - ci-cd
  - production

# Variable schema reference
variables_schema: "variables.schema.json"

# Output files generated by this template
outputs:
  - path: "railway.json"
    template: "railway.json.jinja"
    description: "Railway deployment configuration"
  
  - path: "{{output_dir}}/health.py"
    template: "health.py.jinja"
    description: "Health check endpoint"
    condition: "include_health_check"

# Cost estimation for CA-005
cost_estimate_tokens: 200
generation_time_seconds: 3

# Template is cacheable for reuse
cacheable: true

# Usage examples
example_params: "example_params.yaml"

# Maintainer
owner: "control_tower"
created: "2025-10-22"
last_updated: "2025-10-22"
