# Template Metadata: React Landing Page
id: "tpl-frontend-react-landing"
name: "React Landing Page"
version: "1.0.0"
layer_type: "ui"
status: "approved"

description: |
  Modern landing page component with React and TypeScript.
  Includes:
  - Hero section with headline and CTA
  - Features grid (3-4 feature cards)
  - Email capture form for lead generation
  - Responsive design with Tailwind CSS
  - SEO-friendly meta tags

frameworks:
  - react
  - typescript
  - tailwindcss

tags:
  - landing-page
  - marketing
  - lead-capture
  - seo
  - responsive

# Variable schema reference
variables_schema: "variables.schema.json"

# Output files generated by this template
outputs:
  - path: "{{output_dir}}/components/{{component_name}}.tsx"
    template: "Landing.tsx.jinja"
    description: "Main landing page component"
  
  - path: "{{output_dir}}/components/Hero.tsx"
    template: "Hero.tsx.jinja"
    description: "Hero section component"
  
  - path: "{{output_dir}}/components/Features.tsx"
    template: "Features.tsx.jinja"
    description: "Features grid component"
  
  - path: "{{output_dir}}/components/EmailCapture.tsx"
    template: "EmailCapture.tsx.jinja"
    description: "Email signup form component"

# Cost estimation for CA-005
cost_estimate_tokens: 600
generation_time_seconds: 5

# Template is cacheable for reuse
cacheable: true

# Usage examples
example_params: "example_params.yaml"

# Maintainer
owner: "control_tower"
created: "2025-10-22"
last_updated: "2025-10-22"
