    - "Average session duration >10 minutes"
    - "App store rating >4.0 stars with 100+ reviews"
  
  scale_success:
    - "100,000+ monthly active users"
    - "Premium subscription conversion rate >15%"
    - "Support ticket volume <5% of monthly active users"
