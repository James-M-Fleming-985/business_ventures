# ====================================================================================
# SYSTEM REQUIREMENTS TEMPLATE
# ====================================================================================
# SYSTEM-IMMERSIVE-01: Hardware Integration System
# ====================================================================================
# This template defines system-level requirements that are decomposed into features.
# ALL features in this system must follow the naming conventions and response
# structures defined here to ensure consistency and integration compatibility.
# ====================================================================================

metadata:
  system_id: SYSTEM-IMMERSIVE-01
  system_name: "Hardware Integration System"
  parent_project: PROJECT-IMMERSIVE-DISPLAYS
  created_date: 2025-10-31
  status: "planned"
  priority: "critical"
  
  purpose: |
    Develop and manage IoT-enabled lighting hardware with weather resistance, internet
    connectivity, and modular expansion capabilities. This system handles all physical
    hardware components including LED lights, speakers, control hubs, and effect modules.
    
    Provides the core infrastructure for transforming buildings into immersive displays
    through intelligent lighting control, audio synchronization, and environmental sensing.
  
  business_value: |
    - Enables core product offering through reliable hardware platform
    - Generates primary revenue stream from hardware sales (60% of initial revenue)
    - Provides competitive differentiation through weather durability and performance
    - Supports scalable installations from residential to commercial markets
    - Creates platform for future hardware expansion and upgrades
  
  traceability:
    parent_project_requirements:
      - "PROJECT-AC-001: Hardware responds to mobile app commands within 1 second"
      - "PROJECT-AC-002: System operates outdoors for 12+ months without failure" 
      - "PROJECT-AC-007: System scales to 100+ lights per installation"
    
    project_requirements_file: "../requirements/project_requirements.yaml"
    
    derivation_rationale: |
      This system directly implements the core hardware acceptance criteria from the project
      level requirements. The project vision of transforming buildings into immersive
      experiences requires reliable, weatherproof, networked hardware that can be controlled
      in real-time and scaled to large installations.

deployment:
  platform: Railway
  service_type: Backend API + Hardware Management Dashboard
  scaling: 1 backend + 1 dashboard (Phase 1) → 3 replicas (Phase 2)
  estimated_cost: "$30/month (Phase 1) → $90/month (Phase 2)"
  
  railway_config_backend:
    builder: NIXPACKS
    build_command: "pip install -r requirements.txt"
    start_command: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    health_check: "/health"
    restart_policy: ON_FAILURE
  
  railway_config_frontend:
    builder: NIXPACKS
    build_command: "npm install && npm run build"
    start_command: "npm run preview -- --host 0.0.0.0 --port $PORT"
    health_check: "/"
    restart_policy: ON_FAILURE

# ====================================================================================
# SHARED INTERFACES - CRITICAL FOR FEATURE CONSISTENCY
# ====================================================================================
# ALL features in this system MUST use these standardized interfaces.
# This ensures consistent communication between features and system orchestrators.
# Choose the appropriate response_structure based on your deployment_model.
# ====================================================================================

shared_interfaces:
  # ---------------------------------------------------------------------------------
  # FOR API/WEB APPLICATIONS
  # ---------------------------------------------------------------------------------
  # Use this structure when deployment_model is "FastAPI Backend" or similar
  # ---------------------------------------------------------------------------------
  api_response_structure:
    standard: "Pydantic BaseModel with HTTP semantics"
    deployment_models:
      - "FastAPI Backend"
      - "REST API"
      - "Web Service"
    
    required_fields:
      - name: "success"
        type: "bool"
        description: "Whether operation succeeded (true/false)"
        required: true
      
      - name: "data"
        type: "Optional[Any]"
        description: "Successful result payload (None if error)"
        required: true
      
      - name: "error"
        type: "Optional[str]"
        description: "Error message if failed (None if success)"
        required: true
      
      - name: "metadata"
        type: "Optional[Dict[str, Any]]"
        description: "Additional context (timestamps, trace IDs, hardware status)"
        required: true
    
    http_status_mapping:
      - "200 OK: Success with data (success=true)"
      - "201 Created: Device registered successfully (success=true)"
      - "400 Bad Request: Invalid device command (success=false, error=message)"
      - "404 Not Found: Device not found (success=false, error=message)"
      - "408 Request Timeout: Device not responding (success=false, error=message)"
      - "500 Internal Server Error: Hardware failure (success=false, error=message)"
    
    implementation_example: |
      ```python
      from pydantic import BaseModel, Field
      from typing import Optional, Any, Dict
      from datetime import datetime
      
      class HardwareResponse(BaseModel):
          success: bool
          data: Optional[Any] = None
          error: Optional[str] = None
          metadata: Optional[Dict[str, Any]] = Field(default_factory=dict)
          
          class Config:
              json_encoders = {
                  datetime: lambda v: v.isoformat()
              }
      ```
    
    usage_note: |
      Hardware API routers depend on this exact structure to:
      1. Map to HTTP status codes for device operations
      2. Return consistent JSON responses for mobile app
      3. Support error handling middleware for device failures
      4. Enable hardware health monitoring and tracing
      
      CRITICAL: All features must use identical HardwareResponse structure.
      Define once in app/schemas/hardware_response.py and import everywhere.

# ====================================================================================
# NAMING CONVENTIONS - CRITICAL FOR BUILD AUTOMATION
# ====================================================================================
# These conventions are ENFORCED by build_feature.py and REQUIRED for Python imports.
# The --init-layers flag uses these rules to auto-generate folder structures.
# ====================================================================================

naming_conventions:
  # ---------------------------------------------------------------------------------
  # FOLDER AND FILE NAMING RULES
  # ---------------------------------------------------------------------------------
  rules:
    system_folder:
      format: "SYSTEM-IMMERSIVE-{XX}_{system_name_with_underscores}"
      example: "SYSTEM-IMMERSIVE-01_hardware_integration"
      rationale: "Python import compatibility, clear identification"
    
    feature_folder:
      format: "FEATURE-IMMERSIVE-{SYSTEM_ID}-{FEATURE_NUM}_{feature_name_with_underscores}"
      example: "FEATURE-IMMERSIVE-01-001_device_communication"
      rationale: "Unique identification, sortable, Python import compatible"
    
    layer_folder:
      format: "LAYER_{layer_id_underscores}_{layer_name_with_underscores}"
      example: "LAYER_IMMERSIVE_01_001_001_MQTT_Device_Controller"
      conversion: "LAYER-IMMERSIVE-01-001-001 + 'MQTT Device Controller' → LAYER_IMMERSIVE_01_001_001_MQTT_Device_Controller"
      rationale: "Python cannot import modules with hyphens or spaces"
      critical_note: |
        This is the PRIMARY LESSON from SYSTEM-003 migration:
        - Layer folders MUST use underscores (not spaces or hyphens)
        - Layer IDs: Convert hyphens to underscores (LAYER-IMMERSIVE-01-001-001 → LAYER_IMMERSIVE_01_001_001)
        - Layer Names: Convert spaces to underscores (MQTT Device Controller → MQTT_Device_Controller)
        - build_feature.py enforces this via standardize_layer_folder_name()
        - No fallback logic exists - violations cause import errors
    
    yaml_files:
      system_file: "SYSTEM-IMMERSIVE-01.yaml"
      feature_file: "FEATURE-IMMERSIVE-01-{FEATURE_NUM}.yaml"
      layer_file: "REQ-IMMERSIVE-01-{FEATURE_NUM}-{LAYER_NUM}.yaml"
      location: "Always at the root of the corresponding folder"

# ====================================================================================
# SYSTEM FEATURES DECOMPOSITION
# ====================================================================================

