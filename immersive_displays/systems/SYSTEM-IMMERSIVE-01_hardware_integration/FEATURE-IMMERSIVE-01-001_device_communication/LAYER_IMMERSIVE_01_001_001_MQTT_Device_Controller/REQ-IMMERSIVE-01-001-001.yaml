# ====================================================================================
# REQUIREMENT DEFINITION - What this layer does and why
# ====================================================================================
requirement:
  title: "MQTT Device Controller"
  
  description: |
    Manages all MQTT protocol communication with IoT lighting devices. Provides
    connection management, message routing, topic handling, and protocol-level
    error recovery. Acts as the communication abstraction layer between higher-level
    device management services and the physical MQTT infrastructure.
    
    Ensures reliable, performant message delivery while handling network interruptions,
    connection failures, and protocol-level retry logic transparently.
  
  rationale: |
    IoT devices require reliable, low-latency communication for real-time lighting
    control. MQTT provides the publish/subscribe messaging pattern ideal for
    device command/status communication, but requires sophisticated connection
    management and error handling to meet our performance requirements.
    
    This layer encapsulates all MQTT complexity, providing a clean interface
    for device operations while ensuring robust connectivity under varying
    network conditions.
  
  assumptions:
    - "MQTT broker (AWS IoT Core or Eclipse Mosquitto) is available and accessible"
    - "Devices support MQTT client connections with TLS encryption"
    - "Network latency is typically <100ms but may spike to 200ms"
    - "Device certificates are properly provisioned for authentication"

# ====================================================================================
# FUNCTIONAL REQUIREMENTS - What the layer must do
# ====================================================================================
functional_requirements:
  
  # ---------------------------------------------------------------------------------
  # FR-001: Connection Management
  # ---------------------------------------------------------------------------------
  FR_001_connection_management:
    requirement_id: "FR-IMMERSIVE-01-001-001-001"
    title: "MQTT Connection Management"
    description: |
      Establish, maintain, and recover MQTT connections to device brokers.
      Handle connection lifecycle including authentication, keep-alive, and
      graceful disconnection.
    
    inputs:
      - name: "device_id"
        type: "str"
        description: "Unique identifier for the target device"
        validation: "Non-empty string, alphanumeric plus hyphens/underscores"
      
      - name: "connection_config"
        type: "Dict[str, Any]"
        description: "MQTT connection parameters (broker, port, certificates)"
        validation: "Valid broker URL, port 1883/8883, valid certificate paths"
    
    outputs:
      - name: "connection_result"
        type: "HardwareResponse"
        description: "Connection establishment result with connection handle"
        success_criteria: "success=True with connection handle in data field"
        error_criteria: "success=False with detailed error message"
    
    processing_logic: |
      1. Validate input parameters and device authentication credentials
      2. Establish TLS connection to MQTT broker with device certificates
      3. Authenticate device identity and verify authorization
      4. Configure connection parameters (keep-alive, clean session, QoS)
      5. Set up connection event handlers (disconnect, error, reconnect)
      6. Return connection handle or detailed error information
    
    acceptance_criteria:
      - "Connection establishes within 5 seconds under normal conditions"
      - "Failed connections return specific error codes and messages"
      - "Connection handles are unique and properly managed"
      - "TLS encryption is enforced for all connections"
  
  # ---------------------------------------------------------------------------------
  # FR-002: Message Publishing
  # ---------------------------------------------------------------------------------
  FR_002_message_publishing:
    requirement_id: "FR-IMMERSIVE-01-001-001-002"
    title: "Device Command Publishing"
    description: |
      Publish device control commands to appropriate MQTT topics with proper
      QoS levels, message formatting, and delivery confirmation.
    
    inputs:
      - name: "device_id"
        type: "str"
        description: "Target device identifier"
        validation: "Must match established connection device_id"
      
      - name: "command"
        type: "Dict[str, Any]"
        description: "Device command structure with action and parameters"
        validation: "JSON serializable, contains 'action' field, valid command schema"
    
    outputs:
      - name: "publish_result"
        type: "HardwareResponse"
        description: "Message publishing result with delivery confirmation"
        success_criteria: "success=True with message_id in metadata"
        error_criteria: "success=False with specific publish error"
    
    processing_logic: |
      1. Validate device connection is active and healthy
      2. Serialize command to JSON format with schema validation
      3. Determine appropriate topic (immersive/{device_id}/cmd)
      4. Publish message with QoS 1 for delivery guarantee
      5. Wait for publish acknowledgment from broker
      6. Return success confirmation or detailed error
    
    acceptance_criteria:
      - "Commands publish within 100ms under normal conditions"
      - "QoS 1 ensures delivery confirmation from broker"
      - "Invalid commands are rejected with validation errors"
      - "Large commands (>1KB) are handled appropriately"
  
  # ---------------------------------------------------------------------------------
  # FR-003: Message Subscription
  # ---------------------------------------------------------------------------------
  FR_003_message_subscription:
    requirement_id: "FR-IMMERSIVE-01-001-001-003"
    title: "Device Status Subscription"
    description: |
      Subscribe to device status and response topics, handle incoming messages,
      and route them to appropriate handlers with proper error handling.
    
    inputs:
      - name: "device_id"
        type: "str"
        description: "Device to subscribe to status updates"
        validation: "Active device with established connection"
      
      - name: "message_handler"
        type: "Callable[[str, Dict], None]"
        description: "Callback function for processing received messages"
        validation: "Valid callable accepting topic and message parameters"
    
    outputs:
      - name: "subscription_result"
        type: "HardwareResponse"
        description: "Subscription establishment result"
        success_criteria: "success=True with subscription_id in data"
        error_criteria: "success=False with subscription error details"
    
    processing_logic: |
      1. Validate device connection and message handler
      2. Subscribe to device status topic (immersive/{device_id}/status)
      3. Subscribe to device health topic (immersive/{device_id}/health)  
      4. Register message handler for incoming messages
      5. Handle subscription acknowledgment from broker
      6. Return subscription confirmation or error details
    
    acceptance_criteria:
      - "Subscriptions are established within 2 seconds"
      - "Message handlers receive all published messages"
      - "Invalid topics or handlers are rejected appropriately"
      - "Subscription state is properly managed and cleaned up"

# ====================================================================================
# NON-FUNCTIONAL REQUIREMENTS - How the layer must perform
# ====================================================================================
non_functional_requirements:
  
  performance:
    response_time:
      connection_establishment: "<5 seconds"
      message_publishing: "<100ms"
      message_reception: "<50ms"
      subscription_setup: "<2 seconds"
    
    throughput:
      messages_per_second: "1000+ outbound, 500+ inbound per device"
      concurrent_connections: "100+ active device connections"
      message_size: "Up to 10KB per message"
    
    scalability:
      horizontal_scaling: "Support load balancing across multiple instances"
      connection_pooling: "Efficient connection reuse and management"
      memory_usage: "Linear scaling with number of active connections"
  
  reliability:
    availability: "99.9% connection uptime"
    error_recovery: "Automatic reconnection with exponential backoff"
    message_delivery: "QoS 1 guarantees at-least-once delivery"
    connection_persistence: "Survive temporary network interruptions"
  
  security:
    encryption: "TLS 1.3 for all MQTT connections"
    authentication: "X.509 client certificates for device identity"
    authorization: "Topic-level access controls"
    data_protection: "Message payload encryption for sensitive commands"

# ====================================================================================
# INTERFACES - How other layers interact with this one
# ====================================================================================
interfaces:
  
  public_methods:
    - method_name: "connect_device"
      description: "Establish MQTT connection to specified device"
      signature: "connect_device(device_id: str, config: Dict[str, Any]) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Unique device identifier"
        - name: "config"
          type: "Dict[str, Any]"
          required: true
          description: "Connection configuration (broker, certificates, etc.)"
      returns:
        type: "HardwareResponse"
        description: "Connection result with handle or error details"
    
    - method_name: "send_command"
      description: "Send control command to connected device"
      signature: "send_command(device_id: str, command: Dict[str, Any]) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Target device identifier"
        - name: "command"
          type: "Dict[str, Any]"
          required: true
          description: "Command structure with action and parameters"
      returns:
        type: "HardwareResponse"
        description: "Command publishing result"
    
    - method_name: "subscribe_status"
      description: "Subscribe to device status updates"
      signature: "subscribe_status(device_id: str, handler: Callable) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Device to monitor"
        - name: "handler"
          type: "Callable[[str, Dict], None]"
          required: true
          description: "Message processing callback"
      returns:
        type: "HardwareResponse"
        description: "Subscription result"
    
    - method_name: "disconnect_device"
      description: "Gracefully disconnect from device"
      signature: "disconnect_device(device_id: str) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Device to disconnect"
      returns:
        type: "HardwareResponse"
        description: "Disconnection result"
  
  external_dependencies:
    - name: "paho-mqtt"
      type: "Python library"
      version: ">=1.6.0"
      description: "MQTT client implementation"
    
    - name: "cryptography"
      type: "Python library" 
      version: ">=3.4.0"
      description: "TLS certificate handling"
    
    - name: "AWS IoT Core"
      type: "Cloud service"
      description: "MQTT broker infrastructure"
      alternatives: ["Eclipse Mosquitto", "HiveMQ"]

# ====================================================================================
# TESTING REQUIREMENTS - How to verify this layer works
# ====================================================================================
testing_requirements:
  
  unit_tests:
    minimum_count: 15
    coverage_threshold: 0.95
    
    test_categories:
      connection_management:
        - "test_successful_connection_establishment"
        - "test_connection_failure_handling" 
        - "test_connection_timeout_behavior"
        - "test_certificate_validation"
      
      message_operations:
        - "test_command_publishing_success"
        - "test_command_publishing_failure"
        - "test_status_subscription_setup"
        - "test_message_handler_invocation"
        - "test_message_validation_errors"
      
      error_handling:
        - "test_network_interruption_recovery"
        - "test_broker_unavailable_handling"
        - "test_invalid_device_id_rejection"
        - "test_malformed_message_handling"
        - "test_connection_cleanup_on_errors"
  
  integration_tests:
    minimum_count: 8
    coverage_threshold: 0.85
    
    test_scenarios:
      - "Full device communication flow with real MQTT broker"
      - "Multiple concurrent device connections"
      - "Network interruption and automatic reconnection"
      - "Large message handling and performance"
      - "TLS certificate authentication"
      - "Topic-based message routing"
      - "Connection pooling and resource management"
      - "Graceful shutdown and cleanup"
  
  performance_tests:
    - "Message throughput under various loads (1, 10, 100 devices)"
    - "Connection establishment time under normal and high load"
    - "Memory usage scaling with number of connections"
    - "Network latency impact on message delivery"

