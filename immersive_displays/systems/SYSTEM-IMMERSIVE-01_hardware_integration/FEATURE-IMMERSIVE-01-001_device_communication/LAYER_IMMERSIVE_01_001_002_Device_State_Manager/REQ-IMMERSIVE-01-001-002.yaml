# ====================================================================================
# INTERFACES - How other layers interact with this one
# ====================================================================================
interfaces:
  
  public_methods:
    - method_name: "update_device_state"
      description: "Process device state update from MQTT or other sources"
      signature: "update_device_state(device_id: str, state_update: Dict[str, Any]) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Target device identifier"
        - name: "state_update"
          type: "Dict[str, Any]"
          required: true
          description: "State update message with new device information"
      returns:
        type: "HardwareResponse"
        description: "State update processing result"
    
    - method_name: "get_device_state"
      description: "Retrieve current complete state for specified device"
      signature: "get_device_state(device_id: str) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Device to retrieve state for"
      returns:
        type: "HardwareResponse"
        description: "Current device state or error if device not found"
    
    - method_name: "assess_device_health"
      description: "Perform health assessment for device"
      signature: "assess_device_health(device_id: str) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Device to assess"
      returns:
        type: "HardwareResponse"
        description: "Health assessment with score and recommendations"
    
    - method_name: "subscribe_state_updates"
      description: "Subscribe to real-time state updates for devices"
      signature: "subscribe_state_updates(client_id: str, device_filter: List[str]) -> HardwareResponse"
      parameters:
        - name: "client_id"
          type: "str"
          required: true
          description: "Subscribing client identifier"
        - name: "device_filter"
          type: "List[str]"
          required: true
          description: "List of device IDs to monitor"
      returns:
        type: "HardwareResponse"
        description: "Subscription result with handle"
  
  external_dependencies:
    - name: "redis"
      type: "Python library"
      version: ">=4.3.0"
      description: "High-speed state caching and pub/sub"
    
    - name: "sqlalchemy"
      type: "Python library"
      version: ">=2.0.0"
      description: "State persistence and querying"
    
    - name: "pydantic"
      type: "Python library"
      version: ">=2.0.0"
      description: "State model validation and serialization"

