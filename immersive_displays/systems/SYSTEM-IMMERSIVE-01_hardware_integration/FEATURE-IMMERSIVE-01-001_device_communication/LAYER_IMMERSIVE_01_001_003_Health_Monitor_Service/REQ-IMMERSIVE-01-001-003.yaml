# ====================================================================================
# INTERFACES - How other layers interact with this one
# ====================================================================================
interfaces:
  
  public_methods:
    - method_name: "start_monitoring"
      description: "Begin health monitoring for specified device"
      signature: "start_monitoring(device_id: str, config: Dict[str, Any]) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Device to begin monitoring"
        - name: "config"
          type: "Dict[str, Any]"
          required: true
          description: "Monitoring configuration including metrics and thresholds"
      returns:
        type: "HardwareResponse"
        description: "Monitoring initialization result"
    
    - method_name: "get_health_status"
      description: "Retrieve current health status for device"
      signature: "get_health_status(device_id: str) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Device to check health status"
      returns:
        type: "HardwareResponse"
        description: "Current health status and recent metrics"
    
    - method_name: "configure_alerts"
      description: "Configure health alert thresholds and delivery"
      signature: "configure_alerts(device_id: str, alert_config: Dict[str, Any]) -> HardwareResponse"
      parameters:
        - name: "device_id"
          type: "str"
          required: true
          description: "Device to configure alerts for"
        - name: "alert_config"
          type: "Dict[str, Any]"
          required: true
          description: "Alert configuration with thresholds and delivery settings"
      returns:
        type: "HardwareResponse"
        description: "Alert configuration result"
    
    - method_name: "generate_health_report"
      description: "Generate health trend analysis report"
      signature: "generate_health_report(timeframe: str, device_filter: List[str]) -> HardwareResponse"
      parameters:
        - name: "timeframe"
          type: "str"
          required: true
          description: "Analysis timeframe (e.g., '7d', '30d')"
        - name: "device_filter"
          type: "List[str]"
          required: false
          description: "Optional device filter for targeted analysis"
      returns:
        type: "HardwareResponse"
        description: "Health analysis report with trends and recommendations"
  
  external_dependencies:
    - name: "prometheus_client"
      type: "Python library"
      version: ">=0.14.0"
      description: "Metrics collection and export"
    
    - name: "alertmanager"
      type: "External service"
      description: "Alert routing and delivery"
      alternatives: ["PagerDuty", "Slack webhooks"]
    
    - name: "influxdb"
      type: "Time-series database"
      version: ">=2.0"
      description: "Health metrics storage and querying"

