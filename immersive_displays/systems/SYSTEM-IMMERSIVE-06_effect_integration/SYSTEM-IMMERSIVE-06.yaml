      - "Device type and traits definition"
      - "OAuth 2.0 account linking"
      - "Google Home certification"
    
    supported_capabilities:
      - "OnOff - Power control"
      - "Brightness - Brightness adjustment"
      - "ColorSetting - Color and temperature control"
      - "Scene - Scene and effect activation"
  
  apple_homekit:
    certification_requirements:
