# ====================================================================================
# SHARED INTERFACES AND DATA STRUCTURES
# ====================================================================================

shared_interfaces:
  
  # Audio Sync Response Structure
  AudioSyncResponse:
    description: "Standardized response format for all audio sync API endpoints"
    structure:
      success: "boolean - Operation success indicator"
      data: "object|null - Response payload or null on error"
      error: "string|null - Error message or null on success"
      metadata: "object - Additional context (latency, timing, performance)"
    
    examples:
      success_response: |
        {
          "success": true,
          "data": { 
            "sync_session_id": "sync_12345",
            "audio_source": "microphone_1",
            "beat_detected": true,
            "tempo_bpm": 128.5
          },
          "error": null,
          "metadata": { 
            "timestamp": "2025-10-31T10:00:00.123Z",
            "processing_latency_ms": 15.7,
            "sync_accuracy": 0.98
          }
        }
  
  # Audio Analysis Structure
  AudioAnalysis:
    description: "Real-time audio feature analysis data"
    structure:
      timestamp: "datetime - Analysis timestamp with microsecond precision"
      audio_features:
        beat_detected: "boolean - Beat detection flag"
        tempo_bpm: "float - Detected tempo in beats per minute"
        beat_strength: "float - Beat strength/confidence (0.0-1.0)"
        time_signature: "string - Detected time signature (4/4, 3/4, etc.)"
        
      frequency_analysis:
        bass_energy: "float - Low frequency energy (20-250Hz)"
        mid_energy: "float - Mid frequency energy (250Hz-4kHz)"
        treble_energy: "float - High frequency energy (4-20kHz)"
        dominant_frequency: "float - Dominant frequency in Hz"
        spectral_centroid: "float - Spectral centroid for brightness"
        
      dynamics:
        rms_level: "float - RMS audio level (-60dB to 0dB)"
        peak_level: "float - Peak audio level (-60dB to 0dB)"
        dynamic_range: "float - Current dynamic range"
        onset_strength: "float - Musical onset strength"
        
      musical_features:
        key_signature: "string|null - Detected musical key"
        mode: "enum|null - major|minor|modal"
        harmonic_energy: "float - Harmonic content strength"
        percussive_energy: "float - Percussive content strength"
  
  # Lighting Choreography Structure
  LightingChoreography:
    description: "Audio-synchronized lighting pattern data"
    structure:
      choreography_id: "string - Unique choreography identifier"
      audio_mapping:
        beat_response: "object - Beat-triggered lighting patterns"
        frequency_mapping: "object - Frequency-to-color/intensity mappings"
        energy_scaling: "object - Audio energy to lighting intensity scaling"
        tempo_effects: "object - Tempo-based pattern modifications"
        
      zone_configuration:
        - zone_id: "string - Lighting zone identifier"
          device_ids: "array - Lights assigned to this zone"
          audio_frequency_range: "object - Frequency range for this zone"
          response_sensitivity: "float - Audio response sensitivity (0.0-1.0)"
          color_palette: "array - Available colors for this zone"
          
      timing_parameters:
        global_offset_ms: "integer - Global timing offset compensation"
        zone_delays_ms: "object - Per-zone delay compensation"
        transition_duration_ms: "integer - Pattern transition smoothing time"
        beat_anticipation_ms: "integer - Beat anticipation for smoother response"
  
  # Synchronization Status Structure  
  SyncStatus:
    description: "Real-time synchronization status and performance metrics"
    structure:
      session_id: "string - Active synchronization session ID"
      status: "enum - active|paused|stopped|error"
      
      performance_metrics:
        processing_latency_ms: "float - Current audio processing latency"
        lighting_latency_ms: "float - Lighting command execution latency"
        total_latency_ms: "float - End-to-end synchronization latency"
        sync_accuracy: "float - Synchronization accuracy score (0.0-1.0)"
        
      audio_status:
        input_source: "string - Current audio input source"
        input_level_db: "float - Current input audio level"
        signal_quality: "float - Audio signal quality score (0.0-1.0)"
        noise_floor_db: "float - Current noise floor level"
        
      lighting_status:
        active_zones: "integer - Number of active lighting zones"
        total_lights: "integer - Total number of synchronized lights"
        command_queue_depth: "integer - Pending lighting commands"
        zone_sync_variance_ms: "float - Inter-zone synchronization variance"

