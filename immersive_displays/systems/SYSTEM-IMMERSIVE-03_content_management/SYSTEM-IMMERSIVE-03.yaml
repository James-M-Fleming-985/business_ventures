# ====================================================================================
# SHARED INTERFACES AND DATA STRUCTURES
# ====================================================================================

shared_interfaces:
  
  # Content Management Response Structure
  ContentResponse:
    description: "Standardized response format for all content API endpoints"
    structure:
      success: "boolean - Operation success indicator"
      data: "object|null - Response payload or null on error"
      error: "string|null - Error message or null on success"
      metadata: "object - Additional context (pagination, timestamps, etc.)"
    
    examples:
      success_response: |
        {
          "success": true,
          "data": { 
            "content_id": "halloween_2025_spooky",
            "title": "Spooky Halloween Lights",
            "status": "ready",
            "download_url": "https://cdn.example.com/content/..."
          },
          "error": null,
          "metadata": { 
            "timestamp": "2025-10-31T10:00:00Z",
            "generation_time": "87s",
            "quality_score": 0.94
          }
        }
  
  # Content Item Structure
  ContentItem:
    description: "Comprehensive content metadata structure"
    structure:
      content_id: "string - Unique content identifier"
      title: "string - Human-readable content title"
      description: "string - Content description and usage notes"
      category: "enum - seasonal|event|ambient|music_sync|custom"
      theme: "string - Specific theme (halloween, christmas, etc.)"
      premium: "boolean - Requires subscription access"
      ai_generated: "boolean - Generated by AI vs. human-created"
      
      technical_specs:
        duration: "integer - Content duration in seconds"
        light_count: "integer - Recommended number of lights"
        complexity: "enum - simple|moderate|complex|professional"
        file_size: "integer - Content file size in bytes"
        format_version: "string - Content format version"
      
      media_assets:
        content_file_url: "string - Primary content file URL"
        preview_video_url: "string - Preview video URL"
        thumbnail_url: "string - Content thumbnail image URL"
        music_file_url: "string|null - Associated music file URL"
      
      metadata:
        created_date: "datetime - Content creation timestamp"
        updated_date: "datetime - Last modification timestamp"
        version: "string - Content version identifier"
        creator: "string - Creator name (AI|username)"
        download_count: "integer - Total download count"
        rating: "float - User rating (1.0-5.0)"
        
      generation_info:
        prompt: "string|null - Original AI generation prompt"
        generation_time: "integer|null - AI generation time in seconds"
        quality_score: "float|null - Automated quality assessment"
        model_version: "string|null - AI model used for generation"
  
  # AI Generation Request Structure
  GenerationRequest:
    description: "Structure for AI content generation requests"
    structure:
      request_id: "string - Unique generation request identifier"
      user_id: "string - Requesting user identifier"
      prompt: "string - Content generation prompt"
      theme: "enum - seasonal theme or custom"
      parameters:
        light_count: "integer - Target number of lights"
        duration: "integer - Desired duration in seconds"
        complexity: "enum - simple|moderate|complex"
        style: "enum - elegant|dramatic|playful|professional"
        music_sync: "boolean - Include music synchronization"
      
      priority: "enum - normal|high|premium"
      callback_url: "string|null - Webhook for completion notification"

