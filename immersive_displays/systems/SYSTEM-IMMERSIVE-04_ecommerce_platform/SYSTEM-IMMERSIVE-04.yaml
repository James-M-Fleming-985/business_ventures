# ====================================================================================
# SHARED INTERFACES AND DATA STRUCTURES
# ====================================================================================

shared_interfaces:
  
  # E-commerce Response Structure
  EcommerceResponse:
    description: "Standardized response format for all e-commerce API endpoints"
    structure:
      success: "boolean - Operation success indicator"
      data: "object|null - Response payload or null on error"
      error: "string|null - Error message or null on success"
      metadata: "object - Additional context (transaction IDs, timestamps, etc.)"
    
    examples:
      success_response: |
        {
          "success": true,
          "data": { 
            "order_id": "order_12345",
            "status": "confirmed",
            "total": 299.99,
            "currency": "USD"
          },
          "error": null,
          "metadata": { 
            "timestamp": "2025-10-31T10:00:00Z",
            "transaction_id": "txn_abc123",
            "payment_method": "card_visa"
          }
        }
  
  # Product Structure
  Product:
    description: "Comprehensive product catalog structure"
    structure:
      product_id: "string - Unique product identifier"
      sku: "string - Stock keeping unit identifier"
      name: "string - Product name"
      description: "string - Product description"
      category: "enum - hardware|subscription|accessory|bundle"
      
      pricing:
        price: "float - Base price in primary currency"
        currency: "string - Currency code (USD, EUR, etc.)"
        sale_price: "float|null - Sale price if on discount"
        tax_class: "string - Tax classification for calculations"
      
      inventory:
        stock_quantity: "integer - Available inventory count"
        stock_status: "enum - in_stock|out_of_stock|backorder|discontinued"
        warehouse_locations: "array - Available warehouse locations"
        reorder_level: "integer - Minimum stock level for reordering"
      
      specifications:
        weight: "float - Product weight for shipping calculation"
        dimensions: "object - Length, width, height for shipping"
        variants: "array - Product variants (color, size, etc.)"
        compatibility: "array - Compatible device types"
      
      media:
        images: "array - Product image URLs"
        videos: "array - Product video URLs"
        documents: "array - User manuals, spec sheets, etc."
  
  # Order Structure
  Order:
    description: "Complete order information structure"
    structure:
      order_id: "string - Unique order identifier"
      customer_id: "string - Customer account identifier"
      order_status: "enum - pending|confirmed|processing|shipped|delivered|cancelled"
      
      items:
        - product_id: "string - Product identifier"
          quantity: "integer - Quantity ordered"
          unit_price: "float - Price per unit at time of order"
          total_price: "float - Line item total (quantity × unit_price)"
      
      pricing:
        subtotal: "float - Sum of all line item totals"
        tax_amount: "float - Total tax amount"
        shipping_cost: "float - Shipping and handling cost"
        discount_amount: "float - Total discount amount"
        total_amount: "float - Final order total"
      
      payment:
        payment_method: "string - Payment method used"
        payment_status: "enum - pending|authorized|captured|failed|refunded"
        transaction_id: "string - Payment processor transaction ID"
      
      shipping:
        shipping_address: "object - Delivery address"
        shipping_method: "string - Selected shipping option"
        tracking_number: "string|null - Carrier tracking number"
        estimated_delivery: "datetime - Estimated delivery date"
  
  # Subscription Structure
  Subscription:
    description: "Subscription account and billing information"
    structure:
      subscription_id: "string - Unique subscription identifier"
      customer_id: "string - Customer account identifier"
      plan_id: "string - Subscription plan identifier"
      status: "enum - active|paused|cancelled|past_due|expired"
      
      billing:
        billing_cycle: "enum - monthly|quarterly|annual"
        current_period_start: "datetime - Current billing period start"
        current_period_end: "datetime - Current billing period end"
        next_billing_date: "datetime - Next scheduled billing date"
        
      usage:
        included_allowances: "object - Included usage limits"
        current_usage: "object - Current period usage"
        overage_charges: "float - Additional charges for usage overages"
        
      payment:
        default_payment_method: "string - Default payment method ID"
        last_payment_date: "datetime - Last successful payment"
        last_payment_amount: "float - Last payment amount"
        payment_failures: "integer - Consecutive payment failure count"

